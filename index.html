var articlesData={
"african-cdc":[
{"title":"Africa CDC et l'Éthiopie lancent officiellement la CPHIA 2026 : « Sécurité sanitaire et souveraineté africaine » au programme du 23–27 novembre à Addis-Abeba","url":"https://africacdc.org/news-item/africa-cdc-and-ethiopia-officially-launch-cphia-2026-to-advance-africas-health-security-and-sovereignty-agenda/","content":"Africa CDC et le gouvernement de la République fédérale démocratique d'Éthiopie ont officiellement lancé la 5e Conférence internationale sur la santé publique en Afrique (CPHIA 2026) le 11 mai 2026 à Addis-Abeba. La conférence se tiendra du 23 au 27 novembre 2026 sous le thème « Sécurité sanitaire et souveraineté de l'Afrique : transformation de la dépendance et de la vulnérabilité sanitaires vers l'appropriation et la résilience ». Rassemblement continental phare, la CPHIA 2026 réunira gouvernements, scientifiques, décideurs, professionnels de santé et partenaires autour de solutions africaines pour transformer les systèmes de santé du continent. Le Dr Jean Kaseya, Directeur général d'Africa CDC, a souligné lors du lancement officiel que cet événement sera l'occasion de démontrer qu'une Afrique unie est capable de prendre en charge sa propre sécurité sanitaire — un message particulièrement pertinent dans le contexte de la riposte à l'épidémie Ebola Bundibugyo. Les candidatures aux bourses de voyage et les soumissions de résumés scientifiques restent ouvertes jusqu'au 15 août 2026.","date":"2026-05-11"},
{"title":"États-Unis annoncent 242 millions USD supplémentaires pour l'Ebola Bundibugyo, lors d'une mission conjointe de haut niveau OMS–Africa CDC en RDC et en Ouganda","url":"https://www.who.int/news/item/06-08-2026-africa-cdc-and-who-call-for-urgent--community-led-action-to-contain-ebola-in-the-drc","content":"Le 5 août 2026, les États-Unis ont annoncé un financement additionnel de 242 millions USD pour la réponse immédiate à l'épidémie d'Ebola Bundibugyo en RDC, la préparation régionale et l'aide humanitaire liée à cette crise — une annonce saluée par Africa CDC comme une contribution déterminante pour accélérer la riposte. Ce financement intervient dans un contexte opérationnel critique : le taux de suivi des contacts stagnait à 75 % au 4 août (cible : 95 %), les centres de traitement au Nord-Kivu affichaient 139 % d'occupation, et 3 973 cas confirmés et 1 801 décès avaient été enregistrés en RDC. Une mission de haut niveau s'est rendue en Ouganda et en RDC les 4 et 5 août, conduite par les Directeurs généraux Dr Jean Kaseya (Africa CDC) et Dr Tedros Adhanom Ghebreyesus (OMS), ainsi que le Dr Mohamed Janabi (WHO AFRO), pour tirer les leçons de la réponse ougandaise — qui a conduit à la déclaration de fin d'épidémie le 28 juillet 2026 avec 20 cas confirmés et 2 décès — et évaluer les défis opérationnels en Ituri et au Nord-Kivu. Les conclusions de la mission devront orienter la restructuration profonde de la réponse de terrain.","date":"2026-08-05"},
{"title":"Africa CDC et OMS appellent à une riposte communautaire urgente face à Ebola en RDC : 3 973 cas confirmés, 1 801 décès au 4 août 2026","url":"https://africacdc.org/news-item/africa-cdc-and-who-call-for-urgent-community-led-action-to-contain-ebola-in-the-drc/","content":"L'Africa CDC et l'OMS ont lancé le 6 août 2026 un appel pressant à intensifier la riposte communautaire contre l'épidémie d'Ebola Bundibugyo en RDC. Au 4 août 2026, la RDC dénombrait 3 973 cas confirmés, 1 801 décès et 776 guérisons dans 51 zones de santé de cinq provinces, avec 99 nouveaux cas et 52 décès dans les dernières 24 heures. Le taux de suivi des contacts n'atteignait que 75 %, loin de la cible opérationnelle de 95 % nécessaire pour briser les chaînes de transmission. Les centres de traitement au Nord-Kivu affichaient un taux d'occupation alarmant de 139 %, mettant sous pression sévère les lits, les soignants et les opérations de réponse sur le terrain. En réponse, les États-Unis ont annoncé le 5 août 2026 un financement additionnel de 242 millions USD pour la riposte immédiate et la préparation régionale. L'Ouganda a déclaré le 28 juillet 2026 la fin de son épidémie avec 20 cas confirmés et 2 décès.","date":"2026-08-06"},
{"title":"Africa CDC welcomes President Tshisekedi's direction for a village-centred, accountable and intensified Ebola response in DRC","url":"https://africacdc.org/news-item/africa-cdc-welcomes-president-tshisekedis-direction-and-guidance-for-a-village-centered-accountable-and-intensified-response-to-the-ebola-bundibugyo-outbreak-in-the-democratic-republic-of-th/","content":"Africa CDC on August 6, 2026 welcomed President Felix Antoine Tshisekedi's renewed direction calling for a fundamentally restructured, village-centred and accountable Bundibugyo Ebola response in the DRC. The move marks a critical shift toward placing affected communities at the heart of outbreak control — a priority given that contact follow-up rates remain at 75%, far short of the 95% threshold needed to break transmission chains. Africa CDC Director-General Dr. Jean Kaseya endorsed the President's guidance as a potential turning point for building community trust, particularly in the hardest-hit provinces of Ituri and North Kivu. The direction aligns with the joint Africa CDC-WHO statement of August 6, 2026 demanding faster resource delivery, stronger early detection and improved access to care. As of the August 2 situational report, nearly 4 000 cases and over 1 800 deaths have been recorded since the outbreak began in DRC.","date":"2026-08-06"},
{"title":"CPHIA 2026 : l'Afrique se prépare à accueillir 30 000 délégués à Addis-Abeba","url":"https://cphia.africacdc.org","content":"La 5e Conférence internationale sur la santé publique en Afrique (CPHIA 2026) se tiendra à Addis-Abeba, capitale diplomatique du continent africain et siège de l'Union africaine. Organisée par Africa CDC, la conférence réunira plus de 30 000 délégués — chefs d'État, ministres, chercheurs et innovateurs — autour des défis de santé publique les plus pressants du continent. Les travaux s'articuleront notamment autour de la refonte de l'architecture mondiale de la santé sous leadership africain, de l'institutionnalisation de la prévention et de la préparation aux pandémies, ainsi que d'un salon d'innovation dédié aux technologies de santé africaines. La date limite de soumission des résumés et des candidatures aux bourses de voyage est fixée au 15 août 2026. Le Dr Jean Kaseya, Directeur général d'Africa CDC, figurera parmi les conférenciers principaux.","date":"2026-07-12"},
{"title":"Africa CDC and WHO unveil $518 million joint continental Ebola response plan","url":"https://www.emjreviews.com/microbiology-infectious-diseases/news/africa-cdc-and-who-launch-joint-continental-ebola-response-plan","content":"Africa CDC and WHO officially launched a joint continental preparedness and response plan for the Bundibugyo Ebola outbreak on June 5, 2026. The six-month strategy, running from June to November 2026, is costed at $518 million and operates under a 'One Plan, One Budget, One Team' framework led by the affected nations — the Democratic Republic of the Congo and Uganda — supported by regional and international partners. Key operational pillars include emergency coordination, laboratory testing, disease surveillance, infection prevention and control, clinical care, community engagement, and logistics. Dr. Jean Kaseya, Director-General of Africa CDC, underscored the urgency: \"Ebola moves fast. Africa must move faster. This joint plan gives the continent a clear path to act with speed and unity.\" A joint financial tracking mechanism has been put in place to ensure full transparency in fund utilisation.","date":"2026-07-12"},
{"title":"Ebola moves faster than the response: Africa CDC chief sounds the alarm","url":"https://www.thenewhumanitarian.org/interview/2026/07/09/ebola-moving-faster-than-response-head-africa-cdc-warns","content":"Africa CDC Director General Dr. Jean Kaseya issued an urgent warning on July 9, 2026: the Ebola outbreak driven by the Bundibugyo virus in eastern DRC has yet to reach its peak, yet treatment centres are already at saturation point. In an interview with The New Humanitarian, Kaseya called on the international community to \"act now or pay a much higher price later,\" stressing that the pace of the outbreak is outstripping the pace of the response. Uganda has closed its borders with DRC in a bid to contain cross-border spread, but the move has crippled regional trade and raised humanitarian concerns. Africa CDC continues to coordinate with Member States and partners to accelerate detection, care, and community engagement in conflict-affected Ituri province.","date":"2026-07-12"},
{"title":"Africa CDC déploie une stratégie d'engagement des jeunes dans la santé mondiale : la YES!Health 2025-2028","url":"https://khub.africacdc.org/records/resource/epidemic-intelligence-weekly-report","content":"L'Africa CDC a publié sa stratégie d'engagement et de participation des jeunes dans la santé mondiale, baptisée YES!Health (Youth Engagement and Participation in Global Health), couvrant la période 2025-2028. Portée par le Dr Chrys Promesse Kaniki, cette initiative reconnaît le rôle crucial des jeunes africains âgés de 15 à 35 ans — qui représentent plus de 65 % de la population du continent — dans la résolution des défis sanitaires persistants. La stratégie vise à intégrer les jeunes comme acteurs à part entière des systèmes de santé publique, en leur offrant des plateformes de participation active dans les politiques de santé, la surveillance épidémique et la réponse aux urgences. Cette démarche s'inscrit dans la vision plus large de l'Africa CDC de bâtir une Afrique résiliente, capable de prendre en charge sa propre sécurité sanitaire, notamment dans un contexte marqué par la recrudescence des maladies à virus Ebola et les séquelles de la pandémie de COVID-19 sur les systèmes de surveillance des maladies non transmissibles.","date":"2026-07-11"},
{"title":"Africa CDC et WHO AFRO lancent une équipe continentale de gestion des incidents pour renforcer la réponse aux urgences de santé publique","url":"https://reliefweb.int/updates?list=Africa+Centres+for+Disease+Control+and+Prevention+%28Africa+CDC%29+Updates&advanced-search=%28S50373%29","content":"Kampala, Ouganda, 27 juin 2026 — L'Africa CDC et le Bureau régional de l'OMS pour l'Afrique (WHO AFRO) ont officiellement lancé une Équipe continentale de gestion des incidents (IMST), en présence du ministre ougandais de la Santé, le Dr Chris Baryomunsi. Cette initiative vise à renforcer le leadership de l'Afrique dans la gestion des urgences de santé publique, en particulier dans le contexte de l'épidémie de maladie à virus Ebola Bundibugyo qui sévit en RDC et en Ouganda. Par ailleurs, l'Africa CDC a réuni 13 pays à Kampala pour un atelier de préparation régionale face à cette menace épidémique. Lors d'une réunion de haut niveau présidentielle tenue le 16 juin 2026 sous la présidence du Président du Burundi, S.E. Évariste Ndayishimiye, les chefs d'État et de gouvernement africains ont exprimé leur engagement collectif à intensifier la réponse continentale. Le Président de la RDC, Félix Antoine Tshisekedi, a également accueilli le Président ougandais le 2 juillet 2026, soulignant la dimension diplomatique et régionale de cette crise sanitaire sans précédent.","date":"2026-07-11"},
{"title":"Épidémie de maladie à virus Bundibugyo : 1 581 cas confirmés et 508 morts en RDC et en Ouganda","url":"https://khub.africacdc.org/health-topics/surveillance","content":"L'épidémie de maladie à virus Bundibugyo (BVD) en République démocratique du Congo (RDC) et en Ouganda atteint un niveau alarmant en ce début juillet 2026. Selon les dernières données publiées par l'Africa CDC, le cumul des cas confirmés dans les deux pays s'élève à 1 581, avec 508 décès recensés, portant le taux de létalité global à 32,1 %. La province de l'Ituri en RDC demeure l'épicentre de la crise, concentrant plus de 90 % des cas confirmés et près de 84 % des décès. Le Nord-Kivu, autre province affectée, enregistre quant à lui le taux de létalité provincial le plus élevé, atteignant 57,4 %, témoignant de la gravité de la situation clinique et des difficultés de prise en charge sur le terrain. En Ouganda, la situation reste relativement stable avec 20 cas confirmés et 2 décès. L'Africa CDC maintient une surveillance renforcée aux points d'entrée et de sortie, et appelle à une vigilance soutenue face au risque persistant de transmission transfrontalière.","date":"2026-07-11"},
],
"african-medical-agency":[
{"title":"AMA Treaty ratification reaches 32 AU Member States in May 2026 — universal ratification key to the agency's full continental regulatory mandate","url":"https://au-ama.africa/ratifications/","content":"As of May 2026, 32 of the 55 African Union Member States have ratified the Treaty establishing the African Medicines Agency (AMA), a significant milestone since the Treaty entered into force in November 2021 — when a minimum of 15 ratifications was first reached. The Center for Innovation in Regulatory Science (CIRS) published in 2026 a comprehensive historical review of the AMA's origins and future prospects, noting that its swift early regulatory actions — the Regulatory Reliance Pathway guidance and the June 2026 Levamisole ban — signal accelerating institutional momentum. However, health policy analysts warn that universal ratification remains essential: without major pharmaceutical markets, notably Nigeria (the continent's most populous country and largest pharmaceutical market), the AMA's mandate for continental harmonisation is structurally limited. Each ratifying country commits to co-financing AMA operations, making broader membership critical both for the agency's governance legitimacy and its long-term financial sustainability. PATH and the AU Commission are actively advocating for the remaining 23 non-ratifying states, with particular focus on economies that represent significant shares of Africa's pharmaceutical market and disease burden.","date":"2026-05-31"},
{"title":"Nigeria and Africa's Regulatory Future: AMA's 2026 milestones and what they mean for pharmaceutical companies operating across the continent","url":"https://www.arqon.com/post/nigeria-and-africa-s-regulatory-future-what-the-african-medicines-agency-s-progress-means-for-healt","content":"A 2026 regulatory analysis by advisory firm Arqon examines the strategic implications of the African Medicines Agency's growing influence for pharmaceutical and healthcare companies across Africa, with a focus on Nigeria — the continent's most populous country and largest pharmaceutical market, which has not yet ratified the AMA Treaty. The analysis finds that AMA's regulatory reliance pathways, once fully operationalized, could reduce drug registration timelines in Africa from an average of 3 to 5 years to under 12 months — a transformational opportunity for manufacturers. Nigeria's NAFDAC is cited as being engaged in alignment discussions with AMA as a precursor to potential formal ratification. The paper identifies 2026 as AMA's pivotal year for credibility: the WHO-AMA Framework Agreement, the EMA-AMA Amsterdam partnership, the Medicines for Africa patient safety summit and the inaugural reliance pathway guidance all signal that AMA has shifted decisively from institution-building to active regulatory governance — a track record that no major pharmaceutical stakeholder present in Africa can afford to ignore in its market strategy.","date":"2026-07-20"},
{"title":"OMS et Agence africaine des médicaments : accord-cadre historique pour renforcer l'accès aux produits de santé de qualité en Afrique","url":"https://www.who.int/news/item/21-05-2026-who-and-african-medicines-agency-launch-landmark-framework-to-strengthen-access-to-quality-assured-health-products-in-africa","content":"L'OMS et l'Agence africaine des médicaments (AMA) ont signé le 21 mai 2026 un accord-cadre de collaboration établissant un partenariat structuré pour l'harmonisation réglementaire, la convergence et la confiance mutuelle (reliance) à l'échelle du continent africain. Cet accord vise à renforcer les systèmes réglementaires nationaux et à améliorer l'accès des populations africaines à des médicaments et vaccins sûrs, efficaces et de qualité garantie. Les domaines de coopération incluent l'alignement des normes d'enregistrement, la surveillance post-commercialisation, la lutte contre les médicaments falsifiés et le renforcement des capacités des autorités réglementaires des 55 États membres de l'Union africaine. Signé peu après l'ouverture officielle de l'AMA à Kigali, cet accord est perçu comme le levier décisif pour réduire la dépendance du continent aux agences réglementaires extérieures et accélérer l'accès des Africains aux produits de santé essentiels.","date":"2026-05-21"},
{"title":"Medicines for Africa et l'AMA s'allient contre les médicaments dangereux — Sommet africain sur la sécurité des patients à Kigali, 16-17 septembre 2026","url":"https://www.cnbcafrica.com/2026/medicines-for-africa-and-the-african-medicines-agency-join-forces-to-protect-patients-from-unsafe-medicines-across-africa","content":"Medicines for Africa et l'Agence africaine des médicaments (AMA) ont signé un accord de collaboration pour renforcer la coordination continentale et l'harmonisation réglementaire dans la lutte contre les médicaments de qualité insuffisante et les produits pharmaceutiques falsifiés. Les deux organisations co-organiseront le Sommet africain sur la sécurité des patients à Kigali, au Rwanda, les 16 et 17 septembre 2026. L'OMS estime qu'environ un médicament sur dix utilisé en Afrique subsaharienne est soit de qualité inférieure aux normes, soit falsifié, causant des échecs thérapeutiques, des résistances aux antimicrobiens et des milliers de décès évitables chaque année. Ce partenariat engage l'AMA sur la voie d'une surveillance active du marché pharmaceutique africain dès ses premiers mois d'opérationnalisation à Kigali, avec la sécurité des patients au cœur de sa feuille de route réglementaire.","date":"2026-07-01"},
{"title":"AMA issues inaugural Regulatory Reliance Pathway guidance for human medicines marketing authorisation — a continental first","url":"https://au-ama.africa/","content":"The African Medicines Agency (AMA) released in July 2026 its inaugural guidance on Regulatory Reliance Pathways for the Marketing Authorisation of Human Medicinal Products — a continental first enabling national African regulatory authorities to rely on prior approvals by stringent agencies such as the EMA, FDA or WHO Prequalification Programme when assessing medicines. This reliance approach is projected to significantly reduce approval timelines across the 55 AU Member States, lower costs for national regulators and accelerate patient access to quality medicines. In a separate action, AMA implemented in June 2026 a ban on medicinal products containing Levamisole as an active pharmaceutical ingredient, following post-market safety signals — demonstrating AMA's capacity to act rapidly on safety concerns. Both measures signal that AMA has moved swiftly from institution-building to active regulatory function within months of officially opening in Kigali, Rwanda, setting a new benchmark for continental pharmaceutical governance.","date":"2026-07-15"},
{"title":"L'Agence africaine des médicaments officiellement opérationnelle à Kigali","url":"https://www.instagram.com/reel/DXKBkARCACi","content":"L'Agence africaine des médicaments (AMA) a officiellement ouvert ses portes à Kigali, au Rwanda, marquant une étape historique pour la santé publique continentale. Cette ouverture représente une avancée majeure vers une meilleure collaboration entre les États membres de l'Union africaine et un accès renforcé à des produits médicaux sûrs, efficaces et de qualité à travers le continent. L'initiative OneHealth EU, partenaire clé du processus, salue ce jalon et partage les coulisses des premières semaines d'activité de l'agence, avec des témoignages directs des leaders qui ont porté ce projet. L'AMA a vocation à harmoniser la réglementation pharmaceutique africaine, à réduire la dépendance aux agences extérieures et à accélérer l'approbation de médicaments et vaccins essentiels pour les populations africaines.","date":"2026-07-12"},
{"title":"Le lancement de l'Agence Africaine des Médicaments : une révolution pour la régulation pharmaceutique continentale","url":"https://www.nature.com/articles/d44148-025-00350-8","content":"La mise en opération de l'Agence Africaine des Médicaments (AMA) représente une étape décisive pour la régulation pharmaceutique sur le continent africain. L'Agence Européenne des Médicaments (EMA), par la voix de son responsable des affaires internationales Martin Harvey Allchurch, confirme que des financements sont directement orientés vers des projets collaboratifs spécifiques avec l'AMA. Parmi ceux-ci figure un effort conjoint avec l'OMS visant à soutenir le projet pilote de l'AUDA-NEPAD pour la première évaluation et inscription continentale conjointe de médicaments à usage humain — une étape clé dans l'opérationnalisation de l'AMA. Ce mécanisme régional devrait permettre de réduire les délais d'approbation des médicaments en Afrique, d'harmoniser les standards de sécurité et d'ouvrir la voie à un accès plus équitable aux thérapeutiques innovantes pour les populations africaines.","date":"2026-07-05"},
{"title":"EMA renforce sa coopération avec l'AMA : visite de haut niveau à Amsterdam pour consolider le partenariat réglementaire euro-africain","url":"https://techreviewafrica.com/news/6104/african-medicines-agency-enhances-regulatory-cooperation-with-european-medicines-agency","content":"Une délégation de l'Agence Africaine des Médicaments (AMA) a effectué une visite officielle au siège de l'Agence Européenne des Médicaments (EMA) à Amsterdam du 22 au 26 juin 2026 pour approfondir la coopération réglementaire entre les deux institutions. Les échanges ont porté sur le partage de connaissances, l'apprentissage mutuel et les projets pilotes d'évaluation conjointe de médicaments à usage humain menés avec l'AUDA-NEPAD et l'OMS. Cette coopération est d'autant plus stratégique dans le contexte de l'épidémie d'Ebola Bundibugyo, où AMA et EMA ont tenu leur premier engagement scientifique conjoint en juin 2026 pour accélérer l'accès aux contre-mesures médicales. Le partenariat EMA-AMA constitue un modèle de coopération réglementaire Nord-Sud susceptible d'être étendu à d'autres agences du médicament dans le monde.","date":"2026-06-26"},
{"title":"L'AMA lance un appel à experts pour rejoindre ses Comités Techniques : candidatures closes le 18 juin 2026","url":"https://www.nepad.org/tenders/expression-of-interest-africa-medicine-agency-ama-technical-committees","content":"L'Agence Africaine des Médicaments (AMA) a publié le 11 mai 2026 un appel ouvert à manifestation d'intérêt destiné à recruter des experts pour siéger au sein de ses Comités Techniques. La date limite de soumission des candidatures était fixée au 18 juin 2026. Les experts sélectionnés sont appelés à servir en qualité d'experts indépendants, dans l'intérêt de l'Union africaine et de la santé publique du continent. Les candidatures devaient être transmises électroniquement à l'adresse officielle de l'AMA. Seuls les candidats présélectionnés seront contactés. Cette initiative s'inscrit dans le cadre des efforts de l'AMA pour structurer ses organes scientifiques et renforcer la régulation des médicaments à l'échelle continentale.","date":"2026-06-26"},
],
"manufacture-vaccins":[
{"title":"Africa moves ahead with vaccine manufacturing ambitions in 2026: mRNA platform, AVMA first disbursements and six active technology transfers across the continent","url":"https://www.semafor.com/article/07/02/2026/africa-moves-ahead-with-vaccine-manufacturing-ambitions","content":"A Semafor analysis published July 2, 2026 documents Africa's accelerating push toward vaccine self-sufficiency, highlighting three landmark milestones: the launch of the continent's first end-to-end mRNA vaccine production platform with annual capacity of 100 million doses; Gavi's imminent first cash disbursements under the $1.2 billion African Vaccine Manufacturing Accelerator (AVMA); and six manufacturers — including Atlantic Lifesciences in Ghana and the Biovac Institute in South Africa — with active technology transfers underway. The Sanofi-Marbio co-production partnership in Casablanca is highlighted as a model of North-South industrial collaboration with strong regional export potential. Despite these milestones, market access remains the central structural challenge: African manufacturers must secure advance purchase commitments from governments and multilateral buyers such as Gavi and UNICEF to make local production economically viable beyond initial donor support. Africa currently produces less than 1% of the vaccines it consumes and has set an ambitious target of 60% local production by 2040, requiring sustained coordination between the AU, AMA, national governments and international partners.","date":"2026-07-02"},
{"title":"Gavi outlines priorities for expanding sustainable vaccine manufacturing in Africa: demand, blended finance and regulatory harmonisation as key levers","url":"https://www.gavi.org/news-resources/knowledge-products/expanding-sustainable-vaccine-manufacturing-africa-priorities-support","content":"Gavi published in 2026 a policy brief identifying the priority actions needed to make African vaccine manufacturing sustainable beyond initial donor support, drawing on lessons from the first cohort of manufacturers supported through the African Vaccine Manufacturing Accelerator (AVMA). Three interlocking enablers are identified: credible long-term demand signals from African governments and multilateral buyers; blended financing instruments combining grants, guarantees and advance market commitments; and regulatory harmonisation under the AMA enabling manufacturers to register products across multiple markets without prohibitive per-country registration costs. The brief highlights persistent structural challenges — including skills gaps in quality assurance and Good Manufacturing Practice (GMP) compliance, and delays in technology transfer from originator companies — that require targeted and sustained capacity-building investment. Gavi's 10-year, $1.2 billion AVMA commitment is positioned as a model of sustained multi-decade incentivisation rather than project-by-project funding, with the goal of making African-produced vaccines price-competitive in global procurement tenders by 2030.","date":"2026-06-01"},
{"title":"Landmark vaccine deals signal Africa's shift to local manufacturing: Gavi's $1.2 billion AVMA to make first cash disbursements in 2026","url":"https://healthpolicy-watch.news/landmark-vaccine-deals-signal-africas-shift-toward-local-manufacturing/","content":"A series of landmark deals in 2026 marked a historic turning point in Africa's transition to vaccine self-sufficiency, with Gavi's African Vaccine Manufacturing Accelerator (AVMA) set to make its first cash disbursements to local manufacturers in the second half of 2026. The AVMA, a 10-year initiative worth 1.2 billion USD, has supported the construction of six facilities across the continent with active technology transfers underway, including Atlantic Lifesciences in Ghana and Biovac Institute in South Africa. An end-to-end mRNA vaccine production platform capable of 100 million doses annually is being built in Africa for the first time. Sanofi's partnership with Moroccan biotech firm Marbio to co-produce two vaccines at a new plant in Casablanca is highlighted as a model of North-South industrial collaboration. Africa's target is to produce 60% of its vaccines locally by 2040, up from the current 1% manufactured on the continent.","date":"2026-07-02"},
{"title":"African vaccine manufacturing advancing but five cross-cutting challenges persist — CHAI 2026 supply landscape report","url":"https://www.clintonhealthaccess.org/report/african-vaccine-manufacturing-supply-landscape-2026/","content":"The Clinton Health Access Initiative (CHAI) published its 2026 African Vaccine Manufacturing Supply Landscape report documenting significant progress alongside persistent structural barriers. The report identifies five cross-cutting challenges delaying near-to-market manufacturers: regulatory delays at national and continental levels, uncertain and fragmented market demand, slow disbursement of committed financing, delays from technology transfer partners, and workforce gaps in quality assurance and manufacturing operations. Senegal's Institut Pasteur de Dakar and South Africa's Biovac Institute remain the most established producers, while new facilities in Ghana, Rwanda and Morocco are advancing through technology transfer phases. CHAI warns that without coordinated advance market commitments from African governments and partners like Gavi and UNICEF, manufacturers risk producing vaccines they cannot sell profitably, undermining the entire local manufacturing ecosystem. The report calls for renewed policy coordination between the African Union, AMA and international funders to resolve these barriers before 2027.","date":"2026-06-04"},
{"title":"Africa vaccine manufacturing in 2026: current landscape, innovations and opportunities — a narrative review","url":"https://onlinelibrary.wiley.com/doi/full/10.1002/hsr2.71926","content":"A 2026 narrative review published in Health Science Reports (Wiley) by Chandipwisa et al. provides a comprehensive assessment of vaccine manufacturing across Africa, covering the current landscape, innovations and opportunities for the continent's biopharmaceutical sector. The authors note that while sub-Saharan Africa carries approximately 25% of the global disease burden, the continent produces less than 1% of the vaccines it consumes. The review recommends prioritising domestic procurement policies, building African regulatory talent pipelines, and creating WHO prequalification pathways for African manufacturers — a prerequisite for accessing Gavi and UNICEF international tenders. Key enabling factors identified include the AMA's regulatory harmonisation role, AVMA's funding mechanism, and technology transfer partnerships with manufacturers in Europe and India. The Ebola Bundibugyo outbreak has added new urgency to the push for African priority-pathogen vaccine development integrated into domestic manufacturing agendas.","date":"2026-05-15"},
{"title":"Fabrication de vaccins en Afrique : Africa CDC appelle à une gouvernance renforcée de la R&D sanitaire","url":"https://khub.africacdc.org/records/resource/africa-cdc-who-launch-of-the-continental-preparedness-and-response-plan-for-ebola","content":"Dans le cadre de la réponse continentale à l'épidémie d'Ebola, Africa CDC réaffirme l'importance de prioriser la recherche et le développement (R&D) sanitaire sur le continent africain. Un document récemment publié par l'institution intitulé « A call for health R&D prioritisation and governance mechanisms in Africa » plaide pour la mise en place de mécanismes de gouvernance clairs permettant d'orienter les investissements vers la fabrication locale de vaccins et de produits médicaux essentiels. Cette démarche s'inscrit dans l'Agenda de Sécurité et de Souveraineté Sanitaire de l'Afrique (AHSS), qui vise à réduire la dépendance du continent aux chaînes d'approvisionnement mondiales et à renforcer les capacités industrielles africaines dans le domaine biopharmaceutique. Le plan de réponse Ebola évalué à 518 millions de dollars intègre également un volet dédié à la recherche et à la production d'outils diagnostiques et thérapeutiques adaptés au contexte africain.","date":"2026-07-12"},
{"title":"Surveillance moléculaire de l'influenza en Namibie : un modèle pour orienter la production de vaccins adaptés à l'Afrique","url":"https://khub.africacdc.org/records/resource/epidemic-intelligence-weekly-report-6","content":"Une étude publiée dans le cadre du hub de connaissances sanitaires de l'Africa CDC met en lumière les résultats d'une surveillance moléculaire approfondie des virus de la grippe A et B en Namibie, couvrant la période 2021-2023. Cette recherche, menée à Windhoek, documente les patterns saisonniers de circulation des souches grippales et leurs corrélats cliniques, fournissant des données précieuses pour adapter la composition des vaccins antigrippaux aux réalités épidémiologiques africaines. Les auteurs soulignent que les données de surveillance génomique locale sont indispensables pour permettre aux fabricants de vaccins de produire des formulations mieux adaptées aux souches circulant en Afrique subsaharienne, souvent différentes de celles prédominantes dans l'hémisphère nord. Cette étude plaide pour le renforcement des infrastructures de séquençage génomique et de surveillance virale sur le continent, condition sine qua non pour soutenir une fabrication de vaccins africaine véritablement souveraine et pertinente.","date":"2026-07-11"},
{"title":"Ebola Bundibugyo sans vaccins ni traitements : l'urgence de la fabrication locale de vaccins en Afrique","url":"https://khub.africacdc.org/records/resource/africa-cdc-ebola-outbreaks-in-drc-and-uganda-weekly-brief-28th-may-2026","content":"Le rapport hebdomadaire d'Africa CDC sur l'épidémie Ebola Bundibugyo en RDC et en Ouganda met en lumière une réalité alarmante : aucun vaccin ni traitement approuvé n'est disponible contre cette souche. Un article associé, publié en juillet 2026 sous le titre « Bundibugyo Ebola Without Vaccines or Therapeutics: Why Public Health Fundamentals Matter More Than Border Closures », souligne que l'absence d'outils biomédicaux spécifiques place les équipes de santé publique dans une position de vulnérabilité extrême. Cette situation relance le débat sur la nécessité d'accélérer la fabrication locale de vaccins en Afrique, et d'intégrer les pathogènes prioritaires du continent dans les agendas industriels pharmaceutiques régionaux.","date":"2026-07-09"},
{"title":"Kenya : Africa CDC signe un accord historique pour son centre régional de coordination en Afrique de l'Est","url":"https://www.youtube.com/watch?v=WY-lk_JZOig","content":"Africa CDC a signé un accord de partenariat stratégique avec le gouvernement du Kenya, qui met à disposition 10 acres de terrain et une contribution financière de 2 millions USD pour le Centre régional de coordination de l'Afrique de l'Est, basé à Nairobi. Ce centre, l'un des cinq que compte Africa CDC sur le continent, sera doté prochainement d'un laboratoire régional de référence dont le financement est activement recherché. Le Dr Jean Kaseya a appelé les pays africains à suivre l'exemple du Kenya pour soutenir la production et la surveillance sanitaire continentales.","date":"2026-07-08"},
],
"unicef-gavi":[
{"title":"Gavi Board July 2026: $9 billion raised for Gavi 6.0, 500 million children targeted and AVMA boost approved to advance African vaccine manufacturing","url":"https://www.gavi.org/news/media-room/gavi-board-meeting-underlines-commitment-country-sovereignty-fragility-health-security","content":"Gavi's Board of Directors concluded a two-day strategic meeting in Geneva on July 2, 2026, finalizing key decisions for the implementation of the Gavi 6.0 strategy covering 2026–2030. The Board confirmed that $9 billion has been raised toward the broader replenishment target of $11.9 billion — the largest immunization funding cycle in Gavi's history. Ambitious programme targets were maintained: reaching 500 million children with vaccine support, preventing 8 to 9 million deaths, and contributing to a further 10% reduction in under-five mortality globally. A specific package of measures was approved to boost the African Vaccine Manufacturing Accelerator (AVMA), with expanded roles for Africa CDC and the African Union Commission within the Gavi 6.0 governance framework — a significant shift toward continent-led ownership of vaccine supply chains. The Board also confirmed Gavi's $40 million commitment to accelerate access to Bundibugyo Ebolavirus vaccine candidates, with special preference for manufacturing proposals based in Africa, reflecting the urgency of the DRC outbreak and the absence of any licensed vaccine against the Bundibugyo species.","date":"2026-07-02"},
{"title":"Gavi commits $40 million to accelerate Bundibugyo Ebolavirus vaccine development, with priority for Africa-based manufacturing","url":"https://www.gavi.org/news/media-room/unicef-and-gavi-launch-call-manufacturers-support-accelerated-access-bundibugyo","content":"In June 2026, Gavi committed $40 million to support the accelerated development and manufacturing scale-up of vaccines against Bundibugyo Ebolavirus — the strain behind the largest Ebola outbreak on record in the DRC. UNICEF and Gavi jointly issued on June 24, 2026 a Request for Expression of Interest (REoI) inviting vaccine developers to present data on BDBV-specific vaccine or therapeutic candidates in advanced development, with special consideration given to proposals where production would be based in Africa — the first time Gavi has explicitly privileged African manufacturing in an emergency vaccine procurement context. This $40 million commitment forms part of the broader Gavi 6.0 Board decisions of July 2, 2026, which emphasise country sovereignty and Africa-led health security as core strategic priorities. With no licensed vaccine or treatment available against the Bundibugyo strain and over 1 800 deaths recorded in DRC by early August 2026, this Gavi funding mechanism is seen as critical for incentivizing rapid clinical development and manufacturing readiness for the first BDBV-specific vaccine.","date":"2026-06-24"},
{"title":"Gavi and UNICEF announce equitable pricing deal for malaria vaccine to protect 7 million more children by end of decade","url":"https://www.unicef.org/press-releases/gavi-and-unicef-announce-equitable-pricing-deal-malaria-vaccine-protect-7-million","content":"Gavi, the Vaccine Alliance, and UNICEF announced a landmark equitable pricing agreement for malaria vaccines enabling access for an additional 7 million children in endemic African countries by the end of the decade. As of January 2026, over 39 million doses had been delivered to 25 endemic countries with Gavi support, including Guinea-Bissau's inaugural introduction in 2026. The malaria vaccine has become one of the fastest-scaling interventions in Africa's immunization history: 14 countries introduced it for the first time in 2024 and 7 more — Burundi, Uganda, Mali, Guinea, Togo, Ethiopia and Zambia — followed in 2025. The pricing deal unlocks access for lower-income countries where cost had remained a barrier, and complements WHO's continued endorsement of both RTS,S/AS01E and R21 vaccines as essential tools for reducing under-5 malaria mortality in high-burden African countries.","date":"2026-07-15"},
{"title":"UNICEF and Gavi issue Request for Expression of Interest for Bundibugyo Ebolavirus vaccines amid deadly outbreak in DRC and Uganda","url":"https://www.gavi.org/news-resources/media-room/news-releases","content":"In June 2026, UNICEF and Gavi jointly issued a Request for Expression of Interest (REoI) to accelerate access to vaccines and therapeutics targeting the Bundibugyo Ebolavirus strain, as the ongoing outbreak in DRC and Uganda had caused hundreds of confirmed deaths with no approved countermeasures available. The REoI invites vaccine developers to present data on candidate vaccines or experimental therapeutics in advanced development, with the goal of identifying products eligible for Emergency Use Listing or compassionate-use protocols. This initiative mirrors the COVAX model deployed during COVID-19, applying an access-before-approval approach to Africa's most lethal ongoing outbreak. The move also reflects a broader structural shift: as US USAID funding faces 90% cuts, multilateral health organisations are moving faster and more autonomously to fill critical gaps in outbreak response financing and procurement, underscoring the urgent need to build permanent African-led funding mechanisms.","date":"2026-06-20"},
{"title":"Africa's routine vaccine systems deliver gains against cancer and malaria but face 800 million USD funding gap — WHO AFRO 2026 assessment","url":"https://www.afro.who.int/news/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding-pressures","content":"A 2026 WHO Regional Office for Africa (WHO AFRO) assessment found that routine immunization systems across Africa are registering meaningful gains in HPV vaccination for cancer prevention and malaria vaccine rollout, even as a financing gap of over 800 million USD threatens to reverse these gains through 2027. HPV vaccination has expanded to 11 new African countries since 2023 through Gavi support, while malaria vaccine coverage has grown rapidly in East and West Africa. However, the 90% cut in US USAID immunization funding and the US withdrawal from WHO have created acute pressure on programmes covering 54 million children. Partners including Gavi, UNICEF and the African Development Bank are being urgently called upon to bridge this gap. Joint UNICEF-WHO WUENIC 2025 data published in July 2026 confirm that 90% of infants globally received at least one DTP dose in 2025, but 14.5 million children remain completely unvaccinated worldwide.","date":"2026-07-20"},
{"title":"Face à Ebola Bundibugyo, UNICEF et Gavi au cœur de la stratégie de préparation épidémique en Afrique","url":"https://www.facebook.com/africacdc/posts/-postponement-notice-weekly-press-briefingthis-weeks-briefing-has-been-postponed/1428976145927422","content":"Alors que l'Africa CDC reorganise sa réponse à l'épidémie d'Ebola Bundibugyo sous l'impulsion de la mission du Président Cyril Ramaphosa, Champion de l'Union africaine pour la prévention, la préparation et la réponse aux pandémies (PPPR), en RDC, des partenaires clés comme l'UNICEF et Gavi intensifient leur soutien opérationnel sur le terrain. Ces organisations contribuent au renforcement des systèmes de santé communautaires, à la chaîne du froid pour les produits médicaux disponibles, à l'éducation sanitaire des populations et à la coordination logistique des interventions d'urgence. La solidarité internationale, rappelée lors du briefing de l'Africa CDC, demeure essentielle face à une épidémie qui ne dispose pas encore de vaccin approuvé.","date":"2026-07-10"},
{"title":"Gavi et UNICEF mobilisés pour soutenir la riposte à l'épidémie d'Ebola en Afrique centrale","url":"https://www.facebook.com/africacdc/videos/special-briefing-on-ebola-outbreak-response-july-9-2026/1574351157729456","content":"Dans le cadre de la réponse à l'épidémie de maladie à virus Bundibugyo en RDC et en Ouganda, les partenaires internationaux dont Gavi, l'Alliance pour les vaccins, et l'UNICEF sont étroitement associés aux efforts de coordination continentale. Ces organisations apportent leur expertise logistique, leur soutien financier et leurs capacités de déploiement rapide pour appuyer les gouvernements affectés. Le briefing spécial de l'Africa CDC du 9 juillet 2026 a réaffirmé l'importance de la solidarité internationale et des partenariats solides dans la lutte contre les épidémies, soulignant que la coordination entre l'Union africaine, l'OMS, Gavi et l'UNICEF constitue la pierre angulaire d'une riposte efficace et équitable pour les communautés à risque.","date":"2026-07-10"},
{"title":"Gavi et UNICEF mobilisés face à la crise vaccinale en Afrique : l'épidémie Ebola révèle les lacunes du système","url":"https://www.infectioncontroltoday.com/view/2026-ebola-outbreak-spreads-central-africa-who-warns-growing-crisis-amid-cdc-usaid-cuts","content":"Alors que l'épidémie d'Ebola Bundibugyo continue de se propager en RDC et en Ouganda avec plus de 513 cas et 130 décès suspects, les organisations internationales dont Gavi et l'UNICEF font face à une pression croissante pour combler le vide laissé par les coupes budgétaires américaines. La réduction de 90 % du financement de l'USAID et le retrait des États-Unis de l'OMS ont sévèrement compromis les efforts de réponse. Dans ce contexte, les partenaires onusiens sont appelés à redoubler d'efforts pour maintenir les programmes de vaccination et de préparation aux épidémies sur le continent africain, en particulier dans les zones de conflit et les corridors commerciaux à haut risque.","date":"2026-07-09"},
],
"sante-maroc":[
{"title":"Réforme de la santé au Maroc : 2026, l'année du test — entre ambitions réformatrices et défis d'exécution","url":"https://telquel.ma/2026/03/16/tribune-reforme-de-la-sante-au-maroc-2026-lannee-du-test_1978966","content":"Une tribune publiée dans Telquel en mars 2026 désigne 2026 comme l'année charnière de la réforme du secteur de la santé au Maroc : l'heure est moins aux annonces qu'à la mise en œuvre concrète des engagements pris depuis 2021 dans le cadre de l'État social. Les Groupements sanitaires territoriaux (GST), la généralisation de la feuille de soins électronique, la création de nouveaux CHU et l'entrée en fonction de l'AMMPS constituent autant de chantiers devant aboutir en 2026. L'auteur identifie trois défis majeurs : les résistances institutionnelles au changement parmi certains acteurs du système de santé, le rythme des recrutements insuffisant face aux besoins malgré les 8 000 nouveaux postes budgétaires, et les retards dans la modernisation des structures de santé primaire en zones rurales. Si les ambitions réformatrices sont unanimement saluées, la capacité d'exécution du ministère de la Santé est mise à l'épreuve par la simultanéité et l'ampleur des chantiers engagés. L'article conclut que 2026 sera l'année-test qui déterminera la crédibilité de la réforme auprès des professionnels de santé, des patients et des partenaires internationaux.","date":"2026-03-16"},
{"title":"Maroc : 5,5 milliards de dirhams pour réhabiliter 91 hôpitaux et 1 600 centres de santé primaires en 2026, cinq nouveaux CHU en chantier","url":"https://medias24.com/2025/11/05/rehabilitation-dhopitaux-nouveaux-chu-et-generalisation-des-gst-les-principaux-projets-du-ministere-de-la-sante-en-2026/","content":"Le ministère marocain de la Santé a alloué 5,5 milliards de dirhams à la réhabilitation et modernisation de 91 centres hospitaliers ainsi qu'à la mise à niveau de 1 600 établissements de soins de santé primaires dans le cadre du programme d'investissement 2026. Cinq nouveaux Centres hospitaliers universitaires (CHU) sont simultanément en chantier — à Béni Mellal, Errachidia, Guelmim, Laâyoune et Dakhla — tandis que le CHU Mohammed VI de Tanger est déjà opérationnel et que les CHU d'Agadir et de Laâyoune sont attendus avant la fin 2026. Ces chantiers s'inscrivent dans le plan royal de généralisation des CHU à toutes les régions du Maroc d'ici 2027, visant à rapprocher les soins spécialisés des populations des régions historiquement sous-dotées. Le programme permettra à terme d'ajouter plus de 3 800 lits hospitaliers au parc public, de former 6 000 nouveaux médecins par an dans les facultés régionales de médecine, et d'améliorer substantiellement l'accès aux soins spécialisés hors des grands centres urbains de Casablanca et Rabat.","date":"2025-11-05"},
{"title":"Maroc : l'Agence marocaine du médicament et des produits de santé (AMMPS) entre en fonction pour moderniser la régulation pharmaceutique nationale","url":"https://www.leconomiste.com/sante-les-chantiers-2026/","content":"L'année 2026 marque l'entrée en fonction effective de l'Agence marocaine du médicament et des produits de santé (AMMPS), qui succède à la direction du médicament et de la pharmacie relevant du ministère de la Santé. Dotée d'une autonomie institutionnelle et opérationnelle renforcée, l'AMMPS sera chargée d'évaluer, d'homologuer et de surveiller les médicaments, dispositifs médicaux et produits biologiques mis sur le marché marocain, avec des standards alignés sur les pratiques européennes. Sa création s'inscrit dans la réforme structurelle du système de santé portée par Sa Majesté le Roi Mohammed VI pour bâtir un État social moderne. L'AMMPS est également appelée à renforcer la collaboration du Maroc avec l'Agence africaine des médicaments (AMA) et à positionner le Royaume comme hub réglementaire régional en Afrique, notamment dans le contexte du développement de capacités de fabrication de vaccins à Casablanca avec Sanofi et Marbio.","date":"2026-06-01"},
{"title":"Marbio et Sanofi lancent la co-production de vaccins à Casablanca : le Maroc s'intègre à l'écosystème africain de fabrication locale","url":"https://healthpolicy-watch.news/landmark-vaccine-deals-signal-africas-shift-toward-local-manufacturing/","content":"Le partenariat entre la biotech marocaine Marbio et le groupe pharmaceutique Sanofi pour co-produire deux vaccins dans une nouvelle usine à Casablanca positionne le Maroc comme l'un des pionniers de la fabrication locale de vaccins en Afrique du Nord. Cette collaboration, soutenue par le mécanisme AVMA de Gavi doté de 1,2 milliard USD sur 10 ans, s'inscrit dans l'ambition africaine de produire 60 % des vaccins utilisés sur le continent d'ici 2040, contre moins de 1 % actuellement. Pour le Royaume, cette initiative renforce la souveraineté sanitaire nationale, développe des compétences industrielles biopharmaceutiques locales et crée des emplois qualifiés dans le secteur de la santé. Le Maroc bénéficie d'une position géographique et réglementaire favorable pour exporter vers les marchés africains, s'appuyant sur l'harmonisation progressive en cours sous l'égide de l'AMA. Gavi procédera aux premiers décaissements du fonds AVMA vers les fabricants africains dans le second semestre 2026.","date":"2026-07-02"},
{"title":"Le Maroc consolide son système de santé publique à l'aune des défis épidémiques continentaux","url":"https://microbiotics.com.ng/africa-cdc-strategic-plan-2022-2026?pdf=4936","content":"Dans un contexte de flambées épidémiques récurrentes sur le continent africain, le Maroc renforce ses dispositifs de veille sanitaire et de réponse aux urgences de santé publique. Le Royaume s'appuie sur son réseau de laboratoires de référence et sur ses partenariats avec des institutions internationales telles qu'Africa CDC et l'OMS pour détecter précocement toute menace épidémique. Le Plan stratégique 2022-2026 d'Africa CDC, qui prévoit un Centre de coordination régional pour l'Afrique du Nord basé au Caire, constitue une opportunité pour le Maroc de renforcer son intégration dans l'architecture continentale de sécurité sanitaire. Les autorités marocaines veillent par ailleurs à maintenir des capacités de prise en charge des maladies à potentiel épidémique importées, dans le respect des Règlements sanitaires internationaux.","date":"2026-07-04"},
{"title":"Budget santé 2026 au Maroc : 42,4 milliards de dirhams, une hausse de 30 % et 8 000 nouveaux postes budgétaires","url":"https://aujourdhui.ma/actualite/un-budget-en-hausse-de-30-et-8-000-nouveaux-postes-424-milliards-de-dirhams-pour-la-sante-en-2026","content":"Le ministère marocain de la Santé et de la Protection sociale dispose en 2026 d'un budget record de 42,4 milliards de dirhams, en hausse de 30 % par rapport à l'exercice précédent, dans le cadre de la réforme structurelle du système national de santé portée par la Vision royale de l'État social. Sur cette enveloppe, 16,4 milliards de dirhams sont dédiés aux dépenses de personnel, avec la création de 8 000 nouveaux postes budgétaires pour renforcer les ressources humaines à tous les niveaux du système de soins. Les investissements prioritaires de 2026 incluent la construction de nouveaux Centres hospitaliers universitaires (CHU), la mise à niveau de 90 hôpitaux existants et le déploiement progressif des Groupements sanitaires territoriaux (GST). D'ici fin 2027, toutes les régions du Maroc, à l'exception de Dakhla-Oued Eddahab, disposeront de leur propre CHU.","date":"2026-07-03"},
{"title":"Réforme de l'état social au Maroc : la santé change d'échelle avec les Groupements sanitaires territoriaux","url":"https://leseco.ma/maroc/reforme-de-letat-social-la-sante-change-dechelle-non-sans-resistances.html","content":"La réforme du secteur de la santé au Maroc entre en 2026 dans une phase décisive avec l'opérationnalisation progressive des Groupements sanitaires territoriaux (GST), nouvelles entités de gouvernance régionale chargées d'intégrer et de coordonner l'ensemble des établissements de santé d'une même région. Cette restructuration vise à mettre fin à la fragmentation du système de soins, à améliorer l'accès aux soins en milieu rural et semi-urbain, et à renforcer la complémentarité entre les secteurs public et privé. Si l'ambition réformatrice est globalement saluée, des résistances subsistent parmi les professionnels de santé face aux changements organisationnels, notamment concernant la mobilité des personnels et la redistribution des compétences entre niveaux de soins. La généralisation de la feuille de soins électronique constitue un autre chantier prioritaire de 2026, visant à simplifier les démarches administratives et améliorer la traçabilité des soins.","date":"2026-07-01"},
],
"vaccins-monde":[
{"title":"Oxford University launches world's first Phase I clinical trial of a Bundibugyo Ebolavirus vaccine candidate (ChAdOx1 BDBV)","url":"https://www.ox.ac.uk/news/2026-07-13-worlds-first-phase-i-bundibugyo-ebolavirus-vaccine-trial-launched-by","content":"The University of Oxford's Oxford Vaccine Group launched on July 13, 2026 the world's first Phase I clinical trial of a vaccine specifically designed against Bundibugyo ebolavirus (BDBV) — the species causing the ongoing outbreak in the DRC and Uganda. The trial evaluates the safety and immunogenicity of ChAdOx1 BDBV, a chimpanzee adenovirus-vectored vaccine candidate, in 50 healthy adults aged 18 to 55 years recruited in Oxford, UK, using the same ChAdOx1 platform behind the Oxford-AstraZeneca COVID-19 vaccine. This is the first-ever clinical evaluation of a BDBV-specific candidate: all previously approved Ebola vaccines — Ervebo (rVSV-ZEBOV) and Ad26.ZEBOV/MVA-BN-Filo — target the Zaire species and offer no confirmed cross-protection against Bundibugyo. Phase I results are expected within months and will inform decisions on accelerated Phase II/III trials, potentially conducted in Africa, subject to regulatory timelines and outbreak dynamics. The trial represents a critical step toward closing the vaccine gap for the deadliest Ebola species currently driving an active epidemic.","date":"2026-07-13"},
{"title":"Health Canada authorizes Moderna's mRNA vaccine trial for Bundibugyo Ebola: first volunteer receives dose in Nova Scotia — second country after the UK to launch BDBV trial","url":"https://www.canada.ca/en/health-canada/news/2026/08/health-canada-authorizes-vaccine-clinical-trial-for-ebola-disease-caused-by-the-bundibugyo-virus.html","content":"Health Canada authorized on July 30, 2026 Moderna's Phase I clinical trial of its investigational mRNA vaccine candidate against Ebola disease caused by the Bundibugyo virus, making Canada the second country after the United Kingdom to authorize a BDBV-specific vaccine trial. The first volunteer received the vaccine in Truro, Nova Scotia on August 4, with the study expected to enrol 80 healthy participants across sites in Truro, Halifax and Toronto. Moderna's mRNA-based approach leverages the same platform behind its COVID-19 vaccine. There are currently no licensed vaccines or treatments against Bundibugyo ebolavirus disease — a gap leaving both health workers and communities in DRC and Uganda without specific biomedical protection during the largest Ebola outbreak ever recorded (3 973 confirmed cases, 1 801 deaths as of August 4, 2026). The parallel Oxford (ChAdOx1) and Moderna (mRNA) trials represent a historic dual-technology approach to closing this critical vaccine gap, with first Phase I safety data potentially available by late 2026 to inform emergency use pathways for deployment in outbreak settings.","date":"2026-08-04"},
{"title":"OMS met à jour sa position sur les vaccins COVID-19 : nouvelles recommandations pour la circulation soutenue de SARS-CoV-2 en 2026-2027","url":"https://www.who.int/publications/i/item/who-wer10130-138-156","content":"L'OMS a publié en juillet 2026 une mise à jour de sa position officielle sur les vaccins COVID-19 (Weekly Epidemiological Record, Vol. 101, No. 30, pp. 138-156), actualisant ses recommandations dans le contexte d'une circulation soutenue du SARS-CoV-2, de niveaux élevés d'immunité populationnelle et de la disponibilité de vaccins adaptés aux variants. L'OMS maintient sa recommandation d'une vaccination prioritaire pour les groupes les plus vulnérables — personnes âgées, immunodéprimées et professionnels de santé — tout en précisant les calendriers de rappel et les préférences entre plateformes vaccinales. Ce document remplace les orientations précédentes et constitue la référence mondiale pour les programmes nationaux en 2026-2027, intervenant dans un contexte de diversification des variants et d'interrogations croissantes sur la durée de protection des formulations actuelles. Il guidera notamment les décisions d'achat des pays à revenu faible et intermédiaire qui s'appuient sur le mécanisme COVAX pour leurs approvisionnements.","date":"2026-07-28"},
{"title":"Global childhood immunization coverage inches forward in 2025: 90% of infants received DTP but 14.5 million children remain unvaccinated — WUENIC 2025","url":"https://www.who.int/news/item/15-07-2026-global-childhood-immunization-coverage-inches-forward-despite-conflict-and-hesitancy---unicef--who","content":"WHO and UNICEF reported on July 15, 2026 that 90% of infants globally received at least one dose of the DTP vaccine in 2025, with 85% completing the full three-dose series — representing modest but real progress despite conflict and vaccine hesitancy. However, 14.5 million children worldwide remained completely unvaccinated in 2025, with the highest concentrations in conflict-affected and fragile states in sub-Saharan Africa and South Asia. Coverage gains were undermined in several countries by the 2025-2026 Ebola outbreak in DRC, which disrupted routine health services, and by funding cuts following the US withdrawal from international health commitments. The joint UNICEF-WHO WUENIC 2025 report calls for renewed investment in identifying and reaching zero-dose children, strengthening community health worker networks and cold chain infrastructure to meet Immunization Agenda 2030 targets.","date":"2026-07-15"},
{"title":"Cholera vaccine supply crisis resolved: WHO announces resumption of preventive mass vaccination campaigns worldwide","url":"https://www.who.int/news/item/04-02-2026-preventive-cholera-vaccination-resumes-as-global-supply-reaches-critical-milestone","content":"The World Health Organization announced on February 4, 2026 the resumption of preventive cholera vaccination campaigns following a critical milestone in global oral cholera vaccine (OCV) supply. The restoration ends a period of strict rationing that had forced WHO's International Coordinating Group to suspend preventive immunization since late 2022 — a constraint that had severely hampered outbreak control in Africa, Asia and the Caribbean. The supply breakthrough came from expanded production at Shantha Biotechnics in India and continued output from Eubiologics in South Korea. The announcement is particularly significant for Africa, where cholera outbreaks in DRC, Sudan, Ethiopia and Zimbabwe have caused thousands of deaths since 2022. WHO estimates that scaling up preventive vaccination could avert approximately 2 million cases and 70 000 deaths in endemic countries over the next five years.","date":"2026-02-04"},
{"title":"Ebola Bundibugyo : l'absence de vaccins approuvés met en alerte la communauté scientifique internationale","url":"https://www.cdc.gov/ebola/situation-summary/returning-travelers.html","content":"Alors que l'épidémie de maladie à virus Bundibugyo continue de s'étendre en RDC et en Ouganda, les autorités sanitaires mondiales tirent la sonnette d'alarme sur l'absence de vaccins ou de traitements spécifiquement approuvés contre cette souche. Le CDC américain a publié le 1er juillet 2026 des recommandations pour les voyageurs en provenance des zones affectées, incluant une surveillance des symptômes pendant 21 jours et un renforcement des contrôles sanitaires aux points d'entrée. La communauté scientifique internationale appelle à une accélération des essais cliniques et du développement de candidats vaccins contre le virus Bundibugyo, soulignant que les vaccins disponibles actuellement ont été développés pour d'autres souches du genre Ebolavirus et n'offrent pas de protection croisée confirmée.","date":"2026-07-10"},
{"title":"OMS et UNICEF : publication des estimations actualisées de couverture vaccinale nationale WUENIC 2025","url":"https://immunizationdata.who.int/","content":"L'OMS et l'UNICEF publient en juillet 2026 les estimations actualisées de couverture vaccinale nationale (WUENIC 2025), données de référence annuelles sur l'état de l'immunisation dans le monde entier, avec un webinaire de présentation des résultats programmé le 15 juillet 2026. Ces statistiques par pays et par antigène orientent les stratégies d'investissement de Gavi, de l'UNICEF et des gouvernements partenaires pour identifier les populations prioritaires en matière de rattrapage vaccinal. Elles constituent le principal outil de suivi des progrès vers les objectifs mondiaux de vaccination et d'élimination des maladies évitables. Dans un contexte de réduction des financements internationaux, ces données sont plus que jamais cruciales pour cibler les ressources disponibles vers les pays et populations les plus vulnérables.","date":"2026-07-07"},
{"title":"OMS : le Comité PDVAC se réunit le 6 juillet 2026 pour définir les priorités mondiales de développement vaccinal","url":"https://www.who.int/news-room/events/detail/2026/07/06/default-calendar/2026-who-product-development-for-vaccines-advisory-committee-meeting-(pdvac)","content":"Le Comité consultatif pour le développement de produits vaccinaux (PDVAC) de l'OMS tient sa réunion annuelle le 6 juillet 2026 pour examiner les priorités mondiales en matière de R&D vaccinale, notamment les candidats-vaccins contre le virus Bundibugyo, la dengue, le paludisme et d'autres pathogènes prioritaires. Ce comité d'experts indépendants — virologues, immunologistes et spécialistes de santé publique — formule des recommandations sur les technologies vaccinales à prioriser, les essais cliniques à soutenir et les mécanismes d'accès équitable. Dans le contexte de la crise Ebola Bundibugyo, le PDVAC joue un rôle critique pour guider les investissements en R&D et accélérer le développement de contre-mesures médicales adaptées à ce virus pour lequel aucun vaccin homologué n'existe à ce jour. Ses recommandations orienteront les stratégies d'investissement des grandes institutions mondiales de santé pour les années à venir.","date":"2026-07-06"},
],

function getSourceColor(d){if(d.includes("who.int"))return"#0093D5";if(d.includes("africacdc")||d.includes("au.int"))return"#1B8C3A";if(d.includes("unicef"))return"#00AEEF";if(d.includes("gavi"))return"#E8702A";if(d.includes(".ma")||d.includes("maroc")||d.includes("santemag")||d.includes("hespress"))return"#C1272D";if(d.includes("nature.com"))return"#B5232D";if(d.includes("path.org"))return"#6B2D8B";if(d.includes("cdc.gov"))return"#075290";return"#0069B4";}
function extractDomain(u){try{return new URL(u).hostname.replace("www.","")}catch(e){return""}}
function timeAgo(d){if(!d)return"";var date=new Date(d),now=new Date();if(isNaN(date))return"";var s=Math.floor((now-date)/1000);var formatted=date.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});if(s>=0&&s<86400)return formatted+" - aujourd hui";if(s>=86400&&s<172800)return formatted+" - hier";if(s>=172800&&s<604800)return formatted+" - il y a "+Math.floor(s/86400)+"j";return formatted;}
function isRecent(d){if(!d)return false;var date=new Date(d),now=new Date(),diff=(now-date)/(1000*60*60*24);return diff<=1.5;}
function renderCategories(){var el=document.getElementById("categories");el.innerHTML=CATEGORIES.map(function(c){var articles=articlesData[c.id]||[];var newCount=articles.filter(function(a){return isRecent(a.date)}).length;var badge=newCount>0?'<span style="font-size:9px;background:#E8A020;color:#fff;padding:1px 5px;border-radius:4px;margin-left:4px;font-weight:800">'+newCount+' NEW</span>':"";return'<button class="cat-btn '+(activeCategory===c.id&&!isCustomSearch?"active":"")+'" data-id="'+c.id+'"><div class="cat-icon">'+c.icon+'</div><div class="cat-label">'+c.label+badge+'</div><div class="cat-desc">'+c.desc+'</div></button>';}).join("");el.querySelectorAll(".cat-btn").forEach(function(b){b.addEventListener("click",function(){isCustomSearch=false;activeCategory=b.dataset.id;renderCategories();renderArticles();});});}
function renderArticles(){var container=document.getElementById("articles");var articles=articlesData[activeCategory]||[];var info=document.getElementById("toolbarInfo");var newArticles=articles.filter(function(a){return isRecent(a.date)});var newCountEl=document.getElementById("newCount");info.textContent=articles.length+" articles";if(newArticles.length>0){newCountEl.style.display="inline";newCountEl.textContent="NEW "+newArticles.length+" nouveau"+(newArticles.length>1?"x":"");}else{newCountEl.style.display="none";}if(!articles.length){container.innerHTML='<div class="spinner-wrap" style="padding:40px 0"><div style="font-size:52px;opacity:.3;margin-bottom:14px">📰</div><div class="spinner-text">Aucun article</div></div>';return;}container.innerHTML=articles.map(function(a,i){var domain=extractDomain(a.url),color=getSourceColor(domain),dateStr=timeAgo(a.date);var isNew=isRecent(a.date);return'<div class="article-card'+(isNew?" is-new":"")+'" style="animation-delay:'+i*.06+'s"><div class="article-inner"><div class="article-bar" style="background:'+color+'"></div><div class="article-body"><a href="'+a.url+'" target="_blank" rel="noopener" class="article-title">'+(isNew?'<span class="badge-new">NOUVEAU</span> ':'')+a.title+'</a><div class="article-content collapsed" id="c-'+i+'">'+a.content+'</div><div class="article-meta"><span class="source-tag" style="background:'+color+'14;color:'+color+'">'+domain+'</span>'+(dateStr?'<span class="date-tag">'+dateStr+'</span>':'')+'<button class="expand-btn" data-i="'+i+'">Lire plus</button></div></div></div></div>';}).join("");container.querySelectorAll(".expand-btn").forEach(function(b){b.addEventListener("click",function(){var el=document.getElementById("c-"+b.dataset.i);var c=el.classList.toggle("collapsed");b.textContent=c?"Lire plus":"Reduire";});});}
function doSearch(){var val=document.getElementById("searchInput").value.trim().toLowerCase();if(!val){isCustomSearch=false;renderCategories();renderArticles();return;}isCustomSearch=true;var allArticles=[];Object.values(articlesData).forEach(function(arr){if(Array.isArray(arr))arr.forEach(function(a){allArticles.push(a)})});var filtered=allArticles.filter(function(a){return(a.title+a.content).toLowerCase().includes(val)});activeCategory="search-custom";articlesData["search-custom"]=filtered;renderCategories();renderArticles();}
document.getElementById("searchBtn").addEventListener("click",doSearch);
document.getElementById("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
document.getElementById("updateDate").textContent=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
renderCategories();
renderArticles();
</script>
