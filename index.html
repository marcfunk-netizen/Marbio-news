"sante-maroc":[{"title":"Maroc : le ministère de la Santé lance une campagne nationale de promotion de l&#39;allaitement maternel exclusif — 38 % de taux actuel contre 50 % visé d&#39;ici 2028","url":"https://www.sante.gov.ma/Pages/actualites.aspx","content":"Le ministère marocain de la Santé et de la Protection sociale a lancé le 21 octobre 2026 une campagne nationale de promotion de l&#39;allaitement maternel exclusif jusqu&#39;à l&#39;âge de six mois, ciblant les professionnels de santé, les femmes enceintes et les jeunes mères dans le cadre des Groupements Sanitaires Territoriaux (GST). Selon les données du ministère, seulement 38 % des mères marocaines allaitent exclusivement jusqu&#39;à 6 mois, un taux inférieur aux recommandations de l&#39;OMS et à l&#39;objectif de 50 % du Plan national de nutrition 2024-2028. L&#39;allaitement maternel exclusif est reconnu comme l&#39;une des interventions les plus efficaces pour réduire la mortalité infantile et prévenir les infections digestives et respiratoires. La campagne mobilise sages-femmes, infirmiers et médecins des centres de santé primaires pour renforcer le counseling à l&#39;allaitement dès les consultations prénatales, avec des supports multilingues (arabe, amazighe, français) diffusés via les réseaux sociaux et les 15 nouveaux établissements de soins primaires récemment inaugurés dans 6 régions du Royaume.","date":"21-10-2026"},{"title":"Maroc : 58e conférences de l&#39;École Nationale de Santé Publique — gestion des GST et digitalisation des établissements de santé au cœur des travaux","url":"https://sante21.ma/","content":"L&#39;École Nationale de Santé Publique (ENSP) de Rabat a organisé le 16 octobre 2026 la 58e édition de ses conférences institutionnelles, réunissant des cadres sanitaires, des chercheurs et des responsables du ministère autour des défis du management dans le contexte de la réforme des Groupements Sanitaires Territoriaux (GST). Les travaux ont porté sur la gestion des ressources humaines, la digitalisation des dossiers médicaux et l&#39;optimisation des filières de soins dans les hôpitaux réhabilités dans le cadre du budget santé 2026 de 42,4 milliards de dirhams. L&#39;ENSP forme chaque année plus de 300 cadres supérieurs de santé dans ses programmes de Master en management hospitalier et en santé publique, contribuant à combler le déficit de compétences managériales dans les structures sanitaires provinciales et régionales. Ces conférences constituent l&#39;un des principaux forums d&#39;échanges entre la recherche en santé publique marocaine et la pratique institutionnelle.","date":"16-10-2026"},{"title":"Journée mondiale de l&#39;alimentation 2026 au Maroc : l&#39;accent mis sur les liens entre alimentation et maladies non transmissibles — 38 % des adultes en surpoids ou obèses","url":"https://sante21.ma/","content":"À l&#39;occasion de la Journée mondiale de l&#39;alimentation du 16 octobre 2026, les acteurs de la santé publique marocaine ont mis en avant les liens entre comportements alimentaires et progression des maladies non transmissibles (MNT) — diabète de type 2, hypertension, obésité — qui représentent plus de 45 % des hospitalisations dans les hôpitaux marocains. Selon l&#39;Enquête nationale sur la consommation alimentaire 2024, 38 % des adultes marocains souffrent d&#39;obésité ou de surpoids, avec une progression rapide chez les moins de 30 ans en zones urbaines. Le Plan national de prévention et de contrôle des MNT 2025-2029 place l&#39;alimentation saine au premier rang des déterminants modifiables, avec des objectifs de réduction de 10 % de la prévalence du diabète et de l&#39;obésité d&#39;ici 2029. Des actions de sensibilisation ont été organisées dans les établissements de soins primaires et les marchés alimentaires pour promouvoir le régime méditerranéen protecteur, en lien avec les 97 Groupements sanitaires territoriaux déployés dans les 12 régions du Royaume.","date":"16-10-2026"},{"title":"Maroc : l&#39;AMMPS finalise la révision tarifaire de 300 références médicamenteuses — une baisse des prix attendue fin octobre 2026 après concertation avec l&#39;industrie","url":"https://actusante.ma/lactu-medicale-de-la-semaine-au-maroc/","content":"L&#39;Agence marocaine du médicament et des produits de santé (AMMPS) est en passe de finaliser la révision des prix de près de 300 références médicamenteuses selon les informations publiées le 7 octobre 2026 par actu-sante.ma. Cette révision tarifaire, attendue depuis le début de l&#39;année, s&#39;inscrit dans la politique nationale d&#39;accessibilité aux médicaments portée par le ministère de la Santé dans le cadre de la réforme de l&#39;état social. La concertation entre l&#39;AMMPS, les représentants de l&#39;industrie pharmaceutique nationale et internationale a porté sur les marges des grossistes-répartiteurs et le prix de vente public. La baisse prévue bénéficiera principalement aux patients sous traitement chronique (diabète, hypertension, maladies cardiaques), qui représentent une part croissante des 13 millions de bénéficiaires de l&#39;AMO-Tadamon. L&#39;AMMPS prévoit de publier les nouveaux prix au Journal officiel avant fin octobre 2026.","date":"07-10-2026"},{"title":"Maroc : visite de la délégation du Programme Kofi Annan de leadership en santé publique — renforcement des capacités managériales des cadres sanitaires africains","url":"https://www.sante.gov.ma/Pages/actualites.aspx","content":"Le ministère marocain de la Santé et de la Protection sociale a reçu en octobre 2026 une délégation du Programme Kofi Annan de leadership en santé publique en Afrique (KAPLAP), un programme de formation et de mentorat destiné à renforcer les capacités des futurs leaders sanitaires du continent. Cette visite officielle s&#39;inscrit dans la politique de coopération sud-sud du Maroc, qui joue un rôle croissant dans la formation des ressources humaines en santé de l&#39;espace africain. La délégation a échangé avec les responsables des Groupements sanitaires territoriaux (GST), nouveau modèle organisationnel de la réforme sanitaire marocaine pouvant servir de référence pour d&#39;autres pays africains. Le Maroc forme chaque année environ 500 professionnels de santé africains dans ses établissements universitaires et hospitaliers, dans le cadre de la politique d&#39;ouverture africaine portée par Sa Majesté le Roi Mohammed VI. Cette coopération renforce le positionnement du Maroc comme hub régional de santé en Afrique du Nord et de l&#39;Ouest.","date":"13-10-2026"},{"title":"Maroc : budget santé 2026 en hausse de 30 % à 42,4 milliards de dirhams, avec 8 000 nouveaux postes budgétaires","url":"https://aujourdhui.ma/actualite/un-budget-en-hausse-de-30-et-8-000-nouveaux-postes-424-milliards-de-dirhams-pour-la-sante-en-2026","content":"Le budget 2026 du ministère marocain de la Santé et de la Protection sociale s'élève à 42,4 milliards de dirhams, en hausse de 30 % par rapport à 2025 — la plus forte augmentation budgétaire du secteur depuis une décennie — reflétant la volonté du gouvernement d'accélérer la réforme du système de santé et la généralisation de la couverture médicale de base. L'enveloppe finance 8 000 nouveaux postes budgétaires en 2026, s'ajoutant aux recrutements des années précédentes pour tenter de combler le déficit chronique en professionnels de santé (le Maroc compte moins de 8 médecins pour 10 000 habitants, contre une norme OMS de 23). Les principaux projets comprennent la réhabilitation de 90 hôpitaux, la construction de nouveaux CHU dans des régions sous-dotées, et la généralisation progressive des Groupements Sanitaires Territoriaux (GST) prévus pour couvrir l'ensemble des régions du Royaume. Le Maroc vise une couverture médicale universelle effective d'ici 2030, objectif qui nécessite un investissement public soutenu, notamment dans les zones rurales où l'accès aux soins demeure insuffisant. Ce budget traduit également les engagements pris dans le cadre du Nouveau Modèle de Développement qui place la santé au cœur des réformes sociales prioritaires.","date":"2025-11-05"},{"title":"Maroc : 15 nouveaux établissements de soins de santé primaires inaugurés dans 6 régions en septembre 2026","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=755","content":"Le ministère marocain de la Santé a annoncé en septembre 2026 la mise en service de 15 nouveaux établissements de soins de santé primaires répartis dans 6 régions du Royaume, dans le cadre de la stratégie de renforcement des soins de proximité et de réduction des inégalités géographiques d'accès aux soins. Ces structures — centres de santé de base, maisons d'accouchement et dispensaires ruraux — ciblent prioritairement les zones rurales et montagneuses où la couverture sanitaire reste insuffisante. Chaque établissement est équipé pour assurer les consultations de base, le suivi de la grossesse, la vaccination infantile et la prise en charge des maladies chroniques, conformément au paquet de soins essentiels défini par la réforme sanitaire. Ces ouvertures s'inscrivent dans la dynamique de la mise en place des 97 Groupements Sanitaires Territoriaux (GST) validés par le comité de pilotage de septembre 2026. Le Maroc vise un ratio d'un établissement de soins primaires pour 5 000 habitants d'ici 2030, nécessitant la création de plusieurs centaines d'infrastructures supplémentaires au-delà des réalisations actuelles.","date":"2026-09-08"},{"title":"Octobre Rose au Maroc 2026 : campagne nationale de dépistage du cancer du sein dans 12 régions","url":"https://www.sante.gov.ma/Pages/actualites.aspx","content":"Le ministère marocain de la Santé a lancé le 1er octobre 2026 la campagne nationale Octobre Rose, dédiée à la sensibilisation et au dépistage précoce du cancer du sein, en partenariat avec la Ligue Marocaine pour la Lutte contre le Cancer (LMCC) et des associations de la société civile. Le cancer du sein est le cancer le plus fréquent chez la femme au Maroc — représentant 36 % des cancers féminins avec plus de 12 000 nouveaux cas annuels — et plus de 60 % des cas sont diagnostiqués à un stade avancé faute de dépistage précoce, réduisant considérablement les chances de survie. La campagne 2026 déploie des unités mobiles de mammographie dans 12 régions et cible prioritairement les femmes de 45 à 69 ans, avec des sessions de sensibilisation dans les établissements de soins primaires et les milieux professionnels. Le dépistage à un stade précoce augmente le taux de survie à cinq ans à plus de 90 %, contre moins de 30 % aux stades avancés — un argument central de la communication de santé publique. Le programme national de dépistage du cancer du sein a été progressivement étendu depuis 2023 avec le renforcement des capacités de mammographie dans les hôpitaux régionaux.","date":"2026-10-01"},{"title":"Maroc : bilan rassurant 14 jours après l'alerte Ebola — 1 842 voyageurs contrôlés aux points d'entrée, aucun cas suspect détecté","url":"https://www.sante.gov.ma/Pages/actualites.aspx","content":"Le ministère marocain de la Santé et de la Protection sociale a publié le 14 octobre 2026 un bilan rassurant du dispositif de surveillance Ebola aux points d'entrée, 14 jours après la confirmation du premier cas importé d'Ebola Bundibugyo au Kenya. Aucun cas suspect ou confirmé n'a été identifié au Maroc, avec 1 842 voyageurs soumis à une évaluation sanitaire renforcée aux 12 postes d'inspection aux frontières aériennes, maritimes et terrestres depuis l'activation du plan le 8 octobre 2026. Vingt-trois voyageurs ont fait l'objet d'une surveillance médicale active de 21 jours — tous négatifs — selon les procédures définies dans le Plan national de prévention et de réponse aux risques épidémiques. Le Maroc maintient son niveau d'alerte épidémique de niveau 2 et renforce sa coopération avec Africa CDC, l'OMS-EMRO et les agences sanitaires européennes dans le cadre du Réseau mondial de renseignement épidémique, tout en préparant ses équipes de réponse rapide à un déploiement éventuel en soutien aux pays francophones affectés, conformément aux engagements de solidarité régionale africaine.","date":"2026-10-14"},{"title":"Maroc : le comité de pilotage de la réforme sanitaire valide 97 Groupements sanitaires territoriaux et annonce 1 400 établissements primaires réhabilités","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=755","content":"Le Comité de pilotage de la réforme du système national de santé a tenu sa session d'octobre 2026 et annoncé l'achèvement du programme de réhabilitation de 1 400 établissements de soins de santé primaires (ESSP) sur l'ensemble du territoire marocain, représentant un investissement cumulé de 3,2 milliards de dirhams depuis 2022. Un nouveau programme vise 1 600 ESSP supplémentaires, dont 500 devant être réhabilités ou construits d'ici la fin 2026, pour combler les déserts médicaux des zones rurales et montagneuses encore insuffisamment couvertes. Le comité a également validé la carte définitive de déploiement des Groupements sanitaires territoriaux (GST), portant à 97 le nombre de GST opérationnels ou en cours de mise en place, offrant à terme une couverture territoriale complète aux 12 régions du Royaume. Ces avancées s'inscrivent dans la stratégie de couverture sanitaire universelle du ministère, dont le budget 2026 s'élève à 42,4 milliards de dirhams — en hausse de 30 % — avec 8 000 nouveaux postes budgétaires pour renforcer les ressources humaines dans les zones sous-dotées.","date":"2026-10-13"},{"title":"Maroc : bulletin épidémiologique grippe et IRA septembre 2026 — tendance ascendante dans trois régions, lancement de la campagne de vaccination antigrippale 2026-2027","url":"https://www.sante.gov.ma/Publications/Pages/Bullten_%C3%89pid%C3%A9miologique.aspx","content":"Le bulletin épidémiologique mensuel grippe et infections respiratoires aiguës publié le 7 octobre 2026 par la Direction de l'Épidémiologie couvre la période du 31 août au 27 septembre 2026 et signale une circulation virale à niveau de base avec une tendance légèrement ascendante dans trois régions : Casablanca-Settat, Fès-Meknès et Souss-Massa. Les souches grippales A(H1N1)pdm09, A(H3N2) et B/Victoria circulent à bas bruit dans les réseaux sentinelles, avec une légère prédominance de A(H3N2) dans les prélèvements analysés au laboratoire national de référence. Le bulletin annonce le lancement de la campagne nationale de vaccination antigrippale saisonnière 2026-2027 avec plus de 2,4 millions de doses disponibles, ciblant en priorité les professionnels de santé, les personnes âgées de 65 ans et plus, les patients immunodéprimés et les femmes enceintes — désormais couverts par l'AMO-Tadamon pour les bénéficiaires du régime d'assistance médicale. La recrudescence hivernale habituelle est anticipée à partir de novembre 2026, avec une intensification de la surveillance dans les établissements de santé primaires nouvellement réhabilités.","date":"2026-10-07"},
{"title":"Maroc : activation du plan de surveillance sanitaire aux points d'entrée pour les voyageurs en provenance de RDC et d'Ouganda suite au cas Ebola importé au Kenya","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=776","content":"Le ministère marocain de la Santé et de la Protection sociale a activé le 9 octobre 2026 le plan de surveillance sanitaire renforcée aux points d'entrée — aéroports de Casablanca-Mohammed V, Marrakech, Rabat-Salé et Fès-Saïss, ainsi que les ports de Casablanca et Tanger Med — pour les voyageurs en provenance de la République démocratique du Congo, d'Ouganda et des pays frontaliers affectés par l'épidémie d'Ebola Bundibugyo. Cette activation fait suite à la confirmation du premier cas importé au Kenya le 7 octobre 2026 et à l'appel d'Africa CDC aux 55 États membres d'activer les protocoles RSI de surveillance aux points d'entrée. Les mesures marocaines incluent : questionnaire sanitaire obligatoire pour les passagers arrivant de zones à risque, surveillance de la température à l'arrivée, identification et suivi pendant 21 jours des voyageurs signalant des symptômes compatibles. Le Maroc n'a enregistré aucun cas suspect à ce stade. Le réseau de laboratoires de référence virologiques de l'AMMPS est mis en état d'alerte pour traiter en priorité toute demande d'analyse PCR Ebola. Cette activation illustre la montée en capacité du système de surveillance épidémique marocain, renforcé depuis 2021 par les investissements issus de la réforme du système de santé.","date":"2026-10-09"},
{"title":"Maroc : désignation du nouveau ministre de la Santé attendue cette semaine — les réformes GST, AMMPS et Marbio-Sanofi comme priorités confirmées","url":"https://medias24.com/sujet/formation-gouvernement-maroc-octobre-2026-ministre-sante/","content":"La formation du nouveau gouvernement marocain, annoncée pour la semaine du 12 octobre 2026 suite aux élections législatives du 23 septembre, place la désignation du prochain ministre de la Santé et de la Protection sociale au cœur de l'attention de la société civile sanitaire et du secteur pharmaceutique. Trois profils technocratiques expérimentés dans la gestion des réformes sanitaires complexes sont évoqués dans les médias marocains spécialisés, tous ayant participé aux travaux de la commission de mise en œuvre de la loi-cadre 06-22. Les priorités opérationnelles du nouveau ministre seront : finaliser la généralisation des Groupements sanitaires territoriaux (GST) dans toutes les régions d'ici fin 2026, atteindre 22 millions de bénéficiaires AMO-Tadamon, assurer la mise en service réussie de l'usine Marbio-Sanofi (T1 2027) et accélérer la montée en puissance de l'AMMPS. Le budget de santé 2027 en préparation, estimé à plus de 50 milliards de dirhams, sera le premier grand dossier à traiter en Conseil de gouvernement. La Direction de la santé des populations et celle de l'offre de soins attendent des orientations sur la stratégie de ressources humaines pour combler le déficit de 12 000 médecins estimé par le CESE dans son rapport de 2025.","date":"2026-10-12"},
{"title":"Maroc : 15 nouveaux établissements de soins de santé primaires mis en service dans 6 régions pour renforcer la médecine de proximité","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=755","content":"Le ministère de la Santé et de la Protection Sociale du Maroc a annoncé le 8 septembre 2026 la mise en service de 15 nouveaux établissements de soins de santé primaires répartis dans 6 régions du Royaume, renforçant le maillage territorial de l'offre de soins de proximité dans le cadre de la réforme du système national de santé. Ces ouvertures s'inscrivent dans le programme de réhabilitation et d'extension du réseau primaire lancé par le Comité de pilotage de la réforme, qui a achevé la réhabilitation de 1 400 centres de santé existants et démarré un nouveau programme couvrant 1 600 établissements supplémentaires. Les Groupements sanitaires territoriaux (GST), dispositif central de la réforme pour assurer la coordination entre niveaux de soins, sont progressivement généralisés à l'ensemble des 12 régions en 2026. Ces 15 nouveaux établissements viennent combler des déserts médicaux locaux identifiés lors du diagnostic régional et renforcent la capacité de prise en charge de premier recours pour des millions de Marocains, en particulier dans les zones rurales et périurbaines sous-desservies.","date":"2026-09-08"},
{"title":"Budget santé 2026 au Maroc : 42,4 milliards de dirhams (+30 %), 8 000 nouveaux postes et réhabilitation de 1 600 établissements de soins primaires","url":"https://medias24.com/2025/11/05/rehabilitation-dhopitaux-nouveaux-chu-et-generalisation-des-gst-les-principaux-projets-du-ministere-de-la-sante-en-2026/","content":"Le Projet de Loi de Finances 2026 du Maroc consacre 42,4 milliards de dirhams au ministère de la Santé et de la Protection Sociale, soit une hausse de 30 % — le plus fort taux de progression budgétaire parmi les ministères sociaux et une traduction concrète de l'engagement royal pour la réforme du système de santé. Ce budget exceptionnel finance la création de 8 000 nouveaux postes budgétaires pour réduire les déficits en ressources humaines de santé, la réhabilitation de 90 hôpitaux publics, le lancement d'un nouveau programme de réhabilitation de 1 600 centres de soins de santé primaires, l'ouverture de nouveaux CHU et l'extension de la couverture de l'Assurance Maladie Obligatoire (AMO). Le chantier phare de 2026 est la généralisation des Groupements sanitaires territoriaux (GST) à l'ensemble des 12 régions, un dispositif visant à assurer la continuité des parcours de soins entre la médecine de première ligne et les soins spécialisés. Ce budget traduit la priorité accordée à la santé dans la politique de réforme de l'État social lancée par le gouvernement, dans la perspective de l'accueil de la Coupe du Monde 2030 co-organisée par le Maroc, l'Espagne et le Portugal.","date":"2025-11-05"},
{"title":"Maroc — Octobre Rose 2026 : le ministère de la Santé intensifie les campagnes de dépistage précoce du cancer du sein dans les 12 régions avec 250 unités mobiles de mammographie","url":"https://www.sante.gov.ma/Pages/actualites.aspx","content":"À l'occasion d'Octobre Rose, le ministère marocain de la Santé et de la Protection sociale a lancé en octobre 2026 une campagne nationale intensifiée de sensibilisation et de dépistage précoce du cancer du sein dans les 12 régions du Royaume. La campagne mobilise 250 unités mobiles de mammographie déployées en priorité dans les zones rurales et semi-urbaines où l'accès aux services de dépistage reste limité. Le cancer du sein est la première cause de mortalité par cancer chez la femme au Maroc, avec environ 12 000 nouveaux cas diagnostiqués par an, dont 40 % à un stade avancé faute de dépistage précoce. Le ministère rappelle que le programme national de dépistage organisé — renforcé dans le cadre du budget 2026 de 42,4 milliards de dirhams — offre gratuitement la mammographie et la consultation oncologique à toutes les femmes de 45 à 69 ans assurées par l'AMO-Tadamon. L'objectif 2026 est de dépister 400 000 femmes supplémentaires en capitalisant sur l'AMO-Tadamon qui compte désormais plus de 13 millions de bénéficiaires.","date":"2026-10-01"},
{"title":"Formation du nouveau gouvernement marocain post-élections : AMO-Tadamon, AMMPS et Marbio-Sanofi au cœur de l'accord de coalition santé 2026-2031","url":"https://medias24.com/sujet/ministere-de-la-sante/","content":"À la suite des élections législatives du 23 septembre 2026, la formation du nouveau gouvernement marocain en octobre s'est accompagnée d'un accord de coalition plaçant la santé comme pilier central de la feuille de route 2026-2031. L'AMO-Tadamon figure parmi les engagements prioritaires avec l'objectif d'atteindre 22 millions de bénéficiaires avant fin 2026, aux côtés de la finalisation des Groupements sanitaires territoriaux dans toutes les régions, de la mise en service de l'usine Marbio-Sanofi à Nouaceur (T1 2027) et de l'accélération de la montée en puissance de l'AMMPS. Le prochain ministre de la Santé devra piloter simultanément la transformation structurelle du système de soins, la montée en charge des 15 nouveaux hôpitaux inaugurés en 2026 et le déploiement national de la feuille de soins électronique. La continuité des réformes engagées sous la Vision royale de l'État social est confirmée comme priorité transpartisane de la coalition.","date":"2026-10-03"},
{"title":"Maroc : le PLF 2027 de la santé devrait dépasser 50 milliards de dirhams — poursuite de la transformation du système national de soins sous la Vision royale","url":"https://www.agenceecofin.com/actualites/2010-132470-maroc-un-budget-de-15-milliards-annonce-pour-la-sante-et-l-education-en-2026","content":"Selon les projections budgétaires disponibles, le Projet de loi de finances 2027 en cours de préparation au Maroc devrait prévoir un budget de santé dépassant 50 milliards de dirhams — en hausse de plus de 18 % par rapport au budget record de 42,4 milliards alloué en 2026. Cette augmentation traduit la volonté de poursuivre la transformation structurelle du système national de santé : généralisation des Groupements sanitaires territoriaux dans toutes les régions, achèvement du programme des nouveaux CHU (19 opérationnels en 2026, avec Dakhla-Oued Eddahab encore attendue), et montée en charge des ressources humaines. L'enveloppe 2027 devrait intégrer le financement de la montée en puissance de l'AMMPS et du programme de fabrication locale de médicaments et vaccins via le partenariat Marbio-Sanofi dont la mise en service est prévue au T1 2027. Ces projections s'inscrivent dans le plan décennal de l'État social marocain dont la santé constitue le premier pilier opérationnel, sous l'impulsion de la Vision royale de Sa Majesté le Roi Mohammed VI.","date":"2026-10-04"},
{"title":"Maroc : cinq engagements prioritaires de santé pour 2026-2031 — les partis majoritaires s'accordent sur une feuille de route post-élections du 23 septembre","url":"https://www.sante.gov.ma/Pages/actualites.aspx","content":"À l'issue des élections législatives du 23 septembre 2026, les partis arrivés en tête ont présenté conjointement, le 28 septembre, cinq engagements prioritaires pour la politique de santé 2026-2031 : atteindre 22 millions de bénéficiaires AMO-Tadamon avant fin 2026, achever les CHU régionaux programmés, généraliser les Groupements sanitaires territoriaux dans toutes les régions d'ici 2027, doubler le nombre de médecins formés d'ici 2030 et renforcer les capacités de fabrication locale de médicaments et vaccins via le partenariat Marbio-Sanofi. La désignation du prochain ministre de la Santé est attendue dans la première quinzaine d'octobre 2026, avec une attention particulière aux profils technocrates capables de piloter la transformation du système de santé. La société civile a salué la priorité donnée à la santé tout en appelant à des engagements précis sur la réduction des déserts médicaux ruraux, où un médecin pour 8 000 habitants reste la réalité dans certaines provinces. Ces engagements s'inscrivent dans la continuité de la réforme portée par la Vision royale de l'État social, dont la santé est le premier pilier opérationnel.","date":"2026-09-28"},
{"title":"AMO-Tadamon franchit le cap de 13 millions de bénéficiaires — le Maroc intensifie la campagne d'inscription dans les provinces rurales","url":"https://www.lebrief.ma/amo-tadamon-13-millions-beneficiaires-septembre-2026","content":"Le ministre marocain de la Santé a annoncé le 25 septembre 2026 que l'AMO-Tadamon a franchi le cap de 13 millions de bénéficiaires, soit 1 million supplémentaire depuis la barre des 12 millions atteinte en août 2026. Cette accélération résulte d'une campagne d'inscription intensive lancée en septembre dans 48 provinces rurales et périurbaines, combinant guichets mobiles, dématérialisation complète via l'application Santé Maroc et déploiement de 1 200 médiateurs de santé communautaires. Le gouvernement maintient l'objectif de 22 millions de bénéficiaires d'ici fin 2026, ce qui nécessite l'inscription de 9 millions de personnes supplémentaires en trois mois — une ambition que certains experts de la CNSS jugent optimiste au regard des capacités d'absorption. L'élargissement du panier de soins de juin 2026, incluant désormais les soins dentaires, l'optique et la prise en charge des maladies chroniques, a significativement augmenté l'attractivité du régime pour les populations hésitantes.","date":"2026-09-25"},
{"title":"AMMPS : premières décisions réglementaires publiées — 12 médicaments enregistrés via la voie de reliance EMA et 3 dispositifs médicaux retirés du marché","url":"https://ammps.ma/decisions-reglementaires-septembre-2026","content":"L'Agence marocaine du médicament et des produits de santé (AMMPS) a publié le 23 septembre 2026 ses premières décisions réglementaires officielles depuis son entrée en fonction : enregistrement de 12 médicaments via la voie de reliance sur l'EMA — réduisant les délais d'approbation de 24 mois à 5 mois — et retrait du marché de 3 dispositifs médicaux diagnostiques dont les données de performance clinique étaient insuffisantes selon les nouvelles normes. Parmi les 12 médicaments figurent deux antiviraux à large spectre, un antifongique de nouvelle génération et quatre médicaments pour le diabète de type 2 et les maladies cardiovasculaires — pathologies en forte progression au Maroc. Ces premières décisions confirment le passage de l'AMMPS du stade institutionnel au stade opérationnel et son alignement sur les standards européens. La Directrice générale a annoncé que l'AMMPS traitera 120 dossiers supplémentaires d'ici fin 2026, dont 40 via la voie de reliance AMA pour les médicaments de la liste prioritaire continentale.","date":"2026-09-23"},
{"title":"Maroc : la santé publique au cœur des débats lors des élections législatives du 23 septembre 2026","url":"https://www.titrespresse.com/21880492603/maroc-catastrophe-sante","content":"La santé publique s'est imposée comme l'un des thèmes centraux de la campagne pour les élections législatives marocaines du 23 septembre 2026, avec de nombreux citoyens et associations dénonçant les difficultés persistantes d'accès aux soins malgré les réformes engagées depuis 2021. Des patients ont dénoncé des délais d'attente excessifs dans les établissements publics, la pénurie de spécialistes dans les zones rurales et les coûts encore élevés dans le secteur privé — illustrant un fossé entre les ambitions réformistes annoncées et les réalités vécues quotidiennement par les populations les plus vulnérables. Le gouvernement a mis en avant ses réalisations 2026 : budget de 42,4 milliards de dirhams en hausse de 30 %, inauguration du CHU de Béni Mellal, 15 nouveaux établissements hospitaliers, AMO-Tadamon atteignant 12 millions de bénéficiaires — mais les partis d'opposition ont souligné que la transformation de terrain requiert plusieurs années pour se concrétiser dans l'expérience quotidienne des patients. Ces élections ont confirmé que la santé — aux côtés de l'éducation et du logement — constitue désormais l'un des principaux baromètres de l'État social marocain aux yeux de l'électorat, mettant la pression sur le prochain gouvernement pour accélérer la concrétisation des réformes. La généralisation de la couverture sanitaire universelle et la réduction des inégalités territoriales d'accès aux soins figurent en tête des attentes citoyennes exprimées lors de la campagne électorale.","date":"2026-09-23"},
{"title":"PLF 2026 au Maroc : 42,4 milliards de dirhams pour une impulsion décisive vers l'équité sanitaire territoriale","url":"https://fnh.ma/article/actualite-financiere-maroc/plf-2026-sante-systeme","content":"Le Projet de loi de finances 2026 du Maroc alloue un budget de 42,4 milliards de dirhams au secteur de la santé — en hausse de 30 % par rapport à l'exercice précédent — avec pour ambition centrale de corriger les inégalités territoriales persistantes dans l'accès aux soins, au bénéfice prioritaire des populations rurales et des régions éloignées des grands centres urbains. Selon FNH.ma, les axes prioritaires incluent la finalisation des Groupements sanitaires territoriaux (GST) dans toutes les régions, le déploiement de la feuille de soins électronique, l'accélération des chantiers hospitaliers en cours et la revalorisation des ressources humaines de santé via 8 000 nouveaux postes budgétaires. Ce budget record traduit la volonté royale de faire de la santé un pilier de l'État social marocain, mais les experts et la société civile soulignent que l'efficacité de l'investissement dépend autant de la capacité d'absorption institutionnelle que des montants mobilisés — les hôpitaux sous-staffés et les retards dans la chaîne d'approvisionnement en médicaments constituant les principaux goulets d'étranglement. L'un des indicateurs clés est le taux de réalisation budgétaire — qui avoisinait 85 % en 2025 — dont l'amélioration conditionne la concrétisation des réformes dans l'expérience des patients. Ce budget devrait notamment faciliter la progression de l'AMO-Tadamon vers son objectif ambitieux de 22 millions de bénéficiaires d'ici fin 2026 et préparer le terrain pour le PLF 2027.","date":"2026-09-10"},
{"title":"Première visite officielle de la Directrice régionale de l'OMS-EMRO au Maroc : renforcement du partenariat sanitaire et soutien aux réformes GST et AMMPS","url":"https://www.emro.who.int/fr/media/actualites/who-regional-directors-first-official-visit-to-morocco.html","content":"La Directrice régionale de l'OMS pour la Méditerranée orientale (EMRO) a effectué sa première visite officielle au Maroc en septembre 2026, rencontrant le ministre de la Santé Amine Tehraoui et les responsables de l'Agence marocaine du médicament et des produits de santé (AMMPS). La visite a permis de consolider le partenariat stratégique OMS-Maroc autour des grandes réformes du système de santé en cours : opérationnalisation des Groupements sanitaires territoriaux (GST), déploiement de la feuille de soins électronique, montée en puissance de l'AMMPS et couverture sanitaire universelle via l'AMO-Tadamon (12 millions de bénéficiaires en août 2026). L'OMS a salué le Maroc comme modèle de réforme sanitaire pour la région EMRO, notamment pour son approche d'intégration des soins primaires et spécialisés via les GST et pour son budget de santé record de 42,4 milliards de dirhams en 2026. La Directrice régionale a également évoqué le rôle stratégique que peut jouer le Royaume dans la surveillance épidémiologique régionale, en sa qualité de pont entre l'Europe, l'Afrique du Nord et l'Afrique subsaharienne. La visite a conclu par un accord de renforcement de la coopération technique sur la préparation aux urgences de santé publique, dans un contexte continental marqué par l'épidémie d'Ebola Bundibugyo.","date":"2026-09-10"},
{"title":"L'AMMPS marocaine au Sommet africain sur la sécurité des patients à Kigali : vers l'intégration dans le réseau de pharmacovigilance continental de l'AMA","url":"https://au-ama.africa/","content":"L'Agence marocaine du médicament et des produits de santé (AMMPS), entrée en fonction en 2026, a participé au premier Sommet africain sur la sécurité des patients co-organisé par l'AMA et Medicines for Africa à Kigali (16-17 septembre 2026). La délégation marocaine a signé un accord préliminaire d'adhésion au futur système continental de pharmacovigilance de l'AMA, permettant à l'AMMPS de partager en temps réel les signaux de sécurité pharmaceutique avec les autorités réglementaires des 55 États membres de l'Union africaine. Cette intégration positionne le Maroc comme pont entre le système réglementaire européen (via EMA) et le nouveau cadre africain (via AMA), cohérente avec l'ambition du Royaume d'être un hub réglementaire régional pour l'Afrique du Nord et l'Afrique de l'Ouest francophone. La participation marocaine au Sommet et à la signature de la Déclaration de Kigali illustre la convergence croissante entre la politique pharmaceutique marocaine et les nouvelles normes continentales, concrétisant la coopération AMMPS-AMA initiée lors de leurs premières rencontres de juin 2026.","date":"2026-09-17"},
{"title":"Maroc : l'AMO-Tadamon franchit le cap de 12 millions de bénéficiaires — le gouvernement vise 22 millions couverts avant fin 2026","url":"https://www.lebrief.ma/amo-tadamon-12-millions-beneficiaires-couverture-sante-maroc-2026-100154122/","content":"Le ministre marocain de la Santé et de la Protection sociale, Amine Tehraoui, a annoncé le 24 août 2026 que l'AMO-Tadamon — le régime d'Assurance maladie obligatoire destiné aux populations économiquement défavorisées — a atteint le cap de 12 millions de bénéficiaires, contre 9,3 millions fin 2025, soit une progression de 29 % en moins d'un an. Cet essor est attribué à l'intensification des campagnes d'inscription dans les zones rurales et périurbaines, à la simplification des démarches via les agences de la CNSS et au déploiement d'équipes mobiles dans les provinces les plus reculées. Le gouvernement maintient l'objectif ambitieux d'atteindre 22 millions de bénéficiaires d'ici fin 2026 — soit 10 millions supplémentaires en cinq mois —, un défi logistique qui mobilise l'ensemble de l'administration territoriale. Le panier de soins de l'AMO-Tadamon a été élargi en juin 2026 pour inclure les soins dentaires de base, l'optique médicale et la prise en charge des maladies chroniques, renforçant l'attractivité du régime. Cette couverture sanitaire universelle constitue l'un des piliers de la réforme de l'État social portée par Sa Majesté le Roi Mohammed VI depuis son discours du Trône 2020.","date":"2026-08-24"},
{"title":"Inauguration du CHU Mohamed VI de Béni Mellal : 850 lits, 14 spécialités et une première historique pour la région Béni Mellal-Khénifra","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=762","content":"Le Centre hospitalier universitaire Mohamed VI de Béni Mellal a été inauguré officiellement le 17 août 2026 en présence du ministre de la Santé, marquant la première fois que cette région d'environ 2,5 millions d'habitants dispose d'un établissement hospitalier universitaire de référence. D'une superficie de 35 000 m², le CHU comprend 850 lits fonctionnels répartis dans 14 spécialités médicales et chirurgicales — dont la neurologie, la cardiologie interventionnelle, l'oncologie et la réanimation néonatale — ainsi qu'un plateau technique intégrant un scanner 128 coupes, deux IRM et un bloc opératoire de 12 salles. Cet investissement de 1,2 milliard de dirhams vise à réduire l'exode des patients de la région vers Casablanca ou Rabat, qui représentait plus de 40 000 transferts annuels selon le ministère de la Santé. Le CHU est adossé à la Faculté de médecine et de pharmacie de Béni Mellal, permettant la formation de 300 étudiants en médecine et 120 résidents par an. Son inauguration porte à 19 le nombre de CHU opérationnels au Maroc, dans le cadre du programme de couverture universitaire hospitalière de toutes les régions du Royaume d'ici fin 2027.","date":"2026-08-17"},
{"title":"Maroc : 15 projets hospitaliers achevés d'ici fin 2026, environ 3 000 lits supplémentaires pour corriger les inégalités territoriales d'accès aux soins","url":"https://www.lebrief.ma/sante-15-hopitaux-seront-acheves-en-2026-100148453/","content":"Le ministre marocain de la Santé et de la Protection sociale, Amine Tehraoui, a annoncé l'achèvement de quinze projets hospitaliers à travers le Royaume d'ici la fin de l'année 2026, représentant près de 3 000 lits supplémentaires dans le parc hospitalier national. Ces infrastructures s'inscrivent dans la réforme structurelle du système de santé marocain portée par la Vision royale de l'État social, et viennent compléter l'enveloppe budgétaire de 2,5 milliards de dirhams mobilisée en 2026 pour les Centres hospitaliers provinciaux et régionaux ainsi que pour les hôpitaux de psychiatrie et de spécialités. L'objectif est de corriger les inégalités territoriales d'accès aux soins hospitaliers, notamment dans les zones rurales et semi-urbaines encore sous-dotées en infrastructures spécialisées. D'ici fin 2027, toutes les régions du Maroc — à l'exception de Dakhla-Oued Eddahab — seront dotées de leur propre Centre hospitalier universitaire (CHU), conformément aux engagements du gouvernement en matière de couverture sanitaire universelle et de déconcentration de l'offre de soins spécialisés.","date":"2026-07-10"},
{"title":"Maroc : trois nouveaux Groupements sanitaires territoriaux opérationnels en août 2026, vers une gouvernance sanitaire régionale intégrée","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=755","content":"La première semaine d'août 2026 a marqué une nouvelle étape dans la mise en oeuvre de la réforme du système de santé marocain avec l'opérationnalisation de trois nouveaux Groupements sanitaires territoriaux (GST), s'ajoutant aux entités déjà lancées dans le cadre de la loi-cadre 06-22. Les GST coordonnent l'ensemble des établissements de soins d'une même région — secteur public, secteur privé à but non lucratif et hôpitaux militaires — pour offrir un continuum de soins intégré et améliorer l'accès des populations, en particulier en milieu rural. En parallèle, le déploiement du carnet de vaccination numérique via l'application Santé Maroc se poursuit, permettant la dématérialisation du suivi vaccinal des enfants et des adultes, facilitant la coordination entre professionnels de santé et l'identification des personnes en retard sur leur calendrier vaccinal. Le Comité de pilotage de la réforme a confirmé que 2026 constitue l'année du test pour ce dispositif ambitieux, avec des ajustements progressifs pour lever les résistances organisationnelles identifiées lors des premières phases de mise en oeuvre.","date":"2026-08-10"},
{"title":"Maroc : l'Agence marocaine du médicament et des produits de santé (AMMPS) entre en fonction pour moderniser la régulation pharmaceutique nationale","url":"https://www.leconomiste.com/sante-les-chantiers-2026/","content":"L'année 2026 marque l'entrée en fonction effective de l'Agence marocaine du médicament et des produits de santé (AMMPS), qui succède à la direction du médicament et de la pharmacie relevant du ministère de la Santé. Dotée d'une autonomie institutionnelle et opérationnelle renforcée, l'AMMPS sera chargée d'évaluer, d'homologuer et de surveiller les médicaments, dispositifs médicaux et produits biologiques mis sur le marché marocain, avec des standards alignés sur les pratiques européennes. Sa création s'inscrit dans la réforme structurelle du système de santé portée par Sa Majesté le Roi Mohammed VI pour bâtir un État social moderne. L'AMMPS est également appelée à renforcer la collaboration du Maroc avec l'Agence africaine des médicaments (AMA) et à positionner le Royaume comme hub réglementaire régional en Afrique, notamment dans le contexte du développement de capacités de fabrication de vaccins à Casablanca avec Sanofi et Marbio.","date":"2026-06-01"},
{"title":"Marbio et Sanofi lancent la co-production de vaccins à Casablanca : le Maroc s'intègre à l'écosystème africain de fabrication locale","url":"https://healthpolicy-watch.news/landmark-vaccine-deals-signal-africas-shift-toward-local-manufacturing/","content":"Le partenariat entre la biotech marocaine Marbio et le groupe pharmaceutique Sanofi pour co-produire deux vaccins dans une nouvelle usine à Casablanca positionne le Maroc comme l'un des pionniers de la fabrication locale de vaccins en Afrique du Nord. Cette collaboration, soutenue par le mécanisme AVMA de Gavi doté de 1,2 milliard USD sur 10 ans, s'inscrit dans l'ambition africaine de produire 60 % des vaccins utilisés sur le continent d'ici 2040, contre moins de 1 % actuellement. Pour le Royaume, cette initiative renforce la souveraineté sanitaire nationale, développe des compétences industrielles biopharmaceutiques locales et crée des emplois qualifiés dans le secteur de la santé. Le Maroc bénéficie d'une position géographique et réglementaire favorable pour exporter vers les marchés africains, s'appuyant sur l'harmonisation progressive en cours sous l'égide de l'AMA. Gavi procédera aux premiers décaissements du fonds AVMA vers les fabricants africains dans le second semestre 2026.","date":"2026-07-02"},
{"title":"Le Maroc consolide son système de santé publique à l'aune des défis épidémiques continentaux","url":"https://microbiotics.com.ng/africa-cdc-strategic-plan-2022-2026?pdf=4936","content":"Dans un contexte de flambées épidémiques récurrentes sur le continent africain, le Maroc renforce ses dispositifs de veille sanitaire et de réponse aux urgences de santé publique. Le Royaume s'appuie sur son réseau de laboratoires de référence et sur ses partenariats avec des institutions internationales telles qu'Africa CDC et l'OMS pour détecter précocement toute menace épidémique. Le Plan stratégique 2022-2026 d'Africa CDC, qui prévoit un Centre de coordination régional pour l'Afrique du Nord basé au Caire, constitue une opportunité pour le Maroc de renforcer son intégration dans l'architecture continentale de sécurité sanitaire. Les autorités marocaines veillent par ailleurs à maintenir des capacités de prise en charge des maladies à potentiel épidémique importées, dans le respect des Règlements sanitaires internationaux.","date":"2026-07-04"},
{"title":"Budget santé 2026 au Maroc : 42,4 milliards de dirhams, une hausse de 30 % et 8 000 nouveaux postes budgétaires","url":"https://aujourdhui.ma/actualite/un-budget-en-hausse-de-30-et-8-000-nouveaux-postes-424-milliards-de-dirhams-pour-la-sante-en-2026","content":"Le ministère marocain de la Santé et de la Protection sociale dispose en 2026 d'un budget record de 42,4 milliards de dirhams, en hausse de 30 % par rapport à l'exercice précédent, dans le cadre de la réforme structurelle du système national de santé portée par la Vision royale de l'État social. Sur cette enveloppe, 16,4 milliards de dirhams sont dédiés aux dépenses de personnel, avec la création de 8 000 nouveaux postes budgétaires pour renforcer les ressources humaines à tous les niveaux du système de soins. Les investissements prioritaires de 2026 incluent la construction de nouveaux Centres hospitaliers universitaires (CHU), la mise à niveau de 90 hôpitaux existants et le déploiement progressif des Groupements sanitaires territoriaux (GST). D'ici fin 2027, toutes les régions du Maroc, à l'exception de Dakhla-Oued Eddahab, disposeront de leur propre CHU.","date":"2026-07-03"},
{"title":"Réforme de l'état social au Maroc : la santé change d'échelle avec les Groupements sanitaires territoriaux","url":"https://leseco.ma/maroc/reforme-de-letat-social-la-sante-change-dechelle-non-sans-resistances.html","content":"La réforme du secteur de la santé au Maroc entre en 2026 dans une phase décisive avec l'opérationnalisation progressive des Groupements sanitaires territoriaux (GST), nouvelles entités de gouvernance régionale chargées d'intégrer et de coordonner l'ensemble des établissements de santé d'une même région. Cette restructuration vise à mettre fin à la fragmentation du système de soins, à améliorer l'accès aux soins en milieu rural et semi-urbain, et à renforcer la complémentarité entre les secteurs public et privé. Si l'ambition réformatrice est globalement saluée, des résistances subsistent parmi les professionnels de santé face aux changements organisationnels, notamment concernant la mobilité des personnels et la redistribution des compétences entre niveaux de soins. La généralisation de la feuille de soins électronique constitue un autre chantier prioritaire de 2026, visant à simplifier les démarches administratives et améliorer la traçabilité des soins.","date":"2026-07-01"},
