"african-medical-agency":[{"title":"AMA Week Kigali : l&#39;AMA inaugure deux hubs de capacité réglementaire et d&#39;innovation manufacturière lors de la session plénière du 27 octobre 2026","url":"https://allafrica.com/stories/202610280328.html","content":"Lors de la session plénière de sa première Semaine africaine des médicaments (AMA Week, 25-30 octobre 2026 à Kigali), l&#39;Agence africaine des médicaments a officiellement inauguré deux structures opérationnelles permanentes : un Hub de renforcement des capacités réglementaires nationales et un Hub d&#39;innovation et de préparation manufacturière. Le Hub réglementaire coordonnera les programmes de formation et d&#39;assistance technique aux 33 agences nationales membres, en s&#39;appuyant sur les partenariats avec l&#39;EMA, la FDA et la HSA de Singapour. Le Hub manufacturier accompagnera les fabricants africains dans la mise en conformité BPF et la préparation aux inspections conjointes AMA-AMMPS. La DG Dr Delese Mimi Darko a présenté le bilan des 18 premiers mois d&#39;opérationnalisation : 33 ratifications du traité, 40 médicaments en évaluation conjointe et la mise en place de la voie réglementaire accélérée pour le vaccin mRNA-1403 contre Ebola Bundibugyo. L&#39;AMA a également annoncé la signature de 4 nouveaux accords bilatéraux de reliance réglementaire avec la Tanzanie, le Maroc, le Sénégal et le Cameroun.","date":"27-10-2026"},{"title":"AMA et EMA publient un document de position conjoint pour accélérer les essais cliniques des vaccins contre le virus Ebola Bundibugyo","url":"https://www.thenewdawnliberia.com/african-european-regulators-push-ebola-vaccine-trials/","content":"L&#39;Agence africaine des médicaments (AMA) et l&#39;Agence européenne des médicaments (EMA) ont publié conjointement en octobre 2026 un document de position définissant les standards méthodologiques et les voies réglementaires accélérées pour le développement et l&#39;évaluation clinique des vaccins contre le virus Ebola Bundibugyo (BDBV). Ce document, élaboré après consultation de l&#39;OMS en août 2026, précise les critères d&#39;efficacité minimaux pour une autorisation d&#39;utilisation d&#39;urgence dans les 55 États membres de l&#39;UA et les exigences de données pour une soumission accélérée. La publication coordonnée entre l&#39;AMA et l&#39;EMA constitue un précédent en matière de gouvernance pharmaceutique mondiale et symbolise le positionnement de l&#39;AMA comme partenaire de plein droit dans la réponse aux urgences de santé publique internationale. Ce document viendra directement cadrer l&#39;évaluation du dossier mRNA-1403 de Moderna/CEPI dont le recrutement de l&#39;essai de phase 2 a démarré le 20 octobre 2026 en RDC avec 800 participants ciblés dans les zones d&#39;Ituri et du Nord-Kivu.","date":"25-10-2026"},{"title":"De Kigali, l&#39;Afrique s&#39;attaque aux barrières réglementaires qui freinent l&#39;accès aux médicaments — bilan et perspectives de l&#39;AMA Week 2026","url":"https://www.ktpress.rw/2026/10/from-kigali-africa-moves-to-break-down-barriers-to-medicines-regulation/","content":"Réunis à Kigali du 25 au 30 octobre 2026 pour la première AMA Week, les régulateurs pharmaceutiques africains et leurs partenaires ont lancé plusieurs initiatives concrètes pour réduire la fragmentation réglementaire qui prive des millions d&#39;Africains d&#39;un accès rapide à des médicaments sûrs. Un atelier spécial des régulateurs francophones a préparé l&#39;intégration de 12 pays d&#39;Afrique de l&#39;Ouest et centrale dans le réseau de pharmacovigilance continental dont le déploiement est attendu d&#39;ici décembre 2027. La Directrice générale Dr Delese Mimi Darko a présenté la feuille de route AMA 2027-2028 articulée autour de l&#39;objectif de 44 ratifications et de la mise en œuvre opérationnelle du Cadre continental de pharmacovigilance version 2.0. La conférence a également accueilli une session spéciale sur les leçons réglementaires de l&#39;épidémie Ebola Bundibugyo : comment accélérer l&#39;accès aux contre-mesures médicales en urgence tout en maintenant des standards de sécurité rigoureux pour les 1,4 milliard d&#39;habitants du continent.","date":"26-10-2026"},{"title":"DG de l&#39;AMA Delese Mimi Darko : la fragmentation pharmaceutique africaine brise la chaîne recherche-production-distribution et menace la souveraineté sanitaire","url":"https://africannewspage.net/2026/10/op-ed-why-africas-health-sovereignty-depends-on-ending-pharmaceutical-fragmentation-by-delese-darko","content":"Dans une tribune d&#39;opinion publiée en octobre 2026, la Directrice Générale de l&#39;AMA, Delese Mimi Darko, soutient que la fragmentation entre la recherche, la production et la distribution de médicaments constitue le principal obstacle à la souveraineté sanitaire de l&#39;Afrique. Elle relève que malgré 33 États membres ratificateurs et des voies réglementaires accélérées pour les produits contre Ebola, la multiplication des agences réglementaires nationales aux mandats disparates entrave la mise à l&#39;échelle de la production locale. Darko plaide pour que les États membres transfèrent progressivement certaines compétences à l&#39;AMA afin de créer un marché unique pharmaceutique africain de 1,4 milliard de consommateurs. L&#39;épidémie Ebola Bundibugyo est décrite comme un test grandeur nature de la capacité africaine à accéder rapidement à des produits médicaux élaborés localement — et à ce stade, le résultat est insuffisant. L&#39;op-ed s&#39;adresse directement aux chefs d&#39;État et ministres des finances, les invitant à allouer des ressources à l&#39;AMA lors des sommets budgétaires de fin 2026.","date":"19-10-2026"},{"title":"Leaders africains et partenaires internationaux s&#39;accordent sur une coopération renforcée pour la préparation aux pandémies et la production locale de médicaments","url":"https://kenya-today.com/report-african-leaders-call-for-regional-cooperation-on-pandemic-preparedness-and-local-medicine-production-12652","content":"Lors d&#39;une réunion de haut niveau en octobre 2026, des leaders africains et des partenaires internationaux ont réaffirmé leur engagement commun en faveur de la coopération régionale pour la préparation aux pandémies et la production locale de produits médicaux. Les participants ont souligné l&#39;urgence de renforcer les mécanismes de partage de données épidémiques, d&#39;harmoniser les réglementations pharmaceutiques via l&#39;AMA, et d&#39;investir dans des chaînes d&#39;approvisionnement résilientes. L&#39;épidémie d&#39;Ebola Bundibugyo avec plus de 9 000 cas et 4 400 décès a été citée comme démonstration de la vulnérabilité du continent. Les délégués ont appelé à l&#39;intégration des objectifs de production pharmaceutique dans les plans nationaux de développement. Cette convergence intervient à dix jours de l&#39;ouverture de la 1re AMA Week à Kigali (26-30 octobre 2026), qui devrait accélérer la mise en œuvre d&#39;accords réglementaires bilatéraux et multilatéraux.","date":"16-10-2026"},{"title":"WHO and AMA sign landmark framework to advance regulatory harmonization across Africa","url":"https://www.who.int/news/item/21-05-2026-who-and-african-medicines-agency-launch-landmark-framework-to-strengthen-access-to-quality-assured-health-products-in-africa","content":"The World Health Organization and the African Medicines Agency (AMA) signed a landmark framework agreement on 21 May 2026 on the sidelines of the 79th World Health Assembly to advance regulatory harmonization, convergence, and reliance across Africa. The agreement builds on the transfer of regulatory harmonization functions from AUDA-NEPAD to the AMA in January 2026 and aims to strengthen national regulatory authorities and improve access to quality-assured health products. The WHO-AMA partnership will focus on accelerating market approvals for essential medicines, combating substandard and falsified medicines — estimated to cause over 100,000 preventable deaths in sub-Saharan Africa annually — and harmonizing clinical trial oversight frameworks. AMA Director-General Dr Delese Mimi Darko called the agreement a defining step toward African regulatory sovereignty. The partnership is particularly timely given the Ebola Bundibugyo outbreak, which has created urgent demand for accelerated regulatory pathways for new vaccines and treatments.","date":"2026-05-21"},{"title":"AMA reaches 32 ratifying states as continental regulatory harmonization gains momentum","url":"https://au-ama.africa/ratifications/","content":"The African Medicines Agency treaty had been ratified by 32 of 55 African Union member states as of May 2026, according to the AU ratification tracker — a significant increase from 31 states in January 2026, though major markets including Nigeria and South Africa have yet to ratify. The AMA opened its doors in Kigali, Rwanda in October 2025 under inaugural Director-General Dr Delese Mimi Darko, and has already registered 40 priority medicines via its regulatory reliance pathway and signed 7 bilateral cooperation agreements in its first year. Analysts note that the agency's effectiveness depends heavily on achieving broader ratification coverage, as key pharmaceutical markets outside the treaty cannot access AMA streamlined processes. The upcoming inaugural AMA Week (26-30 October 2026 in Kigali) is expected to include a high-level push to accelerate ratifications from non-member states. Regulatory harmonization functions transferred from AUDA-NEPAD to the AMA in January 2026, placing continental medicines regulation on a legally binding institutional footing for the first time.","date":"2026-05-26"},{"title":"AMA and Medicines for Africa launch joint campaign against substandard and falsified medicines","url":"https://www.cnbcafrica.com/2026/medicines-for-africa-and-the-african-medicines-agency-join-forces-to-protect-patients-from-unsafe-medicines-across-africa","content":"The African Medicines Agency (AMA) and Medicines for Africa signed a Memorandum of Understanding in 2026 to jointly combat the proliferation of substandard and falsified medicines across the continent, a problem estimated to cause over 100,000 preventable deaths annually in sub-Saharan Africa. The partnership leverages the AMA's continental post-market surveillance mandate and Medicines for Africa's network of pharmacies, distributors, and healthcare providers to establish a unified reporting and response system for unsafe medicines. A joint Africa Patient Safety Summit was convened in Kigali on 16-17 September 2026 as the first concrete output of the MoU, gathering regulators, civil society, and pharmaceutical industry representatives. Substandard and falsified medicines are estimated to account for 10-15% of medicines circulating in Africa, disproportionately affecting under-resourced health systems with weak inspection capacity. The AMA's post-market surveillance role complements national authorities' market authorization functions and is designed to become the continent's early warning system for unsafe health products.","date":"2026-08-06"},{"title":"AMA Week Kigali : 4 200 délégués de 51 pays inscrits à 9 jours de l'ouverture — 6 décisions réglementaires majeures attendues les 25-30 octobre 2026","url":"https://au-ama.africa/news/ama-week-2026-registrations-october-update","content":"À neuf jours de l'ouverture de la première Semaine africaine des médicaments (AMA Week, 25-30 octobre 2026) au Centre de conférences de Kigali, l'Agence africaine des médicaments confirme avoir enregistré plus de 4 200 délégués représentant 51 pays — un record absolu pour un événement de régulation pharmaceutique organisé sur le continent africain. La directrice générale Dr Delese Mimi Darko a annoncé lors d'un briefing presse du 16 octobre que 6 décisions réglementaires majeures seront officiellement publiées lors de la session plénière du 27 octobre, dont la finalisation du Cadre continental de pharmacovigilance version 2.0 et un protocole d'inspection conjoint applicable aux fabricants de médicaments et vaccins dans les 28 pays membres du réseau AMA. L'AMA a confirmé la participation du Secrétaire général de l'Union africaine et des ministres de la santé de 14 États membres pour la session inaugurale du 25 octobre. La conférence marquera également le premier anniversaire opérationnel de l'AMA, dont le bilan 2025-2026 inclut l'enregistrement de 40 médicaments prioritaires via la voie de reliance réglementaire et la signature de 7 accords de coopération bilatérale.","date":"2026-10-16"},{"title":"AMA active formellement la voie réglementaire accélérée pour mRNA-1403 contre Ebola Bundibugyo — dossier Moderna soumis en 96 heures, avis technique attendu mi-novembre","url":"https://au-ama.africa/news/ama-accelerated-pathway-mrna-1403-activated-october-2026","content":"Faisant suite à sa réunion d'urgence du 9 octobre 2026, l'Agence africaine des médicaments a formellement activé sa procédure d'évaluation accélérée pour le candidat vaccin mRNA-1403 de Moderna contre l'Ebola Bundibugyo, permettant une revue en parallèle des données de phase 1 et 2 au lieu du processus séquentiel standard. Moderna a soumis son dossier réglementaire provisoire à l'AMA dans les 96 heures suivant la décision du Comité d'urgence, conformément au calendrier convenu avec les autorités sanitaires congolaises (DGSM) qui avaient préalablement approuvé l'essai clinique de phase 2 le 10 octobre. L'AMA a désigné un Groupe de travail technique spécialisé de 12 experts en vaccinologie des filovirus et en réglementation des médicaments d'urgence pour piloter l'évaluation du dossier, avec un premier avis technique préliminaire attendu avant le 15 novembre 2026. Cette coordination réglementaire triangulaire entre l'AMA, les autorités congolaises et l'OMS illustre le rôle pivot que l'Agence africaine entend jouer dans la réponse aux urgences de santé publique continentales, bien au-delà de sa mission réglementaire conventionnelle.","date":"2026-10-13"},
{"title":"AMA Week (Kigali, 25-30 octobre 2026) : programme définitif publié — 48 intervenants de 33 pays, annonce de 4 nouveaux accords de reliance réglementaire","url":"https://au-ama.africa/news/ama-week-kigali-final-programme-october-2026","content":"L'Agence africaine des médicaments (AMA) a publié le 10 octobre 2026 le programme définitif de sa première African Medicines Agency Week, prévue à Kigali du 25 au 30 octobre 2026 avec 48 intervenants représentant 33 pays africains et partenaires internationaux. Le point fort attendu de l'événement est l'annonce de 4 nouveaux accords bilatéraux de reliance réglementaire — avec la Tanzanie, le Maroc (AMMPS), le Sénégal (DPM) et le Cameroun (LANACOME) — permettant à ces pays d'approuver les médicaments de la liste prioritaire AMA via une procédure accélérée de 90 jours au lieu de 18 à 24 mois. Une session spéciale sera consacrée le 27 octobre à la voie réglementaire accélérée pour les vaccins contre Ebola Bundibugyo, avec la présentation du cadre développé en urgence par l'AMA pour autoriser l'essai de phase 2 du mRNA-1403 dans les États membres de l'UA. La Directrice générale Dr Delese Mimi Darko présentera le bilan des 18 premiers mois d'opérationnalisation et lancera la feuille de route AMA 2027-2028 à l'issue de la semaine.","date":"2026-10-10"},
{"title":"AMA : comité d'urgence réuni le 9 octobre pour accélérer la voie réglementaire du vaccin mRNA-1403 contre Ebola Bundibugyo dans les 33 États membres ratifiants","url":"https://au-ama.africa/news/ama-emergency-committee-mrna-1403-bundibugyo-regulatory-pathway-october-2026","content":"Suite aux résultats prometteurs de phase 1 du vaccin mRNA-1403 (Moderna/CEPI) publiés le 27 août 2026 et à la soumission du dossier de phase 2 aux autorités congolaises le 25 septembre 2026, l'Agence africaine des médicaments a réuni le 9 octobre 2026 son Comité d'urgence pour définir la voie réglementaire accélérée permettant aux 33 États membres ratifiants d'autoriser simultanément cet essai de phase 2 sur la base d'un dossier unique. Cette procédure inédite, rendue possible par le mécanisme de reliance réglementaire de l'AMA, évite à chaque pays d'évaluer séparément un dossier complexe dans un délai d'urgence — le démarrage du recrutement étant prévu pour le 20 octobre 2026. L'AMA a adopté un cadre d'urgence en 72 heures permettant la notification accélérée aux autorités nationales des États membres concernés. Ce précédent établit un modèle de réponse réglementaire continentale aux urgences de santé publique que l'AMA ambitionne de codifier dans ses procédures permanentes d'ici fin 2026, transformant la crise Ebola Bundibugyo en leçon institutionnelle fondatrice pour la gouvernance pharmaceutique africaine.","date":"2026-10-09"},
{"title":"Kenya et Cabo Verde ratifient le traité de l'AMA : le total atteint 33 États membres ratifiants et 39 signataires sur 55","url":"https://healthpolicy-watch.news/african-medicines-agency-countdown/","content":"Le Kenya et Cabo Verde ont déposé leurs instruments de ratification du traité constitutif de l'Agence africaine des médicaments (AMA), portant le nombre d'États membres ayant ratifié à 33 sur les 55 membres de l'Union africaine, tandis que 39 pays ont maintenant signé ou ratifié le traité, selon Health Policy Watch et le site de l'AMA. La ratification du Kenya est particulièrement stratégique : le pays est l'un des marchés pharmaceutiques les plus importants d'Afrique subsaharienne et sa Pharmacy and Poisons Board (PPB) est parmi les agences réglementaires nationales les plus solides du continent, renforçant considérablement la légitimité de l'AMA pour les échanges transfrontaliers en Afrique de l'Est. Cette progression rapide soutient l'objectif de 44 ratifications fixé d'ici fin 2027 pour atteindre le seuil du plein régime réglementaire continental permettant aux 55 États membres de bénéficier de l'harmonisation complète. La Directrice générale Dr Delese Mimi Darko a souligné que chaque ratification représente des millions de patients supplémentaires qui bénéficieront des standards de sécurité et de qualité certifiés par l'AMA pour les médicaments et vaccins circulant sur le marché continental. L'AMA intensifie son assistance technique aux 22 pays non-ratifiants restants pour lever les obstacles législatifs et administratifs aux processus de ratification.","date":"2026-10-06"},
{"title":"La DG de l'AMA à l'Assemblée régionale OMS AFRO RC76 : les revues et inspections conjointes réduisent la duplication et améliorent l'accès aux médicaments en Afrique","url":"https://afro.who.int/news/african-medicines-agency-building-trust-quality-and-access-across-africa","content":"La Directrice générale de l'Agence africaine des médicaments (AMA), Dr Delese Mimi Darko, a présenté à l'Assemblée régionale de l'OMS pour l'Afrique (RC76) les progrès de l'AMA dans la construction d'un système réglementaire continental fondé sur la confiance, la qualité et l'accès aux produits de santé. Dr Darko a mis en avant les revues conjointes et les inspections conjointes comme mécanismes centraux permettant aux pays africains de mutualiser leurs ressources techniques, de réduire la duplication coûteuse des évaluations réglementaires nationales et d'accélérer l'accès des patients aux médicaments sûrs et de qualité certifiée. Elle a précisé que l'AMA fonctionne en complémentarité avec les 55 agences réglementaires nationales dans une logique de subsidiarité, les renforçant sans les remplacer. Cette présentation à l'OMS AFRO consolide le positionnement de l'AMA comme partenaire stratégique prioritaire de l'OMS pour l'architecture réglementaire pharmaceutique africaine, aux côtés de l'EMA, de la FDA et de la HSA de Singapour avec lesquelles des accords de coopération ont déjà été formalisés.","date":"2026-09-25"},
{"title":"L'AMA organise sa première Semaine africaine des médicaments à Kigali du 25 au 30 octobre 2026 : bilan réglementaire et jalons de souveraineté pharmaceutique","url":"https://au-ama.africa/","content":"L'Agence africaine des médicaments (AMA) organise du 25 au 30 octobre 2026 à Kigali, Rwanda, la première African Medicines Agency Week — un événement inaugural rassemblant régulateurs nationaux, industriels pharmaceutiques, partenaires au développement et gouvernements des 55 États membres de l'Union africaine. Cette semaine de référence permet de dresser le bilan des 18 premiers mois d'opérationnalisation : 31 ratifications du traité constitutif, 40 médicaments en évaluation conjointe, 12 médicaments approuvés via reliance EMA, et cadre continental de pharmacovigilance adopté en septembre 2026. L'événement s'articule autour de sessions sur l'harmonisation réglementaire, la lutte contre les médicaments falsifiés, les voies accélérées pour les contre-mesures médicales d'urgence et le bilan des partenariats avec l'EMA, la FDA et la HSA de Singapour. La Directrice générale Dr Delese Mimi Darko annoncera les nouvelles étapes de la feuille de route AMA 2026-2027 et les prochains pays candidats à la ratification, dans l'objectif d'atteindre 44 ratifications d'ici fin 2027.","date":"2026-10-06"},
{"title":"Le Ghana lance HINGE, plateforme numérique co-développée avec l'AMA et Institut Pasteur pour harmoniser la réglementation pharmaceutique africaine transfrontalière","url":"https://ghanaweb.com/GhanaHomePage/NewsArchive/President-Mahama-demands-bold-action-for-Africa-s-health-sovereignty-2055163","content":"Le Président ghanéen John Mahama a annoncé le 3 octobre 2026 lors du Forum Alamein Africa en Égypte le lancement de HINGE (Health Investment and National Gateway Enabler), plateforme numérique co-développée avec l'AMA, l'Institut Pasteur et AfroChampions pour harmoniser la réglementation pharmaceutique, la validation clinique et la commercialisation des médicaments à travers les frontières africaines dans un processus unifié. Cette initiative répond à l'un des obstacles chronophages pour les fabricants africains : la duplication des dossiers d'enregistrement dans chacun des 55 pays membres de l'UA, pouvant prendre 5 à 7 ans. HINGE est conçu comme un guichet unique numérique permettant une soumission de dossier unique reconnu par les autorités nationales adhérentes, réduisant le délai estimé à moins de 18 mois. Mahama a également appelé les gouvernements africains, banques de développement et investisseurs institutionnels à financer massivement la fabrication locale, soulignant que l'Afrique importe plus de 70 % de ses médicaments malgré ses immenses ressources.","date":"2026-10-03"},
{"title":"6e PharmaReg & MedDevReg AfriSummit 2026 à Nairobi : les experts appellent à harmoniser la régulation médicamenteuse pour améliorer l'accès aux médicaments sûrs en Afrique","url":"https://standardmedia.co.ke/health/health-science/article/2001559439/africa-urged-to-harmonise-drug-regulation-to-boost-access-to-safe-medicines","content":"Le 6e PharmaReg & MedDevReg AfriSummit 2026, tenu à Nairobi au Kenya, a réuni les principales parties prenantes de la régulation pharmaceutique africaine pour appeler à une harmonisation accélérée des normes d'autorisation de mise sur le marché des médicaments et des dispositifs médicaux à travers le continent. Les experts ont souligné que la fragmentation réglementaire — 55 systèmes nationaux distincts — représente le principal obstacle à l'accès équitable aux médicaments et une barrière structurelle à l'investissement des fabricants locaux. La Directrice générale de l'AMA a rappelé que l'agence coordonne et renforce les systèmes nationaux sans les remplacer, une approche de complémentarité requérant des investissements dans les capacités des agences membres. Le sommet a recommandé que les 24 États non-ratifiants accélèrent leurs processus législatifs et que les donateurs financent l'assistance technique nécessaire pour atteindre l'objectif de 44 ratifications d'ici fin 2027.","date":"2026-10-01"},
{"title":"L'AMA publie son premier Cadre continental de pharmacovigilance : interconnexion de 28 agences nationales d'ici fin 2027","url":"https://au-ama.africa/news/continental-pharmacovigilance-framework-launch-september-2026","content":"L'Agence africaine des médicaments (AMA) a publié le 26 septembre 2026 son premier Cadre continental de pharmacovigilance, document structurant qui définit les normes, protocoles et outils pour interconnecter les systèmes nationaux de surveillance de la sécurité des médicaments des 55 États membres de l'Union africaine. Développé avec l'OMS, l'EMA et 28 autorités nationales pilotes, ce cadre établit des standards minimaux de signalement des effets indésirables, un protocole de partage en temps réel des signaux de sécurité et une plateforme numérique centrale accessible à toutes les agences membres. L'AMA prévoit d'interconnecter 28 agences nationales d'ici décembre 2027, avec un objectif de couverture des 55 États membres d'ici 2030. Ce cadre donne suite aux engagements de la Déclaration de Kigali (16-17 septembre 2026), où il avait été révélé qu'un patient africain sur 20 subit des préjudices liés aux médicaments. L'AMMPS marocaine, la NAFDAC nigériane et l'AMRH sud-africaine figurent parmi les 28 agences pilotes de la première vague d'interconnexion.","date":"2026-09-26"},
{"title":"Trois pays ratifient le traité de l'AMA en septembre 2026 : l'Éthiopie, le Mozambique et le Tchad portent le total à 31 États sur 55","url":"https://au-ama.africa/news/ethiopia-mozambique-chad-ratify-ama-treaty-september-2026","content":"L'Agence africaine des médicaments (AMA) a annoncé le 24 septembre 2026, en marge de l'Assemblée générale de l'ONU à New York, que l'Éthiopie, le Mozambique et le Tchad ont déposé leurs instruments de ratification du traité constitutif de l'AMA, portant le nombre d'États ayant ratifié à 31 sur 55. Cette progression est particulièrement significative : l'Éthiopie, deuxième pays le plus peuplé d'Afrique avec 130 millions d'habitants, apporte une masse critique de marché et une légitimité institutionnelle de premier plan. La ratification du Mozambique est stratégique dans le contexte de l'épidémie d'Ebola, ce pays étant limitrophe de zones à risque. L'AMA maintient son objectif de 44 ratifications d'ici fin 2027 pour atteindre le seuil du plein régime réglementaire continental. La Directrice générale Dr. Delese Mimi Darko a réitéré l'engagement de l'AMA à fournir une assistance technique intensive aux 24 pays non-ratifiants restants pour lever les obstacles législatifs, et a rappelé que 24 pays encore absents privent leurs populations des bénéfices de l'harmonisation réglementaire.","date":"2026-09-24"},
{"title":"AMA et NAFDAC Nigeria signent un accord de reliance réglementaire : 40 médicaments prioritaires approuvés via voie accélérée de 90 jours pour 230 millions de Nigérians","url":"https://au-ama.africa/news/ama-nafdac-regulatory-reliance-agreement-september-2026","content":"L'Agence africaine des médicaments (AMA) et l'Agence nationale pour l'administration des aliments et des médicaments (NAFDAC) du Nigeria ont signé le 22 septembre 2026 un accord de reliance réglementaire bilatéral permettant à la NAFDAC d'approuver les 40 médicaments de la liste prioritaire de l'AMA via une procédure accélérée de 90 jours — contre les 18 à 24 mois du processus d'évaluation nationale complet. Cet accord est historique : le Nigeria est le pays le plus peuplé d'Afrique avec 230 millions d'habitants, et la NAFDAC est l'une des agences réglementaires les plus robustes du continent. La liste inclut des antiviraux contre Ebola, antibiotiques contre les bactéries multirésistantes, antifongiques et candidats vaccins. La NAFDAC s'engage à partager ses données d'évaluation avec l'AMA pour les antigènes communs, réduisant les coûts pour tous les États membres. L'AMA entend répliquer ce modèle avec les dix plus grandes agences réglementaires africaines avant fin 2027, renforçant concrètement l'harmonisation réglementaire continentale.","date":"2026-09-22"},
{"title":"L'Agence africaine des médicaments et l'Autorité sanitaire de Singapour signent un MoU pour renforcer la régulation des produits médicaux en Afrique","url":"https://leadership.ng/ama-singapore-health-authority-sign-mou-to-strengthen-medical-product-regulation-in-africa/","content":"L'Agence africaine des médicaments (AMA) a signé un Mémorandum d'entente (MoU) avec la Health Sciences Authority (HSA) de Singapour pour approfondir la coopération réglementaire et promouvoir une plus grande harmonisation de la régulation des produits médicaux en Afrique. Cet accord prévoit des échanges d'informations réglementaires, un partage d'expertise technique, des programmes de renforcement des capacités et des formations croisées, y compris des consultations conjointes, des études collaboratives et des évaluations mutuelles. Singapour, dont la HSA figure parmi les agences de référence reconnues par l'OMS, devient ainsi un partenaire stratégique de l'AMA aux côtés de l'EMA et du FDA, renforçant le réseau mondial d'agences sur lequel l'AMA peut s'appuyer pour ses procédures de reliance réglementaire. Cette reliance permet aux 55 États membres de l'UA d'approuver des médicaments déjà évalués par la HSA sans dupliquer l'analyse, réduisant les délais d'accès de plusieurs années à quelques mois. Ce MoU s'inscrit dans la stratégie d'internationalisation rapide de l'AMA depuis son ouverture à Kigali, visant à bâtir un réseau mondial d'expertise au service de l'ensemble du continent africain.","date":"2026-09-15"},
{"title":"24 pays encore appelés à ratifier le traité de l'AMA sans délai pour consolider la souveraineté pharmaceutique africaine","url":"https://healthpolicy-watch.news/call-for-24-countries-to-ratify-african-medicines-agency-treaty-without-delay/","content":"Health Policy Watch rapporte que 24 des 55 États membres de l'Union africaine n'avaient pas encore ratifié le traité constitutif de l'Agence africaine des médicaments (AMA) à l'été 2026, fragilisant la légitimité de l'institution et limitant sa capacité à exercer pleinement ses prérogatives réglementaires sur l'ensemble du continent. Les experts appellent ces 24 pays à ratifier sans délai, soulignant que chaque État non-ratifiant prive ses populations des bénéfices de l'harmonisation réglementaire : délais d'accès aux médicaments plus longs, absence de protection par les standards de pharmacovigilance de l'AMA et exclusion des procédures d'évaluation conjointe qui réduisent les coûts pour les gouvernements. Les partisans citent l'épidémie d'Ebola Bundibugyo comme illustration concrète des coûts de l'absence d'harmonisation : sans système réglementaire continental unifié, des contre-mesures médicales auraient dû passer par 55 procédures nationales distinctes. La masse critique de ratifications nécessaires pour que tous les États bénéficient du plein régime réglementaire de l'AMA n'est pas encore atteinte malgré l'ouverture officielle à Kigali. L'AMA a adopté une stratégie proactive d'assistance technique aux pays non-ratifiants pour lever les obstacles législatifs, avec l'objectif d'atteindre 44 ratifications d'ici fin 2027.","date":"2026-09-01"},
{"title":"Ce que l'harmonisation réglementaire continentale de l'AMA change concrètement pour l'accès aux médicaments en Afrique","url":"https://acrnhealth.com/2026/08/13/the-african-medicines-agency-what-continental-regulatory-harmonization-actually-changes/","content":"Une analyse publiée en août 2026 par Africa Clinical Research Network (ACRN) détaille les impacts concrets de l'AMA sur l'accès aux médicaments : réduction des délais d'approbation de 5-7 ans à moins de 18 mois via les voies de reliance réglementaire, élimination de la duplication coûteuse des dossiers dans chacun des 55 États membres, et création d'un cadre réglementaire prévisible qui encourage les fabricants à investir en Afrique. L'étude recense les premiers résultats tangibles depuis l'opérationnalisation de l'AMA en 2025-2026 : liste de 40 médicaments prioritaires pour évaluation conjointe, interdiction du lévamisole, lancement des voies de reliance sur les agences de référence (EMA, FDA, TGA) et premiers audits de pharmacovigilance dans six pays membres. L'harmonisation réduit aussi les barrières à l'entrée pour les fabricants africains — Biovac, Institut Pasteur de Dakar, sites au Maroc et au Ghana — qui naviguaient dans un patchwork de 55 réglementations nationales pour accéder aux marchés continentaux. La Déclaration de Kigali sur la sécurité des patients et le futur réseau continental de pharmacovigilance sont cités comme jalons déjà historiques posés en 2026. L'auteur conclut que l'impact transformateur de l'AMA se mesurera pleinement dans 5 à 10 ans, mais que les bases posées cette année redéfinissent durablement la gouvernance pharmaceutique africaine.","date":"2026-08-13"},
{"title":"Déclaration de Kigali adoptée au 1er Sommet africain sur la sécurité des patients : feuille de route continentale contre les préjudices médicamenteux","url":"https://www.newtimes.co.rw/article/39005/news/health/african-regulators-push-for-harmonised-systems-to-monitor-medicine-safety","content":"Le 1er Sommet africain sur la sécurité des patients, co-organisé par l'AMA et Medicines for Africa à Kigali (Rwanda) les 16-17 septembre 2026, a abouti à l'adoption de trois documents structurants : la Déclaration de Kigali sur la sécurité des patients et les dommages liés aux médicaments, une Feuille de route africaine pour la prévention des préjudices médicamenteux, et un Plan directeur pour une utilisation plus sûre des médicaments. Réunissant gouvernements, régulateurs nationaux, établissements de santé, industriels pharmaceutiques et partenaires au développement de 28 pays africains et internationaux, le sommet a révélé qu'un patient africain sur 20 subit un préjudice directement lié aux médicaments — un taux double de la moyenne mondiale dans les pays à revenu élevé. Le Dr Kimmo Makinen, co-fondateur de Medicines for Africa, a appelé à la création urgente d'un système continental de pharmacovigilance interconnecté sous pilotage de l'AMA. La Déclaration engage les États membres à renforcer leurs systèmes nationaux de pharmacovigilance et à les connecter à la future plateforme de signalement continental de l'AMA, dont le développement est érigé en priorité stratégique pour 2026-2027.","date":"2026-09-17"},
{"title":"Africa HealthTech Summit 2026 à Kigali : l'AMA au coeur de la réimagination stratégique de la santé africaine par le numérique","url":"https://ijabomedia.rw/2026/09/07/africa-healthtech-summit-2026-kigali-and-the-strategic-reimagining-of-africas-health-future/","content":"Le Africa HealthTech Summit 2026 s'est tenu à Kigali, Rwanda, le 7 septembre 2026, positionnant l'Agence africaine des médicaments (AMA) comme acteur central de la transformation numérique des systèmes de santé africains. L'AMA a présenté ses travaux sur la réglementation des produits de santé numériques, des médicaments issus de l'intelligence artificielle et la lutte contre les médicaments falsifiés vendus en ligne — canal croissant pour les produits de mauvaise qualité. Le Rwanda consolide sa position de hub continental pour la gouvernance sanitaire en accueillant deux grands sommets en une semaine : l'Africa HealthTech Summit (7 septembre) et le Sommet africain sur la sécurité des patients (16-17 septembre). Les participants ont débattu du cadre réglementaire nécessaire aux marchés numériques pharmaceutiques africains, où l'essor du commerce en ligne expose les consommateurs à des risques accrus de produits contrefaits. L'AMA s'est engagée à publier d'ici fin 2026 un premier cadre continental de régulation du médicament numérique, domaine encore non réglementé dans la majorité des États africains.","date":"2026-09-07"},
{"title":"1 patient africain sur 20 victime de préjudices médicamenteux : l'AMA appelée à harmoniser d'urgence la pharmacovigilance continentale","url":"https://en.webrwanda.com/2026/09/one-in-20-african-patients-experiences.html","content":"Lors du Sommet africain sur la sécurité des patients (Kigali, 16-17 septembre 2026), les experts ont révélé que 1 patient africain sur 20 subit un préjudice directement lié aux médicaments, soit un taux nettement supérieur à la moyenne mondiale de 1 sur 30 dans les pays à revenu élevé. Cette surmortalité évitable résulte d'une triple défaillance : présence de produits sous-standards et falsifiés (1 médicament sur 10 en Afrique subsaharienne selon l'OMS), insuffisance des systèmes de pharmacovigilance active et rareté des mécanismes de signalement des effets indésirables. Les experts ont estimé que les préjudices médicamenteux coûtent au moins 42 milliards USD par an dans le monde, avec une charge disproportionnée dans les pays à faible revenu africains. L'AMA a été appelée à prioriser le développement d'une plateforme continentale de signalement de pharmacovigilance interconnectant les agences nationales pour un partage en temps réel des signaux de sécurité. La Déclaration de Kigali engage les États membres à renforcer leurs systèmes nationaux et à les connecter à la plateforme de l'AMA d'ici 2028.","date":"2026-09-17"},
{"title":"AMA : liste de 40 médicaments prioritaires finalisée pour la première procédure d'évaluation continentale conjointe 2026-2027","url":"https://au-ama.africa/news/ama-priority-medicines-list-joint-assessment-2026-2027","content":"L'Agence africaine des médicaments (AMA) a publié le 26 août 2026 la liste définitive de 40 médicaments essentiels sélectionnés pour la première procédure d'évaluation et d'inscription continentale conjointe 2026-2027, développée avec l'AUDA-NEPAD et l'OMS. Cette liste prioritaire inclut des antiviraux contre Ebola et la fièvre de Marburg, des antibiotiques de dernière génération contre les bactéries multirésistantes, des antifongiques pour patients immunodéprimés, des médicaments contre le paludisme résistant aux artemisines et trois candidats vaccins africains en attente de préqualification OMS. La sélection a été opérée sur la base des besoins en santé publique non couverts, de la charge de morbidité régionale et de l'absence d'alternatives thérapeutiques accessibles sur le continent. La procédure permettra aux 55 États membres de l'Union africaine de s'appuyer sur les évaluations de l'AMA pour autoriser ces médicaments sur leurs marchés nationaux sans duplication des analyses réglementaires — réduisant les délais d'approbation de plusieurs années à quelques mois. Ce jalon marque le passage de l'AMA d'une institution en construction à un organe réglementaire pleinement opérationnel, pivot de la souveraineté pharmaceutique africaine.","date":"2026-08-26"},
{"title":"Sommet africain sur la sécurité des patients à Kigali : AMA et Medicines for Africa confirment 42 intervenants de 28 pays pour les 16-17 septembre 2026","url":"https://www.cnbcafrica.com/2026/ama-medicines-africa-patient-safety-summit-kigali-programme-confirmed","content":"À moins de quatre semaines du Sommet africain sur la sécurité des patients prévu les 16 et 17 septembre 2026 à Kigali (Rwanda), l'Agence africaine des médicaments (AMA) et Medicines for Africa ont confirmé 42 intervenants représentant 28 pays africains et internationaux, dont des directeurs généraux d'autorités réglementaires nationales, des représentants de l'OMS et de l'EMA, ainsi que des industriels pharmaceutiques locaux et multinationaux. Le programme scientifique s'articule autour de quatre thématiques : la pharmacovigilance continentale, la lutte contre les médicaments falsifiés à l'ère du commerce numérique, le renforcement des capacités réglementaires nationales et la mise en oeuvre des voies de reliance réglementaire de l'AMA. Une session spéciale sera consacrée aux leçons réglementaires tirées de l'épidémie d'Ebola Bundibugyo : comment accélérer l'accès aux contre-mesures médicales en urgence tout en maintenant des standards de sécurité rigoureux. L'OMS estime qu'un médicament sur dix utilisé en Afrique subsaharienne est de qualité insuffisante ou falsifié, causant des milliers de décès évitables chaque année — un problème que ce sommet place au centre de l'agenda réglementaire africain. Ce premier grand événement public co-organisé par l'AMA depuis son ouverture à Kigali positionne le Rwanda comme hub de gouvernance pharmaceutique continentale.","date":"2026-08-20"},
{"title":"L'Agence africaine des médicaments et l'ACAME explorent un partenariat stratégique pour renforcer l'accès aux médicaments essentiels à travers le continent","url":"https://techreviewafrica.com/news/6779/african-medicines-agency-acame-explore-partnership-to-enhance-medical-product-regulation","content":"L'Agence africaine des médicaments (AMA) et l'Association africaine des centrales d'achats de médicaments essentiels (ACAME) ont engagé des discussions de partenariat visant à renforcer la régulation, le contrôle qualité et l'accès aux produits de santé à travers le continent africain. La rencontre s'est tenue au siège de l'AMA à Kigali, au Rwanda, entre la Directrice générale de l'AMA, Dr. Delese Mimi Darko, et le Directeur exécutif de l'ACAME, Aser Minoungou. L'ACAME regroupe les centrales d'achats de médicaments essentiels de nombreux pays africains et constitue un maillon stratégique de la chaîne d'approvisionnement pharmaceutique du continent. Un partenariat AMA-ACAME permettrait de coordonner les achats groupés, d'harmoniser les standards de qualité à l'entrée des médicaments sur les marchés nationaux et de lutter plus efficacement contre la circulation de produits falsifiés — un fléau qui touche un médicament sur dix en Afrique subsaharienne selon l'OMS. Cette initiative s'inscrit dans la mission fondatrice de l'AMA : bâtir un système réglementaire continental fiable garantissant l'accès de toutes les populations africaines à des médicaments sûrs, efficaces et de qualité certifiée.","date":"2026-08-12"},
{"title":"Revue historique de l'AMA (CIRS 2026) : de la gestation à l'opérationnalisation d'une institution réglementaire continentale inédite","url":"https://cirsci.org/publications/historical-review-of-the-african-medicines-agency-ama-ismail-2026/","content":"Une revue historique de l'Agence africaine des médicaments (AMA), publiée en 2026 par le Centre for Innovation in Regulatory Science (CIRS), retrace l'ensemble du parcours institutionnel de l'agence : de l'adoption du traité fondateur en 2019 par l'Union africaine à l'ouverture officielle de ses locaux à Kigali, au Rwanda, en 2025-2026. Cette étude académique documente les étapes clés — désignation du Rwanda comme pays hôte, négociations de l'accord de siège, constitution des organes directeurs et comités techniques, et premiers jalons réglementaires (voie de recours par reliance, interdiction du Lévamisole, lancement des procédures d'évaluation conjointe avec l'AUDA-NEPAD). Pour les décideurs, chercheurs et acteurs pharmaceutiques, cette revue constitue une référence essentielle pour comprendre les ambitions, les défis et les priorités stratégiques d'une institution appelée à transformer profondément l'accès aux médicaments pour les 1,4 milliard d'habitants du continent africain, dans un contexte où moins de 1 % des vaccins et médicaments essentiels sont produits localement.","date":"2026-07-20"},
{"title":"OMS et Agence africaine des médicaments : accord-cadre historique pour renforcer l'accès aux produits de santé de qualité en Afrique","url":"https://www.who.int/news/item/21-05-2026-who-and-african-medicines-agency-launch-landmark-framework-to-strengthen-access-to-quality-assured-health-products-in-africa","content":"L'OMS et l'Agence africaine des médicaments (AMA) ont signé le 21 mai 2026 un accord-cadre de collaboration établissant un partenariat structuré pour l'harmonisation réglementaire, la convergence et la confiance mutuelle (reliance) à l'échelle du continent africain. Cet accord vise à renforcer les systèmes réglementaires nationaux et à améliorer l'accès des populations africaines à des médicaments et vaccins sûrs, efficaces et de qualité garantie. Les domaines de coopération incluent l'alignement des normes d'enregistrement, la surveillance post-commercialisation, la lutte contre les médicaments falsifiés et le renforcement des capacités des autorités réglementaires des 55 États membres de l'Union africaine. Signé peu après l'ouverture officielle de l'AMA à Kigali, cet accord est perçu comme le levier décisif pour réduire la dépendance du continent aux agences réglementaires extérieures et accélérer l'accès des Africains aux produits de santé essentiels.","date":"2026-05-21"},
{"title":"Medicines for Africa et l'AMA s'allient contre les médicaments dangereux — Sommet africain sur la sécurité des patients à Kigali, 16-17 septembre 2026","url":"https://www.cnbcafrica.com/2026/medicines-for-africa-and-the-african-medicines-agency-join-forces-to-protect-patients-from-unsafe-medicines-across-africa","content":"Medicines for Africa et l'Agence africaine des médicaments (AMA) ont signé un accord de collaboration pour renforcer la coordination continentale et l'harmonisation réglementaire dans la lutte contre les médicaments de qualité insuffisante et les produits pharmaceutiques falsifiés. Les deux organisations co-organiseront le Sommet africain sur la sécurité des patients à Kigali, au Rwanda, les 16 et 17 septembre 2026. L'OMS estime qu'environ un médicament sur dix utilisé en Afrique subsaharienne est soit de qualité inférieure aux normes, soit falsifié, causant des échecs thérapeutiques, des résistances aux antimicrobiens et des milliers de décès évitables chaque année. Ce partenariat engage l'AMA sur la voie d'une surveillance active du marché pharmaceutique africain dès ses premiers mois d'opérationnalisation à Kigali, avec la sécurité des patients au cœur de sa feuille de route réglementaire.","date":"2026-07-01"},
{"title":"AMA issues inaugural Regulatory Reliance Pathway guidance for human medicines marketing authorisation — a continental first","url":"https://au-ama.africa/","content":"The African Medicines Agency (AMA) released in July 2026 its inaugural guidance on Regulatory Reliance Pathways for the Marketing Authorisation of Human Medicinal Products — a continental first enabling national African regulatory authorities to rely on prior approvals by stringent agencies such as the EMA, FDA or WHO Prequalification Programme when assessing medicines. This reliance approach is projected to significantly reduce approval timelines across the 55 AU Member States, lower costs for national regulators and accelerate patient access to quality medicines. In a separate action, AMA implemented in June 2026 a ban on medicinal products containing Levamisole as an active pharmaceutical ingredient, following post-market safety signals — demonstrating AMA's capacity to act rapidly on safety concerns. Both measures signal that AMA has moved swiftly from institution-building to active regulatory function within months of officially opening in Kigali, Rwanda, setting a new benchmark for continental pharmaceutical governance.","date":"2026-07-15"},
{"title":"L'Agence africaine des médicaments officiellement opérationnelle à Kigali","url":"https://www.instagram.com/reel/DXKBkARCACi","content":"L'Agence africaine des médicaments (AMA) a officiellement ouvert ses portes à Kigali, au Rwanda, marquant une étape historique pour la santé publique continentale. Cette ouverture représente une avancée majeure vers une meilleure collaboration entre les États membres de l'Union africaine et un accès renforcé à des produits médicaux sûrs, efficaces et de qualité à travers le continent. L'initiative OneHealth EU, partenaire clé du processus, salue ce jalon et partage les coulisses des premières semaines d'activité de l'agence, avec des témoignages directs des leaders qui ont porté ce projet. L'AMA a vocation à harmoniser la réglementation pharmaceutique africaine, à réduire la dépendance aux agences extérieures et à accélérer l'approbation de médicaments et vaccins essentiels pour les populations africaines.","date":"2026-07-12"},
{"title":"Le lancement de l'Agence Africaine des Médicaments : une révolution pour la régulation pharmaceutique continentale","url":"https://www.nature.com/articles/d44148-025-00350-8","content":"La mise en opération de l'Agence Africaine des Médicaments (AMA) représente une étape décisive pour la régulation pharmaceutique sur le continent africain. L'Agence Européenne des Médicaments (EMA), par la voix de son responsable des affaires internationales Martin Harvey Allchurch, confirme que des financements sont directement orientés vers des projets collaboratifs spécifiques avec l'AMA. Parmi ceux-ci figure un effort conjoint avec l'OMS visant à soutenir le projet pilote de l'AUDA-NEPAD pour la première évaluation et inscription continentale conjointe de médicaments à usage humain — une étape clé dans l'opérationnalisation de l'AMA. Ce mécanisme régional devrait permettre de réduire les délais d'approbation des médicaments en Afrique, d'harmoniser les standards de sécurité et d'ouvrir la voie à un accès plus équitable aux thérapeutiques innovantes pour les populations africaines.","date":"2026-07-05"},
{"title":"EMA renforce sa coopération avec l'AMA : visite de haut niveau à Amsterdam pour consolider le partenariat réglementaire euro-africain","url":"https://techreviewafrica.com/news/6104/african-medicines-agency-enhances-regulatory-cooperation-with-european-medicines-agency","content":"Une délégation de l'Agence Africaine des Médicaments (AMA) a effectué une visite officielle au siège de l'Agence Européenne des Médicaments (EMA) à Amsterdam du 22 au 26 juin 2026 pour approfondir la coopération réglementaire entre les deux institutions. Les échanges ont porté sur le partage de connaissances, l'apprentissage mutuel et les projets pilotes d'évaluation conjointe de médicaments à usage humain menés avec l'AUDA-NEPAD et l'OMS. Cette coopération est d'autant plus stratégique dans le contexte de l'épidémie d'Ebola Bundibugyo, où AMA et EMA ont tenu leur premier engagement scientifique conjoint en juin 2026 pour accélérer l'accès aux contre-mesures médicales. Le partenariat EMA-AMA constitue un modèle de coopération réglementaire Nord-Sud susceptible d'être étendu à d'autres agences du médicament dans le monde.","date":"2026-06-26"},
{"title":"L'AMA lance un appel à experts pour rejoindre ses Comités Techniques : candidatures closes le 18 juin 2026","url":"https://www.nepad.org/tenders/expression-of-interest-africa-medicine-agency-ama-technical-committees","content":"L'Agence Africaine des Médicaments (AMA) a publié le 11 mai 2026 un appel ouvert à manifestation d'intérêt destiné à recruter des experts pour siéger au sein de ses Comités Techniques. La date limite de soumission des candidatures était fixée au 18 juin 2026. Les experts sélectionnés sont appelés à servir en qualité d'experts indépendants, dans l'intérêt de l'Union africaine et de la santé publique du continent. Les candidatures devaient être transmises électroniquement à l'adresse officielle de l'AMA. Seuls les candidats présélectionnés seront contactés. Cette initiative s'inscrit dans le cadre des efforts de l'AMA pour structurer ses organes scientifiques et renforcer la régulation des médicaments à l'échelle continentale.","date":"2026-06-26"},

"manufacture-vaccins":[{"title":"WHSRM 2026 : cinq obstacles structurels freinent encore la fabrication vaccinale africaine malgré les investissements record","url":"https://www.africahealthwatch.com/p/whsrm-2026-the-barriers-of-africas","content":"La World Health Summit Regional Meeting 2026 (WHSRM) consacrée à l&#39;Afrique a identifié cinq obstacles structurels persistants freinant le développement de la fabrication vaccinale locale malgré les investissements records de 2025-2026 : absence de garanties d&#39;achat à long terme, insuffisance des capacités réglementaires nationales, coût prohibitif des matières premières biologiques, manque de personnels spécialisés en bioprocess et fragmentation des marchés sans coordination des appels d&#39;offres continentaux. Ces obstacles expliquent pourquoi, malgré des engagements de financement supérieurs à 2 milliards USD depuis 2021, l&#39;Afrique continue de produire moins de 1 % des vaccins qu&#39;elle consomme. Les experts ont recommandé l&#39;adoption d&#39;une politique d&#39;achats préférentiels continentaux via le mécanisme AVMA de Gavi et l&#39;élargissement des inspections conjointes AMA-agences nationales pour réduire les délais de certification BPF. La prochaine étape critique est la mise en service des premiers sites certifiés OMS au Nigeria (May &amp; Baker), au Kenya (Bio Vaccines Institute) et au Maroc (Marbio-Sanofi) prévus entre T1 et T3 2027.","date":"21-10-2026"},{"title":"Hubs mRNA en Afrique : entre ambitions modulaires et réalités du fill-finish — analyse de la fenêtre 2026-2028 pour la production commerciale","url":"https://streamlinefeed.co.ke/news/local-vaccine-manufacturing-mrna-fill-finish-timelines-africa-2026","content":"Une analyse publiée en octobre 2026 examine les promesses et les contraintes réelles des hubs de fabrication de vaccins ARN messager en Afrique dans la fenêtre 2026-2028. Les trois sites les plus avancés — BioNTech/Kanombe Pharma (Rwanda), Afrigen Biologics (Afrique du Sud) et Institut Pasteur de Dakar — ont tous atteint des jalons de production expérimentale mais n&#39;ont pas encore obtenu la certification OMS requise pour approvisionner les marchés UNICEF et Gavi. Le fill-and-finish est identifié comme étape critique sous-investie : de nombreux sites peuvent produire du matériel antigénique mais ne disposent pas encore des lignes aseptiques et des équipements de lyophilisation nécessaires à la production commerciale. Kanombe Pharma au Rwanda a franchi les 100 000 doses expérimentales en octobre 2026 et vise la certification BPF OMS en T1 2027, ce qui en ferait le premier hub mRNA africain commercialement opérationnel. Sans garanties d&#39;achat fermes couvrant au moins 60 % de la capacité des nouvelles usines, l&#39;équilibre financier restera hors de portée pour la plupart des fabricants africains.","date":"20-10-2026"},{"title":"CHAI 2026 : cartographie des capacités de fabrication vaccinale en Afrique — 18 sites en construction sur 12 pays, mais concentration géographique préoccupante","url":"https://www.clintonhealthaccess.org/report/current-and-planned-vaccine-manufacturing/","content":"La Clinton Health Access Initiative (CHAI) a publié en 2026 une cartographie exhaustive des capacités actuelles et planifiées de fabrication vaccinale sur le continent africain, recensant 18 sites en phase de construction ou d&#39;expansion dans 12 pays — un bond significatif par rapport aux 6 sites existants en 2021. Les investissements cumulés dépensés ou engagés pour ces 18 sites dépassent 1,8 milliard USD, financés par un mix de capitaux publics, de financements multilatéraux (IFC, BAD, BEI) et de partenariats avec des fabricants asiatiques et européens. La cartographie révèle une concentration géographique préoccupante : 14 des 18 sites se trouvent dans seulement 5 pays (Afrique du Sud, Maroc, Rwanda, Ghana, Sénégal), laissant 40 pays africains sans perspective de production locale à horizon 2030. Le rapport recommande des politiques d&#39;investissement ciblées vers le Nigeria et l&#39;Éthiopie, et plaide pour une coordination renforcée entre l&#39;AVMA de Gavi et les politiques industrielles nationales, sous l&#39;égide de l&#39;AMA pour l&#39;harmonisation réglementaire des nouveaux sites.","date":"15-10-2026"},{"title":"EAC (Communauté d&#39;Afrique de l&#39;Est) sollicite 45 millions USD pour lancer une production régionale de médicaments et vaccins face à l&#39;épidémie Ebola","url":"https://theeastafrican.co.ke/tea/news/east-africa/eac-seeks-45m-for-production-of-medicines-vaccines-5633818","content":"La Communauté d&#39;Afrique de l&#39;Est (EAC) a présenté le 16 octobre 2026 un appel à financement de 45 millions USD pour lancer une production régionale de médicaments essentiels et de vaccins, en réponse directe à l&#39;épidémie Ebola Bundibugyo qui sévit à sa frontière occidentale. L&#39;initiative vise à établir au moins deux sites de fabrication pharmaceutique partagés entre les États membres (Kenya, Tanzanie, Rwanda, Ouganda, Burundi) et à développer une capacité de fill-and-finish vaccinal régionale d&#39;ici 2028. Le Kenya, qui a enregistré son premier cas importé d&#39;Ebola en octobre 2026, a mis en évidence la vulnérabilité des systèmes de santé régionaux face à l&#39;absence de chaînes d&#39;approvisionnement locales. Le financement recherché couvrirait études de faisabilité, équipements de base et formation technique. L&#39;EAC s&#39;appuie sur les mécanismes de l&#39;AMA et les financements de l&#39;IFC et de la BAD, et négocie avec Gavi pour être incluse dans les prochaines allocations de l&#39;AVMA (African Vaccine Manufacturing Accelerator).","date":"16-10-2026"},{"title":"Ghana : le président Mahama annonce un hub pharmaceutique dans son New Economy Plan pour faire du Ghana un exportateur de vaccins pour l&#39;Afrique","url":"https://www.modernghana.com/news/1537055/never-again-mahama-pushes-for-local-vaccine-manuf.html","content":"Le président ghanéen John Mahama a annoncé le 18 octobre 2026 l&#39;intégration d&#39;un hub pharmaceutique national au sein de son New Economy Plan doté de 10 milliards USD, visant à transformer le Ghana en producteur et fournisseur de vaccins pour l&#39;ensemble du continent africain. Sous le slogan &#39;Never again&#39;, Mahama a rappelé que l&#39;Afrique ne doit plus jamais se retrouver en pénurie de vaccins faute de production locale — une leçon de la crise COVID-19 et de l&#39;épidémie Ebola Bundibugyo. Le plan prévoit des incitations fiscales et des garanties d&#39;État pour attirer des investissements privés dans des unités produisant des vaccins antipaludiques, anti-méningite et contre les pathogènes épidémiques. Le Ghana abrite l&#39;Institut national des vaccins (NVRI) et Atlantic Lifesciences, qui a déjà reçu la préqualification OMS pour un vaccin méningococcique, faisant du pays l&#39;un des trois piliers africains de la souveraineté vaccinale avec le Maroc et l&#39;Afrique du Sud. L&#39;initiative s&#39;aligne sur l&#39;agenda Gavi 6.0 et l&#39;AVMA.","date":"18-10-2026"},{"title":"Gavi's $1.2B African Vaccine Manufacturing Accelerator: first disbursements to African manufacturers expected in 2026","url":"https://www.semafor.com/article/07/02/2026/africa-moves-ahead-with-vaccine-manufacturing-ambitions","content":"Gavi, the Vaccine Alliance, is expected to make its first cash disbursements to African vaccine manufacturers in the second half of 2026 under its $1.2 billion African Vaccine Manufacturing Accelerator (AVMA), a landmark 10-year advance market commitment designed to close Africa's chronic vaccine production gap. Africa currently produces less than 1% of the vaccines it consumes, despite the AU's target of manufacturing 60% locally by 2040. The AVMA is the largest single investment in African vaccine production infrastructure and de-risks scale-up by guaranteeing purchase commitments to eligible manufacturers, reducing the commercial uncertainty that has deterred private investment. Rwanda, Senegal, South Africa, Kenya, and Egypt are among the countries with active vaccine manufacturing projects, though analysts warn that financial support must be accompanied by regulatory capacity, cold chain infrastructure, and specialized workforce development. The first AVMA disbursements will be closely watched as a proof of concept for advance market commitment instruments applied to manufacturing scale-up rather than demand stimulation.","date":"2026-07-02"},{"title":"Biovac backed by IFC and EIB Group to build Africa's first end-to-end multi-vaccine manufacturing site in South Africa","url":"https://healthpolicy-watch.news/landmark-vaccine-deals-signal-africas-shift-toward-local-manufacturing/","content":"South Africa's Biovac Institute has secured investment commitments from the International Finance Corporation (IFC), the European Investment Bank (EIB) Group, and the European Commission to construct Africa's first end-to-end multi-vaccine manufacturing facility, capable of producing a range of vaccines from bulk antigen production through final fill-and-finish at commercial scale. The facility aims to reduce Africa's dependence on imports from India and Europe, which currently supply the vast majority of the continent's vaccines, and to serve regional markets across sub-Saharan Africa. South Africa and Senegal are currently the only African countries with end-to-end vaccine manufacturing capacity, and the Biovac expansion — expected to become operational in the late 2020s — could produce tens of millions of doses annually for influenza, COVID-19, and emerging pathogens. The investment aligns with the African Union's Agenda 2063 health sovereignty goals and the recommendations of the AU High Level Panel on COVID-19. The involvement of multilateral development finance institutions signals growing international confidence in the commercial and public health case for African vaccine manufacturing.","date":"2026-04-01"},{"title":"Rwanda's BioNTech mRNA facility yet to commence commercial production despite significant infrastructure investment","url":"https://www.semafor.com/article/07/02/2026/africa-moves-ahead-with-vaccine-manufacturing-ambitions","content":"Rwanda's mRNA vaccine manufacturing facility in Kigali, built with technical and financial support from BioNTech and the German government as part of the BioNTainers initiative, had not yet commenced commercial production as of mid-2026, despite significant infrastructure investment and extensive capacity-building efforts. The facility, designed to produce up to 50 million mRNA vaccine doses annually, has faced delays related to regulatory approval processes, technology transfer complexity, and the need to develop a specialized local bioprocess workforce with the required skills. The Rwandan government and BioNTech are working toward full operational status, with commercial production now expected in the 2027-2028 timeframe. If successful, the facility would represent Africa's most advanced mRNA vaccine project and serve as a regional manufacturing hub for sub-Saharan Africa, potentially producing vaccines for COVID-19, malaria, HIV, and tuberculosis. The delays highlight broader challenges in the continent's push to build vaccine manufacturing capacity that extends beyond infrastructure to encompass human capital, regulatory systems, and sustainable demand.","date":"2026-07-02"},{"title":"Ghana : l'Institut national des vaccins cible la production du premier vaccin local dès 2027 — accord de transfert de technologie signé avec Bio Farma (Indonésie) pour le vaccin DT","url":"https://myjoyonline.com/ghana-targets-first-locally-manufactured-vaccine-by-2027","content":"L'Institut national des vaccins du Ghana a annoncé le 9 octobre 2026 un accord de transfert de technologie avec Bio Farma, fabricant public indonésien, pour produire localement le premier vaccin ghanéen — un vaccin diphtérie-tétanos (DT) destiné au programme national de vaccination pédiatrique. L'accord prévoit un accompagnement technique de 18 mois incluant la formation du personnel local, le transfert des formulations et processus de fabrication, et l'assistance à la mise en conformité avec les Bonnes pratiques de fabrication de l'OMS, avec une première production pilote prévue d'ici fin 2027. Le Ghana dispose déjà d'infrastructures de remplissage et conditionnement mais cherche à maîtriser progressivement les processus de fabrication des antigènes pour réduire sa dépendance aux importations, qui représentent actuellement 95 % des vaccins administrés dans le programme national. Cette initiative s'inscrit dans la stratégie régionale coordonnée par Africa CDC visant 60 % d'autosuffisance vaccinale africaine d'ici 2040 et illustre la voie incrémentale — maîtrise du fill-and-finish puis intégration progressive des étapes de production en amont — que plusieurs pays africains adoptent face aux contraintes d'investissement.","date":"2026-10-09"},{"title":"Afrique : 36 pays d'Afrique subsaharienne sans capacité pharmaceutique locale — Africanews Business Africa appelle à des garanties d'achat et des cofinancements publics-privés","url":"https://africanews.com/2026/10/15/vaccines-antibiotics-africas-push-for-pharma-independence-business-africa","content":"Dans une émission spéciale du 15 octobre 2026, Africanews Business Africa a documenté la situation critique selon laquelle 36 des 47 pays d'Afrique subsaharienne ne disposent d'aucune capacité de fabrication pharmaceutique locale, les rendant entièrement dépendants des importations pour vaccins essentiels, antibiotiques et médicaments de base. Cette dépendance s'est révélée critique lors de l'épidémie d'Ebola Bundibugyo : aucun des pays africains touchés n'a pu produire localement les équipements de protection individuelle, les médicaments de soutien ou les réactifs de diagnostic nécessaires à la réponse de terrain, entraînant des délais d'approvisionnement de 2 à 6 semaines depuis l'Europe et l'Asie. Les panélistes ont estimé à 2 milliards USD sur cinq ans les investissements nécessaires pour créer une capacité pharmaceutique minimale dans 15 nouveaux pays, conditionnés à des garanties d'achat à long terme permettant de rentabiliser les usines locales face à la concurrence des prix des fabricants asiatiques. Les modèles marocain (Marbio-Sanofi Benslimane), rwandais (BioNTech Hub Kigali) et sud-africain (Biovac/Afrigen) ont été cités comme références à adapter selon les capacités industrielles et réglementaires locales de chaque pays.","date":"2026-10-15"},{"title":"Nouveaux vaccins anti-tuberculose : l'Afrique doit préparer sa capacité manufacturière dès maintenant pour ne pas manquer la fenêtre — rapport allAfrica","url":"https://allafrica.com/stories/202610150225.html","content":"Un rapport de recherche publié le 15 octobre 2026 sur allAfrica avertit que de nouveaux vaccins contre la tuberculose pourraient être disponibles d'ici 2028-2030 après plusieurs essais de phase 2/3 en cours, mais que l'Afrique risque d'être exclue des premières vagues de déploiement faute de capacité manufacturière et réglementaire préparée à l'avance. La tuberculose cause environ 1,3 million de décès par an dans le monde, dont 40 % en Afrique, et aucun vaccin plus efficace que le BCG centenaire n'est actuellement disponible — rendant les 10 candidats en phase avancée particulièrement stratégiques pour la santé publique africaine. L'analyse recommande que les États africains sécurisent dès maintenant des accords de transfert de technologie préemptifs avec les développeurs de vaccins TB (MSD, GSK, Bharat Biotech), et que l'AMA crée une voie réglementaire dédiée TB, en s'appuyant sur les leçons des 18 mois perdus entre l'approbation du vaccin R21 et son introduction dans les programmes africains. Le rapport estime que chaque année de retard d'accès à un vaccin TB efficace représente 500 000 décès évitables en Afrique, rendant urgent l'investissement dans la préparation manufacturière et réglementaire dès maintenant.","date":"2026-10-15"},
{"title":"Kanombe Pharma (Rwanda) franchit le jalon des 100 000 doses de vaccin mRNA en production expérimentale — certification BPF OMS visée pour T1 2027","url":"https://www.biontech.com/news/2026/kanombe-pharma-100000-doses-mrna-milestone-october-2026","content":"Kanombe Pharma, fabricant rwandais de vaccins issu du transfert de technologie du BioNTech mRNA Hub Kigali, a franchi le 9 octobre 2026 le jalon symbolique des 100 000 doses de vaccin à ARN messager produites en mode expérimental — une étape clé dans la montée en puissance industrielle qui précède la certification BPF (Bonnes pratiques de fabrication) de l'OMS, visée pour le premier trimestre 2027. Parmi ces 100 000 doses expérimentales figurent les premières doses du vaccin antipaludique mRNA en phase 3 développé par BioNTech, ainsi que 12 000 doses expérimentales du candidat vaccin contre la fièvre de Lassa codéveloppé avec l'Institut Jenner d'Oxford et Africa CDC. Gavi a versé à Kanombe Pharma un premier paiement AVMA de 22 millions USD suite à l'atteinte de ce jalon contractuel, portant le total des décaissements AVMA en 2026 à plus de 130 millions USD vers les fabricants africains. La certification OMS attendue en T1 2027 ouvrira à Kanombe Pharma l'accès aux appels d'offres UNICEF, faisant du Rwanda le troisième pays africain — après l'Afrique du Sud et le Ghana — à disposer d'un fabricant certifié pour les achats groupés des organisations onusiennes.","date":"2026-10-09"},
{"title":"Marbio-Sanofi Casablanca : 80 % d'avancement, premier lot pilote de DTaP validé — inspection BPF conjointe AMMPS-AMA confirmée pour le 3 novembre 2026","url":"https://healthpolicy-watch.news/marbio-sanofi-casablanca-80-percent-first-dtap-batch-validated-october-2026","content":"Le partenariat Marbio-Sanofi a communiqué le 11 octobre 2026 que la construction de l'usine vaccinale de Nouaceur (Casablanca) a franchi le seuil des 80 % d'avancement, avec la validation analytique réussie du premier lot pilote du vaccin diphtérie-tétanos-coqueluche (DTaP) sur la ligne de remplissage aseptique — une étape décisive confirmant la conformité du procédé de fabrication aux spécifications Sanofi. L'Agence marocaine du médicament (AMMPS) et l'Agence africaine des médicaments (AMA) ont confirmé conjointement la date du 3 novembre 2026 pour la première inspection BPF de l'installation, conduisant simultanément les deux certifications — nationale et continentale — dans une procédure coordonnée sans précédent. Si cette inspection est concluante, la mise en service commercial reste prévue au premier trimestre 2027, avec une première livraison au Programme national de vaccination marocain en avril 2027 et les premières exportations vers le marché UNICEF en Afrique subsaharienne envisagées pour T3 2027. L'effectif de l'usine atteint désormais 175 des 320 postes prévus, dont 52 ingénieurs et techniciens formés dans des installations Sanofi en Europe.","date":"2026-10-11"},
{"title":"Gavi AVMA : premiers décaissements vers des fabricants africains attendus au second semestre 2026 — 13 accords de transfert de technologie déjà signés","url":"https://healthpolicy-watch.news/landmark-vaccine-deals-signal-africas-shift-toward-local-manufacturing/","content":"Gavi, l'Alliance du Vaccin, a confirmé que ses premiers décaissements dans le cadre de l'African Vaccine Manufacturing Accelerator (AVMA) seront effectués au second semestre 2026 en faveur de fabricants africains de vaccins — une étape historique pour le programme de 1,2 milliard USD sur 10 ans qui utilise des incitations financières liées à la demande pour catalyser la production vaccinale locale. À cette date, 13 accords de transfert de technologie entre fabricants africains et partenaires mondiaux ont déjà été signés, et les premières livraisons de vaccins produits en Afrique avec soutien AVMA sont anticipées dès 2027. Le modèle AVMA est conçu pour que les licences de fabrication restent détenues par les acteurs africains — une garantie structurelle essentielle pour éviter que les partenariats reproduisent les dépendances de sous-traitance qui caractérisent aujourd'hui la situation pharmaceutique du continent. Gavi a également proposé l'AVMA+, un ensemble de mesures supplémentaires de 189 millions USD soumis à son Conseil en juillet 2026, pour accélérer la transition vers une fabrication vaccinale africaine compétitive. L'Afrique produit actuellement moins de 1 % de ses vaccins localement, malgré une capacité de remplissage et finition (fill-and-finish) dépassant les 2 milliards de doses — le vrai déficit étant la production d'antigènes.","date":"2026-10-01"},
{"title":"Biovac remporte un appel d'offres Hexaxim en Afrique du Sud et bénéficie des financements IFC-BEI pour la première installation vaccinale africaine de bout en bout","url":"https://www.semafor.com/article/07/02/2026/africa-moves-ahead-with-vaccine-manufacturing-ambitions","content":"Le fabricant sud-africain Biovac a remporté en mai 2026 un appel d'offres des départements de santé provinciaux sud-africains pour la fourniture du vaccin hexavalent Hexaxim de Sanofi, consolidant sa position commerciale et sa viabilité économique dans la perspective de son développement en site vaccinal complet. Des financements convergents de l'IFC (Groupe Banque mondiale), du groupe BEI (Banque européenne d'investissement) et de la Commission européenne visent à construire le premier site africain de fabrication multi-vaccins de bout en bout — incluant la production d'antigènes, maillon crucial absent de la quasi-totalité des capacités africaines actuelles. La Banque africaine de développement a également signé un accord de 15 millions USD avec Biovac pour financer la première production africaine de bout en bout du vaccin contre le choléra. Ces investissements conjugués font de Biovac un pivot stratégique de la montée en gamme vaccinale de l'Afrique du Sud au-delà des seules capacités fill-and-finish, et pourraient servir de modèle pour d'autres pays africains avec des industries pharmaceutiques établies, comme le Maroc, le Ghana et la Tunisie.","date":"2026-07-02"},
{"title":"Maroc : Marbio à Benslimane produit deux vaccins Sanofi pour le marché national — un modèle de fabrication locale à dupliquer selon le rapport CHAI 2026","url":"https://www.clintonhealthaccess.org/report/african-vaccine-manufacturing-supply-landscape-2026/","content":"Selon le rapport 2026 de la Clinton Health Access Initiative (CHAI) sur le paysage de la fabrication vaccinale en Afrique, le laboratoire marocain Marbio, basé à Benslimane, produit désormais deux vaccins du groupe Sanofi destinés à couvrir les besoins du marché national marocain — une réalisation concrète du modèle de transfert de technologie que le gouvernement du Maroc cherche à généraliser pour réduire la dépendance aux importations. Le Maroc figure parmi les quatre pays africains (avec la Tunisie, l'Afrique du Sud et le Sénégal) identifiés par le CHAI comme pôles potentiels d'une fabrication vaccinale africaine compétitive à l'horizon 2030. Le rapport CHAI souligne néanmoins que les fabricants africains font encore face à des obstacles majeurs pour commercialiser leurs produits : la préqualification OMS et la certification AMA restent des barrières à l'entrée coûteuses, faisant de l'harmonisation réglementaire continentale la priorité absolue pour rendre les investissements dans la fabrication locale économiquement viables. L'Afrique importe actuellement 99 % de ses vaccins, et le CHAI estime que les installations de fill-and-finish sur le continent suffisent déjà à couvrir la demande si les antigènes étaient produits localement — ce qui exige encore des investissements massifs en R&D et en capacités de bioréacteurs.","date":"2026-09-15"},
{"title":"Mahama au Forum Alamein Africa : l'Afrique importe 70 % de ses médicaments — les gouvernements doivent financer d'urgence la fabrication pharmaceutique et vaccinale locale","url":"https://riotimesonline.com/mahama-urges-africa-local-pharmaceutical-manufacturing-2026","content":"Le Président ghanéen John Mahama a tenu le 3 octobre 2026 un discours percutant au Forum Alamein Africa en Égypte, exigeant des réponses audacieuses de financiers, régulateurs et industriels africains pour sécuriser la souveraineté sanitaire du continent. Mahama a souligné que l'Afrique importe plus de 70 % de ses médicaments et près de 99 % de ses vaccins, rendant le continent structurellement vulnérable aux ruptures d'approvisionnement — comme le démontre l'épidémie d'Ebola Bundibugyo sans vaccin ni traitement produit sur le continent après plus de 8 000 cas. Il a appelé la BAD, Afreximbank et les fonds souverains africains à orienter au moins 15 % de leurs investissements dans le secteur biopharmaceutique local, et les gouvernements à adopter des politiques d'achat prioritaire pour les médicaments et vaccins produits sur le continent. Le Ghana s'est engagé à financer l'expansion d'Atlantic Lifesciences, dont le vaccin méningocoque A vient d'obtenir la préqualification OMS, et à développer des partenariats supplémentaires de transfert de technologie en vue de 2028.","date":"2026-10-03"},
{"title":"NAFDAC Nigeria appelle à des partenariats pour lancer la fabrication de vaccins localement — l'absence de production nationale retarde la certification OMS Maturity Level 4","url":"https://businessday.ng/health/article/nafdac-seeks-partners-support-to-revive-vaccine-manufacturing-in-nigeria","content":"L'Agence nationale pour l'administration des aliments et des médicaments du Nigeria (NAFDAC) a lancé un appel formel à des partenaires internationaux pour soutenir l'établissement de capacités de fabrication de vaccins au Nigeria, soulignant que l'absence de production nationale retarde l'obtention de la Certification Maturity Level 4 de l'OMS — prérequis pour exporter des lots de vaccins vers d'autres pays africains. Le Nigeria, avec 230 millions d'habitants et le plus grand marché pharmaceutique d'Afrique, reste entièrement dépendant des importations pour ses vaccins. La NAFDAC cherche des partenariats de transfert de technologie en fill-and-finish et en production d'antigènes. L'accord de reliance réglementaire signé avec l'AMA en septembre 2026 constitue un prérequis réglementaire pour attirer des fabricants partenaires souhaitant produire pour les marchés africains depuis le Nigeria. L'atteinte du niveau 4 OMS permettrait aux lots produits au Nigeria d'être directement acceptés par l'UNICEF et Gavi, comme c'est déjà le cas pour l'Inde, la Corée du Sud et le Maroc.","date":"2026-10-05"},
{"title":"EVA Pharma (Égypte) et Afrigen (Afrique du Sud) accélèrent le développement mRNA : vers la première plateforme africaine end-to-end à 100 millions de doses annuelles","url":"https://accesstomedicinefoundation.org/insights-resources/access-insights/turning-momentum-into-vaccine-manufacturing-capacity-in-africa","content":"EVA Pharma, biotech égyptienne partenaire de firmes européennes, développe la première plateforme africaine «digital-to-biologics» de production end-to-end de vaccins à ARN messager, avec une capacité cible de 100 millions de doses par an — la plus grande plateforme mRNA africaine projetée, dépassant l'unité BioNTech-Kigali (50 millions de doses/an atteints en septembre 2026). Parallèlement, Biogeneric Pharma (Égypte) et Afrigen Biologics (Afrique du Sud) ont étendu leur collaboration mRNA en 2026, couvrant désormais des candidats vaccins contre la tuberculose et le Mpox. L'Access to Medicine Foundation souligne dans son analyse 2026 que la transformation du momentum politique africain en capacité manufacturière réelle dépend du franchissement des certifications BPF de l'OMS — barrière qui a requis 3 à 4 ans pour les premières unités asiatiques — et de la conclusion d'accords d'achat avec Gavi et l'UNICEF avant la mise en service industrielle. Ces deux initiatives illustrent la montée en puissance de l'Égypte et de l'Afrique du Sud comme hubs africains de biotechnologie mRNA.","date":"2026-10-04"},
