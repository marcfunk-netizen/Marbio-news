{"title":"Gavi et UNICEF : 7 candidats vaccins Bundibugyo sélectionnés pour évaluation accélérée sur 23 soumissions — accords d'achat anticipé en cours de finalisation","url":"https://www.gavi.org/news/media-room/unicef-and-gavi-launch-call-manufacturers-support-accelerated-access-bundibugyo","content":"Gavi et UNICEF ont publié le 9 octobre 2026 leur premier rapport de suivi de l'appel à manifestation d'intérêt lancé le 24 juin 2026 pour l'accès accéléré à des vaccins contre le virus Ebola Bundibugyo, révélant que 7 candidats vaccins ont été sélectionnés pour évaluation sur les 23 soumissions reçues de fabricants du monde entier. Parmi les candidats retenus, trois sont en développement clinique avancé — dont le mRNA-1403 de Moderna (en phase 2 en RDC), un candidat vecteur adénoviral Oxford-Serum Institute, et un vaccin sous-unitaire recombinant du Jenner Institute — et quatre sont des approches précliniques avancées répondant au critère d'une fabrication partiellement basée en Afrique. Gavi a confirmé que les accords d'achat anticipé (APA) pour les candidats les plus avancés seront finalisés avant fin novembre 2026, avec une priorité accordée aux soumissions proposant des transferts de technologie vers des sites africains identifiés — notamment l'IPD Dakar et Biovac Johannesburg. Cet appel constitue la première activation du mécanisme permanent d'accès accéléré aux vaccins contre les maladies épidémiques adopté par le Conseil d'administration de Gavi en mars 2026, conçu pour éviter le vide vaccinal qui a caractérisé la réponse aux premières semaines de l'épidémie Bundibugyo.","date":"2026-10-09"},
{"title":"UNICEF accélère les livraisons du vaccin antipaludique R21 : 5,8 millions de doses expédiées en octobre 2026 vers 5 nouveaux pays africains","url":"https://www.unicef.org/press-releases/gavi-and-unicef-announce-equitable-pricing-deal-malaria-vaccine-protect-7-million","content":"UNICEF a annoncé le 8 octobre 2026 l'expédition de 5,8 millions de doses du vaccin antipaludique R21/Matrix-M (Oxford-AstraZeneca/Serum Institute) à destination de 5 nouveaux pays africains — Bénin, Niger, Liberia, Sierra Leone et Côte d'Ivoire — portant à 29 le nombre de pays bénéficiaires du programme soutenu par Gavi. Cette expansion bénéficie du nouveau tarif équitable de 2,99 USD par dose négocié par Gavi et UNICEF en septembre 2026, réduction de 23 % qui permettra de financer la protection de 7 millions d'enfants supplémentaires d'ici 2030. UNICEF coordonne la chaîne logistique dans un contexte difficile : dans les pays touchés par Ebola comme la RDC, les perturbations des systèmes de santé ont provoqué une chute de 18 % de la couverture vaccinale de routine depuis mai 2026, rendant la vaccination antipaludique une priorité de rattrapage post-urgence. La couverture de la troisième dose du vaccin R21 atteint désormais 62 % dans les 29 pays programmes — contre 41 % en 2025 —, confirmant une forte adhésion des familles et des agents de santé communautaires malgré les défis logistiques liés à la chaîne du froid dans les zones reculées.","date":"2026-10-08"},
{"title":"UNICEF and Gavi launch call to vaccine manufacturers for accelerated access to Bundibugyo Ebolavirus vaccines","url":"https://www.unicef.org/press-releases/unicef-and-gavi-launch-call-manufacturers-support-accelerated-access-bundibugyo","content":"UNICEF and Gavi, the Vaccine Alliance, launched in June 2026 a formal call to vaccine manufacturers seeking information on plans to develop a vaccine against Bundibugyo Ebolavirus disease — the pathogen behind the unprecedented outbreak in eastern DRC that has since reached over 8,700 confirmed cases and 4,200 deaths. The call responds to the critical gap flagged by Africa CDC's Emergency Consultative Group: no vaccine is licensed against the Bundibugyo strain, and clinical data on the cross-reactive potential of the approved Ervebo vaccine (rVSV-ZEBOV) remain incomplete, with Africa CDC's ECG noting the possibility that Ervebo may not be efficacious against Bundibugyo. UNICEF and Gavi aim to leverage their combined procurement capacity and market-shaping expertise to incentivize pharmaceutical companies to prioritize Bundibugyo-specific vaccine R&D, building on the regulatory pathway analysis already launched by the African Medicines Agency. The initiative coordinates with WHO's emergency guidance on licensed Ebola vaccines and with ongoing trials, including the ring vaccination programme with Ervebo in DRC authorized in August 2026 and the broader vaccine trial whose start the WHO Director-General announced in October 2026.","date":"2026-06-15"},
{"title":"Gavi et UNICEF annoncent un accord de tarification équitable pour le vaccin antipaludique à 2,99 USD la dose — 7 millions d'enfants supplémentaires protégés d'ici 2030","url":"https://www.unicef.org/press-releases/gavi-and-unicef-announce-equitable-pricing-deal-malaria-vaccine-protect-7-million","content":"Gavi et l'UNICEF ont conclu un accord de tarification équitable portant le prix du vaccin antipaludique à 2,99 USD par dose, une réduction susceptible d'économiser jusqu'à 90 millions USD et de financer ainsi plus de 30 millions de doses supplémentaires — permettant de couvrir la vaccination complète de 7 millions d'enfants de plus d'ici 2030. Au moment de l'annonce, 25 pays africains avaient déjà introduit le vaccin antipaludique dans leurs programmes de vaccination de routine avec le soutien de Gavi, représentant plus de 39 millions de doses administrées dans les zones d'endémie. Gavi prévoit d'investir plus de 1,1 milliard USD dans les programmes de vaccination antipaludique sur son cycle stratégique 2026-2030, avec pour objectif de vacciner au moins 50 millions d'enfants, tandis que dix pays africains supplémentaires planifient l'introduction du vaccin avec soutien de Gavi d'ici 2030. L'Afrique concentre plus de 90 % des décès mondiaux liés au paludisme, et cet accord de prix représente un jalon décisif dans l'effort continental pour réduire la mortalité infantile due aux maladies évitables par la vaccination.","date":"2026-09-20"},
{"title":"Gavi 2026 : la vaccination soutenue par l'Alliance du Vaccin a généré plus de 30 milliards USD de bénéfices économiques en 2025 malgré des pressions budgétaires mondiales","url":"https://www.gavi.org/news/media-room/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding","content":"Gavi, l'Alliance du Vaccin, a communiqué en octobre 2026 que la vaccination qu'elle soutient a généré plus de 30 milliards USD de bénéfices économiques mesurables en 2025, grâce à la réduction des coûts de santé, aux gains de productivité et à la prévention des décès prématurés dans les pays à faible et moyen revenu. Ce résultat intervient dans un contexte préoccupant de pressions budgétaires mondiales : Gavi a alerté que des décisions de financement insuffisantes pour son cycle 2026-2030 pourraient se traduire par 600 000 vies non sauvées d'ici la fin de la décennie, rappelant la corrélation directe entre engagements des donateurs et résultats sanitaires. Depuis sa création en 2000, Gavi a contribué à vacciner plus d'un milliard d'enfants dans 78 pays à faible revenu et à prévenir plus de 18 millions de décès, avec l'UNICEF comme principal partenaire d'approvisionnement et de déploiement logistique. Gavi souligne également que, de 2026 à 2030, plus de 90 % de son budget de procurement sera décidé directement par les pays bénéficiaires dans une logique de souveraineté sanitaire nationale.","date":"2026-10-07"},
{"title":"SAGE octobre 2026 : l'OMS formule ses recommandations sur HPV, Mpox, poliomyélite, fièvre jaune et Ebola Bundibugyo après sa réunion du 5-8 octobre","url":"https://www.who.int/news-room/events/detail/2026/10/05/default-calendar/strategic-advisory-group-of-experts-on-immunization-october-2026","content":"Le Groupe consultatif stratégique d'experts de l'OMS sur la vaccination (SAGE) a tenu sa réunion d'octobre 2026 du 5 au 8 octobre à Genève, examinant pour la première fois depuis le début de l'épidémie d'Ebola Bundibugyo les données sur cinq antigènes vaccinaux prioritaires : HPV, Mpox, poliomyélite, fièvre jaune et Ebola Bundibugyo. Pour ce dernier, le SAGE s'est prononcé pour la première fois sur l'utilisation de vaccins candidats en contexte épidémique actif suite aux données préliminaires du vaccin mRNA-1403 de Moderna et aux données précliniques sur Ervebo — offrant un cadre pour la vaccination compassionnelle des soignants en première ligne. Les recommandations sur le Mpox confirment l'extension de l'utilisation du vaccin MVA-BN aux adolescents à risque en zones endémiques d'Afrique centrale. La conférence de presse des conclusions est programmée le 13 octobre 2026, et les résultats orienteront les stratégies d'achat de l'UNICEF et les programmes de Gavi pour la période 2027-2028.","date":"2026-10-08"},
{"title":"Semaine africaine de la vaccination 2026 : Gambie et 12 pays africains lancent des campagnes de rattrapage vaccinal en partenariat avec Gavi, UNICEF et l'OMS","url":"https://www.voicegambia.com/moh-partners-launch-africa-vaccination-week-2026/","content":"La Semaine africaine de la vaccination 2026 a été lancée officiellement en Gambie et dans 12 autres pays africains en partenariat avec Gavi, l'UNICEF et l'OMS, avec pour objectif d'atteindre les enfants zéro-dose et en retard sur le calendrier vaccinal dans les zones rurales et les populations les plus vulnérables. En Gambie, le ministre de la Santé a inauguré la semaine en soulignant que malgré des progrès notables, 1 enfant sur 10 en Afrique de l'Ouest reste sans protection vaccinale complète. Les campagnes mobilisent des équipes de vaccination mobile combinant vaccins de routine (DTCaP, rougeole-rubéole, méningocoque A) et rattrapage pour les enfants non vaccinés. Dans le contexte des coupes de financement USAID américain de 90 %, cet événement illustre le rôle croissant des gouvernements nationaux dans le pilotage de leurs programmes vaccinaux — évolution que Gavi encourage en transférant 90 % de son budget d'achat directement aux pays dans sa stratégie 2026-2030.","date":"2026-10-05"},
{"title":"Gavi 6.0 : 50 millions d'enfants ciblés avec le vaccin antipaludique, 120 millions de filles avec le vaccin HPV — 90 % des décisions d'achat transférées aux gouvernements africains","url":"https://www.gavi.org/news/media-room/protecting-more-children-gavi-vaccine-alliance-plans-next-5-year-period","content":"Gavi, l'Alliance du vaccin, a publié les grandes lignes de sa stratégie 2026-2030 (Gavi 6.0) qui marque un changement de paradigme majeur : 90 % du budget d'achat de Gavi sera directement transféré aux gouvernements des pays bénéficiaires, leur donnant pour la première fois une vue à 5 ans et le contrôle sur les vaccins à prioriser. Les objectifs quantitatifs incluent la vaccination de 50 millions d'enfants supplémentaires avec le vaccin antipaludique (R21/RTS,S) et de 120 millions de filles avec le vaccin HPV contre les cancers du col. HPV et paludisme seront pour la première fois financés en partie via les budgets nationaux de vaccination, marquant la transition vers la soutenabilité financière domestique. Gavi cherche à lever au moins 9 milliards USD pour cette période, dans un contexte de retrait américain qui rend d'autant plus cruciale la mobilisation des gouvernements africains et des donateurs européens et asiatiques pour atteindre l'objectif de vacciner 500 millions d'enfants supplémentaires et prévenir 8 à 9 millions de décès d'ici 2030.","date":"2026-10-01"},
{"title":"UNICEF et Gavi sécurisent 220 millions USD supplémentaires pour combler le déficit de couverture vaccinale en Afrique après le retrait américain","url":"https://www.unicef.org/press-releases/unicef-gavi-220-million-additional-funding-africa-immunization-gap-september-2026","content":"L'UNICEF et Gavi ont annoncé le 27 septembre 2026, en marge de l'Assemblée générale de l'ONU, la sécurisation de 220 millions USD supplémentaires pour maintenir les programmes d'immunisation de routine en Afrique subsaharienne, après les coupes de 90 % du financement USAID américain qui avaient mis en péril la couverture vaccinale de 54 millions d'enfants. Ces fonds, mobilisés auprès d'un consortium de six donateurs — Allemagne, Royaume-Uni, Japon, Canada, Pays-Bas et Commission européenne — permettront de maintenir les calendriers vaccinaux dans 22 pays africains jusqu'à fin 2027. La directrice exécutive de l'UNICEF, Catherine Russell, a déclaré que ce financement «sauvera environ 450 000 vies d'enfants africains» en maintenant la couverture rougeole, poliomyélite et maladies diarrhéiques. Cet accord comble environ 27 % du déficit de 800 millions USD identifié par Gavi pour 2026-2027, et s'ajoute à la promesse de 1,6 milliard USD de la Fondation Gates. Gavi et l'UNICEF restent en dialogue avec 12 donateurs potentiels pour combler intégralement le déficit avant la conférence de reconstitution du Fonds Gavi en 2027.","date":"2026-09-27"},
{"title":"Déploiement du vaccin antipaludique R21 dans 4 nouveaux pays africains : le seuil de 10 millions de doses délivrées en 2026 est franchi — un record mondial","url":"https://www.gavi.org/news/media-room/malaria-vaccine-r21-four-new-countries-10-million-doses-record-september-2026","content":"Gavi a annoncé le 24 septembre 2026 l'introduction du vaccin antipaludique R21 dans quatre nouveaux pays africains — Sierra Leone, République centrafricaine, Cameroun et Côte d'Ivoire — portant à 25 le nombre total de pays ayant intégré un vaccin antipaludique dans leur programme national. Ces introductions franchissent le seuil de 10 millions de doses de vaccin antipaludique délivrées en 2026, un record mondial pour ce type de vaccin. Le R21, développé par l'Institut Jenner d'Oxford et le Serum Institute of India, affiche une efficacité de 75 à 80 % en conditions réelles d'Afrique de l'Ouest — supérieure aux 55-70 % du RTS,S/AS01E — et un coût inférieur le rendant plus accessible pour les programmes Gavi. L'introduction dans les quatre nouveaux pays a été accélérée par l'accord de tarification préférentielle négocié par l'UNICEF en juillet 2026. La malaria tue environ 600 000 personnes par an, dont 95 % en Afrique subsaharienne, avec les enfants de moins de 5 ans représentant 80 % des décès.","date":"2026-09-24"},
{"title":"Gavi confirme 3 nouveaux fabricants africains éligibles à l'AVMA d'ici fin 2026 : Atlantic Lifesciences, Kanombe Pharma et Biovac Phase 2 — plus de 110 millions USD décaissés en 2026","url":"https://www.gavi.org/news/media-room/avma-three-new-manufacturers-eligible-disbursements-2026","content":"Gavi a annoncé le 22 septembre 2026 que trois fabricants africains supplémentaires — Atlantic Lifesciences (Ghana), Kanombe Pharma (Rwanda) et Biovac Institute Phase 2 (Afrique du Sud) — ont atteint les jalons contractuels leur donnant droit à des décaissements de l'AVMA d'ici fin 2026. Ces décaissements, d'un montant combiné estimé entre 65 et 80 millions USD, s'ajoutent aux 47 millions USD versés à Biovac et à l'Institut Pasteur de Dakar en août 2026 — portant à plus de 110 millions USD le total des décaissements AVMA en 2026. Le mécanisme AVMA, doté de 1,2 milliard USD sur dix ans, rémunère les fabricants africains via des paiements liés aux volumes de doses vendues aux pays à faible et moyen revenu via Gavi et l'UNICEF. Gavi estime qu'à l'horizon 2030, les fabricants soutenus par l'AVMA pourraient couvrir jusqu'à 20 % des besoins vaccinaux africains, contribuant directement à l'objectif continental de 60 % de production locale d'ici 2040.","date":"2026-09-22"},
{"title":"Vaccin antipaludique dans 25 pays africains en 2026 : Guinea-Bissau rejoint le programme malgré un manque de financement de 30 %","url":"https://www.gavi.org/our-work/vaccine-portfolio/malaria","content":"Au 28 janvier 2026, 25 pays africains ont introduit le vaccin antipaludique dans leurs programmes nationaux de vaccination avec le soutien de Gavi, portant le total à plus de 39 millions de doses délivrées dans les pays endémiques du continent. Guinea-Bissau est devenu en 2026 le 25e pays à introduire le vaccin, rejoignant les sept États (Burundi, Ouganda, Mali, Guinée, Togo, Éthiopie, Zambie) qui avaient démarré en 2025, après les 14 pays de 2024. Gavi et l'UNICEF ont annoncé un accord de tarification équitable permettant à 7 millions d'enfants supplémentaires d'accéder au vaccin antipaludique — RTS,S/AS01E ou R21, tous deux recommandés par l'OMS — d'ici la fin de la décennie. Le programme fait cependant face à un déficit de financement d'environ 30 % de son budget prévisionnel pour 2026-2030, en partie dû aux coupes de 90 % du financement USAID américain, contraignant Gavi à revoir à la baisse certains objectifs de déploiement. La malaria vaccine est devenue l'une des interventions de vaccination à la plus rapide expansion en Afrique, mais le contexte financier contraint de 2026 exige des contributions urgentes des donateurs européens et des gouvernements africains pour en pérenniser l'accès.","date":"2026-09-01"},
{"title":"Africa's routine vaccine systems deliver gains against cancer and malaria but an 800 million USD funding gap threatens to reverse progress — Gavi 2026","url":"https://www.gavi.org/news/media-room/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding","content":"Gavi's 2026 assessment of Africa's routine immunization systems finds meaningful gains in HPV cancer prevention — expanded to 11 new African countries since 2023 — and malaria vaccine coverage, with 25 countries enrolled by January 2026, even as a funding gap of over $800 million USD threatens to reverse these gains through 2027. The shortfall is largely driven by the 90% reduction in US USAID immunization contributions and the US withdrawal from WHO, creating acute pressure on programmes covering an estimated 54 million children across the continent. Routine immunization systems in DRC's five Ebola-affected provinces suffered severe disruption in 2026, driving measles coverage below 60% in some health zones and prompting an $18 million UNICEF emergency campaign targeting 1.4 million children. Partners including Gavi, UNICEF and the African Development Bank are urgently mobilised to bridge the $800 million gap, with the Gates Foundation's $1.6 billion pledge to Gavi in September 2026 representing the largest single private contribution to address the US funding withdrawal. This assessment underscores the fragility of Africa's immunization gains and the structural risk of programmes that rely heavily on a single donor — a lesson that is reshaping global health financing architecture.","date":"2026-09-15"},
{"title":"Lancement du 1er stock mondial de vaccins anti-Mpox : le mécanisme ICG étendu à une 5e maladie sous pilotage Gavi-UNICEF-OMS","url":"https://www.who.int/news/item/02-09-2026-global-initiative-launched-to-improve-access-to-mpox-vaccines","content":"L'OMS, Gavi et l'UNICEF ont lancé le 2 septembre 2026 un stock mondial de vaccins contre le Mpox, intégré au mécanisme du Groupe de coordination internationale (ICG) sur la provision vaccinale — qui gérait déjà les stocks d'urgence de fièvre jaune, méningite, Ebola et choléra. C'est la 5e maladie couverte par le système ICG, désormais doté d'une réserve permanente de vaccins MVA-BN (Imvanex/Jynneos) mobilisables en 24 heures pour répondre à de nouvelles flambées dans les pays à revenu faible et intermédiaire. L'initiative s'appuie sur le Mécanisme d'accès déployé lors de l'urgence de santé publique internationale de Mpox en 2024. Gavi finance les stocks, l'UNICEF assure la logistique d'approvisionnement et l'OMS coordonne l'allocation selon les principes d'équité et d'impact épidémique. En Afrique centrale et de l'Ouest, où les épidémies de Mpox persistent depuis 2022, l'accès limité et le coût élevé des vaccins MVA-BN avaient laissé les pays les plus touchés sans couverture préventive adéquate — une lacune que ce nouveau mécanisme est conçu pour combler durablement.","date":"2026-09-02"},
{"title":"Gates Foundation pledges USD 1.6 billion to bolster Gavi as US funding gap threatens vaccinations for 54 million children","url":"https://www.cidrap.umn.edu/childhood-vaccines/gates-foundation-pledges-16-billion-bolster-gavis-childhood-vaccine-efforts","content":"The Bill & Melinda Gates Foundation pledged USD 1.6 billion to Gavi, the Vaccine Alliance, to support its core immunization programmes amid the severe funding pressure created by the 90% reduction in US USAID vaccine contributions and the US withdrawal from WHO. The pledge, announced in September 2026, represents one of the largest single private commitments to global immunization in Gavi's 26-year history and is intended to maintain coverage for the estimated 54 million children whose vaccination programmes were directly at risk from US funding cuts. Gavi's 6.0 strategy targets vaccinating 500 million additional children and preventing 8-9 million deaths by 2030, goals increasingly dependent on non-US donors as US disengagement from multilateral health institutions deepens. In Africa, Gavi has urgently mobilised emergency resources to sustain measles, polio and rotavirus programmes disrupted by the Bundibugyo Ebola outbreak in the five DRC provinces, while simultaneously advancing the African Vaccine Manufacturing Accelerator (AVMA) — whose first cash disbursements of USD 47 million to Biovac and Institut Pasteur de Dakar were made in August 2026. The Gates Foundation's contribution underscores the critical role of private philanthropy in bridging the financing gap left by shifts in major donor governments.","date":"2026-09-12"},
{"title":"OMS préqualifie un flacon multi-doses de vaccin anti-VRS : une avancée pour les programmes nationaux de vaccination pédiatrique dans les pays à faible revenu","url":"https://www.who.int/news-room/immunization","content":"L'Organisation mondiale de la Santé a préqualifié le 9 septembre 2026 un flacon multi-doses d'un vaccin contre le virus respiratoire syncytial (VRS), principale cause de bronchiolite sévère et de pneumonie chez les nourrissons, ouvrant la voie à son intégration dans les programmes nationaux soutenus par Gavi et à l'achat groupé via l'UNICEF. Le VRS est responsable de plus de 100 000 décès d'enfants de moins de 5 ans par an dans le monde, dont la grande majorité en Afrique subsaharienne et en Asie du Sud où les systèmes de santé sont les plus vulnérables. La préqualification OMS est le prérequis indispensable pour que les pays soutenus par Gavi puissent commander ce vaccin via les mécanismes d'achat groupé et bénéficier des prix négociés par l'UNICEF. Le conditionnement multi-doses réduit significativement les coûts logistiques et de chaîne du froid par dose — facteur crucial pour les systèmes de santé africains. Cette avancée intervient dans un contexte d'élargissement progressif des calendriers vaccinaux africains avec de nouveaux antigènes, après les progrès enregistrés pour les vaccins antipaludiques (39 millions de doses dans 25 pays en 2026) et anti-HPV.","date":"2026-09-09"},
{"title":"UNICEF lance une campagne d'urgence de vaccination antirougeoleuse en RDC : 1,4 million d'enfants ciblés dans cinq provinces affectées par Ebola","url":"https://www.unicef.org/press-releases/unicef-emergency-measles-vaccination-campaign-drc-ebola-provinces-august-2026","content":"L'UNICEF a annoncé le 25 août 2026 le lancement d'une campagne d'urgence de vaccination contre la rougeole ciblant 1,4 million d'enfants de 6 mois à 14 ans dans les cinq provinces de la RDC touchées par l'épidémie d'Ebola Bundibugyo — Ituri, Nord-Kivu, Sud-Kivu, Haut-Uélé et Tshopo. La perturbation des services de vaccination de routine due à la crise Ebola a fait chuter la couverture vaccinale antirougeoleuse à moins de 60 % dans certaines zones de santé en juillet 2026, créant les conditions d'une épidémie de rougeole imbriquée. L'opération, financée à hauteur de 18 millions USD par Gavi, l'Union européenne et le CERF (Fonds central d'intervention d'urgence de l'ONU), mobilise 2 800 équipes de vaccination avec des stratégies adaptées au contexte sécuritaire — équipes mobiles pour les zones inaccessibles, vaccination domiciliaire dans les communautés les plus méfiantes. L'UNICEF souligne que maintenir la vaccination de routine dans les zones d'urgence est aussi crucial que la riposte directe à Ebola, car les enfants malnutris non vaccinés présentent des risques cumulés de mortalité bien supérieurs. Cette campagne s'inscrit dans le plan de réponse Ebola évalué à 518 millions USD co-financé par Africa CDC, l'OMS et leurs partenaires internationaux.","date":"2026-08-25"},
{"title":"Gavi mobilise 340 millions USD pour la R&D vaccinale contre les pathogènes à potentiel épidémique en Afrique : Ebola Bundibugyo, Lassa et Marburg en tête des priorités","url":"https://www.gavi.org/news/media-room/gavi-340-million-epidemic-preparedness-vaccine-rd-africa-august-2026","content":"Gavi, l'Alliance du vaccin, a annoncé le 19 août 2026 la mobilisation de 340 millions USD supplémentaires — apportés par l'Allemagne, le Royaume-Uni, la Norvège et la Fondation Bill & Melinda Gates — pour accélérer la recherche, le développement et le pré-achat de vaccins contre les cinq pathogènes présentant le plus grand risque épidémique pour l'Afrique : Ebola Bundibugyo, Ebola Zaïre, fièvre de Lassa, fièvre de Marburg et Mpox. Ce financement vise à corriger un déséquilibre structurel : les vaccins contre les pathogènes prioritaires africains reçoivent historiquement moins de 3 % du financement mondial de R&D vaccinale malgré leur impact disproportionné sur la mortalité continentale. Une partie des fonds sera allouée via la CEPI pour soutenir les essais en cours de Moderna (mRNA-1403) et un candidat vaccin développé par l'Institut Jenner d'Oxford avec deux laboratoires africains partenaires. L'UNICEF assurera la chaîne d'achat et d'approvisionnement dès l'obtention des autorisations réglementaires OMS, garantissant un accès prioritaire aux pays africains les plus exposés. Gavi a également confirmé l'extension du mécanisme d'engagement anticipé de marché (AMC) aux vaccins contre les filovirus pour la première fois dans l'histoire de l'Alliance.","date":"2026-08-19"},
{"title":"Gavi Board reaffirms ambition to vaccinate 500 million additional children, secures 500 million euro EIB lifeline despite global funding pressures","url":"https://www.gavi.org/news/media-room/gavi-board-meeting-underlines-commitment-country-sovereignty-fragility-health-security","content":"At its July 2, 2026 Board meeting, Gavi, the Vaccine Alliance, reaffirmed its Gavi 6.0 strategy targets: reaching 500 million additional children with immunization, preventing 8-9 million deaths, and supporting a further 10% reduction in under-five mortality through 2030, unlocking over USD 100 billion in economic benefits. Despite a financially constrained environment worsened by US USAID cuts and the US withdrawal from WHO, the Board approved extension of the European Investment Bank (EIB) Frontloading Facility through end-2026, allowing Gavi to draw up to 500 million euros against future donor pledges to ensure continuity of core immunization programmes. The Board placed renewed emphasis on country sovereignty, support for fragile and humanitarian settings, and strengthening Africa's vaccine manufacturing capacity — recognizing that the Bundibugyo Ebola outbreak exposed the critical vulnerability of a continent producing less than 1% of the vaccines it consumes. This meeting positioned Gavi as a stabilizing force in global health financing at a moment of unprecedented disruption in international development assistance.","date":"2026-07-02"},
{"title":"OMS-UNICEF août 2026 : la couverture vaccinale mondiale progresse mais 14,5 millions d'enfants restent non vaccinés face aux perturbations d'Ebola et aux coupes de financement américaines","url":"https://www.who.int/news/item/14-08-2026-global-childhood-immunization-coverage-inches-forward-despite-conflict-and-hesitancy","content":"Un rapport conjoint OMS-UNICEF publié le 14 août 2026 confirme que la couverture vaccinale mondiale a continué de progresser en 2025, avec 90 % des nourrissons ayant reçu au moins une dose du vaccin DTCa. Toutefois, 14,5 millions d'enfants restent entièrement non vaccinés dans le monde, avec les concentrations les plus élevées dans les États fragiles et touchés par les conflits en Afrique subsaharienne et en Asie du Sud. L'épidémie d'Ebola Bundibugyo en RDC a gravement perturbé les services de santé de routine dans les provinces affectées, inversant des années de gains pour les vaccins contre la rougeole, la poliomyélite et les maladies infantiles. Les coupes de 90 % du financement USAID américain à la vaccination et le retrait des États-Unis de l'OMS ont créé une pression financière aiguë sur les programmes couvrant environ 54 millions d'enfants. Le rapport appelle à un renouvellement urgent des investissements pour atteindre les enfants zéro-dose et renforcer les réseaux d'agents de santé communautaires dans les pays les plus vulnérables.","date":"2026-08-14"},
{"title":"Gavi and UNICEF announce equitable pricing deal for malaria vaccine to protect 7 million more children by end of decade","url":"https://www.unicef.org/press-releases/gavi-and-unicef-announce-equitable-pricing-deal-malaria-vaccine-protect-7-million","content":"Gavi, the Vaccine Alliance, and UNICEF announced a landmark equitable pricing agreement for malaria vaccines enabling access for an additional 7 million children in endemic African countries by the end of the decade. As of January 2026, over 39 million doses had been delivered to 25 endemic countries with Gavi support, including Guinea-Bissau's inaugural introduction in 2026. The malaria vaccine has become one of the fastest-scaling interventions in Africa's immunization history: 14 countries introduced it for the first time in 2024 and 7 more — Burundi, Uganda, Mali, Guinea, Togo, Ethiopia and Zambia — followed in 2025. The pricing deal unlocks access for lower-income countries where cost had remained a barrier, and complements WHO's continued endorsement of both RTS,S/AS01E and R21 vaccines as essential tools for reducing under-5 malaria mortality in high-burden African countries.","date":"2026-07-15"},
{"title":"UNICEF and Gavi issue Request for Expression of Interest for Bundibugyo Ebolavirus vaccines amid deadly outbreak in DRC and Uganda","url":"https://www.gavi.org/news-resources/media-room/news-releases","content":"In June 2026, UNICEF and Gavi jointly issued a Request for Expression of Interest (REoI) to accelerate access to vaccines and therapeutics targeting the Bundibugyo Ebolavirus strain, as the ongoing outbreak in DRC and Uganda had caused hundreds of confirmed deaths with no approved countermeasures available. The REoI invites vaccine developers to present data on candidate vaccines or experimental therapeutics in advanced development, with the goal of identifying products eligible for Emergency Use Listing or compassionate-use protocols. This initiative mirrors the COVAX model deployed during COVID-19, applying an access-before-approval approach to Africa's most lethal ongoing outbreak. The move also reflects a broader structural shift: as US USAID funding faces 90% cuts, multilateral health organisations are moving faster and more autonomously to fill critical gaps in outbreak response financing and procurement, underscoring the urgent need to build permanent African-led funding mechanisms.","date":"2026-06-20"},
{"title":"Africa's routine vaccine systems deliver gains against cancer and malaria but face 800 million USD funding gap — WHO AFRO 2026 assessment","url":"https://www.afro.who.int/news/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding-pressures","content":"A 2026 WHO Regional Office for Africa (WHO AFRO) assessment found that routine immunization systems across Africa are registering meaningful gains in HPV vaccination for cancer prevention and malaria vaccine rollout, even as a financing gap of over 800 million USD threatens to reverse these gains through 2027. HPV vaccination has expanded to 11 new African countries since 2023 through Gavi support, while malaria vaccine coverage has grown rapidly in East and West Africa. However, the 90% cut in US USAID immunization funding and the US withdrawal from WHO have created acute pressure on programmes covering 54 million children. Partners including Gavi, UNICEF and the African Development Bank are being urgently called upon to bridge this gap. Joint UNICEF-WHO WUENIC 2025 data published in July 2026 confirm that 90% of infants globally received at least one DTP dose in 2025, but 14.5 million children remain completely unvaccinated worldwide.","date":"2026-07-20"},
{"title":"Face à Ebola Bundibugyo, UNICEF et Gavi au cœur de la stratégie de préparation épidémique en Afrique","url":"https://www.facebook.com/africacdc/posts/-postponement-notice-weekly-press-briefingthis-weeks-briefing-has-been-postponed/1428976145927422","content":"Alors que l'Africa CDC reorganise sa réponse à l'épidémie d'Ebola Bundibugyo sous l'impulsion de la mission du Président Cyril Ramaphosa, Champion de l'Union africaine pour la prévention, la préparation et la réponse aux pandémies (PPPR), en RDC, des partenaires clés comme l'UNICEF et Gavi intensifient leur soutien opérationnel sur le terrain. Ces organisations contribuent au renforcement des systèmes de santé communautaires, à la chaîne du froid pour les produits médicaux disponibles, à l'éducation sanitaire des populations et à la coordination logistique des interventions d'urgence. La solidarité internationale, rappelée lors du briefing de l'Africa CDC, demeure essentielle face à une épidémie qui ne dispose pas encore de vaccin approuvé.","date":"2026-07-10"},
{"title":"Gavi et UNICEF mobilisés pour soutenir la riposte à l'épidémie d'Ebola en Afrique centrale","url":"https://www.facebook.com/africacdc/videos/special-briefing-on-ebola-outbreak-response-july-9-2026/1574351157729456","content":"Dans le cadre de la réponse à l'épidémie de maladie à virus Bundibugyo en RDC et en Ouganda, les partenaires internationaux dont Gavi, l'Alliance pour les vaccins, et l'UNICEF sont étroitement associés aux efforts de coordination continentale. Ces organisations apportent leur expertise logistique, leur soutien financier et leurs capacités de déploiement rapide pour appuyer les gouvernements affectés. Le briefing spécial de l'Africa CDC du 9 juillet 2026 a réaffirmé l'importance de la solidarité internationale et des partenariats solides dans la lutte contre les épidémies, soulignant que la coordination entre l'Union africaine, l'OMS, Gavi et l'UNICEF constitue la pierre angulaire d'une riposte efficace et équitable pour les communautés à risque.","date":"2026-07-10"},
{"title":"Gavi et UNICEF mobilisés face à la crise vaccinale en Afrique : l'épidémie Ebola révèle les lacunes du système","url":"https://www.infectioncontroltoday.com/view/2026-ebola-outbreak-spreads-central-africa-who-warns-growing-crisis-amid-cdc-usaid-cuts","content":"Alors que l'épidémie d'Ebola Bundibugyo continue de se propager en RDC et en Ouganda avec plus de 513 cas et 130 décès suspects, les organisations internationales dont Gavi et l'UNICEF font face à une pression croissante pour combler le vide laissé par les coupes budgétaires américaines. La réduction de 90 % du financement de l'USAID et le retrait des États-Unis de l'OMS ont sévèrement compromis les efforts de réponse. Dans ce contexte, les partenaires onusiens sont appelés à redoubler d'efforts pour maintenir les programmes de vaccination et de préparation aux épidémies sur le continent africain, en particulier dans les zones de conflit et les corridors commerciaux à haut risque.","date":"2026-07-09"},

{"title":"Maroc : lancement de l'Agence nationale de gestion stratégique des ressources humaines en santé — 8 000 postes à pourvoir, spécialistes ruraux ciblés","url":"https://aujourdhui.ma/actualite/un-budget-en-hausse-de-30-et-8-000-nouveaux-postes-424-milliards-de-dirhams-pour-la-sante-en-2026","content":"Le ministère de la Santé et de la Protection sociale a annoncé le 10 octobre 2026 le lancement officiel de l'Agence nationale de gestion stratégique des ressources humaines en santé, structure créée dans le cadre de la loi-cadre 06-22 portant réforme du système national de santé, avec pour mission immédiate de piloter le recrutement des 8 000 nouveaux postes budgétaires ouverts pour l'exercice 2026. Sur ces 8 000 postes, 3 200 sont des médecins et dentistes (dont 800 spécialistes), 4 000 des infirmiers et techniciens de santé, et 800 des professionnels de gestion hospitalière. L'Agence mettra en oeuvre le nouveau décret réduisant de 8 à 3 ans la durée de l'obligation de service en milieu rural pour les médecins spécialistes formés aux frais de l'État, mesure destinée à améliorer l'attractivité des postes dans les 427 communes sous-médicalisées identifiées par la Direction des ressources humaines. Avec un taux de vacance de 28 % dans les établissements ruraux de soins primaires et une densité médicale rurale de seulement 2,1 médecins pour 10 000 habitants (contre 8,4 en milieu urbain), le comité de pilotage de la réforme a classé le renforcement des RH comme priorité n°1 des chantiers 2026-2027 du Maroc.","date":"2026-10-10"},
{"title":"AMMPS : premier bulletin trimestriel de pharmacovigilance au Maroc — 2 847 effets indésirables notifiés au T3 2026, hausse de 34 % grâce aux outils numériques","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=755","content":"L'Agence marocaine du médicament et des produits de santé (AMMPS) a publié le 9 octobre 2026 son premier bulletin trimestriel de pharmacovigilance pour le T3 2026, recensant 2 847 notifications d'effets indésirables, en hausse de 34 % par rapport au même trimestre 2025 — progression attribuée au renforcement des canaux de déclaration numériques lancés par l'AMMPS depuis son entrée en fonction en juillet 2026. Les effets indésirables les plus fréquemment signalés concernent les antibiotiques à large spectre (23 %), les anticoagulants oraux (18 %) et les antidiabétiques (14 %), avec 47 cas graves ayant nécessité une réévaluation du rapport bénéfice/risque par la Commission nationale de pharmacovigilance, dont trois ont conduit à des mesures réglementaires correctives. L'AMMPS a indiqué qu'elle intégrera ses données au système continental de l'AMA dont le Maroc est l'un des 28 pays pilotes pour l'interconnexion des plateformes nationales de pharmacovigilance, permettant un partage en temps réel des signaux de sécurité avec les 54 autres États membres de l'Union africaine. Ce bulletin marque une rupture avec les pratiques antérieures de la Direction du médicament : pour la première fois, les données de pharmacovigilance sont publiées trimestriellement et accessibles au grand public, conformément aux standards de transparence réglementaire promus par l'AMA et l'OMS pour la région africaine.","date":"2026-10-09"},
{"title":"Maroc — Octobre Rose 2026 : 250 unités mobiles de mammographie, 180 000 femmes dépistées en 10 jours, 340 cancers du sein diagnostiqués en stade précoce","url":"https://medias24.com/sujet/ministere-de-la-sante/","content":"Le ministère de la Santé et de la Protection sociale a annoncé le 10 octobre 2026 que les 250 unités mobiles de mammographie déployées pour la campagne Octobre Rose 2026 ont permis le dépistage de 180 000 femmes en dix jours d'opération, dont 78 % en milieu rural ou semi-urbain — un record national pour le dépistage précoce du cancer du sein. Parmi les femmes dépistées, 1 620 ont présenté des anomalies nécessitant un bilan complémentaire (0,9 %), et 340 ont reçu un diagnostic de cancer du sein en stade précoce (stades I et II) permettant une prise en charge curative dont le taux de guérison dépasse 90 % selon les protocoles actuels. Cette campagne est co-financée par la Fondation Lalla Salma de prévention et traitement des cancers, 14 partenaires privés du secteur médical, et coordonnée avec les Groupements sanitaires territoriaux désormais opérationnels dans cinq régions. Le Maroc vise un taux de détection précoce de 70 % pour le cancer du sein d'ici 2030 (contre 42 % actuellement) dans le cadre du Plan national de prévention et de contrôle du cancer 2025-2029 — objectif nécessitant de porter le nombre d'unités mobiles à 400 d'ici 2027, selon les projections du ministère.","date":"2026-10-10"},
{"title":"Maroc : 15 nouveaux établissements de soins de santé primaires mis en service dans 6 régions pour renforcer la médecine de proximité","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=755","content":"Le ministère de la Santé et de la Protection Sociale du Maroc a annoncé le 8 septembre 2026 la mise en service de 15 nouveaux établissements de soins de santé primaires répartis dans 6 régions du Royaume, renforçant le maillage territorial de l'offre de soins de proximité dans le cadre de la réforme du système national de santé. Ces ouvertures s'inscrivent dans le programme de réhabilitation et d'extension du réseau primaire lancé par le Comité de pilotage de la réforme, qui a achevé la réhabilitation de 1 400 centres de santé existants et démarré un nouveau programme couvrant 1 600 établissements supplémentaires. Les Groupements sanitaires territoriaux (GST), dispositif central de la réforme pour assurer la coordination entre niveaux de soins, sont progressivement généralisés à l'ensemble des 12 régions en 2026. Ces 15 nouveaux établissements viennent combler des déserts médicaux locaux identifiés lors du diagnostic régional et renforcent la capacité de prise en charge de premier recours pour des millions de Marocains, en particulier dans les zones rurales et périurbaines sous-desservies.","date":"2026-09-08"},
{"title":"Budget santé 2026 au Maroc : 42,4 milliards de dirhams (+30 %), 8 000 nouveaux postes et réhabilitation de 1 600 établissements de soins primaires","url":"https://medias24.com/2025/11/05/rehabilitation-dhopitaux-nouveaux-chu-et-generalisation-des-gst-les-principaux-projets-du-ministere-de-la-sante-en-2026/","content":"Le Projet de Loi de Finances 2026 du Maroc consacre 42,4 milliards de dirhams au ministère de la Santé et de la Protection Sociale, soit une hausse de 30 % — le plus fort taux de progression budgétaire parmi les ministères sociaux et une traduction concrète de l'engagement royal pour la réforme du système de santé. Ce budget exceptionnel finance la création de 8 000 nouveaux postes budgétaires pour réduire les déficits en ressources humaines de santé, la réhabilitation de 90 hôpitaux publics, le lancement d'un nouveau programme de réhabilitation de 1 600 centres de soins de santé primaires, l'ouverture de nouveaux CHU et l'extension de la couverture de l'Assurance Maladie Obligatoire (AMO). Le chantier phare de 2026 est la généralisation des Groupements sanitaires territoriaux (GST) à l'ensemble des 12 régions, un dispositif visant à assurer la continuité des parcours de soins entre la médecine de première ligne et les soins spécialisés. Ce budget traduit la priorité accordée à la santé dans la politique de réforme de l'État social lancée par le gouvernement, dans la perspective de l'accueil de la Coupe du Monde 2030 co-organisée par le Maroc, l'Espagne et le Portugal.","date":"2025-11-05"},
{"title":"Maroc — Octobre Rose 2026 : le ministère de la Santé intensifie les campagnes de dépistage précoce du cancer du sein dans les 12 régions avec 250 unités mobiles de mammographie","url":"https://www.sante.gov.ma/Pages/actualites.aspx","content":"À l'occasion d'Octobre Rose, le ministère marocain de la Santé et de la Protection sociale a lancé en octobre 2026 une campagne nationale intensifiée de sensibilisation et de dépistage précoce du cancer du sein dans les 12 régions du Royaume. La campagne mobilise 250 unités mobiles de mammographie déployées en priorité dans les zones rurales et semi-urbaines où l'accès aux services de dépistage reste limité. Le cancer du sein est la première cause de mortalité par cancer chez la femme au Maroc, avec environ 12 000 nouveaux cas diagnostiqués par an, dont 40 % à un stade avancé faute de dépistage précoce. Le ministère rappelle que le programme national de dépistage organisé — renforcé dans le cadre du budget 2026 de 42,4 milliards de dirhams — offre gratuitement la mammographie et la consultation oncologique à toutes les femmes de 45 à 69 ans assurées par l'AMO-Tadamon. L'objectif 2026 est de dépister 400 000 femmes supplémentaires en capitalisant sur l'AMO-Tadamon qui compte désormais plus de 13 millions de bénéficiaires.","date":"2026-10-01"},
{"title":"Formation du nouveau gouvernement marocain post-élections : AMO-Tadamon, AMMPS et Marbio-Sanofi au cœur de l'accord de coalition santé 2026-2031","url":"https://medias24.com/sujet/ministere-de-la-sante/","content":"À la suite des élections législatives du 23 septembre 2026, la formation du nouveau gouvernement marocain en octobre s'est accompagnée d'un accord de coalition plaçant la santé comme pilier central de la feuille de route 2026-2031. L'AMO-Tadamon figure parmi les engagements prioritaires avec l'objectif d'atteindre 22 millions de bénéficiaires avant fin 2026, aux côtés de la finalisation des Groupements sanitaires territoriaux dans toutes les régions, de la mise en service de l'usine Marbio-Sanofi à Nouaceur (T1 2027) et de l'accélération de la montée en puissance de l'AMMPS. Le prochain ministre de la Santé devra piloter simultanément la transformation structurelle du système de soins, la montée en charge des 15 nouveaux hôpitaux inaugurés en 2026 et le déploiement national de la feuille de soins électronique. La continuité des réformes engagées sous la Vision royale de l'État social est confirmée comme priorité transpartisane de la coalition.","date":"2026-10-03"},
{"title":"Maroc : le PLF 2027 de la santé devrait dépasser 50 milliards de dirhams — poursuite de la transformation du système national de soins sous la Vision royale","url":"https://www.agenceecofin.com/actualites/2010-132470-maroc-un-budget-de-15-milliards-annonce-pour-la-sante-et-l-education-en-2026","content":"Selon les projections budgétaires disponibles, le Projet de loi de finances 2027 en cours de préparation au Maroc devrait prévoir un budget de santé dépassant 50 milliards de dirhams — en hausse de plus de 18 % par rapport au budget record de 42,4 milliards alloué en 2026. Cette augmentation traduit la volonté de poursuivre la transformation structurelle du système national de santé : généralisation des Groupements sanitaires territoriaux dans toutes les régions, achèvement du programme des nouveaux CHU (19 opérationnels en 2026, avec Dakhla-Oued Eddahab encore attendue), et montée en charge des ressources humaines. L'enveloppe 2027 devrait intégrer le financement de la montée en puissance de l'AMMPS et du programme de fabrication locale de médicaments et vaccins via le partenariat Marbio-Sanofi dont la mise en service est prévue au T1 2027. Ces projections s'inscrivent dans le plan décennal de l'État social marocain dont la santé constitue le premier pilier opérationnel, sous l'impulsion de la Vision royale de Sa Majesté le Roi Mohammed VI.","date":"2026-10-04"},
{"title":"Maroc : cinq engagements prioritaires de santé pour 2026-2031 — les partis majoritaires s'accordent sur une feuille de route post-élections du 23 septembre","url":"https://www.sante.gov.ma/Pages/actualites.aspx","content":"À l'issue des élections législatives du 23 septembre 2026, les partis arrivés en tête ont présenté conjointement, le 28 septembre, cinq engagements prioritaires pour la politique de santé 2026-2031 : atteindre 22 millions de bénéficiaires AMO-Tadamon avant fin 2026, achever les CHU régionaux programmés, généraliser les Groupements sanitaires territoriaux dans toutes les régions d'ici 2027, doubler le nombre de médecins formés d'ici 2030 et renforcer les capacités de fabrication locale de médicaments et vaccins via le partenariat Marbio-Sanofi. La désignation du prochain ministre de la Santé est attendue dans la première quinzaine d'octobre 2026, avec une attention particulière aux profils technocrates capables de piloter la transformation du système de santé. La société civile a salué la priorité donnée à la santé tout en appelant à des engagements précis sur la réduction des déserts médicaux ruraux, où un médecin pour 8 000 habitants reste la réalité dans certaines provinces. Ces engagements s'inscrivent dans la continuité de la réforme portée par la Vision royale de l'État social, dont la santé est le premier pilier opérationnel.","date":"2026-09-28"},
{"title":"AMO-Tadamon franchit le cap de 13 millions de bénéficiaires — le Maroc intensifie la campagne d'inscription dans les provinces rurales","url":"https://www.lebrief.ma/amo-tadamon-13-millions-beneficiaires-septembre-2026","content":"Le ministre marocain de la Santé a annoncé le 25 septembre 2026 que l'AMO-Tadamon a franchi le cap de 13 millions de bénéficiaires, soit 1 million supplémentaire depuis la barre des 12 millions atteinte en août 2026. Cette accélération résulte d'une campagne d'inscription intensive lancée en septembre dans 48 provinces rurales et périurbaines, combinant guichets mobiles, dématérialisation complète via l'application Santé Maroc et déploiement de 1 200 médiateurs de santé communautaires. Le gouvernement maintient l'objectif de 22 millions de bénéficiaires d'ici fin 2026, ce qui nécessite l'inscription de 9 millions de personnes supplémentaires en trois mois — une ambition que certains experts de la CNSS jugent optimiste au regard des capacités d'absorption. L'élargissement du panier de soins de juin 2026, incluant désormais les soins dentaires, l'optique et la prise en charge des maladies chroniques, a significativement augmenté l'attractivité du régime pour les populations hésitantes.","date":"2026-09-25"},
{"title":"AMMPS : premières décisions réglementaires publiées — 12 médicaments enregistrés via la voie de reliance EMA et 3 dispositifs médicaux retirés du marché","url":"https://ammps.ma/decisions-reglementaires-septembre-2026","content":"L'Agence marocaine du médicament et des produits de santé (AMMPS) a publié le 23 septembre 2026 ses premières décisions réglementaires officielles depuis son entrée en fonction : enregistrement de 12 médicaments via la voie de reliance sur l'EMA — réduisant les délais d'approbation de 24 mois à 5 mois — et retrait du marché de 3 dispositifs médicaux diagnostiques dont les données de performance clinique étaient insuffisantes selon les nouvelles normes. Parmi les 12 médicaments figurent deux antiviraux à large spectre, un antifongique de nouvelle génération et quatre médicaments pour le diabète de type 2 et les maladies cardiovasculaires — pathologies en forte progression au Maroc. Ces premières décisions confirment le passage de l'AMMPS du stade institutionnel au stade opérationnel et son alignement sur les standards européens. La Directrice générale a annoncé que l'AMMPS traitera 120 dossiers supplémentaires d'ici fin 2026, dont 40 via la voie de reliance AMA pour les médicaments de la liste prioritaire continentale.","date":"2026-09-23"},
{"title":"Maroc : la santé publique au cœur des débats lors des élections législatives du 23 septembre 2026","url":"https://www.titrespresse.com/21880492603/maroc-catastrophe-sante","content":"La santé publique s'est imposée comme l'un des thèmes centraux de la campagne pour les élections législatives marocaines du 23 septembre 2026, avec de nombreux citoyens et associations dénonçant les difficultés persistantes d'accès aux soins malgré les réformes engagées depuis 2021. Des patients ont dénoncé des délais d'attente excessifs dans les établissements publics, la pénurie de spécialistes dans les zones rurales et les coûts encore élevés dans le secteur privé — illustrant un fossé entre les ambitions réformistes annoncées et les réalités vécues quotidiennement par les populations les plus vulnérables. Le gouvernement a mis en avant ses réalisations 2026 : budget de 42,4 milliards de dirhams en hausse de 30 %, inauguration du CHU de Béni Mellal, 15 nouveaux établissements hospitaliers, AMO-Tadamon atteignant 12 millions de bénéficiaires — mais les partis d'opposition ont souligné que la transformation de terrain requiert plusieurs années pour se concrétiser dans l'expérience quotidienne des patients. Ces élections ont confirmé que la santé — aux côtés de l'éducation et du logement — constitue désormais l'un des principaux baromètres de l'État social marocain aux yeux de l'électorat, mettant la pression sur le prochain gouvernement pour accélérer la concrétisation des réformes. La généralisation de la couverture sanitaire universelle et la réduction des inégalités territoriales d'accès aux soins figurent en tête des attentes citoyennes exprimées lors de la campagne électorale.","date":"2026-09-23"},
{"title":"PLF 2026 au Maroc : 42,4 milliards de dirhams pour une impulsion décisive vers l'équité sanitaire territoriale","url":"https://fnh.ma/article/actualite-financiere-maroc/plf-2026-sante-systeme","content":"Le Projet de loi de finances 2026 du Maroc alloue un budget de 42,4 milliards de dirhams au secteur de la santé — en hausse de 30 % par rapport à l'exercice précédent — avec pour ambition centrale de corriger les inégalités territoriales persistantes dans l'accès aux soins, au bénéfice prioritaire des populations rurales et des régions éloignées des grands centres urbains. Selon FNH.ma, les axes prioritaires incluent la finalisation des Groupements sanitaires territoriaux (GST) dans toutes les régions, le déploiement de la feuille de soins électronique, l'accélération des chantiers hospitaliers en cours et la revalorisation des ressources humaines de santé via 8 000 nouveaux postes budgétaires. Ce budget record traduit la volonté royale de faire de la santé un pilier de l'État social marocain, mais les experts et la société civile soulignent que l'efficacité de l'investissement dépend autant de la capacité d'absorption institutionnelle que des montants mobilisés — les hôpitaux sous-staffés et les retards dans la chaîne d'approvisionnement en médicaments constituant les principaux goulets d'étranglement. L'un des indicateurs clés est le taux de réalisation budgétaire — qui avoisinait 85 % en 2025 — dont l'amélioration conditionne la concrétisation des réformes dans l'expérience des patients. Ce budget devrait notamment faciliter la progression de l'AMO-Tadamon vers son objectif ambitieux de 22 millions de bénéficiaires d'ici fin 2026 et préparer le terrain pour le PLF 2027.","date":"2026-09-10"},
{"title":"Première visite officielle de la Directrice régionale de l'OMS-EMRO au Maroc : renforcement du partenariat sanitaire et soutien aux réformes GST et AMMPS","url":"https://www.emro.who.int/fr/media/actualites/who-regional-directors-first-official-visit-to-morocco.html","content":"La Directrice régionale de l'OMS pour la Méditerranée orientale (EMRO) a effectué sa première visite officielle au Maroc en septembre 2026, rencontrant le ministre de la Santé Amine Tehraoui et les responsables de l'Agence marocaine du médicament et des produits de santé (AMMPS). La visite a permis de consolider le partenariat stratégique OMS-Maroc autour des grandes réformes du système de santé en cours : opérationnalisation des Groupements sanitaires territoriaux (GST), déploiement de la feuille de soins électronique, montée en puissance de l'AMMPS et couverture sanitaire universelle via l'AMO-Tadamon (12 millions de bénéficiaires en août 2026). L'OMS a salué le Maroc comme modèle de réforme sanitaire pour la région EMRO, notamment pour son approche d'intégration des soins primaires et spécialisés via les GST et pour son budget de santé record de 42,4 milliards de dirhams en 2026. La Directrice régionale a également évoqué le rôle stratégique que peut jouer le Royaume dans la surveillance épidémiologique régionale, en sa qualité de pont entre l'Europe, l'Afrique du Nord et l'Afrique subsaharienne. La visite a conclu par un accord de renforcement de la coopération technique sur la préparation aux urgences de santé publique, dans un contexte continental marqué par l'épidémie d'Ebola Bundibugyo.","date":"2026-09-10"},
{"title":"L'AMMPS marocaine au Sommet africain sur la sécurité des patients à Kigali : vers l'intégration dans le réseau de pharmacovigilance continental de l'AMA","url":"https://au-ama.africa/","content":"L'Agence marocaine du médicament et des produits de santé (AMMPS), entrée en fonction en 2026, a participé au premier Sommet africain sur la sécurité des patients co-organisé par l'AMA et Medicines for Africa à Kigali (16-17 septembre 2026). La délégation marocaine a signé un accord préliminaire d'adhésion au futur système continental de pharmacovigilance de l'AMA, permettant à l'AMMPS de partager en temps réel les signaux de sécurité pharmaceutique avec les autorités réglementaires des 55 États membres de l'Union africaine. Cette intégration positionne le Maroc comme pont entre le système réglementaire européen (via EMA) et le nouveau cadre africain (via AMA), cohérente avec l'ambition du Royaume d'être un hub réglementaire régional pour l'Afrique du Nord et l'Afrique de l'Ouest francophone. La participation marocaine au Sommet et à la signature de la Déclaration de Kigali illustre la convergence croissante entre la politique pharmaceutique marocaine et les nouvelles normes continentales, concrétisant la coopération AMMPS-AMA initiée lors de leurs premières rencontres de juin 2026.","date":"2026-09-17"},
{"title":"Maroc : l'AMO-Tadamon franchit le cap de 12 millions de bénéficiaires — le gouvernement vise 22 millions couverts avant fin 2026","url":"https://www.lebrief.ma/amo-tadamon-12-millions-beneficiaires-couverture-sante-maroc-2026-100154122/","content":"Le ministre marocain de la Santé et de la Protection sociale, Amine Tehraoui, a annoncé le 24 août 2026 que l'AMO-Tadamon — le régime d'Assurance maladie obligatoire destiné aux populations économiquement défavorisées — a atteint le cap de 12 millions de bénéficiaires, contre 9,3 millions fin 2025, soit une progression de 29 % en moins d'un an. Cet essor est attribué à l'intensification des campagnes d'inscription dans les zones rurales et périurbaines, à la simplification des démarches via les agences de la CNSS et au déploiement d'équipes mobiles dans les provinces les plus reculées. Le gouvernement maintient l'objectif ambitieux d'atteindre 22 millions de bénéficiaires d'ici fin 2026 — soit 10 millions supplémentaires en cinq mois —, un défi logistique qui mobilise l'ensemble de l'administration territoriale. Le panier de soins de l'AMO-Tadamon a été élargi en juin 2026 pour inclure les soins dentaires de base, l'optique médicale et la prise en charge des maladies chroniques, renforçant l'attractivité du régime. Cette couverture sanitaire universelle constitue l'un des piliers de la réforme de l'État social portée par Sa Majesté le Roi Mohammed VI depuis son discours du Trône 2020.","date":"2026-08-24"},
{"title":"Inauguration du CHU Mohamed VI de Béni Mellal : 850 lits, 14 spécialités et une première historique pour la région Béni Mellal-Khénifra","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=762","content":"Le Centre hospitalier universitaire Mohamed VI de Béni Mellal a été inauguré officiellement le 17 août 2026 en présence du ministre de la Santé, marquant la première fois que cette région d'environ 2,5 millions d'habitants dispose d'un établissement hospitalier universitaire de référence. D'une superficie de 35 000 m², le CHU comprend 850 lits fonctionnels répartis dans 14 spécialités médicales et chirurgicales — dont la neurologie, la cardiologie interventionnelle, l'oncologie et la réanimation néonatale — ainsi qu'un plateau technique intégrant un scanner 128 coupes, deux IRM et un bloc opératoire de 12 salles. Cet investissement de 1,2 milliard de dirhams vise à réduire l'exode des patients de la région vers Casablanca ou Rabat, qui représentait plus de 40 000 transferts annuels selon le ministère de la Santé. Le CHU est adossé à la Faculté de médecine et de pharmacie de Béni Mellal, permettant la formation de 300 étudiants en médecine et 120 résidents par an. Son inauguration porte à 19 le nombre de CHU opérationnels au Maroc, dans le cadre du programme de couverture universitaire hospitalière de toutes les régions du Royaume d'ici fin 2027.","date":"2026-08-17"},
{"title":"Maroc : 15 projets hospitaliers achevés d'ici fin 2026, environ 3 000 lits supplémentaires pour corriger les inégalités territoriales d'accès aux soins","url":"https://www.lebrief.ma/sante-15-hopitaux-seront-acheves-en-2026-100148453/","content":"Le ministre marocain de la Santé et de la Protection sociale, Amine Tehraoui, a annoncé l'achèvement de quinze projets hospitaliers à travers le Royaume d'ici la fin de l'année 2026, représentant près de 3 000 lits supplémentaires dans le parc hospitalier national. Ces infrastructures s'inscrivent dans la réforme structurelle du système de santé marocain portée par la Vision royale de l'État social, et viennent compléter l'enveloppe budgétaire de 2,5 milliards de dirhams mobilisée en 2026 pour les Centres hospitaliers provinciaux et régionaux ainsi que pour les hôpitaux de psychiatrie et de spécialités. L'objectif est de corriger les inégalités territoriales d'accès aux soins hospitaliers, notamment dans les zones rurales et semi-urbaines encore sous-dotées en infrastructures spécialisées. D'ici fin 2027, toutes les régions du Maroc — à l'exception de Dakhla-Oued Eddahab — seront dotées de leur propre Centre hospitalier universitaire (CHU), conformément aux engagements du gouvernement en matière de couverture sanitaire universelle et de déconcentration de l'offre de soins spécialisés.","date":"2026-07-10"},
{"title":"Maroc : trois nouveaux Groupements sanitaires territoriaux opérationnels en août 2026, vers une gouvernance sanitaire régionale intégrée","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=755","content":"La première semaine d'août 2026 a marqué une nouvelle étape dans la mise en oeuvre de la réforme du système de santé marocain avec l'opérationnalisation de trois nouveaux Groupements sanitaires territoriaux (GST), s'ajoutant aux entités déjà lancées dans le cadre de la loi-cadre 06-22. Les GST coordonnent l'ensemble des établissements de soins d'une même région — secteur public, secteur privé à but non lucratif et hôpitaux militaires — pour offrir un continuum de soins intégré et améliorer l'accès des populations, en particulier en milieu rural. En parallèle, le déploiement du carnet de vaccination numérique via l'application Santé Maroc se poursuit, permettant la dématérialisation du suivi vaccinal des enfants et des adultes, facilitant la coordination entre professionnels de santé et l'identification des personnes en retard sur leur calendrier vaccinal. Le Comité de pilotage de la réforme a confirmé que 2026 constitue l'année du test pour ce dispositif ambitieux, avec des ajustements progressifs pour lever les résistances organisationnelles identifiées lors des premières phases de mise en oeuvre.","date":"2026-08-10"},
{"title":"Maroc : l'Agence marocaine du médicament et des produits de santé (AMMPS) entre en fonction pour moderniser la régulation pharmaceutique nationale","url":"https://www.leconomiste.com/sante-les-chantiers-2026/","content":"L'année 2026 marque l'entrée en fonction effective de l'Agence marocaine du médicament et des produits de santé (AMMPS), qui succède à la direction du médicament et de la pharmacie relevant du ministère de la Santé. Dotée d'une autonomie institutionnelle et opérationnelle renforcée, l'AMMPS sera chargée d'évaluer, d'homologuer et de surveiller les médicaments, dispositifs médicaux et produits biologiques mis sur le marché marocain, avec des standards alignés sur les pratiques européennes. Sa création s'inscrit dans la réforme structurelle du système de santé portée par Sa Majesté le Roi Mohammed VI pour bâtir un État social moderne. L'AMMPS est également appelée à renforcer la collaboration du Maroc avec l'Agence africaine des médicaments (AMA) et à positionner le Royaume comme hub réglementaire régional en Afrique, notamment dans le contexte du développement de capacités de fabrication de vaccins à Casablanca avec Sanofi et Marbio.","date":"2026-06-01"},
{"title":"Marbio et Sanofi lancent la co-production de vaccins à Casablanca : le Maroc s'intègre à l'écosystème africain de fabrication locale","url":"https://healthpolicy-watch.news/landmark-vaccine-deals-signal-africas-shift-toward-local-manufacturing/","content":"Le partenariat entre la biotech marocaine Marbio et le groupe pharmaceutique Sanofi pour co-produire deux vaccins dans une nouvelle usine à Casablanca positionne le Maroc comme l'un des pionniers de la fabrication locale de vaccins en Afrique du Nord. Cette collaboration, soutenue par le mécanisme AVMA de Gavi doté de 1,2 milliard USD sur 10 ans, s'inscrit dans l'ambition africaine de produire 60 % des vaccins utilisés sur le continent d'ici 2040, contre moins de 1 % actuellement. Pour le Royaume, cette initiative renforce la souveraineté sanitaire nationale, développe des compétences industrielles biopharmaceutiques locales et crée des emplois qualifiés dans le secteur de la santé. Le Maroc bénéficie d'une position géographique et réglementaire favorable pour exporter vers les marchés africains, s'appuyant sur l'harmonisation progressive en cours sous l'égide de l'AMA. Gavi procédera aux premiers décaissements du fonds AVMA vers les fabricants africains dans le second semestre 2026.","date":"2026-07-02"},
{"title":"Le Maroc consolide son système de santé publique à l'aune des défis épidémiques continentaux","url":"https://microbiotics.com.ng/africa-cdc-strategic-plan-2022-2026?pdf=4936","content":"Dans un contexte de flambées épidémiques récurrentes sur le continent africain, le Maroc renforce ses dispositifs de veille sanitaire et de réponse aux urgences de santé publique. Le Royaume s'appuie sur son réseau de laboratoires de référence et sur ses partenariats avec des institutions internationales telles qu'Africa CDC et l'OMS pour détecter précocement toute menace épidémique. Le Plan stratégique 2022-2026 d'Africa CDC, qui prévoit un Centre de coordination régional pour l'Afrique du Nord basé au Caire, constitue une opportunité pour le Maroc de renforcer son intégration dans l'architecture continentale de sécurité sanitaire. Les autorités marocaines veillent par ailleurs à maintenir des capacités de prise en charge des maladies à potentiel épidémique importées, dans le respect des Règlements sanitaires internationaux.","date":"2026-07-04"},
{"title":"Budget santé 2026 au Maroc : 42,4 milliards de dirhams, une hausse de 30 % et 8 000 nouveaux postes budgétaires","url":"https://aujourdhui.ma/actualite/un-budget-en-hausse-de-30-et-8-000-nouveaux-postes-424-milliards-de-dirhams-pour-la-sante-en-2026","content":"Le ministère marocain de la Santé et de la Protection sociale dispose en 2026 d'un budget record de 42,4 milliards de dirhams, en hausse de 30 % par rapport à l'exercice précédent, dans le cadre de la réforme structurelle du système national de santé portée par la Vision royale de l'État social. Sur cette enveloppe, 16,4 milliards de dirhams sont dédiés aux dépenses de personnel, avec la création de 8 000 nouveaux postes budgétaires pour renforcer les ressources humaines à tous les niveaux du système de soins. Les investissements prioritaires de 2026 incluent la construction de nouveaux Centres hospitaliers universitaires (CHU), la mise à niveau de 90 hôpitaux existants et le déploiement progressif des Groupements sanitaires territoriaux (GST). D'ici fin 2027, toutes les régions du Maroc, à l'exception de Dakhla-Oued Eddahab, disposeront de leur propre CHU.","date":"2026-07-03"},
{"title":"Réforme de l'état social au Maroc : la santé change d'échelle avec les Groupements sanitaires territoriaux","url":"https://leseco.ma/maroc/reforme-de-letat-social-la-sante-change-dechelle-non-sans-resistances.html","content":"La réforme du secteur de la santé au Maroc entre en 2026 dans une phase décisive avec l'opérationnalisation progressive des Groupements sanitaires territoriaux (GST), nouvelles entités de gouvernance régionale chargées d'intégrer et de coordonner l'ensemble des établissements de santé d'une même région. Cette restructuration vise à mettre fin à la fragmentation du système de soins, à améliorer l'accès aux soins en milieu rural et semi-urbain, et à renforcer la complémentarité entre les secteurs public et privé. Si l'ambition réformatrice est globalement saluée, des résistances subsistent parmi les professionnels de santé face aux changements organisationnels, notamment concernant la mobilité des personnels et la redistribution des compétences entre niveaux de soins. La généralisation de la feuille de soins électronique constitue un autre chantier prioritaire de 2026, visant à simplifier les démarches administratives et améliorer la traçabilité des soins.","date":"2026-07-01"},
