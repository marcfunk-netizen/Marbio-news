{"title":"BioNTech mRNA Hub Kigali atteint sa capacité nominale de 50 millions de doses par an — jalon historique pour la souveraineté vaccinale africaine","url":"https://www.biontech.com/news/2026/biontech-mrna-hub-kigali-full-capacity-september-2026","content":"BioNTech a annoncé le 26 septembre 2026 que sa plateforme de fabrication de vaccins à ARN messager au Rwanda (BioNTech mRNA Hub Kigali), inaugurée en 2022, a atteint sa capacité nominale de 50 millions de doses par an, franchissant un jalon majeur dans la stratégie africaine de souveraineté vaccinale. La montée en puissance — de 1 million de doses en 2023 à 12 millions en 2024, 31 millions en 2025 et pleine capacité en septembre 2026 — s'est accélérée sous la pression de l'épidémie d'Ebola Bundibugyo créant une demande urgente de contre-mesures médicales africaines. La plateforme produit actuellement un vaccin antipaludique mRNA en phase 3 et développe en parallèle un candidat contre la fièvre de Lassa avec l'Institut Jenner d'Oxford et Africa CDC. L'obtention de la certification BPF de l'OMS est prévue au premier trimestre 2027, ouvrant la voie aux appels d'offres UNICEF. BioNTech a confirmé un transfert de technologie complet au fabricant rwandais Kanombe Pharma d'ici 2028, avec formation de 180 scientifiques locaux financée par le mécanisme AVMA de Gavi.","date":"2026-09-26"},
{"title":"Atlantic Lifesciences Ghana obtient la préqualification OMS pour son vaccin méningocoque A — première homologation africaine d'un vaccin fill-and-finish local","url":"https://www.who.int/news/item/25-09-2026-atlantic-lifesciences-ghana-who-prequalification-meningococcal-a","content":"L'OMS a accordé le 25 septembre 2026 la préqualification à Atlantic Lifesciences (ALI) basé à Accra, Ghana, pour son vaccin méningocoque A produit localement par fill-and-finish — une première historique pour un vaccin fabriqué sur le sol ghanéen. Cette préqualification ouvre la voie aux achats groupés de l'UNICEF et de Gavi à partir du premier trimestre 2027. Le vaccin issu d'un partenariat de transfert technologique avec le Serum Institute of India a nécessité 18 mois d'audits BPF avant d'atteindre les standards OMS. L'épidémie de méningite au Sahel — 847 cas signalés depuis juillet 2026 au Nigeria, Niger et Tchad — renforce l'urgence d'une production locale de ce vaccin. Africa CDC, l'AMA et Gavi ont salué conjointement cette préqualification comme une «démonstration de faisabilité» renforçant la crédibilité de l'écosystème africain de fabrication vaccinale. Le mécanisme AVMA de Gavi a octroyé à ALI un paiement de 8,5 millions USD lié à l'atteinte de ce jalon réglementaire.","date":"2026-09-25"},
{"title":"Marbio-Sanofi Casablanca : 75 % d'avancement, ligne de remplissage aseptique démarrée — mise en service T1 2027 confirmée","url":"https://healthpolicy-watch.news/marbio-sanofi-casablanca-75-percent-filling-line-operational-september-2026","content":"La construction de l'usine de co-production vaccinale Marbio-Sanofi à Nouaceur, Casablanca, a atteint 75 % d'avancement au 22 septembre 2026, avec le démarrage des tests de qualification de la première ligne de remplissage aseptique — une étape clé confirmant la mise en service au premier trimestre 2027. Les équipes de Sanofi et Marbio ont finalisé le processus de fermentation pour le vaccin DTaP, avec les premiers lots pilotes produits pour validation analytique. L'usine, dont l'investissement total s'élève à 95 millions USD partiellement soutenu par l'AVMA de Gavi et le Fonds Hassan II, compte désormais 145 des 320 employés permanents prévus, dont 38 ingénieurs formés dans des usines Sanofi en Europe. L'AMMPS marocaine a confirmé une première inspection BPF planifiée pour novembre 2026, conduite conjointement avec l'AMA pour une double certification accélérant l'accès aux marchés africains subsahariens dès 2028.","date":"2026-09-22"},
{"title":"Africa's vaccine sovereignty goal faces its biggest hurdle: securing long-term demand for locally-made vaccines","url":"https://www.semafor.com/article/07/02/2026/africa-moves-ahead-with-vaccine-manufacturing-ambitions","content":"A Semafor analysis published in July 2026 identifies the emerging structural challenge for Africa's vaccine manufacturing ambitions: while Gavi's $1.2 billion African Vaccine Manufacturing Accelerator (AVMA) is successfully financing factory construction across six sites on the continent, the critical bottleneck has shifted from building factories to securing long-term, predictable demand for locally-manufactured vaccines. Without firm purchase commitments from African governments and multilateral procurement agencies like UNICEF and Gavi, manufacturers risk producing vaccines they cannot sell at commercially viable prices, undermining the entire local manufacturing ecosystem. Semafor reports that fewer than 40% of African Union member states have formalised advance market commitments or priority purchasing policies for locally-produced vaccines, despite strong political rhetoric in support of the continent's 60%-by-2040 production target. The first AVMA cash disbursements of $47 million to Biovac and Institut Pasteur de Dakar in August 2026 marked a historic milestone, but experts warn that disbursing capital is the easy part — building a sustainable market where African-made vaccines consistently beat imported alternatives on price, quality and reliability is the decade-long challenge that will define whether the manufacturing revolution succeeds or stalls. A coordinated advance market commitment mechanism under African Union governance is described as the missing piece that could unlock the full potential of existing investments.","date":"2026-07-02"},
{"title":"Fabrication vaccinale africaine : opportunités, priorités et défis selon une synthèse publiée dans la revue Vaccine (Elsevier 2026)","url":"https://www.sciencedirect.com/science/article/pii/S0264410X25001264","content":"Un article de synthèse publié dans la revue Vaccine (Elsevier/ScienceDirect) en 2026 analyse les opportunités, priorités et défis pour renforcer les capacités de fabrication vaccinale locale en Afrique, en s'appuyant sur des données de douze fabricants africains à différents stades de développement dans six pays : Afrique du Sud, Sénégal, Ghana, Kenya, Rwanda et Maroc. Les auteurs identifient trois opportunités structurelles majeures : l'opérationnalisation de l'AMA qui harmonise les cadres réglementaires, le mécanisme AVMA de Gavi qui finance la construction d'usines, et l'épidémie d'Ebola Bundibugyo qui a créé une pression politique sans précédent pour investir dans la fabrication locale de vaccins contre les pathogènes africains prioritaires. Les défis persistants incluent la rareté de la main-d'oeuvre qualifiée en assurance qualité pharmaceutique, les délais de certification BPF de l'OMS (12 à 18 mois après mise en service industrielle), la fragmentation de la demande nationale et l'absence de mécanismes d'engagement anticipé de marché similaires à COVAX sous gouvernance africaine. La revue recommande la création d'un fonds continental de financement de la demande coordonné par l'Union africaine, permettant aux gouvernements africains de s'engager collectivement à acheter auprès de fabricants locaux certifiés à des conditions préférentielles. Les auteurs concluent que sans coordination urgente entre producteurs, gouvernements, agences réglementaires et acheteurs institutionnels, l'Afrique risque d'atteindre 2030 avec des usines construites mais sans acheteurs suffisants pour les maintenir en activité.","date":"2026-07-15"},
{"title":"Afrique : trois sites ciblent la maîtrise du fill-and-finish mRNA d'ici fin 2026 — étape décisive vers l'autosuffisance vaccinale","url":"https://streamlinefeed.co.ke/news/local-vaccine-manufacturing-mrna-fill-finish-timelines-africa-2026","content":"Selon un rapport de Streamlinefeed (septembre 2026), trois sites africains — dont la plateforme mRNA de BioNTech à Kigali (Rwanda) et un site au Kenya — ciblent des capacités opérationnelles de fill-and-finish de vaccins à ARN messager d'ici fin 2026, marquant une avancée décisive dans la stratégie africaine d'autosuffisance vaccinale. Le fill-and-finish — conditionnement final de l'antigène vaccinal en flacons stériles — est longtemps resté dépendant de prestataires européens ou indiens, exposant l'Afrique à des ruptures d'approvisionnement. La maîtrise locale de cette étape permettrait aux fabricants africains d'accéder aux appels d'offres UNICEF et Gavi sans dépendre de chaînes logistiques extérieures. Des obstacles persistent néanmoins : les certifications BPF requises par l'OMS et l'AMA nécessitent 12 à 18 mois d'audits après mise en service industrielle. Le mécanisme AVMA de Gavi, qui a effectué ses premiers décaissements vers Biovac et l'Institut Pasteur de Dakar en août 2026 pour un total de 47 millions USD, constitue l'incitation financière déterminante pour accélérer ces trajectoires industrielles dans les délais impartis.","date":"2026-09-05"},
{"title":"ONE Data : l'Afrique a besoin de 5 milliards USD supplémentaires d'ici 2030 pour produire 60 % de ses vaccins localement","url":"https://data.one.org/analysis/manufacturing","content":"Une analyse publiée par ONE Data en 2026 évalue à au moins 5 milliards USD le financement supplémentaire nécessaire d'ici 2030 pour que l'Afrique atteigne son objectif de produire localement 60 % de ses vaccins — contre moins de 1 % aujourd'hui. L'étude recense 12 fabricants africains à différents stades de développement, dont six en phase d'industrialisation active en Afrique du Sud, Sénégal, Ghana, Kenya, Rwanda et Maroc ; sans engagement ferme de demande de la part des gouvernements africains, plus de la moitié risquent de ne pas atteindre la viabilité commerciale. L'analyse met en évidence un paradoxe structurel : si l'offre de capital pour la construction d'usines a progressé grâce à l'AVMA de Gavi (1,2 milliard USD), la BEI, l'IFC et la BAD, la demande prévisible reste insuffisante — moins de 40 % des États africains ont formalisé des engagements d'achat prioritaire auprès de fabricants locaux. ONE Data appelle à une coordination urgente entre l'Union africaine, les ministères de la santé et les acheteurs institutionnels pour créer des mécanismes d'engagement anticipé de marché africains, similaires au modèle COVAX mais sous gouvernance continentale.","date":"2026-09-02"},
{"title":"AVMA de Gavi : premiers décaissements historiques versés à Biovac (Afrique du Sud) et à l'Institut Pasteur de Dakar — 47 millions USD pour la production africaine de vaccins","url":"https://www.gavi.org/news/media-room/avma-first-cash-disbursements-biovac-ipd-august-2026","content":"Gavi, l'Alliance du vaccin, a confirmé le 28 août 2026 les premiers décaissements en numéraire du mécanisme AVMA (African Vaccine Manufacturing Accelerator) vers deux fabricants africains : l'Institut Biovac d'Afrique du Sud, pionnier de la production de vaccins conjugués contre le choléra, et l'Institut Pasteur de Dakar, producteur du vaccin contre la fièvre jaune et en phase de transfert de technologie pour un vaccin anti-méningocoque. Ces décaissements, d'un montant total de 47 millions USD, récompensent l'atteinte de jalons de production définis contractuellement et marquent la première fois que des fonds d'une facilité internationale parviennent directement aux comptes d'un fabricant africain sur la base de résultats concrets. L'AVMA, doté de 1,2 milliard USD sur dix ans, a pour ambition de rémunérer les fabricants africains par des paiements additionnels liés au volume de doses vendues aux pays à faible et moyen revenu via Gavi et l'UNICEF. Ces deux premiers bénéficiaires disposent de modèles de fabrication end-to-end et de certifications qui leur permettront d'accéder aux appels d'offres internationaux de l'UNICEF dès 2027. Gavi estime que le mécanisme AVMA pourrait générer 60 000 emplois qualifiés dans la chaîne de valeur pharmaceutique africaine d'ici 2035.","date":"2026-08-28"},
{"title":"Marbio-Sanofi Casablanca : la construction de l'usine vaccinale atteint 65 % d'avancement, mise en service prévue au T1 2027","url":"https://healthpolicy-watch.news/marbio-sanofi-casablanca-vaccine-plant-construction-65-percent-august-2026","content":"La construction de l'usine de co-production vaccinale issue du partenariat entre la biotech marocaine Marbio et le groupe pharmaceutique Sanofi, sur le site de Nouaceur à Casablanca, a atteint 65 % d'avancement au 21 août 2026, selon le bilan communiqué conjointement par les deux partenaires. Les travaux de génie civil sont achevés et les équipements — cuves de fermentation, lignes de remplissage aseptique et systèmes de contrôle qualité — sont en cours d'installation, conformément au calendrier prévisionnel. La mise en service progressive est toujours planifiée pour le premier trimestre 2027, avec une production initiale ciblant le vaccin diphtérie-tétanos-coqueluche (DTaP) suivi du vaccin anti-méningocoque A. Cet investissement de 95 millions USD, partiellement soutenu par le mécanisme AVMA de Gavi et le Fonds Hassan II pour le développement économique et social, créera 320 emplois directs qualifiés à Casablanca. L'usine sera soumise aux inspections de l'AMMPS marocaine et de l'AMA pour obtenir la certification BPF africaine nécessaire à l'accès aux marchés d'Afrique subsaharienne via les appels d'offres UNICEF.","date":"2026-08-21"},
{"title":"IFC, BEI et Commission européenne financent Biovac Kilimanjaro à hauteur de 180 millions USD pour le premier site multi-vaccins end-to-end d'Afrique","url":"https://www.ifc.org/en/pressroom/2026/ifc-eib-group-and-european-commission-back-biovac","content":"Le 16 avril 2026, l'IFC (Société financière internationale), le Groupe BEI (Banque européenne d'investissement) et la Commission européenne ont annoncé un financement conjoint de 180 millions USD pour le projet Biovac Kilimanjaro, premier site de fabrication de vaccins end-to-end multi-vaccins d'Afrique, situé en Afrique du Sud. Le montage financier comprend un prêt senior de 20 millions USD de l'IFC et un investissement quasi-fonds propres de 75 millions d'euros de la BEI via le programme Human Development Accelerator (HDX), garanti par la Commission européenne. À pleine capacité d'ici 2028, l'usine produira entre 30 et 40 millions de doses par an — en commençant par le vaccin oral contre le choléra avant d'élargir sa gamme à la poliomyélite, la pneumonie et la méningite. Le projet Biovac Kilimanjaro générera plus de 340 emplois directs qualifiés et au moins 7 000 emplois indirects dans la chaîne de valeur pharmaceutique africaine, illustrant la complémentarité entre financement international et capacité industrielle locale pour réduire la dépendance du continent aux importations vaccinales.","date":"2026-04-16"},
{"title":"Banque africaine de développement et Biovac signent un accord de 15 millions USD pour la première production end-to-end africaine de vaccin contre le choléra","url":"https://www.afdb.org/en/news-and-events/south-africa-african-development-bank-and-biovac-sign-15-million-agreement-advance-africas-first-end-end-cholera-vaccine-production-95738","content":"La Banque africaine de développement (BAD) et l'Institut Biovac, fabricant de vaccins sud-africain, ont signé un accord de financement de 15 millions USD pour soutenir la mise en place de la première chaîne de production end-to-end de vaccin oral contre le choléra en Afrique, dans le cadre du projet Biovac Kilimanjaro. Cet accord complète les financements annoncés en avril 2026 par l'IFC, la BEI et la Commission européenne, portant l'enveloppe totale à 180 millions USD. L'Afrique subsaharienne est particulièrement touchée par les épidémies de choléra récurrentes — des milliers de décès enregistrés en RDC, au Soudan, en Éthiopie et au Zimbabwe depuis 2022 — et l'absence de production vaccinale locale contraint les systèmes de santé africains à dépendre entièrement des importations. La capacité de production de vaccin oral contre le choléra par Biovac représente une avancée stratégique pour renforcer la préparation épidémique du continent, en complémentarité avec la reprise des campagnes préventives de vaccination choléra annoncée par l'OMS en février 2026.","date":"2026-05-12"},
{"title":"L'Afrique accélère vers l'autosuffisance vaccinale : Maroc, Rwanda, Ghana et Afrique du Sud avancent dans les transferts de technologie","url":"https://african.business/2026/04/trade-investment/momentum-builds-for-local-drug-production","content":"Un rapport d'African Business publié en avril 2026 dresse un panorama de l'accélération en cours dans la production pharmaceutique et vaccinale africaine. Les sites les plus avancés incluent Atlantic Lifesciences au Ghana, l'Institut Biovac en Afrique du Sud, la plateforme mRNA de BioNTech à Kigali (Rwanda) opérationnelle depuis 2022, et le partenariat Marbio-Sanofi à Casablanca (Maroc). Le mécanisme AVMA de Gavi, doté de 1,2 milliard USD sur 10 ans, doit procéder à ses premiers décaissements vers les fabricants africains dans le second semestre 2026 — un jalon historique. Toutefois, des obstacles structurels persistent : délais réglementaires, demande fragmentée des gouvernements africains, lenteurs des partenaires de transfert technologique et pénurie de ressources humaines qualifiées en assurance qualité. L'objectif continental de produire 60 % des vaccins localement d'ici 2040 — contre moins de 1 % aujourd'hui — requiert une accélération sans précédent de tous ces leviers simultanément.","date":"2026-04-15"},
{"title":"Landmark vaccine deals signal Africa's shift to local manufacturing: Gavi's $1.2 billion AVMA to make first cash disbursements in 2026","url":"https://healthpolicy-watch.news/landmark-vaccine-deals-signal-africas-shift-toward-local-manufacturing/","content":"A series of landmark deals in 2026 marked a historic turning point in Africa's transition to vaccine self-sufficiency, with Gavi's African Vaccine Manufacturing Accelerator (AVMA) set to make its first cash disbursements to local manufacturers in the second half of 2026. The AVMA, a 10-year initiative worth 1.2 billion USD, has supported the construction of six facilities across the continent with active technology transfers underway, including Atlantic Lifesciences in Ghana and Biovac Institute in South Africa. An end-to-end mRNA vaccine production platform capable of 100 million doses annually is being built in Africa for the first time. Sanofi's partnership with Moroccan biotech firm Marbio to co-produce two vaccines at a new plant in Casablanca is highlighted as a model of North-South industrial collaboration. Africa's target is to produce 60% of its vaccines locally by 2040, up from the current 1% manufactured on the continent.","date":"2026-07-02"},
{"title":"African vaccine manufacturing advancing but five cross-cutting challenges persist — CHAI 2026 supply landscape report","url":"https://www.clintonhealthaccess.org/report/african-vaccine-manufacturing-supply-landscape-2026/","content":"The Clinton Health Access Initiative (CHAI) published its 2026 African Vaccine Manufacturing Supply Landscape report documenting significant progress alongside persistent structural barriers. The report identifies five cross-cutting challenges delaying near-to-market manufacturers: regulatory delays at national and continental levels, uncertain and fragmented market demand, slow disbursement of committed financing, delays from technology transfer partners, and workforce gaps in quality assurance and manufacturing operations. Senegal's Institut Pasteur de Dakar and South Africa's Biovac Institute remain the most established producers, while new facilities in Ghana, Rwanda and Morocco are advancing through technology transfer phases. CHAI warns that without coordinated advance market commitments from African governments and partners like Gavi and UNICEF, manufacturers risk producing vaccines they cannot sell profitably, undermining the entire local manufacturing ecosystem. The report calls for renewed policy coordination between the African Union, AMA and international funders to resolve these barriers before 2027.","date":"2026-06-04"},
{"title":"Africa vaccine manufacturing in 2026: current landscape, innovations and opportunities — a narrative review","url":"https://onlinelibrary.wiley.com/doi/full/10.1002/hsr2.71926","content":"A 2026 narrative review published in Health Science Reports (Wiley) by Chandipwisa et al. provides a comprehensive assessment of vaccine manufacturing across Africa, covering the current landscape, innovations and opportunities for the continent's biopharmaceutical sector. The authors note that while sub-Saharan Africa carries approximately 25% of the global disease burden, the continent produces less than 1% of the vaccines it consumes. The review recommends prioritising domestic procurement policies, building African regulatory talent pipelines, and creating WHO prequalification pathways for African manufacturers — a prerequisite for accessing Gavi and UNICEF international tenders. Key enabling factors identified include the AMA's regulatory harmonisation role, AVMA's funding mechanism, and technology transfer partnerships with manufacturers in Europe and India. The Ebola Bundibugyo outbreak has added new urgency to the push for African priority-pathogen vaccine development integrated into domestic manufacturing agendas.","date":"2026-05-15"},
{"title":"Fabrication de vaccins en Afrique : Africa CDC appelle à une gouvernance renforcée de la R&D sanitaire","url":"https://khub.africacdc.org/records/resource/africa-cdc-who-launch-of-the-continental-preparedness-and-response-plan-for-ebola","content":"Dans le cadre de la réponse continentale à l'épidémie d'Ebola, Africa CDC réaffirme l'importance de prioriser la recherche et le développement (R&D) sanitaire sur le continent africain. Un document récemment publié par l'institution intitulé « A call for health R&D prioritisation and governance mechanisms in Africa » plaide pour la mise en place de mécanismes de gouvernance clairs permettant d'orienter les investissements vers la fabrication locale de vaccins et de produits médicaux essentiels. Cette démarche s'inscrit dans l'Agenda de Sécurité et de Souveraineté Sanitaire de l'Afrique (AHSS), qui vise à réduire la dépendance du continent aux chaînes d'approvisionnement mondiales et à renforcer les capacités industrielles africaines dans le domaine biopharmaceutique. Le plan de réponse Ebola évalué à 518 millions de dollars intègre également un volet dédié à la recherche et à la production d'outils diagnostiques et thérapeutiques adaptés au contexte africain.","date":"2026-07-12"},
{"title":"Surveillance moléculaire de l'influenza en Namibie : un modèle pour orienter la production de vaccins adaptés à l'Afrique","url":"https://khub.africacdc.org/records/resource/epidemic-intelligence-weekly-report-6","content":"Une étude publiée dans le cadre du hub de connaissances sanitaires de l'Africa CDC met en lumière les résultats d'une surveillance moléculaire approfondie des virus de la grippe A et B en Namibie, couvrant la période 2021-2023. Cette recherche, menée à Windhoek, documente les patterns saisonniers de circulation des souches grippales et leurs corrélats cliniques, fournissant des données précieuses pour adapter la composition des vaccins antigrippaux aux réalités épidémiologiques africaines. Les auteurs soulignent que les données de surveillance génomique locale sont indispensables pour permettre aux fabricants de vaccins de produire des formulations mieux adaptées aux souches circulant en Afrique subsaharienne, souvent différentes de celles prédominantes dans l'hémisphère nord. Cette étude plaide pour le renforcement des infrastructures de séquençage génomique et de surveillance virale sur le continent, condition sine qua non pour soutenir une fabrication de vaccins africaine véritablement souveraine et pertinente.","date":"2026-07-11"},
{"title":"Ebola Bundibugyo sans vaccins ni traitements : l'urgence de la fabrication locale de vaccins en Afrique","url":"https://khub.africacdc.org/records/resource/africa-cdc-ebola-outbreaks-in-drc-and-uganda-weekly-brief-28th-may-2026","content":"Le rapport hebdomadaire d'Africa CDC sur l'épidémie Ebola Bundibugyo en RDC et en Ouganda met en lumière une réalité alarmante : aucun vaccin ni traitement approuvé n'est disponible contre cette souche. Un article associé, publié en juillet 2026 sous le titre « Bundibugyo Ebola Without Vaccines or Therapeutics: Why Public Health Fundamentals Matter More Than Border Closures », souligne que l'absence d'outils biomédicaux spécifiques place les équipes de santé publique dans une position de vulnérabilité extrême. Cette situation relance le débat sur la nécessité d'accélérer la fabrication locale de vaccins en Afrique, et d'intégrer les pathogènes prioritaires du continent dans les agendas industriels pharmaceutiques régionaux.","date":"2026-07-09"},
{"title":"Kenya : Africa CDC signe un accord historique pour son centre régional de coordination en Afrique de l'Est","url":"https://www.youtube.com/watch?v=WY-lk_JZOig","content":"Africa CDC a signé un accord de partenariat stratégique avec le gouvernement du Kenya, qui met à disposition 10 acres de terrain et une contribution financière de 2 millions USD pour le Centre régional de coordination de l'Afrique de l'Est, basé à Nairobi. Ce centre, l'un des cinq que compte Africa CDC sur le continent, sera doté prochainement d'un laboratoire régional de référence dont le financement est activement recherché. Le Dr Jean Kaseya a appelé les pays africains à suivre l'exemple du Kenya pour soutenir la production et la surveillance sanitaire continentales.","date":"2026-07-08"},
],
"unicef-gavi":[{"title":"Gavi et UNICEF négocient une réduction de 40 % du prix du vaccin antipaludique RTS,S/AS01 — économies de 50 millions USD sur 2027-2029","url":"https://www.gavi.org/news/media-room/gavi-and-unicef-secure-lower-malaria-vaccine-price-saving-us-50-million-childhood","content":"Gavi et l&#39;UNICEF ont annoncé le 22 octobre 2026 la conclusion d&#39;un accord réduisant le prix du vaccin antipaludique RTS,S/AS01 (GSK) d&#39;environ 40 %, générant des économies estimées à 50 millions USD sur la période 2027-2029. Exécuté par l&#39;UNICEF et financièrement garanti par Gavi, cet accord permettra de financer des doses supplémentaires pour les 25 pays africains où le vaccin est intégré dans les programmes de vaccination de routine avec l&#39;appui de l&#39;Alliance. Depuis le démarrage du déploiement en 2024, UNICEF a procuré et livré plus de 74 millions de doses de vaccins antipaludiques, avec une demande qui a dépassé les projections initiales. La réduction de prix est conditionnée à l&#39;obtention par GSK de la préqualification OMS pour un nouveau site de production. Gavi vise la couverture vaccinale antipaludique de 50 millions d&#39;enfants d&#39;ici 2030, pour un investissement total projeté de plus de 1,1 milliard USD dans ce programme sur son cycle stratégique 2026-2030.","date":"22-10-2026"},{"title":"Vaccination HPV en Afrique : 35 pays ont introduit le vaccin dans leurs programmes de routine — Gavi projette 1 million de décès par cancer du col évités d&#39;ici 2030","url":"https://www.gavi.org/news/media-room/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding","content":"Gavi, l&#39;Alliance du Vaccin, a annoncé en octobre 2026 que 35 pays africains ont désormais intégré le vaccin contre le papillomavirus humain (HPV) dans leurs programmes nationaux de vaccination de routine — une progression notable par rapport aux 20 pays en 2022. Cette expansion devrait permettre d&#39;éviter près d&#39;un million de décès par cancer du col de l&#39;utérus dans les pays bénéficiaires d&#39;ici 2030, faisant de cette vaccination l&#39;une des interventions les plus coût-efficaces de santé publique africaine. Gavi confirme que ses programmes ont généré plus de 30 milliards USD de bénéfices économiques en 2025, avec 73 millions d&#39;enfants immunisés dans 57 pays — dépassant l&#39;objectif de 300 millions d&#39;enfants sur la période 2021-2025. La pression financière reste préoccupante : le retrait américain du financement Gavi (2,6 milliards USD annulés) oblige l&#39;Alliance à diversifier ses sources de revenus, alors que les gouvernements africains ont porté leurs contributions co-financées à un record de 301 millions USD en 2025.","date":"22-10-2026"},{"title":"Journée mondiale de lutte contre la polio 2026 : les Amériques célèbrent 35 ans sans poliovirus sauvage — 48 cas persistant en Afghanistan et Pakistan","url":"https://www.paho.org/en/news/23-10-2026-world-polio-day-2026-americas-mark-35-years-free-wild-poliovirus-vaccination-gaps","content":"À l&#39;occasion de la Journée mondiale de lutte contre la poliomyélite du 24 octobre 2026, l&#39;OPS/OMS Amériques a salué les 35 ans d&#39;élimination du poliovirus sauvage dans les Amériques — acquis depuis 1991 — tout en alertant sur les risques liés aux lacunes persistantes de couverture vaccinale. Selon l&#39;Initiative mondiale pour l&#39;éradication de la polio (GPEI), 48 cas de poliovirus sauvage de type 1 ont été signalés dans le monde en 2026 jusqu&#39;au 20 octobre : 42 en Afghanistan et 6 au Pakistan, deux pays qui demeurent les derniers réservoirs du virus. L&#39;OMS a souligné que la polio dérivée du vaccin (cVDPV2) constitue un risque croissant dans les zones à faible couverture vaccinale en Afrique, avec plusieurs foyers détectés en 2026 dans des pays où la couverture antipolio est inférieure à 70 %. L&#39;OMS appelle à maintenir une couverture vaccinale supérieure à 95 % dans tous les pays, car le risque d&#39;importation depuis les zones d&#39;endémie subsiste tant que l&#39;éradication mondiale n&#39;est pas atteinte.","date":"23-10-2026"},{"title":"Malawi : campagne rougeole-rubéole dans les écoles — 5,8 millions d&#39;enfants vaccinés en septembre 2026 pour endiguer 2 000 cas déclarés depuis janvier","url":"https://www.gavi.org/vaccineswork/gavi-impact-africa-2000","content":"Le Malawi a conduit en septembre 2026 une vaste campagne de vaccination contre la rougeole et la rubéole dans les établissements scolaires, atteignant 5,8 millions d&#39;enfants en quelques semaines selon un rapport Gavi publié début octobre 2026. Cette intervention d&#39;urgence fait suite à l&#39;enregistrement de près de 2 000 cas de rougeole depuis le début de l&#39;année 2026, signe d&#39;une résurgence préoccupante dans le pays. Gavi et l&#39;UNICEF ont co-financé la campagne, fourni les vaccins et appuyé la logistique dans les zones rurales reculées. La stratégie de vaccination en milieu scolaire testée au Malawi pourrait servir de modèle pour d&#39;autres pays africains où les taux de couverture des enfants d&#39;âge scolaire restent inférieurs à 80 %. Selon les données Gavi, des résurgences rougeoleuses touchent en 2026 une vingtaine de pays africains, avec des déficits de couverture particulièrement marqués au Nigeria (2,2 millions d&#39;enfants jamais vaccinés), en RDC et au Sahel.","date":"09-10-2026"},{"title":"Record Gavi 2025 : les pays à faible revenu investissent 301 millions USD en co-financement — une responsabilité nationale croissante qui transforme le modèle d&#39;aide vaccinale","url":"https://allafrica.com/stories/202610090500.html","content":"Le rapport annuel de progrès Gavi 2025 publié en octobre 2026 révèle que les pays à faible revenu soutenus par l&#39;Alliance ont contribué un record de 301 millions USD à l&#39;achat de vaccins, marquant une hausse significative par rapport aux années précédentes. Ce co-financement record s&#39;inscrit dans la stratégie Gavi 5.0 visant à accroître la responsabilité nationale et à préparer la transition vers l&#39;autosuffisance vaccinale. Les programmes Gavi ont par ailleurs généré plus de 30 milliards USD de bénéfices économiques en 2025 — le montant annuel le plus élevé de l&#39;histoire de l&#39;Alliance — grâce à la prévention de décès, d&#39;hospitalisations et de pertes de productivité. Malgré ces avancées, 9,5 millions d&#39;enfants dans 57 pays n&#39;ont encore reçu aucun vaccin de routine, témoignant de la persistance de zones d&#39;exclusion dans les régions en conflit et les communautés marginalisées. Gavi appelle les gouvernements partenaires à renforcer les systèmes de santé primaires pour combler ce déficit.","date":"09-10-2026"},{"title":"Gavi commits $50M to accelerate Bundibugyo Ebola vaccine development and outbreak response","url":"https://www.gavi.org/news/media-room/gavi-commits-additional-funding-ebola-response","content":"Gavi, the Vaccine Alliance, committed US$50 million on 29 May 2026 to accelerate development and deployment of vaccines against Bundibugyo ebolavirus, the strain responsible for the ongoing epidemic in the DRC, Uganda, and Kenya that has killed over 4,400 people. The funding will support accelerated clinical testing of candidate vaccines targeting the Bundibugyo strain, complementing the WHO's ongoing EBO-PEP post-exposure prophylaxis trial. In June 2026, UNICEF and Gavi jointly issued a call for information to vaccine manufacturers to gauge production capacity and accelerate supply chain planning for a future Bundibugyo vaccine. The $50 million commitment is one of the largest single investments in Ebola vaccine development since the West Africa outbreak of 2014-2016, which ultimately led to the approval of Ervebo (rVSV-ZEBOV) against the Zaire strain. With no approved vaccine yet targeting the Bundibugyo strain, the gap in immunological coverage has been identified as a critical barrier to bringing the current outbreak under control.","date":"2026-05-29"},{"title":"UNICEF negotiates 25% cut in R21 malaria vaccine price to $2.99 per dose, expanding access for African countries","url":"https://pulseofafrica.info/news/804","content":"UNICEF has secured a procurement agreement reducing the price of the R21/Matrix-M malaria vaccine to US$2.99 per dose from approximately US$4 — a 25% reduction that could significantly expand access to the vaccine in Gavi-eligible low-income African countries. The R21 vaccine, developed by the University of Oxford and manufactured by the Serum Institute of India, was WHO-prequalified in 2023 and is now supported by Gavi in 25 African countries. The price reduction was executed by UNICEF on behalf of the Gavi alliance using economies of scale to negotiate with the manufacturer. Malaria kills approximately 600,000 people annually, with over 90% of deaths in Africa, predominantly in children under five — making vaccine pricing a critical lever for mass deployment. The new price brings R21 closer to the sub-$3 threshold long advocated by health economists as necessary for sustainable integration into national immunization programs in low-income countries.","date":"2026-10-07"},{"title":"US terminates $2.6B Gavi grant; African health officials seek alternative financing for immunization programs","url":"https://www.cidrap.umn.edu/mpox/african-health-officials-meet-us-counterparts-amid-news-gavi-cuts","content":"The United States terminated a $2.6 billion grant to Gavi, the Vaccine Alliance, that had been scheduled to run through 2030, creating a significant financing shortfall threatening immunization programs for tens of millions of children in Africa and other low-income regions. The cut follows broader US foreign aid reductions and threatens Gavi's ability to procure and distribute vaccines at subsidized rates, potentially reversing recent gains in childhood immunization coverage. African health officials responded by engaging directly with US counterparts to seek clarification and explore alternative financing, including increased contributions from African governments and other donor nations such as the UK, EU, and Gulf states. Gavi reported immunizing over 73 million children in 2025 and generating more than $30 billion in economic benefits; the loss of US funding could reduce coverage reach by an estimated 15-20%. The cut compounds existing pressure on African governments, which are already expected to contribute approximately $4 billion in co-financing under Gavi's evolving partnership model from 2026 onwards.","date":"2026-10-07"},{"title":"Gavi rapport annuel 2025 : 9,5 millions d'enfants zéro-dose dans 57 pays soutenus — l'équité reste le défi central malgré 73 millions d'enfants immunisés","url":"https://allafrica.com/stories/202610090171.html","content":"Le rapport annuel 2025 de Gavi publié début octobre 2026 révèle que malgré des résultats globaux record — plus de 73 millions d'enfants immunisés dans 57 pays soutenus en 2025, pour un total de 351 millions sur 2021-2025 dépassant l'objectif de 300 millions — 9,5 millions d'enfants dans ces mêmes pays n'ont reçu aucun vaccin de routine, soit 4 % au-dessus de la baseline de 2019. Ces 9,5 millions d'enfants zéro-dose se concentrent dans les zones de conflits, les communautés les plus pauvres et les régions éloignées que les campagnes de routine ne parviennent pas à atteindre sans interventions communautaires spécifiques — dont 3 millions environ dans les cinq provinces de RDC affectées par l'épidémie Ebola Bundibugyo. L'Alliance du Vaccin calcule que ses programmes ont généré plus de 30 milliards USD de bénéfices économiques en 2025 et prévenu plus de 2,2 millions de décès futurs, tandis que les pays à revenus faibles ont contribué un record de 301 millions USD aux coûts cofinancés. Gavi alerte que l'objectif de réduire de 50 % le nombre d'enfants zéro-dose d'ici 2030 nécessitera 800 millions USD supplémentaires et une refonte des stratégies de vaccination hors poste fixe dans les contextes fragiles.","date":"2026-10-09"},{"title":"Pressions financières croissantes sur les gouvernements africains : Gavi transfère progressivement les coûts vaccinaux vers les États dans son cadre stratégique 2026-2030","url":"https://www.ecofinagency.com/news-services/0705-55351-africa-s-vaccine-gains-face-funding-pressure-as-governments-take-on-rising-immunization-costs","content":"L'Ecofin Agency analyse en octobre 2026 comment le cadre stratégique Gavi 2026-2030 prévoit un transfert progressif des coûts d'approvisionnement vaccinal des financements internationaux vers les budgets nationaux africains, mettant sous pression les ministères des finances dans les pays dont les ressources fiscales sont déjà contraintes par d'autres urgences comme l'épidémie Ebola Bundibugyo en RDC. Sous le nouveau mécanisme de cofinancement, les gouvernements africains éligibles devront contribuer en moyenne 12 à 18 % du coût des vaccins achetés avec l'appui de Gavi d'ici 2028, contre 5 à 8 % actuellement, avec des seuils progressifs fixés selon le niveau de revenu national brut. Les experts avertissent que certains pays à revenu intermédiaire-bas pourraient ne pas absorber ces hausses dans leurs programmations budgétaires 2027-2028 sans compromettre d'autres volets de la couverture sanitaire universelle, notamment les programmes de vaccination infantile contre les maladies courantes. Gavi examine des options de flexibilité exceptionnelle pour les pays en urgence sanitaire prolongée, notamment un délai de cofinancement de 24 mois pour les États membres directement affectés par l'épidémie Bundibugyo, et appelle les donateurs à maintenir des niveaux de financement élevés pour la transition Gavi 6.0.","date":"2026-10-14"},
{"title":"UNICEF élargit sa campagne d'urgence de vaccination contre la rougeole dans les cinq provinces Ebola de RDC : 1,4 million d'enfants ciblés, 18 millions USD mobilisés","url":"https://www.unicef.org/press-releases/unicef-expands-emergency-measles-vaccination-ebola-provinces-drc-october-2026","content":"L'UNICEF a annoncé le 9 octobre 2026 l'élargissement de sa campagne d'urgence de vaccination contre la rougeole aux cinq provinces de la RDC affectées par l'épidémie d'Ebola Bundibugyo — Ituri, Nord-Kivu, Sud-Kivu, Haut-Uélé et Tshopo — ciblant 1,4 million d'enfants dont les calendriers vaccinaux ont été sévèrement perturbés depuis le début de l'épidémie en mai 2026. Le budget de 18 millions USD est financé par un consortium d'urgence regroupant l'Union européenne (8 millions), l'Allemagne (5 millions) et le Royaume-Uni (5 millions), après que les coupes de financement USAID de 90 % ont laissé un vide critique dans les programmes de vaccination de routine. Le taux de couverture rougeole dans certaines zones de santé d'Ituri est tombé sous 55 % en 2026, créant des conditions propices à une épidémie concomitante qui fragiliserait davantage un système de santé sous tension extrême. L'UNICEF coordinate cette campagne en synergie avec Africa CDC et les agents de santé communautaires locaux, avec un objectif de 95 % de couverture dans les 42 jours de la campagne.","date":"2026-10-09"},
{"title":"Gavi Board : 35 millions USD supplémentaires débloqués pour accélérer le déploiement vaccinal et la réponse Ebola en Afrique centrale — décision d'urgence du 10 octobre 2026","url":"https://www.gavi.org/news/media-room/gavi-board-35-million-emergency-allocation-ebola-africa-central-october-2026","content":"Le Conseil d'administration de Gavi, l'Alliance du Vaccin, a approuvé le 10 octobre 2026 une allocation d'urgence de 35 millions USD pour accélérer le déploiement vaccinal et la réponse à l'épidémie d'Ebola Bundibugyo en Afrique centrale — une décision prise en session extraordinaire au regard de la détérioration de la situation, illustrée par la première exportation au Kenya et l'autorisation imminente de l'essai mRNA-1403. Ces fonds d'urgence financeront : 15 millions USD pour les campagnes de rattrapage vaccinal (rougeole, polio, DTP) dans les cinq provinces congolaises affectées ; 12 millions USD pour constituer un stock stratégique prépositionnel de vaccins MVA-BN contre le Mpox en Afrique centrale ; et 8 millions USD d'appui au mécanisme AVMA pour accélérer les certifications BPF des fabricants africains. La Directrice générale de Gavi, Sania Nishtar, a qualifié cette décision de réponse proportionnelle à une urgence sans précédent, en soulignant que la souveraineté vaccinale africaine reste la réponse structurelle de long terme. Ces 35 millions USD portent le total des décaissements Gavi liés à l'Ebola Bundibugyo à plus de 200 millions USD depuis le début de l'épidémie en mai 2026.","date":"2026-10-10"},
{"title":"UNICEF and Gavi launch call to vaccine manufacturers for accelerated access to Bundibugyo Ebolavirus vaccines","url":"https://www.unicef.org/press-releases/unicef-and-gavi-launch-call-manufacturers-support-accelerated-access-bundibugyo","content":"UNICEF and Gavi, the Vaccine Alliance, launched in June 2026 a formal call to vaccine manufacturers seeking information on plans to develop a vaccine against Bundibugyo Ebolavirus disease — the pathogen behind the unprecedented outbreak in eastern DRC that has since reached over 8,700 confirmed cases and 4,200 deaths. The call responds to the critical gap flagged by Africa CDC's Emergency Consultative Group: no vaccine is licensed against the Bundibugyo strain, and clinical data on the cross-reactive potential of the approved Ervebo vaccine (rVSV-ZEBOV) remain incomplete, with Africa CDC's ECG noting the possibility that Ervebo may not be efficacious against Bundibugyo. UNICEF and Gavi aim to leverage their combined procurement capacity and market-shaping expertise to incentivize pharmaceutical companies to prioritize Bundibugyo-specific vaccine R&D, building on the regulatory pathway analysis already launched by the African Medicines Agency. The initiative coordinates with WHO's emergency guidance on licensed Ebola vaccines and with ongoing trials, including the ring vaccination programme with Ervebo in DRC authorized in August 2026 and the broader vaccine trial whose start the WHO Director-General announced in October 2026.","date":"2026-06-15"},
{"title":"Gavi et UNICEF annoncent un accord de tarification équitable pour le vaccin antipaludique à 2,99 USD la dose — 7 millions d'enfants supplémentaires protégés d'ici 2030","url":"https://www.unicef.org/press-releases/gavi-and-unicef-announce-equitable-pricing-deal-malaria-vaccine-protect-7-million","content":"Gavi et l'UNICEF ont conclu un accord de tarification équitable portant le prix du vaccin antipaludique à 2,99 USD par dose, une réduction susceptible d'économiser jusqu'à 90 millions USD et de financer ainsi plus de 30 millions de doses supplémentaires — permettant de couvrir la vaccination complète de 7 millions d'enfants de plus d'ici 2030. Au moment de l'annonce, 25 pays africains avaient déjà introduit le vaccin antipaludique dans leurs programmes de vaccination de routine avec le soutien de Gavi, représentant plus de 39 millions de doses administrées dans les zones d'endémie. Gavi prévoit d'investir plus de 1,1 milliard USD dans les programmes de vaccination antipaludique sur son cycle stratégique 2026-2030, avec pour objectif de vacciner au moins 50 millions d'enfants, tandis que dix pays africains supplémentaires planifient l'introduction du vaccin avec soutien de Gavi d'ici 2030. L'Afrique concentre plus de 90 % des décès mondiaux liés au paludisme, et cet accord de prix représente un jalon décisif dans l'effort continental pour réduire la mortalité infantile due aux maladies évitables par la vaccination.","date":"2026-09-20"},
{"title":"Gavi 2026 : la vaccination soutenue par l'Alliance du Vaccin a généré plus de 30 milliards USD de bénéfices économiques en 2025 malgré des pressions budgétaires mondiales","url":"https://www.gavi.org/news/media-room/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding","content":"Gavi, l'Alliance du Vaccin, a communiqué en octobre 2026 que la vaccination qu'elle soutient a généré plus de 30 milliards USD de bénéfices économiques mesurables en 2025, grâce à la réduction des coûts de santé, aux gains de productivité et à la prévention des décès prématurés dans les pays à faible et moyen revenu. Ce résultat intervient dans un contexte préoccupant de pressions budgétaires mondiales : Gavi a alerté que des décisions de financement insuffisantes pour son cycle 2026-2030 pourraient se traduire par 600 000 vies non sauvées d'ici la fin de la décennie, rappelant la corrélation directe entre engagements des donateurs et résultats sanitaires. Depuis sa création en 2000, Gavi a contribué à vacciner plus d'un milliard d'enfants dans 78 pays à faible revenu et à prévenir plus de 18 millions de décès, avec l'UNICEF comme principal partenaire d'approvisionnement et de déploiement logistique. Gavi souligne également que, de 2026 à 2030, plus de 90 % de son budget de procurement sera décidé directement par les pays bénéficiaires dans une logique de souveraineté sanitaire nationale.","date":"2026-10-07"},
{"title":"SAGE octobre 2026 : l'OMS formule ses recommandations sur HPV, Mpox, poliomyélite, fièvre jaune et Ebola Bundibugyo après sa réunion du 5-8 octobre","url":"https://www.who.int/news-room/events/detail/2026/10/05/default-calendar/strategic-advisory-group-of-experts-on-immunization-october-2026","content":"Le Groupe consultatif stratégique d'experts de l'OMS sur la vaccination (SAGE) a tenu sa réunion d'octobre 2026 du 5 au 8 octobre à Genève, examinant pour la première fois depuis le début de l'épidémie d'Ebola Bundibugyo les données sur cinq antigènes vaccinaux prioritaires : HPV, Mpox, poliomyélite, fièvre jaune et Ebola Bundibugyo. Pour ce dernier, le SAGE s'est prononcé pour la première fois sur l'utilisation de vaccins candidats en contexte épidémique actif suite aux données préliminaires du vaccin mRNA-1403 de Moderna et aux données précliniques sur Ervebo — offrant un cadre pour la vaccination compassionnelle des soignants en première ligne. Les recommandations sur le Mpox confirment l'extension de l'utilisation du vaccin MVA-BN aux adolescents à risque en zones endémiques d'Afrique centrale. La conférence de presse des conclusions est programmée le 13 octobre 2026, et les résultats orienteront les stratégies d'achat de l'UNICEF et les programmes de Gavi pour la période 2027-2028.","date":"2026-10-08"},
{"title":"Semaine africaine de la vaccination 2026 : Gambie et 12 pays africains lancent des campagnes de rattrapage vaccinal en partenariat avec Gavi, UNICEF et l'OMS","url":"https://www.voicegambia.com/moh-partners-launch-africa-vaccination-week-2026/","content":"La Semaine africaine de la vaccination 2026 a été lancée officiellement en Gambie et dans 12 autres pays africains en partenariat avec Gavi, l'UNICEF et l'OMS, avec pour objectif d'atteindre les enfants zéro-dose et en retard sur le calendrier vaccinal dans les zones rurales et les populations les plus vulnérables. En Gambie, le ministre de la Santé a inauguré la semaine en soulignant que malgré des progrès notables, 1 enfant sur 10 en Afrique de l'Ouest reste sans protection vaccinale complète. Les campagnes mobilisent des équipes de vaccination mobile combinant vaccins de routine (DTCaP, rougeole-rubéole, méningocoque A) et rattrapage pour les enfants non vaccinés. Dans le contexte des coupes de financement USAID américain de 90 %, cet événement illustre le rôle croissant des gouvernements nationaux dans le pilotage de leurs programmes vaccinaux — évolution que Gavi encourage en transférant 90 % de son budget d'achat directement aux pays dans sa stratégie 2026-2030.","date":"2026-10-05"},
{"title":"Gavi 6.0 : 50 millions d'enfants ciblés avec le vaccin antipaludique, 120 millions de filles avec le vaccin HPV — 90 % des décisions d'achat transférées aux gouvernements africains","url":"https://www.gavi.org/news/media-room/protecting-more-children-gavi-vaccine-alliance-plans-next-5-year-period","content":"Gavi, l'Alliance du vaccin, a publié les grandes lignes de sa stratégie 2026-2030 (Gavi 6.0) qui marque un changement de paradigme majeur : 90 % du budget d'achat de Gavi sera directement transféré aux gouvernements des pays bénéficiaires, leur donnant pour la première fois une vue à 5 ans et le contrôle sur les vaccins à prioriser. Les objectifs quantitatifs incluent la vaccination de 50 millions d'enfants supplémentaires avec le vaccin antipaludique (R21/RTS,S) et de 120 millions de filles avec le vaccin HPV contre les cancers du col. HPV et paludisme seront pour la première fois financés en partie via les budgets nationaux de vaccination, marquant la transition vers la soutenabilité financière domestique. Gavi cherche à lever au moins 9 milliards USD pour cette période, dans un contexte de retrait américain qui rend d'autant plus cruciale la mobilisation des gouvernements africains et des donateurs européens et asiatiques pour atteindre l'objectif de vacciner 500 millions d'enfants supplémentaires et prévenir 8 à 9 millions de décès d'ici 2030.","date":"2026-10-01"},
{"title":"UNICEF et Gavi sécurisent 220 millions USD supplémentaires pour combler le déficit de couverture vaccinale en Afrique après le retrait américain","url":"https://www.unicef.org/press-releases/unicef-gavi-220-million-additional-funding-africa-immunization-gap-september-2026","content":"L'UNICEF et Gavi ont annoncé le 27 septembre 2026, en marge de l'Assemblée générale de l'ONU, la sécurisation de 220 millions USD supplémentaires pour maintenir les programmes d'immunisation de routine en Afrique subsaharienne, après les coupes de 90 % du financement USAID américain qui avaient mis en péril la couverture vaccinale de 54 millions d'enfants. Ces fonds, mobilisés auprès d'un consortium de six donateurs — Allemagne, Royaume-Uni, Japon, Canada, Pays-Bas et Commission européenne — permettront de maintenir les calendriers vaccinaux dans 22 pays africains jusqu'à fin 2027. La directrice exécutive de l'UNICEF, Catherine Russell, a déclaré que ce financement «sauvera environ 450 000 vies d'enfants africains» en maintenant la couverture rougeole, poliomyélite et maladies diarrhéiques. Cet accord comble environ 27 % du déficit de 800 millions USD identifié par Gavi pour 2026-2027, et s'ajoute à la promesse de 1,6 milliard USD de la Fondation Gates. Gavi et l'UNICEF restent en dialogue avec 12 donateurs potentiels pour combler intégralement le déficit avant la conférence de reconstitution du Fonds Gavi en 2027.","date":"2026-09-27"},
{"title":"Déploiement du vaccin antipaludique R21 dans 4 nouveaux pays africains : le seuil de 10 millions de doses délivrées en 2026 est franchi — un record mondial","url":"https://www.gavi.org/news/media-room/malaria-vaccine-r21-four-new-countries-10-million-doses-record-september-2026","content":"Gavi a annoncé le 24 septembre 2026 l'introduction du vaccin antipaludique R21 dans quatre nouveaux pays africains — Sierra Leone, République centrafricaine, Cameroun et Côte d'Ivoire — portant à 25 le nombre total de pays ayant intégré un vaccin antipaludique dans leur programme national. Ces introductions franchissent le seuil de 10 millions de doses de vaccin antipaludique délivrées en 2026, un record mondial pour ce type de vaccin. Le R21, développé par l'Institut Jenner d'Oxford et le Serum Institute of India, affiche une efficacité de 75 à 80 % en conditions réelles d'Afrique de l'Ouest — supérieure aux 55-70 % du RTS,S/AS01E — et un coût inférieur le rendant plus accessible pour les programmes Gavi. L'introduction dans les quatre nouveaux pays a été accélérée par l'accord de tarification préférentielle négocié par l'UNICEF en juillet 2026. La malaria tue environ 600 000 personnes par an, dont 95 % en Afrique subsaharienne, avec les enfants de moins de 5 ans représentant 80 % des décès.","date":"2026-09-24"},
{"title":"Gavi confirme 3 nouveaux fabricants africains éligibles à l'AVMA d'ici fin 2026 : Atlantic Lifesciences, Kanombe Pharma et Biovac Phase 2 — plus de 110 millions USD décaissés en 2026","url":"https://www.gavi.org/news/media-room/avma-three-new-manufacturers-eligible-disbursements-2026","content":"Gavi a annoncé le 22 septembre 2026 que trois fabricants africains supplémentaires — Atlantic Lifesciences (Ghana), Kanombe Pharma (Rwanda) et Biovac Institute Phase 2 (Afrique du Sud) — ont atteint les jalons contractuels leur donnant droit à des décaissements de l'AVMA d'ici fin 2026. Ces décaissements, d'un montant combiné estimé entre 65 et 80 millions USD, s'ajoutent aux 47 millions USD versés à Biovac et à l'Institut Pasteur de Dakar en août 2026 — portant à plus de 110 millions USD le total des décaissements AVMA en 2026. Le mécanisme AVMA, doté de 1,2 milliard USD sur dix ans, rémunère les fabricants africains via des paiements liés aux volumes de doses vendues aux pays à faible et moyen revenu via Gavi et l'UNICEF. Gavi estime qu'à l'horizon 2030, les fabricants soutenus par l'AVMA pourraient couvrir jusqu'à 20 % des besoins vaccinaux africains, contribuant directement à l'objectif continental de 60 % de production locale d'ici 2040.","date":"2026-09-22"},
{"title":"Vaccin antipaludique dans 25 pays africains en 2026 : Guinea-Bissau rejoint le programme malgré un manque de financement de 30 %","url":"https://www.gavi.org/our-work/vaccine-portfolio/malaria","content":"Au 28 janvier 2026, 25 pays africains ont introduit le vaccin antipaludique dans leurs programmes nationaux de vaccination avec le soutien de Gavi, portant le total à plus de 39 millions de doses délivrées dans les pays endémiques du continent. Guinea-Bissau est devenu en 2026 le 25e pays à introduire le vaccin, rejoignant les sept États (Burundi, Ouganda, Mali, Guinée, Togo, Éthiopie, Zambie) qui avaient démarré en 2025, après les 14 pays de 2024. Gavi et l'UNICEF ont annoncé un accord de tarification équitable permettant à 7 millions d'enfants supplémentaires d'accéder au vaccin antipaludique — RTS,S/AS01E ou R21, tous deux recommandés par l'OMS — d'ici la fin de la décennie. Le programme fait cependant face à un déficit de financement d'environ 30 % de son budget prévisionnel pour 2026-2030, en partie dû aux coupes de 90 % du financement USAID américain, contraignant Gavi à revoir à la baisse certains objectifs de déploiement. La malaria vaccine est devenue l'une des interventions de vaccination à la plus rapide expansion en Afrique, mais le contexte financier contraint de 2026 exige des contributions urgentes des donateurs européens et des gouvernements africains pour en pérenniser l'accès.","date":"2026-09-01"},
{"title":"Africa's routine vaccine systems deliver gains against cancer and malaria but an 800 million USD funding gap threatens to reverse progress — Gavi 2026","url":"https://www.gavi.org/news/media-room/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding","content":"Gavi's 2026 assessment of Africa's routine immunization systems finds meaningful gains in HPV cancer prevention — expanded to 11 new African countries since 2023 — and malaria vaccine coverage, with 25 countries enrolled by January 2026, even as a funding gap of over $800 million USD threatens to reverse these gains through 2027. The shortfall is largely driven by the 90% reduction in US USAID immunization contributions and the US withdrawal from WHO, creating acute pressure on programmes covering an estimated 54 million children across the continent. Routine immunization systems in DRC's five Ebola-affected provinces suffered severe disruption in 2026, driving measles coverage below 60% in some health zones and prompting an $18 million UNICEF emergency campaign targeting 1.4 million children. Partners including Gavi, UNICEF and the African Development Bank are urgently mobilised to bridge the $800 million gap, with the Gates Foundation's $1.6 billion pledge to Gavi in September 2026 representing the largest single private contribution to address the US funding withdrawal. This assessment underscores the fragility of Africa's immunization gains and the structural risk of programmes that rely heavily on a single donor — a lesson that is reshaping global health financing architecture.","date":"2026-09-15"},
{"title":"Lancement du 1er stock mondial de vaccins anti-Mpox : le mécanisme ICG étendu à une 5e maladie sous pilotage Gavi-UNICEF-OMS","url":"https://www.who.int/news/item/02-09-2026-global-initiative-launched-to-improve-access-to-mpox-vaccines","content":"L'OMS, Gavi et l'UNICEF ont lancé le 2 septembre 2026 un stock mondial de vaccins contre le Mpox, intégré au mécanisme du Groupe de coordination internationale (ICG) sur la provision vaccinale — qui gérait déjà les stocks d'urgence de fièvre jaune, méningite, Ebola et choléra. C'est la 5e maladie couverte par le système ICG, désormais doté d'une réserve permanente de vaccins MVA-BN (Imvanex/Jynneos) mobilisables en 24 heures pour répondre à de nouvelles flambées dans les pays à revenu faible et intermédiaire. L'initiative s'appuie sur le Mécanisme d'accès déployé lors de l'urgence de santé publique internationale de Mpox en 2024. Gavi finance les stocks, l'UNICEF assure la logistique d'approvisionnement et l'OMS coordonne l'allocation selon les principes d'équité et d'impact épidémique. En Afrique centrale et de l'Ouest, où les épidémies de Mpox persistent depuis 2022, l'accès limité et le coût élevé des vaccins MVA-BN avaient laissé les pays les plus touchés sans couverture préventive adéquate — une lacune que ce nouveau mécanisme est conçu pour combler durablement.","date":"2026-09-02"},
{"title":"Gates Foundation pledges USD 1.6 billion to bolster Gavi as US funding gap threatens vaccinations for 54 million children","url":"https://www.cidrap.umn.edu/childhood-vaccines/gates-foundation-pledges-16-billion-bolster-gavis-childhood-vaccine-efforts","content":"The Bill & Melinda Gates Foundation pledged USD 1.6 billion to Gavi, the Vaccine Alliance, to support its core immunization programmes amid the severe funding pressure created by the 90% reduction in US USAID vaccine contributions and the US withdrawal from WHO. The pledge, announced in September 2026, represents one of the largest single private commitments to global immunization in Gavi's 26-year history and is intended to maintain coverage for the estimated 54 million children whose vaccination programmes were directly at risk from US funding cuts. Gavi's 6.0 strategy targets vaccinating 500 million additional children and preventing 8-9 million deaths by 2030, goals increasingly dependent on non-US donors as US disengagement from multilateral health institutions deepens. In Africa, Gavi has urgently mobilised emergency resources to sustain measles, polio and rotavirus programmes disrupted by the Bundibugyo Ebola outbreak in the five DRC provinces, while simultaneously advancing the African Vaccine Manufacturing Accelerator (AVMA) — whose first cash disbursements of USD 47 million to Biovac and Institut Pasteur de Dakar were made in August 2026. The Gates Foundation's contribution underscores the critical role of private philanthropy in bridging the financing gap left by shifts in major donor governments.","date":"2026-09-12"},
{"title":"OMS préqualifie un flacon multi-doses de vaccin anti-VRS : une avancée pour les programmes nationaux de vaccination pédiatrique dans les pays à faible revenu","url":"https://www.who.int/news-room/immunization","content":"L'Organisation mondiale de la Santé a préqualifié le 9 septembre 2026 un flacon multi-doses d'un vaccin contre le virus respiratoire syncytial (VRS), principale cause de bronchiolite sévère et de pneumonie chez les nourrissons, ouvrant la voie à son intégration dans les programmes nationaux soutenus par Gavi et à l'achat groupé via l'UNICEF. Le VRS est responsable de plus de 100 000 décès d'enfants de moins de 5 ans par an dans le monde, dont la grande majorité en Afrique subsaharienne et en Asie du Sud où les systèmes de santé sont les plus vulnérables. La préqualification OMS est le prérequis indispensable pour que les pays soutenus par Gavi puissent commander ce vaccin via les mécanismes d'achat groupé et bénéficier des prix négociés par l'UNICEF. Le conditionnement multi-doses réduit significativement les coûts logistiques et de chaîne du froid par dose — facteur crucial pour les systèmes de santé africains. Cette avancée intervient dans un contexte d'élargissement progressif des calendriers vaccinaux africains avec de nouveaux antigènes, après les progrès enregistrés pour les vaccins antipaludiques (39 millions de doses dans 25 pays en 2026) et anti-HPV.","date":"2026-09-09"},
{"title":"UNICEF lance une campagne d'urgence de vaccination antirougeoleuse en RDC : 1,4 million d'enfants ciblés dans cinq provinces affectées par Ebola","url":"https://www.unicef.org/press-releases/unicef-emergency-measles-vaccination-campaign-drc-ebola-provinces-august-2026","content":"L'UNICEF a annoncé le 25 août 2026 le lancement d'une campagne d'urgence de vaccination contre la rougeole ciblant 1,4 million d'enfants de 6 mois à 14 ans dans les cinq provinces de la RDC touchées par l'épidémie d'Ebola Bundibugyo — Ituri, Nord-Kivu, Sud-Kivu, Haut-Uélé et Tshopo. La perturbation des services de vaccination de routine due à la crise Ebola a fait chuter la couverture vaccinale antirougeoleuse à moins de 60 % dans certaines zones de santé en juillet 2026, créant les conditions d'une épidémie de rougeole imbriquée. L'opération, financée à hauteur de 18 millions USD par Gavi, l'Union européenne et le CERF (Fonds central d'intervention d'urgence de l'ONU), mobilise 2 800 équipes de vaccination avec des stratégies adaptées au contexte sécuritaire — équipes mobiles pour les zones inaccessibles, vaccination domiciliaire dans les communautés les plus méfiantes. L'UNICEF souligne que maintenir la vaccination de routine dans les zones d'urgence est aussi crucial que la riposte directe à Ebola, car les enfants malnutris non vaccinés présentent des risques cumulés de mortalité bien supérieurs. Cette campagne s'inscrit dans le plan de réponse Ebola évalué à 518 millions USD co-financé par Africa CDC, l'OMS et leurs partenaires internationaux.","date":"2026-08-25"},
{"title":"Gavi mobilise 340 millions USD pour la R&D vaccinale contre les pathogènes à potentiel épidémique en Afrique : Ebola Bundibugyo, Lassa et Marburg en tête des priorités","url":"https://www.gavi.org/news/media-room/gavi-340-million-epidemic-preparedness-vaccine-rd-africa-august-2026","content":"Gavi, l'Alliance du vaccin, a annoncé le 19 août 2026 la mobilisation de 340 millions USD supplémentaires — apportés par l'Allemagne, le Royaume-Uni, la Norvège et la Fondation Bill & Melinda Gates — pour accélérer la recherche, le développement et le pré-achat de vaccins contre les cinq pathogènes présentant le plus grand risque épidémique pour l'Afrique : Ebola Bundibugyo, Ebola Zaïre, fièvre de Lassa, fièvre de Marburg et Mpox. Ce financement vise à corriger un déséquilibre structurel : les vaccins contre les pathogènes prioritaires africains reçoivent historiquement moins de 3 % du financement mondial de R&D vaccinale malgré leur impact disproportionné sur la mortalité continentale. Une partie des fonds sera allouée via la CEPI pour soutenir les essais en cours de Moderna (mRNA-1403) et un candidat vaccin développé par l'Institut Jenner d'Oxford avec deux laboratoires africains partenaires. L'UNICEF assurera la chaîne d'achat et d'approvisionnement dès l'obtention des autorisations réglementaires OMS, garantissant un accès prioritaire aux pays africains les plus exposés. Gavi a également confirmé l'extension du mécanisme d'engagement anticipé de marché (AMC) aux vaccins contre les filovirus pour la première fois dans l'histoire de l'Alliance.","date":"2026-08-19"},
{"title":"Gavi Board reaffirms ambition to vaccinate 500 million additional children, secures 500 million euro EIB lifeline despite global funding pressures","url":"https://www.gavi.org/news/media-room/gavi-board-meeting-underlines-commitment-country-sovereignty-fragility-health-security","content":"At its July 2, 2026 Board meeting, Gavi, the Vaccine Alliance, reaffirmed its Gavi 6.0 strategy targets: reaching 500 million additional children with immunization, preventing 8-9 million deaths, and supporting a further 10% reduction in under-five mortality through 2030, unlocking over USD 100 billion in economic benefits. Despite a financially constrained environment worsened by US USAID cuts and the US withdrawal from WHO, the Board approved extension of the European Investment Bank (EIB) Frontloading Facility through end-2026, allowing Gavi to draw up to 500 million euros against future donor pledges to ensure continuity of core immunization programmes. The Board placed renewed emphasis on country sovereignty, support for fragile and humanitarian settings, and strengthening Africa's vaccine manufacturing capacity — recognizing that the Bundibugyo Ebola outbreak exposed the critical vulnerability of a continent producing less than 1% of the vaccines it consumes. This meeting positioned Gavi as a stabilizing force in global health financing at a moment of unprecedented disruption in international development assistance.","date":"2026-07-02"},
{"title":"OMS-UNICEF août 2026 : la couverture vaccinale mondiale progresse mais 14,5 millions d'enfants restent non vaccinés face aux perturbations d'Ebola et aux coupes de financement américaines","url":"https://www.who.int/news/item/14-08-2026-global-childhood-immunization-coverage-inches-forward-despite-conflict-and-hesitancy","content":"Un rapport conjoint OMS-UNICEF publié le 14 août 2026 confirme que la couverture vaccinale mondiale a continué de progresser en 2025, avec 90 % des nourrissons ayant reçu au moins une dose du vaccin DTCa. Toutefois, 14,5 millions d'enfants restent entièrement non vaccinés dans le monde, avec les concentrations les plus élevées dans les États fragiles et touchés par les conflits en Afrique subsaharienne et en Asie du Sud. L'épidémie d'Ebola Bundibugyo en RDC a gravement perturbé les services de santé de routine dans les provinces affectées, inversant des années de gains pour les vaccins contre la rougeole, la poliomyélite et les maladies infantiles. Les coupes de 90 % du financement USAID américain à la vaccination et le retrait des États-Unis de l'OMS ont créé une pression financière aiguë sur les programmes couvrant environ 54 millions d'enfants. Le rapport appelle à un renouvellement urgent des investissements pour atteindre les enfants zéro-dose et renforcer les réseaux d'agents de santé communautaires dans les pays les plus vulnérables.","date":"2026-08-14"},
{"title":"Gavi and UNICEF announce equitable pricing deal for malaria vaccine to protect 7 million more children by end of decade","url":"https://www.unicef.org/press-releases/gavi-and-unicef-announce-equitable-pricing-deal-malaria-vaccine-protect-7-million","content":"Gavi, the Vaccine Alliance, and UNICEF announced a landmark equitable pricing agreement for malaria vaccines enabling access for an additional 7 million children in endemic African countries by the end of the decade. As of January 2026, over 39 million doses had been delivered to 25 endemic countries with Gavi support, including Guinea-Bissau's inaugural introduction in 2026. The malaria vaccine has become one of the fastest-scaling interventions in Africa's immunization history: 14 countries introduced it for the first time in 2024 and 7 more — Burundi, Uganda, Mali, Guinea, Togo, Ethiopia and Zambia — followed in 2025. The pricing deal unlocks access for lower-income countries where cost had remained a barrier, and complements WHO's continued endorsement of both RTS,S/AS01E and R21 vaccines as essential tools for reducing under-5 malaria mortality in high-burden African countries.","date":"2026-07-15"},
{"title":"UNICEF and Gavi issue Request for Expression of Interest for Bundibugyo Ebolavirus vaccines amid deadly outbreak in DRC and Uganda","url":"https://www.gavi.org/news-resources/media-room/news-releases","content":"In June 2026, UNICEF and Gavi jointly issued a Request for Expression of Interest (REoI) to accelerate access to vaccines and therapeutics targeting the Bundibugyo Ebolavirus strain, as the ongoing outbreak in DRC and Uganda had caused hundreds of confirmed deaths with no approved countermeasures available. The REoI invites vaccine developers to present data on candidate vaccines or experimental therapeutics in advanced development, with the goal of identifying products eligible for Emergency Use Listing or compassionate-use protocols. This initiative mirrors the COVAX model deployed during COVID-19, applying an access-before-approval approach to Africa's most lethal ongoing outbreak. The move also reflects a broader structural shift: as US USAID funding faces 90% cuts, multilateral health organisations are moving faster and more autonomously to fill critical gaps in outbreak response financing and procurement, underscoring the urgent need to build permanent African-led funding mechanisms.","date":"2026-06-20"},
{"title":"Africa's routine vaccine systems deliver gains against cancer and malaria but face 800 million USD funding gap — WHO AFRO 2026 assessment","url":"https://www.afro.who.int/news/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding-pressures","content":"A 2026 WHO Regional Office for Africa (WHO AFRO) assessment found that routine immunization systems across Africa are registering meaningful gains in HPV vaccination for cancer prevention and malaria vaccine rollout, even as a financing gap of over 800 million USD threatens to reverse these gains through 2027. HPV vaccination has expanded to 11 new African countries since 2023 through Gavi support, while malaria vaccine coverage has grown rapidly in East and West Africa. However, the 90% cut in US USAID immunization funding and the US withdrawal from WHO have created acute pressure on programmes covering 54 million children. Partners including Gavi, UNICEF and the African Development Bank are being urgently called upon to bridge this gap. Joint UNICEF-WHO WUENIC 2025 data published in July 2026 confirm that 90% of infants globally received at least one DTP dose in 2025, but 14.5 million children remain completely unvaccinated worldwide.","date":"2026-07-20"},
{"title":"Face à Ebola Bundibugyo, UNICEF et Gavi au cœur de la stratégie de préparation épidémique en Afrique","url":"https://www.facebook.com/africacdc/posts/-postponement-notice-weekly-press-briefingthis-weeks-briefing-has-been-postponed/1428976145927422","content":"Alors que l'Africa CDC reorganise sa réponse à l'épidémie d'Ebola Bundibugyo sous l'impulsion de la mission du Président Cyril Ramaphosa, Champion de l'Union africaine pour la prévention, la préparation et la réponse aux pandémies (PPPR), en RDC, des partenaires clés comme l'UNICEF et Gavi intensifient leur soutien opérationnel sur le terrain. Ces organisations contribuent au renforcement des systèmes de santé communautaires, à la chaîne du froid pour les produits médicaux disponibles, à l'éducation sanitaire des populations et à la coordination logistique des interventions d'urgence. La solidarité internationale, rappelée lors du briefing de l'Africa CDC, demeure essentielle face à une épidémie qui ne dispose pas encore de vaccin approuvé.","date":"2026-07-10"},
{"title":"Gavi et UNICEF mobilisés pour soutenir la riposte à l'épidémie d'Ebola en Afrique centrale","url":"https://www.facebook.com/africacdc/videos/special-briefing-on-ebola-outbreak-response-july-9-2026/1574351157729456","content":"Dans le cadre de la réponse à l'épidémie de maladie à virus Bundibugyo en RDC et en Ouganda, les partenaires internationaux dont Gavi, l'Alliance pour les vaccins, et l'UNICEF sont étroitement associés aux efforts de coordination continentale. Ces organisations apportent leur expertise logistique, leur soutien financier et leurs capacités de déploiement rapide pour appuyer les gouvernements affectés. Le briefing spécial de l'Africa CDC du 9 juillet 2026 a réaffirmé l'importance de la solidarité internationale et des partenariats solides dans la lutte contre les épidémies, soulignant que la coordination entre l'Union africaine, l'OMS, Gavi et l'UNICEF constitue la pierre angulaire d'une riposte efficace et équitable pour les communautés à risque.","date":"2026-07-10"},
{"title":"Gavi et UNICEF mobilisés face à la crise vaccinale en Afrique : l'épidémie Ebola révèle les lacunes du système","url":"https://www.infectioncontroltoday.com/view/2026-ebola-outbreak-spreads-central-africa-who-warns-growing-crisis-amid-cdc-usaid-cuts","content":"Alors que l'épidémie d'Ebola Bundibugyo continue de se propager en RDC et en Ouganda avec plus de 513 cas et 130 décès suspects, les organisations internationales dont Gavi et l'UNICEF font face à une pression croissante pour combler le vide laissé par les coupes budgétaires américaines. La réduction de 90 % du financement de l'USAID et le retrait des États-Unis de l'OMS ont sévèrement compromis les efforts de réponse. Dans ce contexte, les partenaires onusiens sont appelés à redoubler d'efforts pour maintenir les programmes de vaccination et de préparation aux épidémies sur le continent africain, en particulier dans les zones de conflit et les corridors commerciaux à haut risque.","date":"2026-07-09"},
