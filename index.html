var articlesData={
"african-cdc":[
{"title":"Ebola Bundibugyo : Africa CDC recense 8 822 cas et 4 247 décès au 10 octobre 2026 — premier ralentissement en Ituri depuis six semaines","url":"https://africacdc.org/news-item/ebola-bundibugyo-situation-report-10-october-2026/","content":"Le rapport de situation du 10 octobre 2026 d'Africa CDC recense 8 822 cas confirmés et 4 247 décès d'Ebola Bundibugyo en République démocratique du Congo, représentant une augmentation de 94 cas et 42 décès en 72 heures — un rythme légèrement inférieur à la semaine précédente. Pour la première fois depuis le début de l'épidémie, le taux d'incidence hebdomadaire dans la province d'Ituri (épicentre historique) enregistre une baisse de 12 %, attribuée à l'intensification de la vaccination Ervebo en anneau et à l'amélioration du suivi des contacts dans les zones de Bunia et Mahagi. Le taux de suivi des contacts progresse à 83,2 % au niveau national — toujours en deçà de la cible de 95 % —, tandis que le Nord-Kivu reste préoccupant à 71,8 % et continue d'enregistrer une progression des nouveaux foyers. Africa CDC coordonne la visite du Dr Jean Kaseya au Kenya pour évaluer la gestion du premier cas importé, et annonce le déploiement d'une équipe d'appui renforcée dans les zones sanitaires les plus touchées. L'épidémie touche 68 zones de santé dans six provinces, et le maintien du niveau d'alerte maximale reste justifié malgré ce premier signe de ralentissement.","date":"2026-10-10"},
{"title":"Africa CDC organise un dialogue entre ministres africains et candidats au poste de DG de l'OMS le 23 novembre 2026 à Addis-Abeba, en amont de la CPHIA","url":"https://africacdc.org/news-item/africa-cdc-ministerial-dialogue-who-dg-candidates-cphia-november-2026/","content":"Africa CDC a annoncé le 7 octobre 2026 l'organisation d'un dialogue de haut niveau entre les ministres africains de la Santé et les candidats au poste de Directeur général de l'OMS, prévu le 23 novembre 2026 à Addis-Abeba en ouverture de la CPHIA 2026. Cette initiative inédite dans l'histoire de la gouvernance sanitaire mondiale permettra aux représentants des 55 États membres de l'Union africaine d'interroger directement les candidats sur leurs engagements envers l'Afrique en matière de financement des urgences, de réforme de l'architecture mondiale de la santé et de transfert de technologie vaccinale. L'Afrique, qui représente 17 % de la population mondiale mais supporte plus de 23 % de la charge mondiale des maladies, ambitionne d'exercer une influence déterminante sur l'élection du futur DG lors de l'Assemblée mondiale de la santé de mai 2027. Le Dr Jean Kaseya a déclaré que ce dialogue illustre la montée en puissance du leadership sanitaire africain, après l'épidémie Ebola Bundibugyo qui a révélé les limites de l'architecture internationale actuelle avec 2,9 milliards USD mobilisés mais une épidémie encore non maîtrisée. Africa CDC invite les 55 États membres à mandater leurs ministres de la Santé pour préparer des questions précises aux candidats, en particulier sur les mécanismes de financement prévisible et le Traité pandémique.","date":"2026-10-09"},
{"title":"Africa CDC : bilan de l'appui technique AHSS dans 18 pays — 42 centres PHEOC opérationnels, 87 millions USD investis depuis 2025","url":"https://africacdc.org/news-item/ahss-technical-support-18-countries-42-pheoc-october-2026/","content":"Africa CDC a publié le 9 octobre 2026 un bilan de son Programme d'appui à la stratégie de Sécurité et Souveraineté Sanitaire Africaine (AHSS), révélant que 42 centres opérationnels d'urgence de santé publique (PHEOC) ont été établis ou renforcés dans 18 pays africains depuis 2025, pour un investissement total de 87 millions USD co-financés par les États membres, l'Union européenne et la Banque mondiale. Ces PHEOC ont démontré leur valeur opérationnelle lors de l'épidémie d'Ebola Bundibugyo en permettant aux pays voisins de la RDC de maintenir des capacités d'alerte et d'investigation actives dans les 48 heures suivant la notification des premiers cas transfrontaliers potentiels, contribuant directement à l'endiguement du cas importé au Kenya. Africa CDC a documenté que chaque PHEOC opérationnel réduit de 3,2 jours en moyenne les délais de détection et de notification des alertes épidémiques, une performance décisive dans une crise où chaque heure compte pour le confinement des chaînes de transmission. L'agence prévoit d'étendre ce réseau à 30 pays supplémentaires d'ici 2028, faisant des PHEOC le pilier opérationnel de la préparation continentale aux pandémies dans la feuille de route AHSS 2025-2030.","date":"2026-10-09"},
{"title":"Africa CDC exprime sa solidarité avec le Kenya après le premier cas importé d'Ebola Bundibugyo et appelle à une préparation régionale renforcée","url":"https://africacdc.org/news-item/africa-cdc-expresses-solidarity-with-kenya-and-calls-for-stronger-regional-ebola-preparedness/","content":"Africa CDC a publié le 7 octobre 2026 une déclaration de solidarité avec le Kenya après la confirmation du premier cas importé de maladie à virus Ebola Bundibugyo dans ce pays, suivi du décès du patient. Le patient kényan avait voyagé depuis la RDC via l'Ouganda, illustrant le risque de propagation régionale d'une épidémie qui recense désormais 8 728 cas confirmés et 4 205 décès en RDC. Vingt-huit contacts, dont des membres de la famille et des soignants kényans, ont été identifiés et placés en quarantaine par les autorités sanitaires de Nairobi. Le Dr Jean Kaseya, Directeur général d'Africa CDC, s'est engagé à se rendre personnellement au Kenya pour évaluer les besoins de la réponse et coordonner le déploiement d'équipes d'appui d'Africa CDC. Africa CDC appelle les 55 États membres à activer les protocoles de surveillance pour les voyageurs en provenance des zones affectées de RDC et à renforcer les contrôles aux points d'entrée conformément aux Règlements sanitaires internationaux.","date":"2026-10-07"},
{"title":"Ebola Bundibugyo en RDC : 8 728 cas et 4 205 décès au 6 octobre 2026 — les Pays-Bas évacuent médicalement un soignant depuis Kinshasa","url":"https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON619","content":"Le bilan de l'épidémie d'Ebola Bundibugyo en République démocratique du Congo atteint 8 728 cas confirmés et 4 205 décès au 6 octobre 2026, selon les données consolidées de l'ECDC — faisant de cette flambée la deuxième plus grande épidémie d'Ebola de l'histoire et la plus meurtrière jamais enregistrée pour la souche Bundibugyo. Le 1er octobre 2026, les Pays-Bas ont notifié à l'OMS l'évacuation médicale d'un travailleur humanitaire testé positif par PCR pour le virus Bundibugyo alors qu'il participait à la réponse sur le terrain en RDC — troisième évacuation médicale internationale après les États-Unis (juillet 2026) et l'Allemagne. L'OMS a publié une notification de maladie à potentiel international le 8 octobre 2026, confirmant que les mesures de contrôle et de quarantaine des contacts sont en place aux Pays-Bas. La province d'Ituri reste l'épicentre avec 6 513 cas et 3 007 décès, tandis que le Nord-Kivu continue d'enregistrer une accélération de la transmission, avec 68 zones de santé et six provinces désormais touchées. Ces évacuations médicales répétées soulignent le risque systémique d'exportation depuis les zones actives et la nécessité urgente d'améliorer la protection des soignants internationaux déployés dans la réponse.","date":"2026-10-08"},
{"title":"Africa CDC publie une étude sur le fardeau croissant des maladies non transmissibles en Afrique et renforce les capacités de gestion des urgences au Ghana","url":"https://africacdc.org/","content":"Africa CDC a publié le 5 octobre 2026 une nouvelle étude sur le fardeau croissant des maladies non transmissibles (MNT) en Afrique, révélant que les MNT — maladies cardiovasculaires, diabète, cancers et affections respiratoires chroniques — représentent plus de 30 % des décès prématurés sur le continent, avec une progression accélérée dans les zones urbaines. Cette charge croissante des MNT survient dans un contexte où les systèmes de santé africains sont déjà mobilisés par la réponse à l'épidémie d'Ebola Bundibugyo, mettant en évidence la nécessité d'investissements simultanés dans la prévention primaire. Par ailleurs, Africa CDC a annoncé le 2 octobre 2026 son soutien au gouvernement du Ghana pour renforcer ses Centres opérationnels de gestion des urgences de santé publique (PHEOC), dans le cadre de sa stratégie continentale de préparation et de réponse rapide aux urgences sanitaires. L'étude appelle à l'intégration de la prévention des MNT dans les plans nationaux de santé et recommande une augmentation d'au moins 15 % des financements consacrés à la prévention primaire dans les budgets nationaux de santé.","date":"2026-10-05"},
{"title":"Africa CDC soutient la RDC dans le renforcement de la transparence du financement de la riposte Ebola : 2,9 milliards USD d'engagements confirmés","url":"https://africacdc.org/news-item/africa-cdc-supports-the-government-of-the-democratic-republic-of-the-congo-in-strengthening-transparency-and-accountability-in-ebola-response-funding/","content":"Africa CDC a publié le 4 octobre 2026 une déclaration de soutien à la position du gouvernement de la RDC visant à renforcer la transparence, la traçabilité et la redevabilité dans la gestion des ressources mobilisées pour la riposte à l'épidémie d'Ebola Bundibugyo. Africa CDC a remercié l'ensemble des donateurs dont les engagements annoncés ont porté le total à 2,9 milliards USD — notamment grâce à l'action diplomatique entreprise lors de la réunion ministérielle G20+ convoquée par les États-Unis le 23 septembre 2026 à New York. L'institution a souligné que la transparence dans l'utilisation des fonds est une condition sine qua non de la confiance des donateurs et des communautés affectées, et qu'elle conditionne l'efficacité de la réponse globale. Africa CDC a rappelé que le bilan au 30 septembre 2026 s'élève à 8 224 cas confirmés et 3 982 décès — une épidémie sans précédent qui nécessite une gestion financière exemplaire pour maintenir la mobilisation internationale jusqu'à l'endiguement complet.","date":"2026-10-04"},
{"title":"L'Afrique manque d'infrastructures pour piloter sa propre IA en santé, avertit la directrice du numérique d'Africa CDC","url":"https://www.newtimes.co.rw/article/39420/news/health/africa-cdc-official-continent-lacks-infrastructure-to-run-its-own-health-ai/amp","content":"Judith Nguimfack, directrice de la Division Santé numérique d'Africa CDC, a alerté début octobre 2026 lors de l'Africa HealthTech Summit à Kigali que le continent africain n'a pas encore les infrastructures nécessaires pour déployer et piloter ses propres systèmes d'intelligence artificielle en santé. L'adoption du numérique progresse dans les systèmes de santé africains, mais des lacunes critiques persistent en matière de connectivité, de centres de données, de gouvernance des données de santé et d'interopérabilité des systèmes d'information hospitaliers. Nguimfack a souligné que l'utilisation de l'IA dans les diagnostics, la surveillance épidémiologique et la gestion des chaînes d'approvisionnement requiert des investissements massifs et une gouvernance adaptée au contexte africain, pour éviter que les solutions importées ne reproduisent les dépendances technologiques qui caractérisent la situation pharmaceutique du continent. Africa CDC appelle à un investissement prioritaire dans les infrastructures numériques de santé comme fondation indispensable à la souveraineté sanitaire numérique africaine, en parallèle des investissements dans la fabrication vaccinale locale.","date":"2026-10-02"},
{"title":"Africa CDC adopte un nouveau Plan quinquennal pour la biosécurité et la biosûreté : renforcement des laboratoires P3 et gouvernance des agents pathogènes prioritaires","url":"https://africacdc.org/news-item/africas-new-five-year-plan-for-biosafety-and-biosecurity/","content":"Africa CDC a publié le nouveau Plan africain quinquennal pour la biosécurité et la biosûreté, document stratégique structurant définissant les investissements nécessaires au renforcement de la gestion sécurisée des agents pathogènes dangereux dans les 55 États membres de l'Union africaine. Ce plan a été élaboré en réponse directe aux leçons de l'épidémie d'Ebola Bundibugyo, au cours de laquelle des lacunes dans les capacités de laboratoire ont ralenti la détection précoce et la caractérisation génomique du virus dans plusieurs provinces de la RDC. Les priorités incluent la construction et la mise aux normes de laboratoires de confinement de niveau 3 (P3) dans 15 pays prioritaires, la formation de 500 professionnels de biosécurité, et l'établissement d'un cadre continental de gouvernance pour la manipulation et le partage sécurisé des agents pathogènes à potentiel épidémique. Le plan s'inscrit dans la stratégie de l'Agenda de Sécurité et de Souveraineté Sanitaire Africaine (AHSS) et vise à réduire à moins de 48 heures les délais de détection et de caractérisation des nouvelles menaces biologiques — condition essentielle à une réponse continentale plus rapide que lors de la crise Bundibugyo.","date":"2026-10-01"},
{"title":"Ebola Bundibugyo en RDC : Africa CDC recense 8 214 cas et 3 978 décès au 28 septembre 2026 — l'épidémie approche le seuil des 4 000 victimes","url":"https://africacdc.org/news-item/ebola-bundibugyo-situation-report-28-september-2026/","content":"Le rapport de situation du 28 septembre 2026 d'Africa CDC recense 8 214 cas confirmés et 3 978 décès d'Ebola Bundibugyo en République démocratique du Congo, confirmant que cette épidémie est de loin la plus meurtrière jamais enregistrée pour cette souche. L'épidémie s'étend désormais à 68 zones de santé dans six provinces, avec une progression particulièrement alarmante au Nord-Kivu où le nombre de cas a augmenté de 32 % en une semaine. Le taux de suivi des contacts a légèrement progressé à 81,4 % — encore insuffisant pour atteindre la cible opérationnelle de 95 %. Africa CDC souligne que la réunion PAHO-Africa CDC du 23 septembre à New York a permis de sécuriser des engagements supplémentaires de 87 millions USD, réduisant le déficit de financement à 189 millions USD sur les 518 millions du plan continental. L'institution maintient le niveau d'alerte maximale et appelle à une mobilisation internationale urgente avant la CPHIA 2026 prévue à Addis-Abeba du 23 au 27 novembre.","date":"2026-09-28"},
{"title":"Africa CDC et l'Union africaine lancent l'AUEF : mécanisme d'urgence continental permettant de décaisser 100 millions USD en 72 heures pour les épidémies","url":"https://africacdc.org/news-item/african-union-emergency-fund-auef-launch-september-2026/","content":"L'Union africaine et Africa CDC ont officiellement lancé le 24 septembre 2026, en marge de l'Assemblée générale de l'ONU à New York, le Mécanisme d'urgence africain pour les épidémies (AUEF), un fonds continental permettant de décaisser jusqu'à 100 millions USD en 72 heures pour soutenir la réponse aux urgences de santé publique de niveau continental. Ce mécanisme, fruit de deux années de négociation, vient directement en réponse aux délais de décaissement qui ont freiné la riposte à l'épidémie d'Ebola Bundibugyo — dont le plan de réponse à 518 millions USD présentait encore un déficit de 276 millions USD, sept mois après le début de l'épidémie. Vingt-deux États membres ont déjà contribué à la capitalisation initiale avec des engagements fermes totalisant 45 millions USD, auxquels s'ajoutent 30 millions USD de l'Union européenne. Africa CDC sera l'institution de mise en oeuvre de l'AUEF, sous la gouvernance d'un conseil tripartite associant l'UA, Africa CDC et un comité indépendant d'experts. Dr Jean Kaseya a qualifié ce lancement d'«étape historique vers la souveraineté sanitaire africaine».","date":"2026-09-24"},
{"title":"Africa CDC publie la feuille de route de la CPHIA 2026 : 32 sessions plénières et 8 000 résumés scientifiques reçus pour la conférence d'Addis-Abeba","url":"https://cphia.africacdc.org/programme-2026","content":"Africa CDC a publié le 25 septembre 2026 la feuille de route officielle de la 5e Conférence panafricaine pour la santé publique (CPHIA 2026), prévue à Addis-Abeba du 23 au 27 novembre 2026. La conférence accueillera 32 sessions plénières articulées autour de cinq axes : réforme de l'architecture mondiale de la santé sous leadership africain, leçons de l'épidémie d'Ebola Bundibugyo, avancées de la fabrication vaccinale locale, mécanismes de financement durable et innovations numériques en santé. Un record de 8 000 résumés scientifiques ont été soumis — double du chiffre de la CPHIA 2024 — témoignant de la vitalité de la recherche en santé publique africaine. Les délégués inscrits proviennent de 78 pays, dont 55 États membres de l'Union africaine. Le Dr Jean Kaseya a annoncé que la RDC sera représentée par une délégation de 200 professionnels de santé, dont des équipes de première ligne de la réponse Ebola, pour documenter en temps réel les leçons opérationnelles de la crise en cours.","date":"2026-09-25"},
{"title":"PAHO et Africa CDC appellent à des investissements durables et à une coopération renforcée entre l'Afrique et les Amériques pour la préparation aux pandémies","url":"https://www.paho.org/en/news/23-9-2026-paho-and-africa-cdc-call-sustained-investment-and-stronger-africa-americas","content":"L'Organisation panaméricaine de la Santé (PAHO/OMS) et Africa CDC ont publié le 23 septembre 2026, en marge de l'Assemblée générale de l'ONU à New York, un appel conjoint à des investissements durables en prévention, préparation et réponse aux pandémies (PPPR) et à un renforcement substantiel de la coopération sanitaire entre l'Afrique et les Amériques. Les deux organisations ont souligné que les leçons de la COVID-19 — accès inéquitable aux vaccins, défaillances des chaînes d'approvisionnement, fragilité des systèmes de santé — restent largement non intégrées dans les architectures nationales de préparation, comme le démontre l'épidémie d'Ebola Bundibugyo en RDC sans vaccin approuvé ni financement suffisant. Africa CDC et PAHO plaident conjointement pour que le Traité international sur la prévention, la préparation et la réponse aux pandémies inclue des mécanismes contraignants de transfert de technologie et de financement équitable pour les pays à faible revenu. La déclaration commune souligne que le déficit de financement de 276 millions USD persistant dans le plan continental Ebola à 518 millions USD illustre concrètement les lacunes de l'architecture mondiale actuelle. Les deux institutions s'engagent à renforcer leurs échanges d'expertise en surveillance épidémiologique, réponse d'urgence et renforcement des capacités sanitaires.","date":"2026-09-23"},
{"title":"Africa CDC salue la réunion G20+ sur Ebola convoquée par les États-Unis et appelle à l'action unifiée, à la livraison accélérée et à la transparence financière totale","url":"https://africacdc.org/news-item/africa-cdc-welcomes-u-s-convened-g20-ebola-meeting-and-calls-for-united-action-faster-delivery-and-full-transparency/","content":"Africa CDC a salué le 20 septembre 2026 la réunion des ministres des Affaires étrangères du G20+ sur l'accélération de la réponse collective à Ebola, convoquée par les États-Unis en marge de l'Assemblée générale de l'ONU à New York. Au 22 septembre 2026, la RDC recensait 7 773 cas confirmés et 3 759 décès d'Ebola Bundibugyo — le bilan le plus lourd jamais enregistré pour cette souche. Africa CDC a noté avec satisfaction les engagements pris pour une livraison accélérée des ressources et une transparence totale dans l'utilisation des fonds, le déficit de financement atteignant encore 276 millions USD sur les 518 millions du plan continental. La participation de l'Ouganda — dont l'épidémie a été déclarée éteinte le 27 août 2026 avec seulement 20 cas et 2 décès — a offert un modèle de riposte efficace que les partenaires ont été invités à transposer en RDC. Africa CDC maintient que des baisses s'observent dans certaines zones d'Ituri mais que des augmentations dans le Nord-Kivu et une expansion géographique continue maintiennent l'urgence au niveau continental.","date":"2026-09-20"},
{"title":"La riposte Ebola Bundibugyo montre des progrès fragmentés mais demeure une urgence continentale, alertent les scientifiques africains","url":"https://africacdc.org/news-item/ebola-response-shows-progress-but-outbreak-remains-a-continental-emergency-african-scientists-say/","content":"Le 17 septembre 2026, Africa CDC et le Groupe consultatif d'urgence présidé par le Prof. Salim Abdool Karim ont publié une déclaration qualifiant la situation d'urgence continentale persistante malgré des signes de progrès : une baisse des cas dans l'épicentre d'Ituri s'accompagne d'une flambée dans le Nord-Kivu et d'une expansion géographique vers de nouvelles zones de santé. Le bilan au 14 septembre 2026 fait état de 7 258 cas confirmés et 3 510 décès en RDC, soit un taux de létalité de 48,4 % — le plus élevé jamais enregistré pour une épidémie à virus Ebola. Les scientifiques africains ont souligné que les progrès de la vaccination Ervebo et le renforcement du suivi des contacts demeurent insuffisants sans financement international complet. Africa CDC appelle à porter le taux de suivi des contacts de 78 % à la cible opérationnelle de 95 % pour briser les chaînes de transmission. L'institution reste en état d'alerte maximale et coordonne avec 14 pays frontaliers un dispositif de surveillance transfrontalière renforcé.","date":"2026-09-17"},
{"title":"Ebola Bundibugyo en RDC : 7 258 cas et 3 510 décès au 14 septembre 2026 — l'épidémie s'étend désormais à six provinces","url":"https://www.globalsecurity.org/security/library/news/2026/09/sec-260911-azertac02.htm","content":"Au 14 septembre 2026, la RDC recense 7 258 cas confirmés et 3 510 décès de maladie à virus Ebola Bundibugyo, soit un taux de létalité de 48,4 %, selon le rapport de situation d'Africa CDC. L'épidémie touche désormais six provinces — Ituri, Nord-Kivu, Sud-Kivu, Haut-Uélé, Tshopo et Bas-Uélé — avec 61 zones de santé affectées et 905 patients hospitalisés en isolement. Si la dynamique de transmission ralentit légèrement en Ituri (épicentre historique), elle s'accélère au Nord-Kivu et dans le Haut-Uélé, témoignant d'une diffusion géographique persistante. Le rapport du 14 septembre fait état de 58 nouveaux cas et 35 nouveaux décès en 24 heures ; le taux de suivi des contacts n'atteint que 78,6 %, encore loin de la cible de 95 % nécessaire pour briser les chaînes de transmission. Africa CDC a appelé d'urgence ses 55 États membres à renforcer immédiatement les contrôles sanitaires de sortie dans les aéroports, ports maritimes et postes frontières terrestres conformément aux Règlements sanitaires internationaux, face au risque accru de propagation transfrontalière depuis le Nord-Kivu.","date":"2026-09-14"},
{"title":"Africa CDC au World Health Summit 2026 : le Dr Kaseya exige une refonte de l'architecture mondiale de la santé sous leadership africain","url":"https://africacdc.org/africa-cdc-at-whs2026/","content":"Africa CDC participe au World Health Summit 2026, principale plateforme mondiale de dialogue sur la santé, où le Directeur général Dr Jean Kaseya défend une réforme profonde de la gouvernance internationale en tirant les leçons de l'épidémie d'Ebola Bundibugyo — la plus meurtrière de l'histoire de cette souche avec plus de 7 000 cas et 3 500 décès en RDC à mi-septembre 2026. Africa CDC plaide pour que l'Afrique occupe un siège permanent et une voix renforcée au sein de l'OMS et des mécanismes de financement d'urgence, et pour que la préparation aux pandémies bénéficie d'investissements durables et prévisibles. L'institution met en avant ses avancées concrètes : déploiement de l'Équipe continentale de gestion des incidents, renforcement du réseau de surveillance, premiers décaissements du mécanisme AVMA vers des fabricants africains de vaccins, et organisation de la CPHIA 2026 à Addis-Abeba du 23 au 27 novembre 2026. Le Dr Kaseya souligne que le financement de la réponse Ebola reste sous-doté de 276 millions USD et que sans engagement financier urgent de la communauté internationale, l'épidémie continuera de progresser en menaçant la stabilité régionale.","date":"2026-09-10"},
{"title":"Africa CDC et ECDC publient une alerte conjointe sur le risque de propagation transfrontalière d'Ebola depuis le Nord-Kivu","url":"https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda","content":"Africa CDC et le Centre européen de prévention et de contrôle des maladies (ECDC) ont publié mi-septembre 2026 une alerte conjointe avertissant que la progression de l'épidémie d'Ebola Bundibugyo vers le Nord-Kivu — province densément peuplée aux importants flux transfrontaliers — accroît le risque de propagation vers l'Ouganda, le Rwanda et le Burundi. L'ECDC a émis une évaluation de risque pour les voyageurs européens, concluant à un risque d'importation faible mais non nul, illustré par l'évacuation médicale d'un ressortissant américain travaillant pour une ONG humanitaire vers l'Allemagne le 13 juillet 2026. Africa CDC a exhorté ses États membres à renforcer les contrôles sanitaires aux points d'entrée et de sortie conformément aux RSI, et à activer les protocoles de surveillance pour les voyageurs en provenance des six provinces affectées. Avec 7 258 cas et 3 510 décès au 14 septembre 2026, l'épidémie dépasse désormais toutes les précédentes en nombre de cas confirmés d'Ebola Bundibugyo dans l'histoire de la médecine.","date":"2026-09-11"},
{"title":"Plan de réponse renforcée sur 100 jours contre Ebola Bundibugyo : Africa CDC recense 4 723 cas et 2 187 décès au 27 août 2026","url":"https://africacdc.org/news-item/ebola-bundibugyo-100-day-response-plan-27-august-2026/","content":"Dans son rapport de situation du 27 août 2026, Africa CDC recense 4 723 cas confirmés et 2 187 décès d'Ebola Bundibugyo en République démocratique du Congo, soit un taux de létalité de 46,3 % — le plus élevé jamais enregistré pour cette souche. L'épidémie touche désormais 58 zones de santé dans cinq provinces, avec de nouveaux cas signalés dans les zones frontalières du Sud-Kivu limitrophes du Rwanda et du Burundi. Face à cette évolution, Africa CDC et le gouvernement congolais ont adopté conjointement un plan de réponse renforcée de 100 jours visant à porter le taux de suivi des contacts à 95 % d'ici fin octobre 2026, à doubler les capacités des centres de traitement et à déployer 500 agents de santé communautaires supplémentaires dans les zones les plus touchées. L'essai clinique de vaccination en anneau par Ervebo a été officiellement autorisé par les autorités congolaises le 25 août 2026 — une avancée cruciale alors qu'aucun vaccin n'est encore homologué contre cette souche. Africa CDC appelle la communauté internationale à débloquer en urgence les 276 millions USD encore nécessaires pour financer intégralement le plan continental de réponse d'ici fin septembre 2026.","date":"2026-08-27"},
{"title":"Africa CDC Epidemic Intelligence Weekly Report — 22 août 2026 : surveillance élargie en Afrique de l'Ouest et centrale face au risque de propagation d'Ebola","url":"https://khub.africacdc.org/records/resource/epidemic-intelligence-weekly-report-22-august-2026","content":"Le rapport d'intelligence épidémiologique hebdomadaire d'Africa CDC du 22 août 2026 documente un renforcement de la surveillance aux frontières de neuf pays d'Afrique de l'Ouest et centrale considérés à risque élevé de propagation de l'épidémie d'Ebola Bundibugyo. Trois alertes transfrontalières investigées — au Burundi, au Rwanda et en République du Congo — ont toutes été confirmées négatives après analyses de laboratoire, démontrant l'efficacité des mécanismes de détection précoce déployés par Africa CDC. Parallèlement, Africa CDC surveille une flambée de méningite à méningocoque au Sahel avec 847 cas notifiés depuis début juillet 2026 dans trois pays (Nigéria, Niger, Tchad), ainsi qu'une recrudescence de la dengue en Côte d'Ivoire et au Sénégal comptant plus de 1 200 cas suspects. Africa CDC souligne que cette charge épidémique multiple met sous pression les équipes nationales de veille sanitaire et appelle à un renforcement urgent des laboratoires régionaux affiliés au réseau ASLM. L'agence rappelle que son Centre régional de coordination pour l'Afrique centrale, basé à Libreville, coordonne en temps réel la surveillance de tous ces foyers épidémiques avec les autorités sanitaires des 55 pays membres de l'Union africaine.","date":"2026-08-22"},
{"title":"Trois mois d'épidémie Ebola Bundibugyo : Africa CDC exige une action décisive et immédiate face à une crise hors normes","url":"https://africacdc.org/news-item/three-months-into-the-bundibugyo-ebola-outbreak-the-time-for-decisive-action-is-now/","content":"À l'occasion du bilan des trois premiers mois de l'épidémie de maladie à virus Ebola Bundibugyo, Africa CDC a publié le 17 août 2026 un appel solennel à l'action décisive. Depuis son démarrage en mai 2026 dans une seule province (Ituri), l'épidémie a étendu sa portée à 53 zones de santé réparties dans cinq provinces de la RDC — Ituri, Nord-Kivu, Sud-Kivu, Haut-Uélé et Tshopo —, devenant ainsi la plus grande épidémie d'Ebola Bundibugyo jamais enregistrée. Le bilan humain dépasse désormais 4 000 cas confirmés et 2 000 décès, tandis que les centres de traitement restent saturés et le taux de suivi des contacts insuffisant. Africa CDC appelle les gouvernements africains, les partenaires internationaux et les donateurs à mobiliser des ressources supplémentaires d'urgence, à accélérer le déploiement des équipes de riposte et à prioriser l'engagement communautaire pour briser les chaînes de transmission. Le lancement imminent d'un essai clinique du vaccin Ervebo en anneau de contacts est présenté comme une avancée décisive dans la lutte contre cette épidémie sans précédent.","date":"2026-08-17"},
{"title":"Africa CDC salue les recommandations du Groupe consultatif d'urgence : essai clinique Ervebo en anneau préconisé en RDC, 4 449 cas et 2 061 décès confirmés","url":"https://africacdc.org/news-item/africa-cdc-welcomes-emergency-consultative-group-recommendations-on-ebola-bundibugyo-response/","content":"Le 14 août 2026, Africa CDC a salué les recommandations du Groupe consultatif d'urgence (ECG), présidé par le Prof. Salim Abdool Karim, chargé de guider la riposte à l'épidémie Ebola Bundibugyo. L'ECG a fortement soutenu l'utilisation du vaccin Ervebo (rVSV-ZEBOV de Merck) selon deux modalités : un essai clinique de vaccination en anneau des contacts et une vaccination compassionnelle des soignants en première ligne. Au 14 août 2026, la RDC recensait 4 449 cas confirmés et 2 061 décès, soit un taux de létalité de 46,3 %. L'ECG a précisé que de nouvelles données sur les anticorps neutralisants sont prudemment prometteuses, mais qu'il subsiste un risque raisonnable qu'Ervebo ne soit pas efficace contre le virus Bundibugyo et que des preuves complémentaires sont nécessaires. Africa CDC a transmis ces recommandations aux autorités congolaises pour mise en oeuvre immédiate dans la plus grande épidémie d'Ebola Bundibugyo jamais enregistrée.","date":"2026-08-14"},
{"title":"Africa CDC soutient les décisions du gouvernement congolais pour contrôler l'urgence Ebola Bundibugyo 2026","url":"https://www.globalsecurity.org/security/library/news/2026/08/sec-260810-africacdc01.htm","content":"Le 10 août 2026, Africa CDC a publié une déclaration soutenant la mise en oeuvre immédiate des décisions du gouvernement de la RDC visant à contrôler l'urgence sanitaire liée à l'épidémie de maladie à virus Ebola Bundibugyo. Ces mesures font suite à la directive du Président Félix-Antoine Tshisekedi d'accélérer et de restructurer la réponse en plaçant les communautés au coeur du dispositif. Africa CDC a réaffirmé son engagement à soutenir techniquement les autorités congolaises dans la surveillance, le suivi des contacts, la gestion des cas et la logistique des interventions d'urgence. L'agence continentale a rappelé que l'Ouganda a mis fin à son épidémie le 28 juillet 2026 — 20 cas confirmés, 2 décès — démontrant qu'une réponse rapide et communautaire peut venir à bout du virus Bundibugyo. Africa CDC appelle à capitaliser sur ces leçons pour intensifier la riposte dans les cinq provinces congolaises encore affectées.","date":"2026-08-10"},
{"title":"Africa CDC et OMS appellent à une riposte communautaire urgente face à Ebola en RDC : 3 973 cas confirmés, 1 801 décès au 4 août 2026","url":"https://africacdc.org/news-item/africa-cdc-and-who-call-for-urgent-community-led-action-to-contain-ebola-in-the-drc/","content":"L'Africa CDC et l'OMS ont lancé le 6 août 2026 un appel pressant à intensifier la riposte communautaire contre l'épidémie d'Ebola Bundibugyo en RDC. Au 4 août 2026, la RDC dénombrait 3 973 cas confirmés, 1 801 décès et 776 guérisons dans 51 zones de santé de cinq provinces, avec 99 nouveaux cas et 52 décès dans les dernières 24 heures. Le taux de suivi des contacts n'atteignait que 75 %, loin de la cible opérationnelle de 95 % nécessaire pour briser les chaînes de transmission. Les centres de traitement au Nord-Kivu affichaient un taux d'occupation alarmant de 139 %, mettant sous pression sévère les lits, les soignants et les opérations de réponse sur le terrain. En réponse, les États-Unis ont annoncé le 5 août 2026 un financement additionnel de 242 millions USD pour la riposte immédiate et la préparation régionale. L'Ouganda a déclaré le 28 juillet 2026 la fin de son épidémie avec 20 cas confirmés et 2 décès.","date":"2026-08-06"},
{"title":"Africa CDC welcomes President Tshisekedi's direction for a village-centred, accountable and intensified Ebola response in DRC","url":"https://africacdc.org/news-item/africa-cdc-welcomes-president-tshisekedis-direction-and-guidance-for-a-village-centered-accountable-and-intensified-response-to-the-ebola-bundibugyo-outbreak-in-the-democratic-republic-of-th/","content":"Africa CDC on August 6, 2026 welcomed President Felix Antoine Tshisekedi's renewed direction calling for a fundamentally restructured, village-centred and accountable Bundibugyo Ebola response in the DRC. The move marks a critical shift toward placing affected communities at the heart of outbreak control — a priority given that contact follow-up rates remain at 75%, far short of the 95% threshold needed to break transmission chains. Africa CDC Director-General Dr. Jean Kaseya endorsed the President's guidance as a potential turning point for building community trust, particularly in the hardest-hit provinces of Ituri and North Kivu. The direction aligns with the joint Africa CDC-WHO statement of August 6, 2026 demanding faster resource delivery, stronger early detection and improved access to care. As of the August 2 situational report, nearly 4 000 cases and over 1 800 deaths have been recorded since the outbreak began in DRC.","date":"2026-08-06"},
{"title":"CPHIA 2026 : l'Afrique se prépare à accueillir 30 000 délégués à Addis-Abeba","url":"https://cphia.africacdc.org","content":"La 5e Conférence internationale sur la santé publique en Afrique (CPHIA 2026) se tiendra à Addis-Abeba, capitale diplomatique du continent africain et siège de l'Union africaine. Organisée par Africa CDC, la conférence réunira plus de 30 000 délégués — chefs d'État, ministres, chercheurs et innovateurs — autour des défis de santé publique les plus pressants du continent. Les travaux s'articuleront notamment autour de la refonte de l'architecture mondiale de la santé sous leadership africain, de l'institutionnalisation de la prévention et de la préparation aux pandémies, ainsi que d'un salon d'innovation dédié aux technologies de santé africaines. La date limite de soumission des résumés et des candidatures aux bourses de voyage est fixée au 15 août 2026. Le Dr Jean Kaseya, Directeur général d'Africa CDC, figurera parmi les conférenciers principaux.","date":"2026-07-12"},
{"title":"Africa CDC and WHO unveil $518 million joint continental Ebola response plan","url":"https://www.emjreviews.com/microbiology-infectious-diseases/news/africa-cdc-and-who-launch-joint-continental-ebola-response-plan","content":"Africa CDC and WHO officially launched a joint continental preparedness and response plan for the Bundibugyo Ebola outbreak on June 5, 2026. The six-month strategy, running from June to November 2026, is costed at $518 million and operates under a 'One Plan, One Budget, One Team' framework led by the affected nations — the Democratic Republic of the Congo and Uganda — supported by regional and international partners. Key operational pillars include emergency coordination, laboratory testing, disease surveillance, infection prevention and control, clinical care, community engagement, and logistics. Dr. Jean Kaseya, Director-General of Africa CDC, underscored the urgency: \"Ebola moves fast. Africa must move faster. This joint plan gives the continent a clear path to act with speed and unity.\" A joint financial tracking mechanism has been put in place to ensure full transparency in fund utilisation.","date":"2026-07-12"},
{"title":"Ebola moves faster than the response: Africa CDC chief sounds the alarm","url":"https://www.thenewhumanitarian.org/interview/2026/07/09/ebola-moving-faster-than-response-head-africa-cdc-warns","content":"Africa CDC Director General Dr. Jean Kaseya issued an urgent warning on July 9, 2026: the Ebola outbreak driven by the Bundibugyo virus in eastern DRC has yet to reach its peak, yet treatment centres are already at saturation point. In an interview with The New Humanitarian, Kaseya called on the international community to \"act now or pay a much higher price later,\" stressing that the pace of the outbreak is outstripping the pace of the response. Uganda has closed its borders with DRC in a bid to contain cross-border spread, but the move has crippled regional trade and raised humanitarian concerns. Africa CDC continues to coordinate with Member States and partners to accelerate detection, care, and community engagement in conflict-affected Ituri province.","date":"2026-07-12"},
{"title":"Africa CDC déploie une stratégie d'engagement des jeunes dans la santé mondiale : la YES!Health 2025-2028","url":"https://khub.africacdc.org/records/resource/epidemic-intelligence-weekly-report","content":"L'Africa CDC a publié sa stratégie d'engagement et de participation des jeunes dans la santé mondiale, baptisée YES!Health (Youth Engagement and Participation in Global Health), couvrant la période 2025-2028. Portée par le Dr Chrys Promesse Kaniki, cette initiative reconnaît le rôle crucial des jeunes africains âgés de 15 à 35 ans — qui représentent plus de 65 % de la population du continent — dans la résolution des défis sanitaires persistants. La stratégie vise à intégrer les jeunes comme acteurs à part entière des systèmes de santé publique, en leur offrant des plateformes de participation active dans les politiques de santé, la surveillance épidémique et la réponse aux urgences. Cette démarche s'inscrit dans la vision plus large de l'Africa CDC de bâtir une Afrique résiliente, capable de prendre en charge sa propre sécurité sanitaire, notamment dans un contexte marqué par la recrudescence des maladies à virus Ebola et les séquelles de la pandémie de COVID-19 sur les systèmes de surveillance des maladies non transmissibles.","date":"2026-07-11"},
{"title":"Africa CDC et WHO AFRO lancent une équipe continentale de gestion des incidents pour renforcer la réponse aux urgences de santé publique","url":"https://reliefweb.int/updates?list=Africa+Centres+for+Disease+Control+and+Prevention+%28Africa+CDC%29+Updates&advanced-search=%28S50373%29","content":"Kampala, Ouganda, 27 juin 2026 — L'Africa CDC et le Bureau régional de l'OMS pour l'Afrique (WHO AFRO) ont officiellement lancé une Équipe continentale de gestion des incidents (IMST), en présence du ministre ougandais de la Santé, le Dr Chris Baryomunsi. Cette initiative vise à renforcer le leadership de l'Afrique dans la gestion des urgences de santé publique, en particulier dans le contexte de l'épidémie de maladie à virus Ebola Bundibugyo qui sévit en RDC et en Ouganda. Par ailleurs, l'Africa CDC a réuni 13 pays à Kampala pour un atelier de préparation régionale face à cette menace épidémique. Lors d'une réunion de haut niveau présidentielle tenue le 16 juin 2026 sous la présidence du Président du Burundi, S.E. Évariste Ndayishimiye, les chefs d'État et de gouvernement africains ont exprimé leur engagement collectif à intensifier la réponse continentale. Le Président de la RDC, Félix Antoine Tshisekedi, a également accueilli le Président ougandais le 2 juillet 2026, soulignant la dimension diplomatique et régionale de cette crise sanitaire sans précédent.","date":"2026-07-11"},
{"title":"Épidémie de maladie à virus Bundibugyo : 1 581 cas confirmés et 508 morts en RDC et en Ouganda","url":"https://khub.africacdc.org/health-topics/surveillance","content":"L'épidémie de maladie à virus Bundibugyo (BVD) en République démocratique du Congo (RDC) et en Ouganda atteint un niveau alarmant en ce début juillet 2026. Selon les dernières données publiées par l'Africa CDC, le cumul des cas confirmés dans les deux pays s'élève à 1 581, avec 508 décès recensés, portant le taux de létalité global à 32,1 %. La province de l'Ituri en RDC demeure l'épicentre de la crise, concentrant plus de 90 % des cas confirmés et près de 84 % des décès. Le Nord-Kivu, autre province affectée, enregistre quant à lui le taux de létalité provincial le plus élevé, atteignant 57,4 %, témoignant de la gravité de la situation clinique et des difficultés de prise en charge sur le terrain. En Ouganda, la situation reste relativement stable avec 20 cas confirmés et 2 décès. L'Africa CDC maintient une surveillance renforcée aux points d'entrée et de sortie, et appelle à une vigilance soutenue face au risque persistant de transmission transfrontalière.","date":"2026-07-11"},
