{"title":"Moderna mRNA-1403 : résultats préliminaires de phase 2 en RDC — 78 % de réponse immunitaire contre Ebola Bundibugyo chez 1 247 participants vaccinés","url":"https://onlinelibrary.wiley.com/doi/full/10.1002/hsr2.71926","content":"Moderna et la Coalition pour les innovations en matière de préparation aux épidémies (CEPI) ont annoncé le 9 octobre 2026 des résultats préliminaires de l'essai de phase 2 du vaccin mRNA-1403 contre le virus Ebola Bundibugyo conduit en RDC, montrant que 78 % des 1 247 participants vaccinés ont développé des niveaux d'anticorps neutralisants considérés comme potentiellement protecteurs selon les critères du comité scientifique indépendant. L'essai recrute des contacts directs des cas confirmés dans les zones de santé actives d'Ituri et du Nord-Kivu — un recrutement de 1 247 participants en 90 jours, supérieur aux projections initiales, rendu possible par l'engagement des communautés et la confiance bâtie par les équipes de réponse Ebola. Ces résultats intermédiaires ne constituent pas encore une preuve d'efficacité clinique, mais le profil immunogène justifie la poursuite de l'essai vers une analyse d'efficacité protectrice prévue au T1 2027, avec un objectif de 3 500 participants totaux. L'OMS a indiqué que des résultats finaux positifs pourraient soutenir une demande d'autorisation d'urgence accélérée, ce qui ferait du mRNA-1403 le premier vaccin spécifiquement développé et approuvé contre le virus Bundibugyo — une avancée décisive pour les futures épidémies de cette souche documentées dans 12 pays africains depuis 1994.","date":"2026-10-09"},
{"title":"OMS : rapport intermédiaire 2026 sur la couverture vaccinale — 14,3 millions d'enfants non vaccinés, impact de l'Ebola sur la routine en RDC (-21 %)","url":"https://www.who.int/news/item/02-04-2026-message-by-the-director-of-the-department-of-immunization--vaccines-and-biologicals-at-who---march-2026","content":"L'Organisation mondiale de la santé a publié le 10 octobre 2026 son rapport intermédiaire sur la couverture vaccinale mondiale 2026, révélant que 14,3 millions d'enfants ne reçoivent aucune vaccination de routine — une proportion quasi stable par rapport à 2025 malgré les 100 millions de doses de rattrapage livrées par le programme Big Catch-Up avant sa clôture en mars 2026. En République démocratique du Congo, l'épidémie d'Ebola Bundibugyo a provoqué une baisse de 21 % de la couverture vaccinale de routine dans les six provinces affectées depuis mai 2026, avec des chutes particulièrement préoccupantes pour le DTC3 (−27 %), le vaccin antipolio oral (−31 %) et la rougeole-rubéole (−24 %). L'OMS souligne le risque d'un double fardeau épidémique : la gestion de l'urgence Ebola crée les conditions d'une recrudescence des maladies évitables par la vaccination, comme observé lors des épidémies Ebola de 2018-2020 en RDC où la rougeole avait tué davantage que le virus Ebola lui-même. Le rapport appelle les partenaires internationaux à financer des campagnes de rattrapage vaccinal ciblées dans les six provinces affectées dès que les conditions le permettront, estimant le budget nécessaire à 340 millions USD — soit 23 % du budget annuel habituel de vaccination de routine en RDC.","date":"2026-10-10"},
{"title":"Traité pandémique OMS : accord de principe sur l'Article 12 PABS lors de la session extraordinaire du 8-10 octobre 2026 — vote final en novembre","url":"https://www.who.int/news/item/26-05-2026-global-health-leaders-reaffirm-commitment-to-immunization-agenda-2030","content":"Les États membres de l'OMS ont annoncé le 10 octobre 2026 un accord de principe sur l'Article 12 du Traité pandémique relatif au Système de bénéfice partagé pour l'accès aux pathogènes (PABS), lors de la session extraordinaire du Comité de négociation intergouvernemental tenue à Genève du 8 au 10 octobre 2026 — un déblocage majeur après six mois d'impasse sur cet article central. L'accord prévoit que les pays qui partagent des échantillons de pathogènes via le réseau mondial de surveillance de l'OMS recevront un accès garanti à 20 % de la production de vaccins et thérapeutiques développés à partir de ces pathogènes, avec livraison en 6 mois maximum suivant la déclaration d'urgence — une demande portée de longue date par les pays africains après l'expérience COVID-19. L'épidémie d'Ebola Bundibugyo en RDC — causée par un pathogène pour lequel aucun vaccin approuvé n'existait malgré des séquences génomiques disponibles depuis 2007 — a cristallisé l'urgence de ce mécanisme dans les négociations de 2026. Le vote final des États membres sur le texte complet du Traité pandémique est prévu lors de l'Assemblée mondiale de la santé extraordinaire de novembre 2026, qui sera précédée le 23 novembre du dialogue de l'Africa CDC entre ministres africains et candidats au poste de DG de l'OMS à Addis-Abeba.","date":"2026-10-10"},
{"title":"Le DG de l'OMS annonce le démarrage imminent d'un essai clinique vaccinal contre Ebola Bundibugyo — plus de 600 participants déjà enrollés pour les essais thérapeutiques","url":"https://www.who.int/news-room/speeches/item/who-director-general-s-opening-remarks-at-the-media-briefing---7-october-2026","content":"Le Directeur général de l'OMS, Dr Tedros Adhanom Ghebreyesus, a annoncé lors de son briefing médias du 7 octobre 2026 que le démarrage d'un essai clinique vaccinal contre l'Ebola Bundibugyo est attendu dans le courant du mois d'octobre 2026 — une avancée décisive dans la réponse à une épidémie qui a causé plus de 8 700 cas et 4 200 décès en RDC. Parallèlement, plus de 600 personnes sont déjà enrollées dans des essais cliniques de thérapeutiques contre Ebola Bundibugyo, confirmant une mobilisation accélérée de la recherche clinique dans les zones de crise. L'OMS avait publié le 28 mai 2026 des orientations d'urgence sur l'utilisation compassionnelle du vaccin Ervebo (rVSV-ZEBOV, homologué contre Ebola Zaïre) dans le contexte de l'épidémie Bundibugyo, en attendant les résultats du programme de vaccination en anneau conduit depuis août 2026. Ces essais cliniques coordonnés par l'OMS, Africa CDC et les autorités congolaises visent à combler le vide vaccinal spécifique à la souche Bundibugyo — une lacune structurelle du pipeline mondial de contre-mesures médicales pour les filovirus que l'ampleur de cette épidémie rend désormais inacceptable.","date":"2026-10-07"},
{"title":"L'OMS recommande la composition des vaccins antigrippaux pour l'hémisphère sud saison 2027 — mise à jour des souches dominantes en circulation","url":"https://www.who.int/news-room","content":"L'OMS a publié le 25 septembre 2026 ses recommandations officielles sur la composition des vaccins antigrippaux pour la saison grippale 2027 de l'hémisphère sud, permettant aux fabricants pharmaceutiques mondiaux d'ajuster leurs formulations en temps utile avant la saison australe d'avril-juillet 2027. Ces recommandations sont fondées sur l'analyse en temps réel des données de surveillance épidémiologique et virologique collectées par le réseau mondial GISRS (Système mondial de surveillance de la grippe et de riposte), qui regroupe plus de 140 centres nationaux dans 120 pays. Cette publication annuelle intervient alors que l'OMS coordonne simultanément la réponse à l'épidémie d'Ebola Bundibugyo, soulignant la nécessité de maintenir les systèmes de surveillance des maladies respiratoires même en période de gestion d'urgences infectieuses majeures qui concentrent l'attention internationale. Les fabricants de vaccins antigrippaux desservant les marchés sud-américains, africains et océaniens disposent de six mois environ pour produire et distribuer les nouvelles formulations, dans le cadre du cycle prévisible de veille et d'adaptation vaccinale géré par l'OMS depuis 75 ans.","date":"2026-09-25"},
{"title":"Les systèmes vaccinaux de routine en Afrique progressent contre le paludisme et le cancer, mais les pressions financières mondiales menacent les acquis selon l'OMS AFRO","url":"https://www.afro.who.int/news/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding-pressures","content":"L'OMS AFRO a publié une analyse sur les performances des systèmes de vaccination de routine en Afrique, documentant des progrès tangibles notamment contre le paludisme — avec 25 pays ayant introduit le vaccin antipaludique avec soutien de Gavi — et contre le cancer du col de l'utérus via l'expansion du vaccin HPV dans dix pays supplémentaires planifiée d'ici 2030. Ces avancées surviennent toutefois dans un contexte de pressions financières croissantes : les coupes dans l'aide internationale à la santé font peser un risque réel sur la pérennité des programmes de vaccination de routine, Gavi ayant alerté que des financements insuffisants pour 2026-2030 pourraient coûter 600 000 vies d'ici la fin de la décennie. L'OMS AFRO souligne que les gains vaccinaux accumulés — notamment une réduction de 80 % des décès par rougeole dans certaines régions depuis 2000 — sont fragiles et réversibles sans financement prévisible à long terme des programmes nationaux. Cette analyse appelle les gouvernements africains à augmenter leurs propres investissements dans la vaccination pour réduire la dépendance structurelle aux financements internationaux, dans la logique de souveraineté sanitaire promue par l'Union africaine et Africa CDC.","date":"2026-10-05"},
{"title":"SAGE de l'OMS (5-8 octobre 2026) : premières recommandations mondiales sur les vaccins candidats contre Ebola Bundibugyo, et mise à jour sur Mpox, HPV, polio et fièvre jaune","url":"https://www.who.int/news-room/events/detail/2026/10/05/default-calendar/strategic-advisory-group-of-experts-on-immunization-october-2026","content":"Le Groupe consultatif stratégique d'experts de l'OMS sur la vaccination (SAGE) a tenu du 5 au 8 octobre 2026 à Genève sa réunion d'automne, examinant les données sur cinq domaines vaccinaux prioritaires. Pour Ebola Bundibugyo, le SAGE a émis pour la première fois des orientations sur l'utilisation de vaccins candidats en contexte épidémique actif : vaccination compassionnelle des soignants et cadre d'utilisation du mRNA-1403 de Moderna dont les résultats de phase 1 sont prometteursavec 87 % de réponse immunologique à 100 µg. Pour Mpox, les recommandations étendent l'utilisation du vaccin MVA-BN aux adolescents à risque en zones endémiques d'Afrique centrale et de l'Ouest, pays où les épidémies persistent depuis 2022. La conférence de presse de présentation des recommandations est prévue le 13 octobre 2026 — les conclusions du SAGE constitueront les orientations mondiales de référence pour la programmation vaccinale 2027 de Gavi et de l'UNICEF, ainsi que pour les décisions d'autorisation accélérée des agences réglementaires africaines dont l'AMA.","date":"2026-10-08"},
{"title":"OMS préqualifie un vaccin maternel anti-VRS en formulation multi-doses : réduction de plus de 80 % des hospitalisations néonatales pour bronchiolite dans les pays à faible revenu","url":"https://www.who.int/news-room/events","content":"L'Organisation mondiale de la Santé a accordé la préqualification à un vaccin maternel contre le virus respiratoire syncytial (VRS) en conditionnement multi-doses, permettant son déploiement dans les programmes Gavi et ses achats via l'UNICEF dans les pays à faible revenu. Les données d'efficacité montrent une réduction de plus de 80 % du risque d'hospitalisation des nourrissons pour bronchiolite sévère à VRS lorsque la mère est vaccinée au troisième trimestre de grossesse. Le VRS cause environ 100 000 décès d'enfants de moins de 5 ans par an dans le monde, la quasi-totalité en Afrique subsaharienne et en Asie du Sud. Le conditionnement multi-doses préqualifié réduit significativement le coût par dose et les contraintes logistiques de la chaîne du froid, levant les principaux obstacles pratiques au déploiement dans les pays à ressources limitées. Cette préqualification complète le pipeline vaccinal maternel existant contre la coqueluche et le tétanos néonatal, et constitue un outil supplémentaire majeur pour réduire la mortalité néonatale évitable en Afrique.","date":"2026-10-06"},
{"title":"World Vaccine Congress 2026 : IA, mRNA de nouvelle génération et équité d'accès comme axes stratégiques de la décennie vaccinale post-2026","url":"https://vac4eu.org/event/world-vaccine-congress-2026/","content":"Le World Vaccine Congress 2026, plus grand rassemblement mondial des professionnels de la vaccination, a centré son programme sur trois axes qui dessinent l'agenda vaccinal de la prochaine décennie : l'intégration de l'intelligence artificielle dans la surveillance épidémiologique et la pharmacovigilance post-commercialisation, les plateformes mRNA de nouvelle génération (auto-amplificatrices, à thermostabilité améliorée pour les pays sans chaîne du froid fiable), et les stratégies d'équité d'accès entre pays riches et pays à faible revenu. L'épidémie d'Ebola Bundibugyo en RDC — sans vaccin approuvé après plus de 8 000 cas et près de 4 000 décès — a été présentée comme l'illustration la plus dramatique des conséquences de l'inaction sur les vaccins pour pathogènes africains prioritaires. VAC4EU, réseau européen de recherche sur l'efficacité en vie réelle, participe au Congrès avec des méthodologies de plus en plus sollicitées par les régulateurs africains dont l'AMA cherche à développer ses propres capacités d'évaluation post-commercialisation pour le marché continental.","date":"2026-10-01"},
{"title":"Nouveau vaccin contre la dengue Qdenga (Takeda) préqualifié par l'OMS — déploiement dans 12 pays africains envisagé pour 2027 face à une expansion record du vecteur","url":"https://www.who.int/news/item/29-09-2026-takeda-qdenga-dengue-vaccine-who-prequalification","content":"L'Organisation mondiale de la Santé a accordé le 29 septembre 2026 la préqualification au vaccin contre la dengue Qdenga (TAK-003) du laboratoire Takeda, ouvrant la voie à son déploiement dans les programmes nationaux d'immunisation des pays tropicaux à revenu faible et intermédiaire. La dengue est en expansion rapide en Afrique sous l'effet du changement climatique : en 2026, la Côte d'Ivoire, le Sénégal, la Tanzanie et l'Éthiopie ont enregistré plus de 120 000 cas, un record continental. La préqualification est le prérequis indispensable pour les achats via l'UNICEF et Gavi. Takeda a signé avec le Serum Institute of India un accord de licence pour une production générique à prix réduit, avec un objectif de 50 millions de doses disponibles à partir de 2027. Gavi et l'UNICEF ont lancé une demande d'expressions d'intérêt auprès de 12 pays africains à haute endémicité pour planifier les premières introductions nationales du vaccin dengue en 2027.","date":"2026-09-29"},
{"title":"Moderna et CEPI soumettent officiellement le dossier de phase 2 du mRNA-1403 aux autorités congolaises — démarrage du recrutement en zone épidémique Ebola prévu en novembre 2026","url":"https://cepi.net/moderna-mrna-1403-phase2-drc-submission-september-2026","content":"Moderna et la Coalition pour les innovations en matière de préparation aux épidémies (CEPI) ont soumis officiellement le 25 septembre 2026 aux autorités sanitaires de la RDC et à Africa CDC le dossier de demande d'autorisation pour l'essai clinique de phase 2 du candidat vaccin mRNA-1403 contre Ebola Bundibugyo — moins de quatre semaines après la publication des résultats de phase 1 montrant un profil de sécurité favorable et une réponse immunologique chez 87 % des participants à la dose de 100 µg. L'essai de phase 2 proposé ciblera 800 adultes dans les zones d'épidémie active du Nord-Kivu et de l'Ituri, avec une sous-étude de 200 soignants en première ligne. Africa CDC a mobilisé une équipe d'évaluation accélérée en 30 jours pour soutenir l'autorisation de l'Autorité de réglementation des médicaments de la RDC. Un démarrage du recrutement est attendu dès novembre 2026 — une accélération sans précédent pour un vaccin contre un filovirus, illustrant la mobilisation mondiale face à une épidémie ayant causé près de 4 000 morts.","date":"2026-09-25"},
{"title":"Traité pandémique de l'OMS : accord provisoire sur l'Article 12 sur l'accès aux pathogènes — vote final des États membres prévu pour novembre 2026","url":"https://www.who.int/news/item/25-09-2026-pandemic-treaty-article-12-provisional-agreement","content":"Les États membres de l'OMS ont conclu le 25 septembre 2026 un accord provisoire sur l'Article 12 du Traité international sur la prévention, la préparation et la réponse aux pandémies (PPPR) — l'article le plus controversé portant sur le partage des pathogènes et l'accès aux bénéfices pour les pays à revenu faible. Les pays qui partagent des données génomiques sur des pathogènes à potentiel pandémique recevront 10 % des vaccins et contre-mesures médicales développés grâce à ces données, et un accès prioritaire à 20 % supplémentaires à prix préférentiel. Le Groupe africain, soutenu par le Groupe des 77, avait longtemps bloqué les négociations sur cet article, arguant que les mécanismes existants profitaient disproportionnellement aux pays riches. L'accord provisoire représente une avancée majeure vers un traité contraignant, après l'échec de la première tentative d'adoption en mai 2026. Le vote final est programmé pour l'Assemblée mondiale de la Santé extraordinaire de novembre 2026 à Genève.","date":"2026-09-25"},
{"title":"L'OMS consulte les experts mondiaux sur la composition des vaccins antigrippaux pour l'hémisphère sud 2027","url":"https://www.who.int/news-room/events","content":"L'Organisation mondiale de la Santé a tenu du 21 au 24 septembre 2026 sa consultation internationale sur la composition des vaccins antigrippaux destinés à l'hémisphère sud pour la saison 2027, réunissant des virologues de référence des Centres nationaux de grippe du réseau mondial de surveillance GISRS (Global Influenza Surveillance and Response System) qui inclut 147 institutions dans 127 pays. Les recommandations publiées à l'issue de la consultation sont transmises aux fabricants qui disposent de six à huit mois pour produire les vaccins avant le début de la saison grippale australe en avril 2027, dans une fenêtre industrielle extrêmement contrainte. Cette consultation revêt une importance particulière en 2026 : les données de surveillance africaine — notamment la surveillance moléculaire conduite en Namibie et au Sénégal — ont influencé les discussions sur l'inclusion de souches spécifiques aux populations africaines, trop souvent sous-représentées dans les formules vaccinales. Le réseau GISRS, pierre angulaire de la préparation mondiale à la grippe pandémique, est aussi utilisé pour anticiper le risque d'émergence de nouvelles souches à potentiel pandémique, fonction dont l'importance s'est renforcée après les leçons de la COVID-19. L'intégration croissante des données de surveillance africaine dans ces consultations illustre la montée en puissance épidémiologique du continent sous l'impulsion d'Africa CDC et de ses réseaux de laboratoires régionaux.","date":"2026-09-21"},
{"title":"IVAC-Johns Hopkins : les estimations mondiales de couverture vaccinale 2026 révèlent des inégalités d'accès persistantes malgré les progrès globaux","url":"https://publichealth.jhu.edu/ivac/2026/latest-global-immunization-coverage-estimates-illustrate-gaps-in-vaccine-access","content":"L'International Vaccine Access Center (IVAC) de l'École de santé publique Bloomberg de Johns Hopkins a publié en 2026 une analyse des dernières estimations mondiales de couverture vaccinale (WUENIC 2025), soulignant que malgré des progrès globaux — 90 % des nourrissons ayant reçu au moins une dose de DTCoq — d'importantes inégalités d'accès persistent entre pays à revenu élevé et pays à faible revenu. L'analyse met en évidence que 14,5 millions d'enfants restent entièrement non vaccinés dans le monde en 2025, avec des concentrations particulièrement élevées dans les États fragiles et touchés par les conflits en Afrique subsaharienne et en Asie du Sud. L'IVAC souligne que les perturbations de l'épidémie d'Ebola Bundibugyo en RDC ont inversé plusieurs années de progrès dans les cinq provinces affectées, avec des taux de couverture rougeole tombant sous 60 % dans certaines zones de santé et créant les conditions d'épidémies concomitantes. Les réductions de 90 % du financement USAID américain et le retrait des États-Unis de l'OMS ont aggravé les déficits de couverture dans une vingtaine de pays dépendants de ce financement pour leurs programmes d'immunisation de routine. L'IVAC appelle à une coordination urgente des donateurs alternatifs — Union européenne, Allemagne, Royaume-Uni, Japon et fondations privées — pour combler le déficit de financement estimé à 800 millions USD par Gavi sur la période 2026-2027.","date":"2026-09-10"},
{"title":"Nouveau rapport de l'OMS : des mesures audacieuses s'imposent pour un accès équitable aux nouveaux vaccins contre la tuberculose en développement","url":"https://www.who.int/news-room/immunization","content":"L'Organisation mondiale de la Santé a publié un rapport appelant à des mesures audacieuses pour garantir que les nouveaux vaccins contre la tuberculose (TB) — dont plusieurs candidats prometteurs sont en phase 2 et 3 d'essais cliniques en 2026 — seront accessibles équitablement aux pays à faible et moyen revenu dès leur homologation. La tuberculose tue 1,3 million de personnes par an dans le monde — les pays africains supportant 23 % de la charge mondiale — rendant l'accès africain aux futurs vaccins une priorité de santé publique absolue. L'OMS souligne que la crise d'accès aux vaccins COVID-19 a démontré qu'en l'absence de mécanismes proactifs, les pays à faible revenu attendent parfois des années après les pays riches — un scénario à éviter absolument pour les vaccins TB qui pourraient transformer la lutte contre cette maladie endémique en Afrique. L'organisation recommande la mise en place dès maintenant de mécanismes d'engagement anticipé de marché (AMC) similaires à COVAX, des accords de transfert de technologie avec des fabricants dans les pays à revenu faible et moyen, et des clauses d'accès prioritaire dans les contrats de financement public de la R&D vaccinale. Ce rapport s'inscrit dans la stratégie mondiale END TB qui vise à mettre fin à l'épidémie de tuberculose d'ici 2030, un objectif aujourd'hui remis en question par les perturbations liées au COVID-19 et aux coupes de financement international.","date":"2026-09-15"},
{"title":"OMS, Gavi et UNICEF établissent le 5e stock mondial d'urgence vaccinale : le Mpox rejoint fièvre jaune, méningite, Ebola et choléra dans le mécanisme ICG","url":"https://www.gavi.org/news/media-room/global-initiative-launched-improve-access-mpox-vaccines","content":"L'OMS, Gavi et l'UNICEF ont officiellement lancé le 2 septembre 2026 un stock mondial d'urgence de vaccins contre le Mpox, géré par le Groupe de coordination internationale (ICG) sur la provision vaccinale — le 5e stock de ce mécanisme après ceux dédiés à la fièvre jaune, la méningite, Ebola et le choléra. Le stock permettra une mobilisation de vaccins MVA-BN (Imvanex/Jynneos) en 24 à 72 heures pour répondre à de nouvelles flambées dans les pays à faible revenu, avec une allocation équitable basée sur la demande et l'impact épidémique. L'initiative s'appuie sur l'expérience du mécanisme d'accès déployé lors de l'urgence de santé publique internationale de Mpox en 2024 et répond à la persistance des épidémies de Mpox en RDC et en Afrique de l'Ouest. Gavi finance les stocks, l'UNICEF gère la logistique d'approvisionnement et l'OMS coordonne la gouvernance du mécanisme. Cette avancée représente une leçon directe des crises COVID-19 et Ebola : constituer des stocks stratégiques de vaccins avant les urgences plutôt qu'en réaction à elles, pour une réponse mondiale plus rapide et plus équitable.","date":"2026-09-02"},
{"title":"OMS préqualifie un flacon multi-doses de vaccin anti-VRS le 9 septembre 2026 : première mondiale pour la protection des nourrissons dans les pays à revenu faible","url":"https://www.who.int/news-room/immunization","content":"L'Organisation mondiale de la Santé a préqualifié le 9 septembre 2026 un flacon multi-doses d'un vaccin contre le virus respiratoire syncytial (VRS), principale cause de bronchiolite sévère et de pneumonie chez les nourrissons, ouvrant la voie à son déploiement dans les programmes nationaux d'immunisation des pays à faible et moyen revenu. Le VRS cause environ 100 000 décès d'enfants de moins de 5 ans par an dans le monde, avec plus de 95 % de la mortalité concentrée dans les pays à faible revenu, notamment en Afrique subsaharienne et en Asie du Sud. La préqualification OMS est le prérequis indispensable pour l'achat groupé via l'UNICEF et Gavi ; le conditionnement multi-doses optimise les coûts logistiques et la gestion de la chaîne du froid dans les contextes à ressources limitées. Cette avancée complète un pipeline de nouveaux vaccins intégrés aux programmes africains ces dernières années : vaccin antipaludique (39 millions de doses dans 25 pays en 2026), anti-HPV, anti-typhoïde conjugué et anti-choléra oral dont la production a repris en 2026. L'OMS rappelle que l'immunisation reste l'intervention de santé publique au meilleur rapport coût-efficacité, prévenant entre 4 et 5 millions de décès par an.","date":"2026-09-09"},
{"title":"OMS publie le jeu de données mondial d'achats de vaccins MI4A 2026 : 182 pays et 20 ans de données sur les acquisitions nationales de vaccins","url":"https://www.who.int/publications/m/item/2026-mi4a-public-vaccine-purchase-dataset","content":"L'Organisation mondiale de la Santé a publié en septembre 2026 le jeu de données public d'achats de vaccins MI4A (Market Information for Access to Vaccines) 2026, couvrant les acquisitions de 182 pays de 2005 à 2025. Ce jeu de données de référence mondiale fournit une transparence sans précédent sur les volumes achetés, les prix payés et les fabricants fournisseurs pour tous les antigènes vaccinaux — un outil stratégique pour les ministères de la santé, Gavi, l'UNICEF et les fabricants africains émergents souhaitant comprendre les dynamiques de marché et calibrer leur production. Les données 2025, intégrées pour la première fois dans cette édition, reflètent les impacts des coupes de financement américain via l'USAID et des perturbations liées à l'épidémie d'Ebola Bundibugyo sur les achats de vaccins en Afrique centrale. Ce jeu de données est particulièrement précieux pour les fabricants africains du mécanisme AVMA qui cherchent à quantifier la demande prévisible sur leurs marchés cibles, et pour les gouvernements souhaitant développer des politiques d'achat prioritaire auprès des fabricants locaux.","date":"2026-09-08"},
{"title":"OMS et Union européenne lancent HERA-Afrique : partenariat de 200 millions d'euros pour renforcer la préparation épidémique et la fabrication vaccinale sur le continent africain","url":"https://www.who.int/news/item/22-08-2026-who-eu-hera-africa-200-million-partnership-epidemic-preparedness","content":"L'Organisation mondiale de la Santé et l'Autorité européenne de préparation et de réaction en cas d'urgence sanitaire (HERA) ont lancé le 22 août 2026 le programme HERA-Afrique, un partenariat de 200 millions d'euros sur cinq ans destiné à renforcer la préparation épidémique et les capacités de fabrication de vaccins et de contre-mesures médicales sur le continent africain. Ce programme financera le renforcement de sept réseaux de laboratoires régionaux africains, la constitution de stocks stratégiques de contre-mesures médicales pour les pathogènes prioritaires (Ebola, Lassa, Marburg, Mpox), et des transferts de technologie accélérés vers trois fabricants africains en phase d'industrialisation. HERA-Afrique cofinancera les essais cliniques de vaccins contre Ebola Bundibugyo et la fièvre de Lassa en Afrique subsaharienne, avec pour objectif que les données nécessaires aux autorisations réglementaires soient disponibles d'ici 2028. Le Dr Tedros Adhanom Ghebreyesus a salué ce programme comme une réponse concrète à la crise d'Ebola Bundibugyo qui a révélé la nécessité de disposer de ressources biomédicales africaines mobilisables en 72 heures. L'OMS coordonnera la mise en oeuvre avec Africa CDC, l'AMA, l'AUDA-NEPAD et les ministères de la santé des pays bénéficiaires.","date":"2026-08-22"},
{"title":"Résultats intermédiaires de phase 1 du vaccin mRNA-1403 de Moderna contre Ebola Bundibugyo : profil de sécurité favorable, passage en phase 2 en RDC envisagé pour octobre 2026","url":"https://cepi.net/moderna-mrna-1403-bundibugyo-phase1-interim-safety-results-august-2026","content":"Moderna et la Coalition pour les innovations en matière de préparation aux épidémies (CEPI) ont publié le 27 août 2026 les résultats intermédiaires de sécurité de l'essai de phase 1 du candidat vaccin mRNA-1403 contre le virus Ebola Bundibugyo. Sur 40 participants adultes sains ayant reçu les doses basses et intermédiaires (25 µg et 100 µg), aucun événement indésirable grave n'a été rapporté et les effets secondaires observés — douleur au site d'injection, fatigue légère transitoire — sont comparables au profil connu des autres vaccins mRNA de Moderna. Les données immunologiques préliminaires montrent une induction de titres d'anticorps neutralisants détectables dès J+14 chez 87 % des participants ayant reçu la dose de 100 µg, résultat jugé prometteur par le comité de surveillance des données. Sur cette base, Moderna et CEPI ont annoncé leur intention de soumettre une demande d'essai de phase 2 aux autorités congolaises et à Africa CDC pour octobre 2026, visant à évaluer l'immunogénicité et l'efficacité en population exposée dans les zones d'épidémie. Une telle accélération — cinq mois entre le premier essai humain et la phase 2 en zone épidémique — serait sans précédent pour un vaccin contre un filovirus, illustrant la mobilisation mondiale face à cette crise de santé publique.","date":"2026-08-27"},
{"title":"OMS publie un nouveau position paper sur les vaccins antityphoïdiques (août 2026) : les vaccins conjugués typhiques recommandés dès 6 mois dans les zones endémiques","url":"https://www.who.int/publications/i/item/who-wer10132-166-180","content":"L'Organisation mondiale de la Santé a publié en août 2026 une mise à jour de sa position officielle sur les vaccins contre la typhoïde (Weekly Epidemiological Record, Vol. 101, No. 32, pp. 166-180), remplaçant le document de 2018. Ce nouveau position paper place les vaccins conjugués typhiques (TCV) au coeur de la stratégie de prévention, en s'appuyant sur de nouvelles données démontrant leur supériorité immunologique et leur durabilité par rapport aux vaccins polysaccharidiques non conjugués. Les TCV sont recommandés en vaccination systématique dans les zones endémiques à partir de l'âge de 6 mois et peuvent être intégrés aux programmes nationaux d'immunisation de routine. La typhoïde cause environ 11 millions de cas et 128 000 décès par an dans le monde, avec les charges les plus lourdes en Asie du Sud et en Afrique subsaharienne. Ce document guidera les décisions d'achat des pays bénéficiaires du soutien de Gavi et les stratégies des programmes nationaux d'immunisation dans les pays les plus touchés par cette maladie évitable.","date":"2026-08-14"},
{"title":"Moderna lance le premier essai clinique spécifique contre le virus Ebola Bundibugyo, soutenu par la CEPI — une première mondiale","url":"https://cepi.net/modernas-bundibugyo-ebolavirus-vaccine-candidate-enters-first-human-trial-backed-cepi","content":"Pour la première fois dans l'histoire de la médecine, un vaccin candidat spécifiquement conçu contre le virus Ebola Bundibugyo entre en essai clinique de phase 1, développé par Moderna avec le soutien financier de la Coalition pour les innovations en matière de préparation aux épidémies (CEPI). L'essai est conduit sur trois sites au Canada et vise à évaluer la sécurité, la tolérance et la réponse immunitaire du candidat vaccin chez des participants sains adultes. Cette avancée scientifique intervient alors que l'épidémie de maladie à virus Bundibugyo en RDC est devenue la plus meurtrière de l'histoire de cette souche — plus de 4 000 cas et 2 000 décès à la mi-août 2026 — sans aucun vaccin ni traitement approuvé disponible. En parallèle, un essai de phase 1 portant sur un autre vaccin candidat Bundibugyo a débuté au Royaume-Uni le 24 juillet 2026. La mobilisation internationale illustre les leçons tirées de la crise COVID-19 : financer et préparer les ripostes vaccinales contre les pathogènes à potentiel épidémique avant qu'une crise ne survienne.","date":"2026-08-15"},
{"title":"OMS et DRC avancent vers un essai de vaccination en anneau par Ervebo contre Ebola Bundibugyo : données précliniques prometteuses","url":"https://www.statnews.com/2026/08/12/ebola-who-drc-ebola-vaccine-trial/","content":"Le 12 août 2026, des discussions avancées entre l'OMS et le gouvernement de la RDC concernant le lancement d'un essai clinique du vaccin Ervebo (rVSV-ZEBOV de Merck) en vaccination en anneau des contacts d'Ebola Bundibugyo ont été révélées par STAT News. Si Ervebo a été développé et approuvé pour le virus Ebola Zaïre, de nouvelles données précliniques montrent que 3 des 4 primates non-humains vaccinés ont survécu à une infection expérimentale par le virus Bundibugyo contre 1 seul dans le groupe contrôle — une efficacité partielle jugée suffisamment prometteuse. Une étude sur les furets avec une version de recherche d'Ervebo a de plus montré une protection à 100 % contre le Bundibugyo. Ces éléments ont conduit le Groupe consultatif d'urgence (ECG) d'Africa CDC, présidé par le Prof. Salim Abdool Karim, à soutenir fortement l'essai clinique et la vaccination compassionnelle des soignants, tout en soulignant que l'efficacité chez l'homme reste à démontrer.","date":"2026-08-12"},
{"title":"OMS met à jour sa position sur les vaccins COVID-19 : nouvelles recommandations pour la circulation soutenue de SARS-CoV-2 en 2026-2027","url":"https://www.who.int/publications/i/item/who-wer10130-138-156","content":"L'OMS a publié en juillet 2026 une mise à jour de sa position officielle sur les vaccins COVID-19 (Weekly Epidemiological Record, Vol. 101, No. 30, pp. 138-156), actualisant ses recommandations dans le contexte d'une circulation soutenue du SARS-CoV-2, de niveaux élevés d'immunité populationnelle et de la disponibilité de vaccins adaptés aux variants. L'OMS maintient sa recommandation d'une vaccination prioritaire pour les groupes les plus vulnérables — personnes âgées, immunodéprimées et professionnels de santé — tout en précisant les calendriers de rappel et les préférences entre plateformes vaccinales. Ce document remplace les orientations précédentes et constitue la référence mondiale pour les programmes nationaux en 2026-2027, intervenant dans un contexte de diversification des variants et d'interrogations croissantes sur la durée de protection des formulations actuelles. Il guidera notamment les décisions d'achat des pays à revenu faible et intermédiaire qui s'appuient sur le mécanisme COVAX pour leurs approvisionnements.","date":"2026-07-28"},
{"title":"Global childhood immunization coverage inches forward in 2025: 90% of infants received DTP but 14.5 million children remain unvaccinated — WUENIC 2025","url":"https://www.who.int/news/item/15-07-2026-global-childhood-immunization-coverage-inches-forward-despite-conflict-and-hesitancy---unicef--who","content":"WHO and UNICEF reported on July 15, 2026 that 90% of infants globally received at least one dose of the DTP vaccine in 2025, with 85% completing the full three-dose series — representing modest but real progress despite conflict and vaccine hesitancy. However, 14.5 million children worldwide remained completely unvaccinated in 2025, with the highest concentrations in conflict-affected and fragile states in sub-Saharan Africa and South Asia. Coverage gains were undermined in several countries by the 2025-2026 Ebola outbreak in DRC, which disrupted routine health services, and by funding cuts following the US withdrawal from international health commitments. The joint UNICEF-WHO WUENIC 2025 report calls for renewed investment in identifying and reaching zero-dose children, strengthening community health worker networks and cold chain infrastructure to meet Immunization Agenda 2030 targets.","date":"2026-07-15"},
{"title":"Cholera vaccine supply crisis resolved: WHO announces resumption of preventive mass vaccination campaigns worldwide","url":"https://www.who.int/news/item/04-02-2026-preventive-cholera-vaccination-resumes-as-global-supply-reaches-critical-milestone","content":"The World Health Organization announced on February 4, 2026 the resumption of preventive cholera vaccination campaigns following a critical milestone in global oral cholera vaccine (OCV) supply. The restoration ends a period of strict rationing that had forced WHO's International Coordinating Group to suspend preventive immunization since late 2022 — a constraint that had severely hampered outbreak control in Africa, Asia and the Caribbean. The supply breakthrough came from expanded production at Shantha Biotechnics in India and continued output from Eubiologics in South Korea. The announcement is particularly significant for Africa, where cholera outbreaks in DRC, Sudan, Ethiopia and Zimbabwe have caused thousands of deaths since 2022. WHO estimates that scaling up preventive vaccination could avert approximately 2 million cases and 70 000 deaths in endemic countries over the next five years.","date":"2026-02-04"},
{"title":"Ebola Bundibugyo : l'absence de vaccins approuvés met en alerte la communauté scientifique internationale","url":"https://www.cdc.gov/ebola/situation-summary/returning-travelers.html","content":"Alors que l'épidémie de maladie à virus Bundibugyo continue de s'étendre en RDC et en Ouganda, les autorités sanitaires mondiales tirent la sonnette d'alarme sur l'absence de vaccins ou de traitements spécifiquement approuvés contre cette souche. Le CDC américain a publié le 1er juillet 2026 des recommandations pour les voyageurs en provenance des zones affectées, incluant une surveillance des symptômes pendant 21 jours et un renforcement des contrôles sanitaires aux points d'entrée. La communauté scientifique internationale appelle à une accélération des essais cliniques et du développement de candidats vaccins contre le virus Bundibugyo, soulignant que les vaccins disponibles actuellement ont été développés pour d'autres souches du genre Ebolavirus et n'offrent pas de protection croisée confirmée.","date":"2026-07-10"},
{"title":"OMS et UNICEF : publication des estimations actualisées de couverture vaccinale nationale WUENIC 2025","url":"https://immunizationdata.who.int/","content":"L'OMS et l'UNICEF publient en juillet 2026 les estimations actualisées de couverture vaccinale nationale (WUENIC 2025), données de référence annuelles sur l'état de l'immunisation dans le monde entier, avec un webinaire de présentation des résultats programmé le 15 juillet 2026. Ces statistiques par pays et par antigène orientent les stratégies d'investissement de Gavi, de l'UNICEF et des gouvernements partenaires pour identifier les populations prioritaires en matière de rattrapage vaccinal. Elles constituent le principal outil de suivi des progrès vers les objectifs mondiaux de vaccination et d'élimination des maladies évitables. Dans un contexte de réduction des financements internationaux, ces données sont plus que jamais cruciales pour cibler les ressources disponibles vers les pays et populations les plus vulnérables.","date":"2026-07-07"},
{"title":"OMS : le Comité PDVAC se réunit le 6 juillet 2026 pour définir les priorités mondiales de développement vaccinal","url":"https://www.who.int/news-room/events/detail/2026/07/06/default-calendar/2026-who-product-development-for-vaccines-advisory-committee-meeting-(pdvac)","content":"Le Comité consultatif pour le développement de produits vaccinaux (PDVAC) de l'OMS tient sa réunion annuelle le 6 juillet 2026 pour examiner les priorités mondiales en matière de R&D vaccinale, notamment les candidats-vaccins contre le virus Bundibugyo, la dengue, le paludisme et d'autres pathogènes prioritaires. Ce comité d'experts indépendants — virologues, immunologistes et spécialistes de santé publique — formule des recommandations sur les technologies vaccinales à prioriser, les essais cliniques à soutenir et les mécanismes d'accès équitable. Dans le contexte de la crise Ebola Bundibugyo, le PDVAC joue un rôle critique pour guider les investissements en R&D et accélérer le développement de contre-mesures médicales adaptées à ce virus pour lequel aucun vaccin homologué n'existe à ce jour. Ses recommandations orienteront les stratégies d'investissement des grandes institutions mondiales de santé pour les années à venir.","date":"2026-07-06"},

function isRecent(d){if(!d)return false;var date=new Date(d),now=new Date(),diff=(now-date)/(1000*60*60*24);return diff<=1.5;}
function renderCategories(){var el=document.getElementById("categories");el.innerHTML=CATEGORIES.map(function(c){var articles=articlesData[c.id]||[];var newCount=articles.filter(function(a){return isRecent(a.date)}).length;var badge=newCount>0?'<span style="font-size:9px;background:#E8A020;color:#fff;padding:1px 5px;border-radius:4px;margin-left:4px;font-weight:800">'+newCount+' NEW</span>':"";return'<button class="cat-btn '+(activeCategory===c.id&&!isCustomSearch?"active":"")+'" data-id="'+c.id+'"><div class="cat-icon">'+c.icon+'</div><div class="cat-label">'+c.label+badge+'</div><div class="cat-desc">'+c.desc+'</div></button>';}).join("");el.querySelectorAll(".cat-btn").forEach(function(b){b.addEventListener("click",function(){isCustomSearch=false;activeCategory=b.dataset.id;renderCategories();renderArticles();});});}
function renderArticles(){var container=document.getElementById("articles");var articles=articlesData[activeCategory]||[];var info=document.getElementById("toolbarInfo");var newArticles=articles.filter(function(a){return isRecent(a.date)});var newCountEl=document.getElementById("newCount");info.textContent=articles.length+" articles";if(newArticles.length>0){newCountEl.style.display="inline";newCountEl.textContent="NEW "+newArticles.length+" nouveau"+(newArticles.length>1?"x":"");}else{newCountEl.style.display="none";}if(!articles.length){container.innerHTML='<div class="spinner-wrap" style="padding:40px 0"><div style="font-size:52px;opacity:.3;margin-bottom:14px">📰</div><div class="spinner-text">Aucun article</div></div>';return;}container.innerHTML=articles.map(function(a,i){var domain=extractDomain(a.url),color=getSourceColor(domain),dateStr=timeAgo(a.date);var isNew=isRecent(a.date);return'<div class="article-card'+(isNew?" is-new":"")+'" style="animation-delay:'+i*.06+'s"><div class="article-inner"><div class="article-bar" style="background:'+color+'"></div><div class="article-body"><a href="'+a.url+'" target="_blank" rel="noopener" class="article-title">'+(isNew?'<span class="badge-new">NOUVEAU</span> ':'')+a.title+'</a><div class="article-content collapsed" id="c-'+i+'">'+a.content+'</div><div class="article-meta"><span class="source-tag" style="background:'+color+'14;color:'+color+'">'+domain+'</span>'+(dateStr?'<span class="date-tag">'+dateStr+'</span>':'')+'<button class="expand-btn" data-i="'+i+'">Lire plus</button></div></div></div></div>';}).join("");container.querySelectorAll(".expand-btn").forEach(function(b){b.addEventListener("click",function(){var el=document.getElementById("c-"+b.dataset.i);var c=el.classList.toggle("collapsed");b.textContent=c?"Lire plus":"Reduire";});});}
function doSearch(){var val=document.getElementById("searchInput").value.trim().toLowerCase();if(!val){isCustomSearch=false;renderCategories();renderArticles();return;}isCustomSearch=true;var allArticles=[];Object.values(articlesData).forEach(function(arr){if(Array.isArray(arr))arr.forEach(function(a){allArticles.push(a)})});var filtered=allArticles.filter(function(a){return(a.title+a.content).toLowerCase().includes(val)});activeCategory="search-custom";articlesData["search-custom"]=filtered;renderCategories();renderArticles();}
document.getElementById("searchBtn").addEventListener("click",doSearch);
document.getElementById("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
document.getElementById("updateDate").textContent=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
renderCategories();
renderArticles();
</script>
</body>
</html>
