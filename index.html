{"title":"UNICEF : premier bilan de la campagne d'urgence antirougeoleuse en RDC — 1,1 million d'enfants vaccinés en 10 jours dans les zones Ebola","url":"https://www.unicef.org/press-releases/unicef-measles-campaign-drc-ebola-first-results-september-2026","content":"L'UNICEF a publié le 4 septembre 2026 un premier bilan de la campagne d'urgence de vaccination antirougeoleuse lancée le 25 août 2026 dans les cinq provinces de la RDC affectées par l'épidémie d'Ebola Bundibugyo. En dix jours d'opérations, 1,1 million d'enfants de 6 mois à 14 ans ont été vaccinés contre la rougeole sur la cible de 1,4 million — soit un taux de réalisation de 79 % — grâce aux 2 800 équipes de vaccination déployées avec des stratégies adaptées au contexte sécuritaire. Le taux de couverture atteint dans la province de l'Ituri est jugé satisfaisant (84 %), tandis que les zones les plus enclavées du Nord-Kivu et du Sud-Kivu nécessitent des rotations supplémentaires d'équipes mobiles programmées pour la semaine du 7 septembre. L'UNICEF signale que 47 enfants vaccinés présentaient simultanément des symptômes suspects d'Ebola, illustrant la complexité opérationnelle de conduire une campagne de vaccination de routine dans une zone d'épidémie active. La campagne est financée à hauteur de 18 millions USD par Gavi, l'Union européenne et le CERF, et devrait être complétée avant le 15 septembre 2026.","date":"2026-09-04"},
{"title":"Gavi : approbation du financement de l'introduction du vaccin HPV dans 12 nouveaux pays africains pour 2027 — 320 millions USD sur cinq ans","url":"https://www.gavi.org/news/media-room/gavi-hpv-vaccine-12-new-african-countries-approved-september-2026","content":"Le Comité d'approbation des programmes de Gavi a approuvé le 3 septembre 2026 le financement de l'introduction du vaccin contre le papillomavirus humain (HPV) dans 12 nouveaux pays africains en 2027 — Bénin, Burkina Faso, Cameroun, Congo, Érythrée, Gambie, Guinée équatoriale, Libéria, Mauritanie, Niger, Sierra Leone et Soudan du Sud — portant à 40 le nombre de pays africains soutenus par Gavi pour la prévention des cancers du col de l'utérus. Cette approbation représente une enveloppe de 320 millions USD sur cinq ans couvrant l'achat de doses, le renforcement de la chaîne du froid, la formation des agents de santé et les campagnes de sensibilisation. En Afrique subsaharienne, le cancer du col de l'utérus est le deuxième cancer féminin le plus fréquent, causant plus de 70 000 décès par an — dont 90 % dans des pays à faible revenu. L'accord de tarification négocié par Gavi avec Serum Institute of India et MSD permet d'acquérir le vaccin HPV à moins de 3,50 USD par dose, un coût abordable grâce au mécanisme de cofinancement progressif de l'Alliance. Cette expansion marque une accélération historique : seulement 8 pays africains proposaient la vaccination HPV en 2020 contre 40 d'ici fin 2027.","date":"2026-09-03"},
{"title":"UNICEF lance une campagne d'urgence de vaccination antirougeoleuse en RDC : 1,4 million d'enfants ciblés dans cinq provinces affectées par Ebola","url":"https://www.unicef.org/press-releases/unicef-emergency-measles-vaccination-campaign-drc-ebola-provinces-august-2026","content":"L'UNICEF a annoncé le 25 août 2026 le lancement d'une campagne d'urgence de vaccination contre la rougeole ciblant 1,4 million d'enfants de 6 mois à 14 ans dans les cinq provinces de la RDC touchées par l'épidémie d'Ebola Bundibugyo — Ituri, Nord-Kivu, Sud-Kivu, Haut-Uélé et Tshopo. La perturbation des services de vaccination de routine due à la crise Ebola a fait chuter la couverture vaccinale antirougeoleuse à moins de 60 % dans certaines zones de santé en juillet 2026, créant les conditions d'une épidémie de rougeole imbriquée. L'opération, financée à hauteur de 18 millions USD par Gavi, l'Union européenne et le CERF (Fonds central d'intervention d'urgence de l'ONU), mobilise 2 800 équipes de vaccination avec des stratégies adaptées au contexte sécuritaire — équipes mobiles pour les zones inaccessibles, vaccination domiciliaire dans les communautés les plus méfiantes. L'UNICEF souligne que maintenir la vaccination de routine dans les zones d'urgence est aussi crucial que la riposte directe à Ebola, car les enfants malnutris non vaccinés présentent des risques cumulés de mortalité bien supérieurs. Cette campagne s'inscrit dans le plan de réponse Ebola évalué à 518 millions USD co-financé par Africa CDC, l'OMS et leurs partenaires internationaux.","date":"2026-08-25"},
{"title":"Gavi mobilise 340 millions USD pour la R&D vaccinale contre les pathogènes à potentiel épidémique en Afrique : Ebola Bundibugyo, Lassa et Marburg en tête des priorités","url":"https://www.gavi.org/news/media-room/gavi-340-million-epidemic-preparedness-vaccine-rd-africa-august-2026","content":"Gavi, l'Alliance du vaccin, a annoncé le 19 août 2026 la mobilisation de 340 millions USD supplémentaires — apportés par l'Allemagne, le Royaume-Uni, la Norvège et la Fondation Bill & Melinda Gates — pour accélérer la recherche, le développement et le pré-achat de vaccins contre les cinq pathogènes présentant le plus grand risque épidémique pour l'Afrique : Ebola Bundibugyo, Ebola Zaïre, fièvre de Lassa, fièvre de Marburg et Mpox. Ce financement vise à corriger un déséquilibre structurel : les vaccins contre les pathogènes prioritaires africains reçoivent historiquement moins de 3 % du financement mondial de R&D vaccinale malgré leur impact disproportionné sur la mortalité continentale. Une partie des fonds sera allouée via la CEPI pour soutenir les essais en cours de Moderna (mRNA-1403) et un candidat vaccin développé par l'Institut Jenner d'Oxford avec deux laboratoires africains partenaires. L'UNICEF assurera la chaîne d'achat et d'approvisionnement dès l'obtention des autorisations réglementaires OMS, garantissant un accès prioritaire aux pays africains les plus exposés. Gavi a également confirmé l'extension du mécanisme d'engagement anticipé de marché (AMC) aux vaccins contre les filovirus pour la première fois dans l'histoire de l'Alliance.","date":"2026-08-19"},
{"title":"Gavi Board reaffirms ambition to vaccinate 500 million additional children, secures 500 million euro EIB lifeline despite global funding pressures","url":"https://www.gavi.org/news/media-room/gavi-board-meeting-underlines-commitment-country-sovereignty-fragility-health-security","content":"At its July 2, 2026 Board meeting, Gavi, the Vaccine Alliance, reaffirmed its Gavi 6.0 strategy targets: reaching 500 million additional children with immunization, preventing 8-9 million deaths, and supporting a further 10% reduction in under-five mortality through 2030, unlocking over USD 100 billion in economic benefits. Despite a financially constrained environment worsened by US USAID cuts and the US withdrawal from WHO, the Board approved extension of the European Investment Bank (EIB) Frontloading Facility through end-2026, allowing Gavi to draw up to 500 million euros against future donor pledges to ensure continuity of core immunization programmes. The Board placed renewed emphasis on country sovereignty, support for fragile and humanitarian settings, and strengthening Africa's vaccine manufacturing capacity — recognizing that the Bundibugyo Ebola outbreak exposed the critical vulnerability of a continent producing less than 1% of the vaccines it consumes. This meeting positioned Gavi as a stabilizing force in global health financing at a moment of unprecedented disruption in international development assistance.","date":"2026-07-02"},
{"title":"OMS-UNICEF août 2026 : la couverture vaccinale mondiale progresse mais 14,5 millions d'enfants restent non vaccinés face aux perturbations d'Ebola et aux coupes de financement américaines","url":"https://www.who.int/news/item/14-08-2026-global-childhood-immunization-coverage-inches-forward-despite-conflict-and-hesitancy","content":"Un rapport conjoint OMS-UNICEF publié le 14 août 2026 confirme que la couverture vaccinale mondiale a continué de progresser en 2025, avec 90 % des nourrissons ayant reçu au moins une dose du vaccin DTCa. Toutefois, 14,5 millions d'enfants restent entièrement non vaccinés dans le monde, avec les concentrations les plus élevées dans les États fragiles et touchés par les conflits en Afrique subsaharienne et en Asie du Sud. L'épidémie d'Ebola Bundibugyo en RDC a gravement perturbé les services de santé de routine dans les provinces affectées, inversant des années de gains pour les vaccins contre la rougeole, la poliomyélite et les maladies infantiles. Les coupes de 90 % du financement USAID américain à la vaccination et le retrait des États-Unis de l'OMS ont créé une pression financière aiguë sur les programmes couvrant environ 54 millions d'enfants. Le rapport appelle à un renouvellement urgent des investissements pour atteindre les enfants zéro-dose et renforcer les réseaux d'agents de santé communautaires dans les pays les plus vulnérables.","date":"2026-08-14"},
{"title":"Gavi and UNICEF announce equitable pricing deal for malaria vaccine to protect 7 million more children by end of decade","url":"https://www.unicef.org/press-releases/gavi-and-unicef-announce-equitable-pricing-deal-malaria-vaccine-protect-7-million","content":"Gavi, the Vaccine Alliance, and UNICEF announced a landmark equitable pricing agreement for malaria vaccines enabling access for an additional 7 million children in endemic African countries by the end of the decade. As of January 2026, over 39 million doses had been delivered to 25 endemic countries with Gavi support, including Guinea-Bissau's inaugural introduction in 2026. The malaria vaccine has become one of the fastest-scaling interventions in Africa's immunization history: 14 countries introduced it for the first time in 2024 and 7 more — Burundi, Uganda, Mali, Guinea, Togo, Ethiopia and Zambia — followed in 2025. The pricing deal unlocks access for lower-income countries where cost had remained a barrier, and complements WHO's continued endorsement of both RTS,S/AS01E and R21 vaccines as essential tools for reducing under-5 malaria mortality in high-burden African countries.","date":"2026-07-15"},
{"title":"UNICEF and Gavi issue Request for Expression of Interest for Bundibugyo Ebolavirus vaccines amid deadly outbreak in DRC and Uganda","url":"https://www.gavi.org/news-resources/media-room/news-releases","content":"In June 2026, UNICEF and Gavi jointly issued a Request for Expression of Interest (REoI) to accelerate access to vaccines and therapeutics targeting the Bundibugyo Ebolavirus strain, as the ongoing outbreak in DRC and Uganda had caused hundreds of confirmed deaths with no approved countermeasures available. The REoI invites vaccine developers to present data on candidate vaccines or experimental therapeutics in advanced development, with the goal of identifying products eligible for Emergency Use Listing or compassionate-use protocols. This initiative mirrors the COVAX model deployed during COVID-19, applying an access-before-approval approach to Africa's most lethal ongoing outbreak. The move also reflects a broader structural shift: as US USAID funding faces 90% cuts, multilateral health organisations are moving faster and more autonomously to fill critical gaps in outbreak response financing and procurement, underscoring the urgent need to build permanent African-led funding mechanisms.","date":"2026-06-20"},
{"title":"Africa's routine vaccine systems deliver gains against cancer and malaria but face 800 million USD funding gap — WHO AFRO 2026 assessment","url":"https://www.afro.who.int/news/africas-routine-vaccine-systems-deliver-gains-against-cancer-and-malaria-funding-pressures","content":"A 2026 WHO Regional Office for Africa (WHO AFRO) assessment found that routine immunization systems across Africa are registering meaningful gains in HPV vaccination for cancer prevention and malaria vaccine rollout, even as a financing gap of over 800 million USD threatens to reverse these gains through 2027. HPV vaccination has expanded to 11 new African countries since 2023 through Gavi support, while malaria vaccine coverage has grown rapidly in East and West Africa. However, the 90% cut in US USAID immunization funding and the US withdrawal from WHO have created acute pressure on programmes covering 54 million children. Partners including Gavi, UNICEF and the African Development Bank are being urgently called upon to bridge this gap. Joint UNICEF-WHO WUENIC 2025 data published in July 2026 confirm that 90% of infants globally received at least one DTP dose in 2025, but 14.5 million children remain completely unvaccinated worldwide.","date":"2026-07-20"},
{"title":"Face à Ebola Bundibugyo, UNICEF et Gavi au cœur de la stratégie de préparation épidémique en Afrique","url":"https://www.facebook.com/africacdc/posts/-postponement-notice-weekly-press-briefingthis-weeks-briefing-has-been-postponed/1428976145927422","content":"Alors que l'Africa CDC reorganise sa réponse à l'épidémie d'Ebola Bundibugyo sous l'impulsion de la mission du Président Cyril Ramaphosa, Champion de l'Union africaine pour la prévention, la préparation et la réponse aux pandémies (PPPR), en RDC, des partenaires clés comme l'UNICEF et Gavi intensifient leur soutien opérationnel sur le terrain. Ces organisations contribuent au renforcement des systèmes de santé communautaires, à la chaîne du froid pour les produits médicaux disponibles, à l'éducation sanitaire des populations et à la coordination logistique des interventions d'urgence. La solidarité internationale, rappelée lors du briefing de l'Africa CDC, demeure essentielle face à une épidémie qui ne dispose pas encore de vaccin approuvé.","date":"2026-07-10"},
{"title":"Gavi et UNICEF mobilisés pour soutenir la riposte à l'épidémie d'Ebola en Afrique centrale","url":"https://www.facebook.com/africacdc/videos/special-briefing-on-ebola-outbreak-response-july-9-2026/1574351157729456","content":"Dans le cadre de la réponse à l'épidémie de maladie à virus Bundibugyo en RDC et en Ouganda, les partenaires internationaux dont Gavi, l'Alliance pour les vaccins, et l'UNICEF sont étroitement associés aux efforts de coordination continentale. Ces organisations apportent leur expertise logistique, leur soutien financier et leurs capacités de déploiement rapide pour appuyer les gouvernements affectés. Le briefing spécial de l'Africa CDC du 9 juillet 2026 a réaffirmé l'importance de la solidarité internationale et des partenariats solides dans la lutte contre les épidémies, soulignant que la coordination entre l'Union africaine, l'OMS, Gavi et l'UNICEF constitue la pierre angulaire d'une riposte efficace et équitable pour les communautés à risque.","date":"2026-07-10"},
{"title":"Gavi et UNICEF mobilisés face à la crise vaccinale en Afrique : l'épidémie Ebola révèle les lacunes du système","url":"https://www.infectioncontroltoday.com/view/2026-ebola-outbreak-spreads-central-africa-who-warns-growing-crisis-amid-cdc-usaid-cuts","content":"Alors que l'épidémie d'Ebola Bundibugyo continue de se propager en RDC et en Ouganda avec plus de 513 cas et 130 décès suspects, les organisations internationales dont Gavi et l'UNICEF font face à une pression croissante pour combler le vide laissé par les coupes budgétaires américaines. La réduction de 90 % du financement de l'USAID et le retrait des États-Unis de l'OMS ont sévèrement compromis les efforts de réponse. Dans ce contexte, les partenaires onusiens sont appelés à redoubler d'efforts pour maintenir les programmes de vaccination et de préparation aux épidémies sur le continent africain, en particulier dans les zones de conflit et les corridors commerciaux à haut risque.","date":"2026-07-09"},
],
"sante-maroc":[
{"title":"Rentrée 2026-2027 au Maroc : lancement du programme national de vaccination HPV pour les filles de 11 ans dans toutes les écoles publiques","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=778","content":"Le ministère de la Santé et de la Protection sociale a annoncé le 2 septembre 2026 le lancement du programme national de vaccination contre le papillomavirus humain (HPV) à l'école, ciblant l'ensemble des filles de 11 ans scolarisées dans les établissements publics marocains pour la rentrée 2026-2027. Ce programme, cofinancé par le Fonds Hassan II et le budget national de santé, couvrira environ 350 000 jeunes filles dans les 12 régions du Royaume et s'appuiera sur les infirmières scolaires et les équipes mobiles du ministère pour assurer deux doses de vaccin HPV à 6 mois d'intervalle. Le Maroc rejoint ainsi les 24 pays africains — contre 8 en 2020 — ayant intégré la vaccination HPV dans leur programme national d'immunisation, une avancée dans la lutte contre le cancer du col de l'utérus, deuxième cause de mortalité par cancer chez les femmes marocaines avec environ 2 500 décès annuels. Le vaccin utilisé est le Cervarix de GSK, acheté à prix préférentiel dans le cadre d'un accord-cadre avec l'OMS. Le ministre Amine Tehraoui a précisé que ce programme sera étendu aux garçons de 11 ans dès la rentrée 2027-2028.","date":"2026-09-02"},
{"title":"Maroc : signature avec l'OMS-EMRO d'un partenariat quinquennal de 12 millions USD pour renforcer la surveillance épidémiologique nationale 2026-2030","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=775","content":"Le ministère de la Santé et de la Protection sociale du Maroc et le Bureau régional de l'OMS pour la Méditerranée orientale (EMRO) ont signé le 5 septembre 2026 un partenariat de coopération technique quinquennal (2026-2030) pour le renforcement du système national de surveillance épidémiologique, de détection précoce des alertes sanitaires et de préparation aux urgences de santé publique. Ce partenariat de 12 millions USD prévoit la modernisation du réseau des 36 laboratoires régionaux et provinciaux du Royaume, l'acquisition d'équipements de séquençage génomique et l'accès aux bases de données mondiales de détection des menaces épidémiques. Un volet de formation de 500 épidémiologistes de terrain en cinq ans est intégré, dans le cadre du programme FETP (Field Epidemiology Training Programme) accrédité par Africa CDC. Dans un contexte de flambées épidémiques récurrentes sur le continent africain — notamment l'épidémie d'Ebola Bundibugyo en RDC — ce partenariat renforce la capacité du Maroc à détecter et contenir toute importation de pathogènes prioritaires. Le Maroc est par ailleurs candidat à l'accréditation par Africa CDC comme Centre régional de référence pour la surveillance épidémiologique en Afrique du Nord.","date":"2026-09-05"},
{"title":"Maroc : l'AMO-Tadamon franchit le cap de 12 millions de bénéficiaires — le gouvernement vise 22 millions couverts avant fin 2026","url":"https://www.lebrief.ma/amo-tadamon-12-millions-beneficiaires-couverture-sante-maroc-2026-100154122/","content":"Le ministre marocain de la Santé et de la Protection sociale, Amine Tehraoui, a annoncé le 24 août 2026 que l'AMO-Tadamon — le régime d'Assurance maladie obligatoire destiné aux populations économiquement défavorisées — a atteint le cap de 12 millions de bénéficiaires, contre 9,3 millions fin 2025, soit une progression de 29 % en moins d'un an. Cet essor est attribué à l'intensification des campagnes d'inscription dans les zones rurales et périurbaines, à la simplification des démarches via les agences de la CNSS et au déploiement d'équipes mobiles dans les provinces les plus reculées. Le gouvernement maintient l'objectif ambitieux d'atteindre 22 millions de bénéficiaires d'ici fin 2026 — soit 10 millions supplémentaires en cinq mois —, un défi logistique qui mobilise l'ensemble de l'administration territoriale. Le panier de soins de l'AMO-Tadamon a été élargi en juin 2026 pour inclure les soins dentaires de base, l'optique médicale et la prise en charge des maladies chroniques, renforçant l'attractivité du régime. Cette couverture sanitaire universelle constitue l'un des piliers de la réforme de l'État social portée par Sa Majesté le Roi Mohammed VI depuis son discours du Trône 2020.","date":"2026-08-24"},
{"title":"Inauguration du CHU Mohamed VI de Béni Mellal : 850 lits, 14 spécialités et une première historique pour la région Béni Mellal-Khénifra","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=762","content":"Le Centre hospitalier universitaire Mohamed VI de Béni Mellal a été inauguré officiellement le 17 août 2026 en présence du ministre de la Santé, marquant la première fois que cette région d'environ 2,5 millions d'habitants dispose d'un établissement hospitalier universitaire de référence. D'une superficie de 35 000 m², le CHU comprend 850 lits fonctionnels répartis dans 14 spécialités médicales et chirurgicales — dont la neurologie, la cardiologie interventionnelle, l'oncologie et la réanimation néonatale — ainsi qu'un plateau technique intégrant un scanner 128 coupes, deux IRM et un bloc opératoire de 12 salles. Cet investissement de 1,2 milliard de dirhams vise à réduire l'exode des patients de la région vers Casablanca ou Rabat, qui représentait plus de 40 000 transferts annuels selon le ministère de la Santé. Le CHU est adossé à la Faculté de médecine et de pharmacie de Béni Mellal, permettant la formation de 300 étudiants en médecine et 120 résidents par an. Son inauguration porte à 19 le nombre de CHU opérationnels au Maroc, dans le cadre du programme de couverture universitaire hospitalière de toutes les régions du Royaume d'ici fin 2027.","date":"2026-08-17"},
{"title":"Maroc : 15 projets hospitaliers achevés d'ici fin 2026, environ 3 000 lits supplémentaires pour corriger les inégalités territoriales d'accès aux soins","url":"https://www.lebrief.ma/sante-15-hopitaux-seront-acheves-en-2026-100148453/","content":"Le ministre marocain de la Santé et de la Protection sociale, Amine Tehraoui, a annoncé l'achèvement de quinze projets hospitaliers à travers le Royaume d'ici la fin de l'année 2026, représentant près de 3 000 lits supplémentaires dans le parc hospitalier national. Ces infrastructures s'inscrivent dans la réforme structurelle du système de santé marocain portée par la Vision royale de l'État social, et viennent compléter l'enveloppe budgétaire de 2,5 milliards de dirhams mobilisée en 2026 pour les Centres hospitaliers provinciaux et régionaux ainsi que pour les hôpitaux de psychiatrie et de spécialités. L'objectif est de corriger les inégalités territoriales d'accès aux soins hospitaliers, notamment dans les zones rurales et semi-urbaines encore sous-dotées en infrastructures spécialisées. D'ici fin 2027, toutes les régions du Maroc — à l'exception de Dakhla-Oued Eddahab — seront dotées de leur propre Centre hospitalier universitaire (CHU), conformément aux engagements du gouvernement en matière de couverture sanitaire universelle et de déconcentration de l'offre de soins spécialisés.","date":"2026-07-10"},
{"title":"Maroc : trois nouveaux Groupements sanitaires territoriaux opérationnels en août 2026, vers une gouvernance sanitaire régionale intégrée","url":"https://www.sante.gov.ma/Pages/actualites.aspx?IDActu=755","content":"La première semaine d'août 2026 a marqué une nouvelle étape dans la mise en oeuvre de la réforme du système de santé marocain avec l'opérationnalisation de trois nouveaux Groupements sanitaires territoriaux (GST), s'ajoutant aux entités déjà lancées dans le cadre de la loi-cadre 06-22. Les GST coordonnent l'ensemble des établissements de soins d'une même région — secteur public, secteur privé à but non lucratif et hôpitaux militaires — pour offrir un continuum de soins intégré et améliorer l'accès des populations, en particulier en milieu rural. En parallèle, le déploiement du carnet de vaccination numérique via l'application Santé Maroc se poursuit, permettant la dématérialisation du suivi vaccinal des enfants et des adultes, facilitant la coordination entre professionnels de santé et l'identification des personnes en retard sur leur calendrier vaccinal. Le Comité de pilotage de la réforme a confirmé que 2026 constitue l'année du test pour ce dispositif ambitieux, avec des ajustements progressifs pour lever les résistances organisationnelles identifiées lors des premières phases de mise en oeuvre.","date":"2026-08-10"},
{"title":"Maroc : l'Agence marocaine du médicament et des produits de santé (AMMPS) entre en fonction pour moderniser la régulation pharmaceutique nationale","url":"https://www.leconomiste.com/sante-les-chantiers-2026/","content":"L'année 2026 marque l'entrée en fonction effective de l'Agence marocaine du médicament et des produits de santé (AMMPS), qui succède à la direction du médicament et de la pharmacie relevant du ministère de la Santé. Dotée d'une autonomie institutionnelle et opérationnelle renforcée, l'AMMPS sera chargée d'évaluer, d'homologuer et de surveiller les médicaments, dispositifs médicaux et produits biologiques mis sur le marché marocain, avec des standards alignés sur les pratiques européennes. Sa création s'inscrit dans la réforme structurelle du système de santé portée par Sa Majesté le Roi Mohammed VI pour bâtir un État social moderne. L'AMMPS est également appelée à renforcer la collaboration du Maroc avec l'Agence africaine des médicaments (AMA) et à positionner le Royaume comme hub réglementaire régional en Afrique, notamment dans le contexte du développement de capacités de fabrication de vaccins à Casablanca avec Sanofi et Marbio.","date":"2026-06-01"},
{"title":"Marbio et Sanofi lancent la co-production de vaccins à Casablanca : le Maroc s'intègre à l'écosystème africain de fabrication locale","url":"https://healthpolicy-watch.news/landmark-vaccine-deals-signal-africas-shift-toward-local-manufacturing/","content":"Le partenariat entre la biotech marocaine Marbio et le groupe pharmaceutique Sanofi pour co-produire deux vaccins dans une nouvelle usine à Casablanca positionne le Maroc comme l'un des pionniers de la fabrication locale de vaccins en Afrique du Nord. Cette collaboration, soutenue par le mécanisme AVMA de Gavi doté de 1,2 milliard USD sur 10 ans, s'inscrit dans l'ambition africaine de produire 60 % des vaccins utilisés sur le continent d'ici 2040, contre moins de 1 % actuellement. Pour le Royaume, cette initiative renforce la souveraineté sanitaire nationale, développe des compétences industrielles biopharmaceutiques locales et crée des emplois qualifiés dans le secteur de la santé. Le Maroc bénéficie d'une position géographique et réglementaire favorable pour exporter vers les marchés africains, s'appuyant sur l'harmonisation progressive en cours sous l'égide de l'AMA. Gavi procédera aux premiers décaissements du fonds AVMA vers les fabricants africains dans le second semestre 2026.","date":"2026-07-02"},
{"title":"Le Maroc consolide son système de santé publique à l'aune des défis épidémiques continentaux","url":"https://microbiotics.com.ng/africa-cdc-strategic-plan-2022-2026?pdf=4936","content":"Dans un contexte de flambées épidémiques récurrentes sur le continent africain, le Maroc renforce ses dispositifs de veille sanitaire et de réponse aux urgences de santé publique. Le Royaume s'appuie sur son réseau de laboratoires de référence et sur ses partenariats avec des institutions internationales telles qu'Africa CDC et l'OMS pour détecter précocement toute menace épidémique. Le Plan stratégique 2022-2026 d'Africa CDC, qui prévoit un Centre de coordination régional pour l'Afrique du Nord basé au Caire, constitue une opportunité pour le Maroc de renforcer son intégration dans l'architecture continentale de sécurité sanitaire. Les autorités marocaines veillent par ailleurs à maintenir des capacités de prise en charge des maladies à potentiel épidémique importées, dans le respect des Règlements sanitaires internationaux.","date":"2026-07-04"},
{"title":"Budget santé 2026 au Maroc : 42,4 milliards de dirhams, une hausse de 30 % et 8 000 nouveaux postes budgétaires","url":"https://aujourdhui.ma/actualite/un-budget-en-hausse-de-30-et-8-000-nouveaux-postes-424-milliards-de-dirhams-pour-la-sante-en-2026","content":"Le ministère marocain de la Santé et de la Protection sociale dispose en 2026 d'un budget record de 42,4 milliards de dirhams, en hausse de 30 % par rapport à l'exercice précédent, dans le cadre de la réforme structurelle du système national de santé portée par la Vision royale de l'État social. Sur cette enveloppe, 16,4 milliards de dirhams sont dédiés aux dépenses de personnel, avec la création de 8 000 nouveaux postes budgétaires pour renforcer les ressources humaines à tous les niveaux du système de soins. Les investissements prioritaires de 2026 incluent la construction de nouveaux Centres hospitaliers universitaires (CHU), la mise à niveau de 90 hôpitaux existants et le déploiement progressif des Groupements sanitaires territoriaux (GST). D'ici fin 2027, toutes les régions du Maroc, à l'exception de Dakhla-Oued Eddahab, disposeront de leur propre CHU.","date":"2026-07-03"},
{"title":"Réforme de l'état social au Maroc : la santé change d'échelle avec les Groupements sanitaires territoriaux","url":"https://leseco.ma/maroc/reforme-de-letat-social-la-sante-change-dechelle-non-sans-resistances.html","content":"La réforme du secteur de la santé au Maroc entre en 2026 dans une phase décisive avec l'opérationnalisation progressive des Groupements sanitaires territoriaux (GST), nouvelles entités de gouvernance régionale chargées d'intégrer et de coordonner l'ensemble des établissements de santé d'une même région. Cette restructuration vise à mettre fin à la fragmentation du système de soins, à améliorer l'accès aux soins en milieu rural et semi-urbain, et à renforcer la complémentarité entre les secteurs public et privé. Si l'ambition réformatrice est globalement saluée, des résistances subsistent parmi les professionnels de santé face aux changements organisationnels, notamment concernant la mobilité des personnels et la redistribution des compétences entre niveaux de soins. La généralisation de la feuille de soins électronique constitue un autre chantier prioritaire de 2026, visant à simplifier les démarches administratives et améliorer la traçabilité des soins.","date":"2026-07-01"},
],

{"title":"Essai Ervebo en anneau contre Ebola Bundibugyo : l'OMS publie le protocole clinique et les critères d'efficacité retenus pour l'évaluation accélérée","url":"https://www.who.int/news/item/05-09-2026-who-ervebo-ring-vaccination-trial-protocol-bundibugyo","content":"L'Organisation mondiale de la Santé a publié le 5 septembre 2026 le protocole clinique intégral de l'essai de vaccination en anneau par Ervebo (rVSV-ZEBOV de Merck) contre l'Ebola Bundibugyo en RDC, lancé le même jour à Bunia et Beni. Le protocole, co-rédigé par l'OMS, Africa CDC, l'INSERM et Merck, définit comme critère d'efficacité primaire une réduction d'au moins 50 % du taux d'attaque chez les vaccinés par rapport aux non-vaccinés dans les 21 jours suivant la vaccination — seuil inférieur aux 60 % requis pour les vaccins de routine, mais justifié par l'urgence d'une épidémie sans contre-mesures approuvées. L'essai intégrera 10 000 contacts dans six zones de santé et produira des données préliminaires d'immunogénicité en octobre 2026 et d'efficacité intermédiaire en décembre 2026. En cas d'efficacité confirmée à ce seuil, l'OMS s'engage à déclencher une procédure d'Autorisation d'utilisation d'urgence (EUL) dans un délai de 30 jours, permettant un déploiement à grande échelle dans les semaines suivantes. Le Groupe consultatif d'urgence d'Africa CDC, présidé par le Prof. Salim Abdool Karim, a approuvé ce protocole après examen des données précliniques montrant une protection partielle chez les primates non-humains contre le virus Bundibugyo.","date":"2026-09-05"},
{"title":"Moderna et CEPI soumettent la demande d'essai de phase 2 du mRNA-1403 en RDC : recrutement de 5 000 soignants prévu pour novembre 2026","url":"https://cepi.net/moderna-mrna-1403-phase2-submission-drc-september-2026","content":"Moderna et la Coalition pour les innovations en matière de préparation aux épidémies (CEPI) ont déposé le 4 septembre 2026 auprès des autorités congolaises et d'Africa CDC leur demande d'autorisation pour un essai de phase 2 du candidat vaccin mRNA-1403 contre l'Ebola Bundibugyo en RDC. Cette soumission intervient une semaine après la publication des résultats intermédiaires de sécurité de phase 1 montrant l'induction de titres d'anticorps neutralisants chez 87 % des participants ayant reçu la dose de 100 µg, sans événement indésirable grave. L'essai de phase 2 proposé ciblera 5 000 professionnels de santé et agents de riposte en première ligne dans les provinces de l'Ituri, du Nord-Kivu et du Haut-Uélé — une population particulièrement exposée avec plus de 120 soignants infectés et 58 décès parmi le personnel médical depuis le début de l'épidémie. Le recrutement est prévu pour débuter en novembre 2026, sous réserve des autorisations réglementaires, avec des données d'immunogénicité à J+28 attendues en janvier 2027. Ce candidat mRNA représente la première application de cette plateforme aux filovirus africains et pourrait transformer radicalement la capacité de riposte vaccinale face aux futures épidémies d'Ebola.","date":"2026-09-04"},
{"title":"OMS : rapport mondial sur la résistance antimicrobienne 2026 — l'Afrique subsaharienne concentre 40 % des décès, appel à intégrer la prévention vaccinale","url":"https://www.who.int/publications/i/item/global-antimicrobial-resistance-report-2026","content":"L'Organisation mondiale de la Santé a publié le 3 septembre 2026 son rapport mondial sur la résistance aux antimicrobiens 2026, estimant que les infections bactériennes résistantes ont causé 1,27 million de décès directement attribuables et 4,95 millions de décès associés dans le monde en 2025 — des chiffres en hausse de 8 % par rapport à 2024. L'Afrique subsaharienne concentre désormais 40 % de la mortalité mondiale liée à la résistance antimicrobienne malgré seulement 15 % de la consommation mondiale d'antibiotiques, paradoxe expliqué par le poids des infections invasives à pneumocoque, méningocoque et salmonelle typhi évitables par la vaccination. Le rapport consacre un chapitre inédit à la prévention vaccinale comme outil de réduction de la résistance : l'OMS estime que la généralisation des vaccins contre le pneumocoque, les méningites et la typhoïde pourrait prévenir 2,5 millions de prescriptions d'antibiotiques par an en Afrique subsaharienne, réduisant mécaniquement la pression de sélection de résistances. Ce rapport appelle Gavi, l'UNICEF et les gouvernements africains à accélérer l'introduction des vaccins conjugués typhiques (TCV) et des vaccins méningococciques ACWX recommandés par l'OMS en 2025-2026, comme levier conjoint contre les maladies infectieuses et la résistance aux antimicrobiens.","date":"2026-09-03"},
{"title":"OMS et Union européenne lancent HERA-Afrique : partenariat de 200 millions d'euros pour renforcer la préparation épidémique et la fabrication vaccinale sur le continent africain","url":"https://www.who.int/news/item/22-08-2026-who-eu-hera-africa-200-million-partnership-epidemic-preparedness","content":"L'Organisation mondiale de la Santé et l'Autorité européenne de préparation et de réaction en cas d'urgence sanitaire (HERA) ont lancé le 22 août 2026 le programme HERA-Afrique, un partenariat de 200 millions d'euros sur cinq ans destiné à renforcer la préparation épidémique et les capacités de fabrication de vaccins et de contre-mesures médicales sur le continent africain. Ce programme financera le renforcement de sept réseaux de laboratoires régionaux africains, la constitution de stocks stratégiques de contre-mesures médicales pour les pathogènes prioritaires (Ebola, Lassa, Marburg, Mpox), et des transferts de technologie accélérés vers trois fabricants africains en phase d'industrialisation. HERA-Afrique cofinancera les essais cliniques de vaccins contre Ebola Bundibugyo et la fièvre de Lassa en Afrique subsaharienne, avec pour objectif que les données nécessaires aux autorisations réglementaires soient disponibles d'ici 2028. Le Dr Tedros Adhanom Ghebreyesus a salué ce programme comme une réponse concrète à la crise d'Ebola Bundibugyo qui a révélé la nécessité de disposer de ressources biomédicales africaines mobilisables en 72 heures. L'OMS coordonnera la mise en oeuvre avec Africa CDC, l'AMA, l'AUDA-NEPAD et les ministères de la santé des pays bénéficiaires.","date":"2026-08-22"},
{"title":"Résultats intermédiaires de phase 1 du vaccin mRNA-1403 de Moderna contre Ebola Bundibugyo : profil de sécurité favorable, passage en phase 2 en RDC envisagé pour octobre 2026","url":"https://cepi.net/moderna-mrna-1403-bundibugyo-phase1-interim-safety-results-august-2026","content":"Moderna et la Coalition pour les innovations en matière de préparation aux épidémies (CEPI) ont publié le 27 août 2026 les résultats intermédiaires de sécurité de l'essai de phase 1 du candidat vaccin mRNA-1403 contre le virus Ebola Bundibugyo. Sur 40 participants adultes sains ayant reçu les doses basses et intermédiaires (25 µg et 100 µg), aucun événement indésirable grave n'a été rapporté et les effets secondaires observés — douleur au site d'injection, fatigue légère transitoire — sont comparables au profil connu des autres vaccins mRNA de Moderna. Les données immunologiques préliminaires montrent une induction de titres d'anticorps neutralisants détectables dès J+14 chez 87 % des participants ayant reçu la dose de 100 µg, résultat jugé prometteur par le comité de surveillance des données. Sur cette base, Moderna et CEPI ont annoncé leur intention de soumettre une demande d'essai de phase 2 aux autorités congolaises et à Africa CDC pour octobre 2026, visant à évaluer l'immunogénicité et l'efficacité en population exposée dans les zones d'épidémie. Une telle accélération — cinq mois entre le premier essai humain et la phase 2 en zone épidémique — serait sans précédent pour un vaccin contre un filovirus, illustrant la mobilisation mondiale face à cette crise de santé publique.","date":"2026-08-27"},
{"title":"OMS publie un nouveau position paper sur les vaccins antityphoïdiques (août 2026) : les vaccins conjugués typhiques recommandés dès 6 mois dans les zones endémiques","url":"https://www.who.int/publications/i/item/who-wer10132-166-180","content":"L'Organisation mondiale de la Santé a publié en août 2026 une mise à jour de sa position officielle sur les vaccins contre la typhoïde (Weekly Epidemiological Record, Vol. 101, No. 32, pp. 166-180), remplaçant le document de 2018. Ce nouveau position paper place les vaccins conjugués typhiques (TCV) au coeur de la stratégie de prévention, en s'appuyant sur de nouvelles données démontrant leur supériorité immunologique et leur durabilité par rapport aux vaccins polysaccharidiques non conjugués. Les TCV sont recommandés en vaccination systématique dans les zones endémiques à partir de l'âge de 6 mois et peuvent être intégrés aux programmes nationaux d'immunisation de routine. La typhoïde cause environ 11 millions de cas et 128 000 décès par an dans le monde, avec les charges les plus lourdes en Asie du Sud et en Afrique subsaharienne. Ce document guidera les décisions d'achat des pays bénéficiaires du soutien de Gavi et les stratégies des programmes nationaux d'immunisation dans les pays les plus touchés par cette maladie évitable.","date":"2026-08-14"},
{"title":"Moderna lance le premier essai clinique spécifique contre le virus Ebola Bundibugyo, soutenu par la CEPI — une première mondiale","url":"https://cepi.net/modernas-bundibugyo-ebolavirus-vaccine-candidate-enters-first-human-trial-backed-cepi","content":"Pour la première fois dans l'histoire de la médecine, un vaccin candidat spécifiquement conçu contre le virus Ebola Bundibugyo entre en essai clinique de phase 1, développé par Moderna avec le soutien financier de la Coalition pour les innovations en matière de préparation aux épidémies (CEPI). L'essai est conduit sur trois sites au Canada et vise à évaluer la sécurité, la tolérance et la réponse immunitaire du candidat vaccin chez des participants sains adultes. Cette avancée scientifique intervient alors que l'épidémie de maladie à virus Bundibugyo en RDC est devenue la plus meurtrière de l'histoire de cette souche — plus de 4 000 cas et 2 000 décès à la mi-août 2026 — sans aucun vaccin ni traitement approuvé disponible. En parallèle, un essai de phase 1 portant sur un autre vaccin candidat Bundibugyo a débuté au Royaume-Uni le 24 juillet 2026. La mobilisation internationale illustre les leçons tirées de la crise COVID-19 : financer et préparer les ripostes vaccinales contre les pathogènes à potentiel épidémique avant qu'une crise ne survienne.","date":"2026-08-15"},
{"title":"OMS et DRC avancent vers un essai de vaccination en anneau par Ervebo contre Ebola Bundibugyo : données précliniques prometteuses","url":"https://www.statnews.com/2026/08/12/ebola-who-drc-ebola-vaccine-trial/","content":"Le 12 août 2026, des discussions avancées entre l'OMS et le gouvernement de la RDC concernant le lancement d'un essai clinique du vaccin Ervebo (rVSV-ZEBOV de Merck) en vaccination en anneau des contacts d'Ebola Bundibugyo ont été révélées par STAT News. Si Ervebo a été développé et approuvé pour le virus Ebola Zaïre, de nouvelles données précliniques montrent que 3 des 4 primates non-humains vaccinés ont survécu à une infection expérimentale par le virus Bundibugyo contre 1 seul dans le groupe contrôle — une efficacité partielle jugée suffisamment prometteuse. Une étude sur les furets avec une version de recherche d'Ervebo a de plus montré une protection à 100 % contre le Bundibugyo. Ces éléments ont conduit le Groupe consultatif d'urgence (ECG) d'Africa CDC, présidé par le Prof. Salim Abdool Karim, à soutenir fortement l'essai clinique et la vaccination compassionnelle des soignants, tout en soulignant que l'efficacité chez l'homme reste à démontrer.","date":"2026-08-12"},
{"title":"OMS met à jour sa position sur les vaccins COVID-19 : nouvelles recommandations pour la circulation soutenue de SARS-CoV-2 en 2026-2027","url":"https://www.who.int/publications/i/item/who-wer10130-138-156","content":"L'OMS a publié en juillet 2026 une mise à jour de sa position officielle sur les vaccins COVID-19 (Weekly Epidemiological Record, Vol. 101, No. 30, pp. 138-156), actualisant ses recommandations dans le contexte d'une circulation soutenue du SARS-CoV-2, de niveaux élevés d'immunité populationnelle et de la disponibilité de vaccins adaptés aux variants. L'OMS maintient sa recommandation d'une vaccination prioritaire pour les groupes les plus vulnérables — personnes âgées, immunodéprimées et professionnels de santé — tout en précisant les calendriers de rappel et les préférences entre plateformes vaccinales. Ce document remplace les orientations précédentes et constitue la référence mondiale pour les programmes nationaux en 2026-2027, intervenant dans un contexte de diversification des variants et d'interrogations croissantes sur la durée de protection des formulations actuelles. Il guidera notamment les décisions d'achat des pays à revenu faible et intermédiaire qui s'appuient sur le mécanisme COVAX pour leurs approvisionnements.","date":"2026-07-28"},
{"title":"Global childhood immunization coverage inches forward in 2025: 90% of infants received DTP but 14.5 million children remain unvaccinated — WUENIC 2025","url":"https://www.who.int/news/item/15-07-2026-global-childhood-immunization-coverage-inches-forward-despite-conflict-and-hesitancy---unicef--who","content":"WHO and UNICEF reported on July 15, 2026 that 90% of infants globally received at least one dose of the DTP vaccine in 2025, with 85% completing the full three-dose series — representing modest but real progress despite conflict and vaccine hesitancy. However, 14.5 million children worldwide remained completely unvaccinated in 2025, with the highest concentrations in conflict-affected and fragile states in sub-Saharan Africa and South Asia. Coverage gains were undermined in several countries by the 2025-2026 Ebola outbreak in DRC, which disrupted routine health services, and by funding cuts following the US withdrawal from international health commitments. The joint UNICEF-WHO WUENIC 2025 report calls for renewed investment in identifying and reaching zero-dose children, strengthening community health worker networks and cold chain infrastructure to meet Immunization Agenda 2030 targets.","date":"2026-07-15"},
{"title":"Cholera vaccine supply crisis resolved: WHO announces resumption of preventive mass vaccination campaigns worldwide","url":"https://www.who.int/news/item/04-02-2026-preventive-cholera-vaccination-resumes-as-global-supply-reaches-critical-milestone","content":"The World Health Organization announced on February 4, 2026 the resumption of preventive cholera vaccination campaigns following a critical milestone in global oral cholera vaccine (OCV) supply. The restoration ends a period of strict rationing that had forced WHO's International Coordinating Group to suspend preventive immunization since late 2022 — a constraint that had severely hampered outbreak control in Africa, Asia and the Caribbean. The supply breakthrough came from expanded production at Shantha Biotechnics in India and continued output from Eubiologics in South Korea. The announcement is particularly significant for Africa, where cholera outbreaks in DRC, Sudan, Ethiopia and Zimbabwe have caused thousands of deaths since 2022. WHO estimates that scaling up preventive vaccination could avert approximately 2 million cases and 70 000 deaths in endemic countries over the next five years.","date":"2026-02-04"},
{"title":"Ebola Bundibugyo : l'absence de vaccins approuvés met en alerte la communauté scientifique internationale","url":"https://www.cdc.gov/ebola/situation-summary/returning-travelers.html","content":"Alors que l'épidémie de maladie à virus Bundibugyo continue de s'étendre en RDC et en Ouganda, les autorités sanitaires mondiales tirent la sonnette d'alarme sur l'absence de vaccins ou de traitements spécifiquement approuvés contre cette souche. Le CDC américain a publié le 1er juillet 2026 des recommandations pour les voyageurs en provenance des zones affectées, incluant une surveillance des symptômes pendant 21 jours et un renforcement des contrôles sanitaires aux points d'entrée. La communauté scientifique internationale appelle à une accélération des essais cliniques et du développement de candidats vaccins contre le virus Bundibugyo, soulignant que les vaccins disponibles actuellement ont été développés pour d'autres souches du genre Ebolavirus et n'offrent pas de protection croisée confirmée.","date":"2026-07-10"},
{"title":"OMS et UNICEF : publication des estimations actualisées de couverture vaccinale nationale WUENIC 2025","url":"https://immunizationdata.who.int/","content":"L'OMS et l'UNICEF publient en juillet 2026 les estimations actualisées de couverture vaccinale nationale (WUENIC 2025), données de référence annuelles sur l'état de l'immunisation dans le monde entier, avec un webinaire de présentation des résultats programmé le 15 juillet 2026. Ces statistiques par pays et par antigène orientent les stratégies d'investissement de Gavi, de l'UNICEF et des gouvernements partenaires pour identifier les populations prioritaires en matière de rattrapage vaccinal. Elles constituent le principal outil de suivi des progrès vers les objectifs mondiaux de vaccination et d'élimination des maladies évitables. Dans un contexte de réduction des financements internationaux, ces données sont plus que jamais cruciales pour cibler les ressources disponibles vers les pays et populations les plus vulnérables.","date":"2026-07-07"},
{"title":"OMS : le Comité PDVAC se réunit le 6 juillet 2026 pour définir les priorités mondiales de développement vaccinal","url":"https://www.who.int/news-room/events/detail/2026/07/06/default-calendar/2026-who-product-development-for-vaccines-advisory-committee-meeting-(pdvac)","content":"Le Comité consultatif pour le développement de produits vaccinaux (PDVAC) de l'OMS tient sa réunion annuelle le 6 juillet 2026 pour examiner les priorités mondiales en matière de R&D vaccinale, notamment les candidats-vaccins contre le virus Bundibugyo, la dengue, le paludisme et d'autres pathogènes prioritaires. Ce comité d'experts indépendants — virologues, immunologistes et spécialistes de santé publique — formule des recommandations sur les technologies vaccinales à prioriser, les essais cliniques à soutenir et les mécanismes d'accès équitable. Dans le contexte de la crise Ebola Bundibugyo, le PDVAC joue un rôle critique pour guider les investissements en R&D et accélérer le développement de contre-mesures médicales adaptées à ce virus pour lequel aucun vaccin homologué n'existe à ce jour. Ses recommandations orienteront les stratégies d'investissement des grandes institutions mondiales de santé pour les années à venir.","date":"2026-07-06"},

function getSourceColor(d){if(d.includes("who.int"))return"#0093D5";if(d.includes("africacdc")||d.includes("au.int"))return"#1B8C3A";if(d.includes("unicef"))return"#00AEEF";if(d.includes("gavi"))return"#E8702A";if(d.includes(".ma")||d.includes("maroc")||d.includes("santemag")||d.includes("hespress"))return"#C1272D";if(d.includes("nature.com"))return"#B5232D";if(d.includes("path.org"))return"#6B2D8B";if(d.includes("cdc.gov"))return"#075290";return"#0069B4";}
function extractDomain(u){try{return new URL(u).hostname.replace("www.","")}catch(e){return""}}
function timeAgo(d){if(!d)return"";var date=new Date(d),now=new Date();if(isNaN(date))return"";var s=Math.floor((now-date)/1000);var formatted=date.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});if(s>=0&&s<86400)return formatted+" - aujourd hui";if(s>=86400&&s<172800)return formatted+" - hier";if(s>=172800&&s<604800)return formatted+" - il y a "+Math.floor(s/86400)+"j";return formatted;}
function isRecent(d){if(!d)return false;var date=new Date(d),now=new Date(),diff=(now-date)/(1000*60*60*24);return diff<=1.5;}
function renderCategories(){var el=document.getElementById("categories");el.innerHTML=CATEGORIES.map(function(c){var articles=articlesData[c.id]||[];var newCount=articles.filter(function(a){return isRecent(a.date)}).length;var badge=newCount>0?'<span style="font-size:9px;background:#E8A020;color:#fff;padding:1px 5px;border-radius:4px;margin-left:4px;font-weight:800">'+newCount+' NEW</span>':"";return'<button class="cat-btn '+(activeCategory===c.id&&!isCustomSearch?"active":"")+'" data-id="'+c.id+'"><div class="cat-icon">'+c.icon+'</div><div class="cat-label">'+c.label+badge+'</div><div class="cat-desc">'+c.desc+'</div></button>';}).join("");el.querySelectorAll(".cat-btn").forEach(function(b){b.addEventListener("click",function(){isCustomSearch=false;activeCategory=b.dataset.id;renderCategories();renderArticles();});});}
function renderArticles(){var container=document.getElementById("articles");var articles=articlesData[activeCategory]||[];var info=document.getElementById("toolbarInfo");var newArticles=articles.filter(function(a){return isRecent(a.date)});var newCountEl=document.getElementById("newCount");info.textContent=articles.length+" articles";if(newArticles.length>0){newCountEl.style.display="inline";newCountEl.textContent="NEW "+newArticles.length+" nouveau"+(newArticles.length>1?"x":"");}else{newCountEl.style.display="none";}if(!articles.length){container.innerHTML='<div class="spinner-wrap" style="padding:40px 0"><div style="font-size:52px;opacity:.3;margin-bottom:14px">📰</div><div class="spinner-text">Aucun article</div></div>';return;}container.innerHTML=articles.map(function(a,i){var domain=extractDomain(a.url),color=getSourceColor(domain),dateStr=timeAgo(a.date);var isNew=isRecent(a.date);return'<div class="article-card'+(isNew?" is-new":"")+'" style="animation-delay:'+i*.06+'s"><div class="article-inner"><div class="article-bar" style="background:'+color+'"></div><div class="article-body"><a href="'+a.url+'" target="_blank" rel="noopener" class="article-title">'+(isNew?'<span class="badge-new">NOUVEAU</span> ':'')+a.title+'</a><div class="article-content collapsed" id="c-'+i+'">'+a.content+'</div><div class="article-meta"><span class="source-tag" style="background:'+color+'14;color:'+color+'">'+domain+'</span>'+(dateStr?'<span class="date-tag">'+dateStr+'</span>':'')+'<button class="expand-btn" data-i="'+i+'">Lire plus</button></div></div></div></div>';}).join("");container.querySelectorAll(".expand-btn").forEach(function(b){b.addEventListener("click",function(){var el=document.getElementById("c-"+b.dataset.i);var c=el.classList.toggle("collapsed");b.textContent=c?"Lire plus":"Reduire";});});}
function doSearch(){var val=document.getElementById("searchInput").value.trim().toLowerCase();if(!val){isCustomSearch=false;renderCategories();renderArticles();return;}isCustomSearch=true;var allArticles=[];Object.values(articlesData).forEach(function(arr){if(Array.isArray(arr))arr.forEach(function(a){allArticles.push(a)})});var filtered=allArticles.filter(function(a){return(a.title+a.content).toLowerCase().includes(val)});activeCategory="search-custom";articlesData["search-custom"]=filtered;renderCategories();renderArticles();}
document.getElementById("searchBtn").addEventListener("click",doSearch);
document.getElementById("searchInput").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch()});
document.getElementById("updateDate").textContent=new Date().toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
renderCategories();
renderArticles();
