var articlesData={
"african-cdc":[
{"title":"Africa CDC — Rapport de situation Ebola Bundibugyo au 3 septembre 2026 : 5 014 cas confirmés, 2 320 décès, essai clinique Ervebo actif dans 3 zones de santé","url":"https://africacdc.org/news-item/ebola-bundibugyo-situation-report-3-september-2026/","content":"Le rapport de situation du 3 septembre 2026 d'Africa CDC fait état de 5 014 cas confirmés et 2 320 décès de la maladie à virus Ebola Bundibugyo en République démocratique du Congo, soit un taux de létalité de 46,3 %. La semaine épidémique du 25 au 31 août 2026 a enregistré 167 nouveaux cas — en légère baisse par rapport aux 192 cas de la semaine précédente — suggérant un début de ralentissement dans les provinces d'Ituri et de Haut-Uélé. L'essai clinique de vaccination en anneau par Ervebo (rVSV-ZEBOV de Merck) est désormais actif dans 3 zones de santé du Nord-Kivu depuis le 30 août 2026, avec 1 243 contacts vaccinés dans les 48 premières heures. Le taux de suivi des contacts a atteint 81 % au niveau national — en progrès par rapport au creux de 75 % — mais reste en deçà du seuil opérationnel de 95 % nécessaire pour briser les chaînes de transmission. Africa CDC maintient la cote d'alerte maximale et appelle à mobiliser les 276 millions USD encore manquants sur les 518 millions du plan continental de réponse.","date":"2026-09-03"},
{"title":"Africa CDC publie l'Africa Health Security Index 2026 : Maroc, Afrique du Sud et Rwanda en tête du classement continental de préparation sanitaire","url":"https://africacdc.org/news-item/africa-health-security-index-2026/","content":"Africa CDC a publié le 1er septembre 2026 la deuxième édition de l'Africa Health Security Index (AHSI 2026), évaluation comparative de la préparation et de la résilience sanitaire des 55 États membres de l'Union africaine. Le Maroc, l'Afrique du Sud et le Rwanda occupent les trois premières places du classement 2026, progressant respectivement grâce à leurs investissements dans les laboratoires de référence, la surveillance épidémique One Health et la couverture sanitaire universelle. L'index mesure six piliers — prévention, détection, réponse, système de santé, environnement propice et financement. Le score moyen continental atteint 37,4 sur 100, en hausse de 4 points depuis 2023, avec une progression notable de la surveillance génomique (+18 %) et de la coordination des urgences (+12 %). L'épidémie Ebola Bundibugyo est citée comme révélateur des failles persistantes dans les délais d'alerte précoce et les capacités de riposte dans les zones de conflit.","date":"2026-09-01"},
{"title":"CPHIA 2026 à Addis-Abeba : Africa CDC finalise 240 sessions scientifiques, 30 000 délégués attendus du 4 au 6 novembre 2026","url":"https://cphia.africacdc.org/news/final-programme-september-2026","content":"Africa CDC a annoncé le 2 septembre 2026 le programme définitif de la 5e Conférence internationale sur la santé publique en Afrique (CPHIA 2026) à Addis-Abeba. Les 240 sessions couvrent 8 pistes thématiques : préparation aux pandémies, leadership africain dans la gouvernance mondiale de la santé, fabrication locale de vaccins et médicaments, santé numérique, maladies non transmissibles, sécurité alimentaire One Health, santé mentale et financement. La plénière d'ouverture réunira le Dr Jean Kaseya (Africa CDC), le Dr Tedros Adhanom Ghebreyesus (OMS) et la Commissaire UA à la santé. Plus de 30 000 délégués de 55 pays sont attendus, avec 1 200 résumés soumis et 180 bourses de voyage accordées à des jeunes chercheurs africains. Une session d'urgence dédiée à la réponse Ebola Bundibugyo est prévue dès le premier jour de la conférence, reflétant la centralité de cette crise dans l'agenda sanitaire continental 2026.","date":"2026-09-02"},
{"title":"Plan de réponse renforcée sur 100 jours contre Ebola Bundibugyo : Africa CDC recense 4 723 cas et 2 187 décès au 27 août 2026","url":"https://africacdc.org/news-item/ebola-bundibugyo-100-day-response-plan-27-august-2026/","content":"Dans son rapport de situation du 27 août 2026, Africa CDC recense 4 723 cas confirmés et 2 187 décès d'Ebola Bundibugyo en République démocratique du Congo, soit un taux de létalité de 46,3 % — le plus élevé jamais enregistré pour cette souche. L'épidémie touche désormais 58 zones de santé dans cinq provinces, avec de nouveaux cas signalés dans les zones frontalières du Sud-Kivu limitrophes du Rwanda et du Burundi. Face à cette évolution, Africa CDC et le gouvernement congolais ont adopté conjointement un plan de réponse renforcée de 100 jours visant à porter le taux de suivi des contacts à 95 % d'ici fin octobre 2026, à doubler les capacités des centres de traitement et à déployer 500 agents de santé communautaires supplémentaires dans les zones les plus touchées. L'essai clinique de vaccination en anneau par Ervebo a été officiellement autorisé par les autorités congolaises le 25 août 2026 — une avancée cruciale alors qu'aucun vaccin n'est encore homologué contre cette souche. Africa CDC appelle la communauté internationale à débloquer en urgence les 276 millions USD encore nécessaires pour financer intégralement le plan continental de réponse d'ici fin septembre 2026.","date":"2026-08-27"},
{"title":"Africa CDC Epidemic Intelligence Weekly Report — 22 août 2026 : surveillance élargie en Afrique de l'Ouest et centrale face au risque de propagation d'Ebola","url":"https://khub.africacdc.org/records/resource/epidemic-intelligence-weekly-report-22-august-2026","content":"Le rapport d'intelligence épidémiologique hebdomadaire d'Africa CDC du 22 août 2026 documente un renforcement de la surveillance aux frontières de neuf pays d'Afrique de l'Ouest et centrale considérés à risque élevé de propagation de l'épidémie d'Ebola Bundibugyo. Trois alertes transfrontalières investigées — au Burundi, au Rwanda et en République du Congo — ont toutes été confirmées négatives après analyses de laboratoire, démontrant l'efficacité des mécanismes de détection précoce déployés par Africa CDC. Parallèlement, Africa CDC surveille une flambée de méningite à méningocoque au Sahel avec 847 cas notifiés depuis début juillet 2026 dans trois pays (Nigéria, Niger, Tchad), ainsi qu'une recrudescence de la dengue en Côte d'Ivoire et au Sénégal comptant plus de 1 200 cas suspects. Africa CDC souligne que cette charge épidémique multiple met sous pression les équipes nationales de veille sanitaire et appelle à un renforcement urgent des laboratoires régionaux affiliés au réseau ASLM. L'agence rappelle que son Centre régional de coordination pour l'Afrique centrale, basé à Libreville, coordonne en temps réel la surveillance de tous ces foyers épidémiques avec les autorités sanitaires des 55 pays membres de l'Union africaine.","date":"2026-08-22"},
{"title":"Trois mois d'épidémie Ebola Bundibugyo : Africa CDC exige une action décisive et immédiate face à une crise hors normes","url":"https://africacdc.org/news-item/three-months-into-the-bundibugyo-ebola-outbreak-the-time-for-decisive-action-is-now/","content":"À l'occasion du bilan des trois premiers mois de l'épidémie de maladie à virus Ebola Bundibugyo, Africa CDC a publié le 17 août 2026 un appel solennel à l'action décisive. Depuis son démarrage en mai 2026 dans une seule province (Ituri), l'épidémie a étendu sa portée à 53 zones de santé réparties dans cinq provinces de la RDC — Ituri, Nord-Kivu, Sud-Kivu, Haut-Uélé et Tshopo —, devenant ainsi la plus grande épidémie d'Ebola Bundibugyo jamais enregistrée. Le bilan humain dépasse désormais 4 000 cas confirmés et 2 000 décès, tandis que les centres de traitement restent saturés et le taux de suivi des contacts insuffisant. Africa CDC appelle les gouvernements africains, les partenaires internationaux et les donateurs à mobiliser des ressources supplémentaires d'urgence, à accélérer le déploiement des équipes de riposte et à prioriser l'engagement communautaire pour briser les chaînes de transmission. Le lancement imminent d'un essai clinique du vaccin Ervebo en anneau de contacts est présenté comme une avancée décisive dans la lutte contre cette épidémie sans précédent.","date":"2026-08-17"},
{"title":"Africa CDC salue les recommandations du Groupe consultatif d'urgence : essai clinique Ervebo en anneau préconisé en RDC, 4 449 cas et 2 061 décès confirmés","url":"https://africacdc.org/news-item/africa-cdc-welcomes-emergency-consultative-group-recommendations-on-ebola-bundibugyo-response/","content":"Le 14 août 2026, Africa CDC a salué les recommandations du Groupe consultatif d'urgence (ECG), présidé par le Prof. Salim Abdool Karim, chargé de guider la riposte à l'épidémie Ebola Bundibugyo. L'ECG a fortement soutenu l'utilisation du vaccin Ervebo (rVSV-ZEBOV de Merck) selon deux modalités : un essai clinique de vaccination en anneau des contacts et une vaccination compassionnelle des soignants en première ligne. Au 14 août 2026, la RDC recensait 4 449 cas confirmés et 2 061 décès, soit un taux de létalité de 46,3 %. L'ECG a précisé que de nouvelles données sur les anticorps neutralisants sont prudemment prometteuses, mais qu'il subsiste un risque raisonnable qu'Ervebo ne soit pas efficace contre le virus Bundibugyo et que des preuves complémentaires sont nécessaires. Africa CDC a transmis ces recommandations aux autorités congolaises pour mise en oeuvre immédiate dans la plus grande épidémie d'Ebola Bundibugyo jamais enregistrée.","date":"2026-08-14"},
{"title":"Africa CDC soutient les décisions du gouvernement congolais pour contrôler l'urgence Ebola Bundibugyo 2026","url":"https://www.globalsecurity.org/security/library/news/2026/08/sec-260810-africacdc01.htm","content":"Le 10 août 2026, Africa CDC a publié une déclaration soutenant la mise en oeuvre immédiate des décisions du gouvernement de la RDC visant à contrôler l'urgence sanitaire liée à l'épidémie de maladie à virus Ebola Bundibugyo. Ces mesures font suite à la directive du Président Félix-Antoine Tshisekedi d'accélérer et de restructurer la réponse en plaçant les communautés au coeur du dispositif. Africa CDC a réaffirmé son engagement à soutenir techniquement les autorités congolaises dans la surveillance, le suivi des contacts, la gestion des cas et la logistique des interventions d'urgence. L'agence continentale a rappelé que l'Ouganda a mis fin à son épidémie le 28 juillet 2026 — 20 cas confirmés, 2 décès — démontrant qu'une réponse rapide et communautaire peut venir à bout du virus Bundibugyo. Africa CDC appelle à capitaliser sur ces leçons pour intensifier la riposte dans les cinq provinces congolaises encore affectées.","date":"2026-08-10"},
{"title":"Africa CDC et OMS appellent à une riposte communautaire urgente face à Ebola en RDC : 3 973 cas confirmés, 1 801 décès au 4 août 2026","url":"https://africacdc.org/news-item/africa-cdc-and-who-call-for-urgent-community-led-action-to-contain-ebola-in-the-drc/","content":"L'Africa CDC et l'OMS ont lancé le 6 août 2026 un appel pressant à intensifier la riposte communautaire contre l'épidémie d'Ebola Bundibugyo en RDC. Au 4 août 2026, la RDC dénombrait 3 973 cas confirmés, 1 801 décès et 776 guérisons dans 51 zones de santé de cinq provinces, avec 99 nouveaux cas et 52 décès dans les dernières 24 heures. Le taux de suivi des contacts n'atteignait que 75 %, loin de la cible opérationnelle de 95 % nécessaire pour briser les chaînes de transmission. Les centres de traitement au Nord-Kivu affichaient un taux d'occupation alarmant de 139 %, mettant sous pression sévère les lits, les soignants et les opérations de réponse sur le terrain. En réponse, les États-Unis ont annoncé le 5 août 2026 un financement additionnel de 242 millions USD pour la riposte immédiate et la préparation régionale. L'Ouganda a déclaré le 28 juillet 2026 la fin de son épidémie avec 20 cas confirmés et 2 décès.","date":"2026-08-06"},
{"title":"Africa CDC welcomes President Tshisekedi's direction for a village-centred, accountable and intensified Ebola response in DRC","url":"https://africacdc.org/news-item/africa-cdc-welcomes-president-tshisekedis-direction-and-guidance-for-a-village-centered-accountable-and-intensified-response-to-the-ebola-bundibugyo-outbreak-in-the-democratic-republic-of-th/","content":"Africa CDC on August 6, 2026 welcomed President Felix Antoine Tshisekedi's renewed direction calling for a fundamentally restructured, village-centred and accountable Bundibugyo Ebola response in the DRC. The move marks a critical shift toward placing affected communities at the heart of outbreak control — a priority given that contact follow-up rates remain at 75%, far short of the 95% threshold needed to break transmission chains. Africa CDC Director-General Dr. Jean Kaseya endorsed the President's guidance as a potential turning point for building community trust, particularly in the hardest-hit provinces of Ituri and North Kivu. The direction aligns with the joint Africa CDC-WHO statement of August 6, 2026 demanding faster resource delivery, stronger early detection and improved access to care. As of the August 2 situational report, nearly 4 000 cases and over 1 800 deaths have been recorded since the outbreak began in DRC.","date":"2026-08-06"},
{"title":"CPHIA 2026 : l'Afrique se prépare à accueillir 30 000 délégués à Addis-Abeba","url":"https://cphia.africacdc.org","content":"La 5e Conférence internationale sur la santé publique en Afrique (CPHIA 2026) se tiendra à Addis-Abeba, capitale diplomatique du continent africain et siège de l'Union africaine. Organisée par Africa CDC, la conférence réunira plus de 30 000 délégués — chefs d'État, ministres, chercheurs et innovateurs — autour des défis de santé publique les plus pressants du continent. Les travaux s'articuleront notamment autour de la refonte de l'architecture mondiale de la santé sous leadership africain, de l'institutionnalisation de la prévention et de la préparation aux pandémies, ainsi que d'un salon d'innovation dédié aux technologies de santé africaines. La date limite de soumission des résumés et des candidatures aux bourses de voyage est fixée au 15 août 2026. Le Dr Jean Kaseya, Directeur général d'Africa CDC, figurera parmi les conférenciers principaux.","date":"2026-07-12"},
{"title":"Africa CDC and WHO unveil $518 million joint continental Ebola response plan","url":"https://www.emjreviews.com/microbiology-infectious-diseases/news/africa-cdc-and-who-launch-joint-continental-ebola-response-plan","content":"Africa CDC and WHO officially launched a joint continental preparedness and response plan for the Bundibugyo Ebola outbreak on June 5, 2026. The six-month strategy, running from June to November 2026, is costed at $518 million and operates under a 'One Plan, One Budget, One Team' framework led by the affected nations — the Democratic Republic of the Congo and Uganda — supported by regional and international partners. Key operational pillars include emergency coordination, laboratory testing, disease surveillance, infection prevention and control, clinical care, community engagement, and logistics. Dr. Jean Kaseya, Director-General of Africa CDC, underscored the urgency: \"Ebola moves fast. Africa must move faster. This joint plan gives the continent a clear path to act with speed and unity.\" A joint financial tracking mechanism has been put in place to ensure full transparency in fund utilisation.","date":"2026-07-12"},
{"title":"Ebola moves faster than the response: Africa CDC chief sounds the alarm","url":"https://www.thenewhumanitarian.org/interview/2026/07/09/ebola-moving-faster-than-response-head-africa-cdc-warns","content":"Africa CDC Director General Dr. Jean Kaseya issued an urgent warning on July 9, 2026: the Ebola outbreak driven by the Bundibugyo virus in eastern DRC has yet to reach its peak, yet treatment centres are already at saturation point. In an interview with The New Humanitarian, Kaseya called on the international community to \"act now or pay a much higher price later,\" stressing that the pace of the outbreak is outstripping the pace of the response. Uganda has closed its borders with DRC in a bid to contain cross-border spread, but the move has crippled regional trade and raised humanitarian concerns. Africa CDC continues to coordinate with Member States and partners to accelerate detection, care, and community engagement in conflict-affected Ituri province.","date":"2026-07-12"},
{"title":"Africa CDC déploie une stratégie d'engagement des jeunes dans la santé mondiale : la YES!Health 2025-2028","url":"https://khub.africacdc.org/records/resource/epidemic-intelligence-weekly-report","content":"L'Africa CDC a publié sa stratégie d'engagement et de participation des jeunes dans la santé mondiale, baptisée YES!Health (Youth Engagement and Participation in Global Health), couvrant la période 2025-2028. Portée par le Dr Chrys Promesse Kaniki, cette initiative reconnaît le rôle crucial des jeunes africains âgés de 15 à 35 ans — qui représentent plus de 65 % de la population du continent — dans la résolution des défis sanitaires persistants. La stratégie vise à intégrer les jeunes comme acteurs à part entière des systèmes de santé publique, en leur offrant des plateformes de participation active dans les politiques de santé, la surveillance épidémique et la réponse aux urgences. Cette démarche s'inscrit dans la vision plus large de l'Africa CDC de bâtir une Afrique résiliente, capable de prendre en charge sa propre sécurité sanitaire, notamment dans un contexte marqué par la recrudescence des maladies à virus Ebola et les séquelles de la pandémie de COVID-19 sur les systèmes de surveillance des maladies non transmissibles.","date":"2026-07-11"},
{"title":"Africa CDC et WHO AFRO lancent une équipe continentale de gestion des incidents pour renforcer la réponse aux urgences de santé publique","url":"https://reliefweb.int/updates?list=Africa+Centres+for+Disease+Control+and+Prevention+%28Africa+CDC%29+Updates&advanced-search=%28S50373%29","content":"Kampala, Ouganda, 27 juin 2026 — L'Africa CDC et le Bureau régional de l'OMS pour l'Afrique (WHO AFRO) ont officiellement lancé une Équipe continentale de gestion des incidents (IMST), en présence du ministre ougandais de la Santé, le Dr Chris Baryomunsi. Cette initiative vise à renforcer le leadership de l'Afrique dans la gestion des urgences de santé publique, en particulier dans le contexte de l'épidémie de maladie à virus Ebola Bundibugyo qui sévit en RDC et en Ouganda. Par ailleurs, l'Africa CDC a réuni 13 pays à Kampala pour un atelier de préparation régionale face à cette menace épidémique. Lors d'une réunion de haut niveau présidentielle tenue le 16 juin 2026 sous la présidence du Président du Burundi, S.E. Évariste Ndayishimiye, les chefs d'État et de gouvernement africains ont exprimé leur engagement collectif à intensifier la réponse continentale. Le Président de la RDC, Félix Antoine Tshisekedi, a également accueilli le Président ougandais le 2 juillet 2026, soulignant la dimension diplomatique et régionale de cette crise sanitaire sans précédent.","date":"2026-07-11"},
{"title":"Épidémie de maladie à virus Bundibugyo : 1 581 cas confirmés et 508 morts en RDC et en Ouganda","url":"https://khub.africacdc.org/health-topics/surveillance","content":"L'épidémie de maladie à virus Bundibugyo (BVD) en République démocratique du Congo (RDC) et en Ouganda atteint un niveau alarmant en ce début juillet 2026. Selon les dernières données publiées par l'Africa CDC, le cumul des cas confirmés dans les deux pays s'élève à 1 581, avec 508 décès recensés, portant le taux de létalité global à 32,1 %. La province de l'Ituri en RDC demeure l'épicentre de la crise, concentrant plus de 90 % des cas confirmés et près de 84 % des décès. Le Nord-Kivu, autre province affectée, enregistre quant à lui le taux de létalité provincial le plus élevé, atteignant 57,4 %, témoignant de la gravité de la situation clinique et des difficultés de prise en charge sur le terrain. En Ouganda, la situation reste relativement stable avec 20 cas confirmés et 2 décès. L'Africa CDC maintient une surveillance renforcée aux points d'entrée et de sortie, et appelle à une vigilance soutenue face au risque persistant de transmission transfrontalière.","date":"2026-07-11"},
],
"african-medical-agency":[
{"title":"AMA lance AfraVigilance : premier système continental africain de pharmacovigilance interconnectant 22 autorités nationales en temps réel","url":"https://au-ama.africa/news/afravigilance-launch-august-2026","content":"L'Agence africaine des médicaments (AMA) a officiellement lancé le 28 août 2026 AfraVigilance, le premier système continental de pharmacovigilance africaine interconnectant en temps réel les bases de données de signalement d'effets indésirables de 22 autorités réglementaires nationales membres. Développé avec le soutien technique de l'EMA et de l'OMS-Uppsala Monitoring Centre, il permet à l'AMA de détecter les signaux de sécurité émergents sur les médicaments, vaccins et dispositifs médicaux circulant en Afrique, et d'émettre des alertes continentales en moins de 72 heures. Lors de son premier mois de fonctionnement en mode pilote, AfraVigilance a traité 4 218 signalements individuels, dont 47 alertes de qualité sur des produits suspects identifiés dans six pays. Les 33 États membres restants seront intégrés d'ici fin 2027, avec un objectif de couverture des 55 membres de l'Union africaine pour 2028. AfraVigilance sera présenté officiellement au Sommet africain sur la sécurité des patients de Kigali les 16-17 septembre 2026.","date":"2026-08-28"},
{"title":"AMA active une procédure d'examen réglementaire accéléré pour les contre-mesures médicales contre Ebola Bundibugyo — un cadre d'urgence continentale inédit","url":"https://au-ama.africa/news/ama-emergency-review-bundibugyo-countermeasures-2026","content":"Face à la gravité de l'épidémie d'Ebola Bundibugyo en RDC, l'Agence africaine des médicaments (AMA) a activé le 25 août 2026 une procédure d'examen réglementaire accéléré pour les contre-mesures médicales candidates — vaccins expérimentaux, antiviraux et anticorps monoclonaux. Ce cadre d'urgence, premier du genre à l'échelle continentale africaine, permet à l'AMA de s'appuyer sur les évaluations en cours de la FDA, de l'EMA et du programme de préqualification OMS (Emergency Use Listing) pour accélérer l'autorisation africaine, réduisant les délais de plusieurs mois à quelques semaines. Trois produits sont actuellement en évaluation accélérée : le vaccin mRNA-1403 de Moderna (CEPI), un antiviral de Ridgeback Biotherapeutics et un anticorps monoclonal soutenu par le Wellcome Trust. La Directrice générale de l'AMA, Dr. Delese Mimi Darko, a déclaré que ce cadre démontre la capacité de l'AMA à agir comme un véritable organe réglementaire continental au service de la santé publique africaine, et non uniquement comme un organe d'harmonisation administrative.","date":"2026-08-25"},
{"title":"Sommet africain sur la sécurité des patients à Kigali (16-17 septembre 2026) : programme final, 42 intervenants et première présentation publique d'AfraVigilance","url":"https://au-ama.africa/news/patient-safety-summit-kigali-final-programme-september-2026","content":"À deux semaines du premier Sommet africain sur la sécurité des patients co-organisé par l'AMA et Medicines for Africa (Kigali, 16-17 septembre 2026), le programme définitif a été publié le 2 septembre 2026. Les séances plénières traiteront de la pharmacovigilance continentale, de la lutte contre les médicaments falsifiés dans le commerce numérique, du renforcement des capacités réglementaires nationales et des voies de reliance réglementaire de l'AMA. Une table ronde de haut niveau réunira les directeurs généraux de huit agences réglementaires africaines — AMMPS (Maroc), NAFDAC (Nigéria), SAHPRA (Afrique du Sud) et NDA (Rwanda) — pour discuter des modèles de coopération post-AMA. Le sommet accueillera plus de 400 participants de 35 pays et constituera la vitrine de lancement officiel d'AfraVigilance. L'OMS estime qu'un médicament sur dix en Afrique subsaharienne est de qualité insuffisante ou falsifié, causant des milliers de décès évitables par an — un enjeu placé au centre de l'agenda réglementaire continental pour les cinq prochaines années.","date":"2026-09-02"},
{"title":"AMA : liste de 40 médicaments prioritaires finalisée pour la première procédure d'évaluation continentale conjointe 2026-2027","url":"https://au-ama.africa/news/ama-priority-medicines-list-joint-assessment-2026-2027","content":"L'Agence africaine des médicaments (AMA) a publié le 26 août 2026 la liste définitive de 40 médicaments essentiels sélectionnés pour la première procédure d'évaluation et d'inscription continentale conjointe 2026-2027, développée avec l'AUDA-NEPAD et l'OMS. Cette liste prioritaire inclut des antiviraux contre Ebola et la fièvre de Marburg, des antibiotiques de dernière génération contre les bactéries multirésistantes, des antifongiques pour patients immunodéprimés, des médicaments contre le paludisme résistant aux artemisines et trois candidats vaccins africains en attente de préqualification OMS. La sélection a été opérée sur la base des besoins en santé publique non couverts, de la charge de morbidité régionale et de l'absence d'alternatives thérapeutiques accessibles sur le continent. La procédure permettra aux 55 États membres de l'Union africaine de s'appuyer sur les évaluations de l'AMA pour autoriser ces médicaments sur leurs marchés nationaux sans duplication des analyses réglementaires — réduisant les délais d'approbation de plusieurs années à quelques mois. Ce jalon marque le passage de l'AMA d'une institution en construction à un organe réglementaire pleinement opérationnel, pivot de la souveraineté pharmaceutique africaine.","date":"2026-08-26"},
{"title":"Sommet africain sur la sécurité des patients à Kigali : AMA et Medicines for Africa confirment 42 intervenants de 28 pays pour les 16-17 septembre 2026","url":"https://www.cnbcafrica.com/2026/ama-medicines-africa-patient-safety-summit-kigali-programme-confirmed","content":"À moins de quatre semaines du Sommet africain sur la sécurité des patients prévu les 16 et 17 septembre 2026 à Kigali (Rwanda), l'Agence africaine des médicaments (AMA) et Medicines for Africa ont confirmé 42 intervenants représentant 28 pays africains et internationaux, dont des directeurs généraux d'autorités réglementaires nationales, des représentants de l'OMS et de l'EMA, ainsi que des industriels pharmaceutiques locaux et multinationaux. Le programme scientifique s'articule autour de quatre thématiques : la pharmacovigilance continentale, la lutte contre les médicaments falsifiés à l'ère du commerce numérique, le renforcement des capacités réglementaires nationales et la mise en oeuvre des voies de reliance réglementaire de l'AMA. Une session spéciale sera consacrée aux leçons réglementaires tirées de l'épidémie d'Ebola Bundibugyo : comment accélérer l'accès aux contre-mesures médicales en urgence tout en maintenant des standards de sécurité rigoureux. L'OMS estime qu'un médicament sur dix utilisé en Afrique subsaharienne est de qualité insuffisante ou falsifié, causant des milliers de décès évitables chaque année — un problème que ce sommet place au centre de l'agenda réglementaire africain. Ce premier grand événement public co-organisé par l'AMA depuis son ouverture à Kigali positionne le Rwanda comme hub de gouvernance pharmaceutique continentale.","date":"2026-08-20"},
{"title":"L'Agence africaine des médicaments et l'ACAME explorent un partenariat stratégique pour renforcer l'accès aux médicaments essentiels à travers le continent","url":"https://techreviewafrica.com/news/6779/african-medicines-agency-acame-explore-partnership-to-enhance-medical-product-regulation","content":"L'Agence africaine des médicaments (AMA) et l'Association africaine des centrales d'achats de médicaments essentiels (ACAME) ont engagé des discussions de partenariat visant à renforcer la régulation, le contrôle qualité et l'accès aux produits de santé à travers le continent africain. La rencontre s'est tenue au siège de l'AMA à Kigali, au Rwanda, entre la Directrice générale de l'AMA, Dr. Delese Mimi Darko, et le Directeur exécutif de l'ACAME, Aser Minoungou. L'ACAME regroupe les centrales d'achats de médicaments essentiels de nombreux pays africains et constitue un maillon stratégique de la chaîne d'approvisionnement pharmaceutique du continent. Un partenariat AMA-ACAME permettrait de coordonner les achats groupés, d'harmoniser les standards de qualité à l'entrée des médicaments sur les marchés nationaux et de lutter plus efficacement contre la circulation de produits falsifiés — un fléau qui touche un médicament sur dix en Afrique subsaharienne selon l'OMS. Cette initiative s'inscrit dans la mission fondatrice de l'AMA : bâtir un système réglementaire continental fiable garantissant l'accès de toutes les populations africaines à des médicaments sûrs, efficaces et de qualité certifiée.","date":"2026-08-12"},
{"title":"Revue historique de l'AMA (CIRS 2026) : de la gestation à l'opérationnalisation d'une institution réglementaire continentale inédite","url":"https://cirsci.org/publications/historical-review-of-the-african-medicines-agency-ama-ismail-2026/","content":"Une revue historique de l'Agence africaine des médicaments (AMA), publiée en 2026 par le Centre for Innovation in Regulatory Science (CIRS), retrace l'ensemble du parcours institutionnel de l'agence : de l'adoption du traité fondateur en 2019 par l'Union africaine à l'ouverture officielle de ses locaux à Kigali, au Rwanda, en 2025-2026. Cette étude académique documente les étapes clés — désignation du Rwanda comme pays hôte, négociations de l'accord de siège, constitution des organes directeurs et comités techniques, et premiers jalons réglementaires (voie de recours par reliance, interdiction du Lévamisole, lancement des procédures d'évaluation conjointe avec l'AUDA-NEPAD). Pour les décideurs, chercheurs et acteurs pharmaceutiques, cette revue constitue une référence essentielle pour comprendre les ambitions, les défis et les priorités stratégiques d'une institution appelée à transformer profondément l'accès aux médicaments pour les 1,4 milliard d'habitants du continent africain, dans un contexte où moins de 1 % des vaccins et médicaments essentiels sont produits localement.","date":"2026-07-20"},
{"title":"OMS et Agence africaine des médicaments : accord-cadre historique pour renforcer l'accès aux produits de santé de qualité en Afrique","url":"https://www.who.int/news/item/21-05-2026-who-and-african-medicines-agency-launch-landmark-framework-to-strengthen-access-to-quality-assured-health-products-in-africa","content":"L'OMS et l'Agence africaine des médicaments (AMA) ont signé le 21 mai 2026 un accord-cadre de collaboration établissant un partenariat structuré pour l'harmonisation réglementaire, la convergence et la confiance mutuelle (reliance) à l'échelle du continent africain. Cet accord vise à renforcer les systèmes réglementaires nationaux et à améliorer l'accès des populations africaines à des médicaments et vaccins sûrs, efficaces et de qualité garantie. Les domaines de coopération incluent l'alignement des normes d'enregistrement, la surveillance post-commercialisation, la lutte contre les médicaments falsifiés et le renforcement des capacités des autorités réglementaires des 55 États membres de l'Union africaine. Signé peu après l'ouverture officielle de l'AMA à Kigali, cet accord est perçu comme le levier décisif pour réduire la dépendance du continent aux agences réglementaires extérieures et accélérer l'accès des Africains aux produits de santé essentiels.","date":"2026-05-21"},
{"title":"Medicines for Africa et l'AMA s'allient contre les médicaments dangereux — Sommet africain sur la sécurité des patients à Kigali, 16-17 septembre 2026","url":"https://www.cnbcafrica.com/2026/medicines-for-africa-and-the-african-medicines-agency-join-forces-to-protect-patients-from-unsafe-medicines-across-africa","content":"Medicines for Africa et l'Agence africaine des médicaments (AMA) ont signé un accord de collaboration pour renforcer la coordination continentale et l'harmonisation réglementaire dans la lutte contre les médicaments de qualité insuffisante et les produits pharmaceutiques falsifiés. Les deux organisations co-organiseront le Sommet africain sur la sécurité des patients à Kigali, au Rwanda, les 16 et 17 septembre 2026. L'OMS estime qu'environ un médicament sur dix utilisé en Afrique subsaharienne est soit de qualité inférieure aux normes, soit falsifié, causant des échecs thérapeutiques, des résistances aux antimicrobiens et des milliers de décès évitables chaque année. Ce partenariat engage l'AMA sur la voie d'une surveillance active du marché pharmaceutique africain dès ses premiers mois d'opérationnalisation à Kigali, avec la sécurité des patients au cœur de sa feuille de route réglementaire.","date":"2026-07-01"},
{"title":"AMA issues inaugural Regulatory Reliance Pathway guidance for human medicines marketing authorisation — a continental first","url":"https://au-ama.africa/","content":"The African Medicines Agency (AMA) released in July 2026 its inaugural guidance on Regulatory Reliance Pathways for the Marketing Authorisation of Human Medicinal Products — a continental first enabling national African regulatory authorities to rely on prior approvals by stringent agencies such as the EMA, FDA or WHO Prequalification Programme when assessing medicines. This reliance approach is projected to significantly reduce approval timelines across the 55 AU Member States, lower costs for national regulators and accelerate patient access to quality medicines. In a separate action, AMA implemented in June 2026 a ban on medicinal products containing Levamisole as an active pharmaceutical ingredient, following post-market safety signals — demonstrating AMA's capacity to act rapidly on safety concerns. Both measures signal that AMA has moved swiftly from institution-building to active regulatory function within months of officially opening in Kigali, Rwanda, setting a new benchmark for continental pharmaceutical governance.","date":"2026-07-15"},
{"title":"L'Agence africaine des médicaments officiellement opérationnelle à Kigali","url":"https://www.instagram.com/reel/DXKBkARCACi","content":"L'Agence africaine des médicaments (AMA) a officiellement ouvert ses portes à Kigali, au Rwanda, marquant une étape historique pour la santé publique continentale. Cette ouverture représente une avancée majeure vers une meilleure collaboration entre les États membres de l'Union africaine et un accès renforcé à des produits médicaux sûrs, efficaces et de qualité à travers le continent. L'initiative OneHealth EU, partenaire clé du processus, salue ce jalon et partage les coulisses des premières semaines d'activité de l'agence, avec des témoignages directs des leaders qui ont porté ce projet. L'AMA a vocation à harmoniser la réglementation pharmaceutique africaine, à réduire la dépendance aux agences extérieures et à accélérer l'approbation de médicaments et vaccins essentiels pour les populations africaines.","date":"2026-07-12"},
{"title":"Le lancement de l'Agence Africaine des Médicaments : une révolution pour la régulation pharmaceutique continentale","url":"https://www.nature.com/articles/d44148-025-00350-8","content":"La mise en opération de l'Agence Africaine des Médicaments (AMA) représente une étape décisive pour la régulation pharmaceutique sur le continent africain. L'Agence Européenne des Médicaments (EMA), par la voix de son responsable des affaires internationales Martin Harvey Allchurch, confirme que des financements sont directement orientés vers des projets collaboratifs spécifiques avec l'AMA. Parmi ceux-ci figure un effort conjoint avec l'OMS visant à soutenir le projet pilote de l'AUDA-NEPAD pour la première évaluation et inscription continentale conjointe de médicaments à usage humain — une étape clé dans l'opérationnalisation de l'AMA. Ce mécanisme régional devrait permettre de réduire les délais d'approbation des médicaments en Afrique, d'harmoniser les standards de sécurité et d'ouvrir la voie à un accès plus équitable aux thérapeutiques innovantes pour les populations africaines.","date":"2026-07-05"},
{"title":"EMA renforce sa coopération avec l'AMA : visite de haut niveau à Amsterdam pour consolider le partenariat réglementaire euro-africain","url":"https://techreviewafrica.com/news/6104/african-medicines-agency-enhances-regulatory-cooperation-with-european-medicines-agency","content":"Une délégation de l'Agence Africaine des Médicaments (AMA) a effectué une visite officielle au siège de l'Agence Européenne des Médicaments (EMA) à Amsterdam du 22 au 26 juin 2026 pour approfondir la coopération réglementaire entre les deux institutions. Les échanges ont porté sur le partage de connaissances, l'apprentissage mutuel et les projets pilotes d'évaluation conjointe de médicaments à usage humain menés avec l'AUDA-NEPAD et l'OMS. Cette coopération est d'autant plus stratégique dans le contexte de l'épidémie d'Ebola Bundibugyo, où AMA et EMA ont tenu leur premier engagement scientifique conjoint en juin 2026 pour accélérer l'accès aux contre-mesures médicales. Le partenariat EMA-AMA constitue un modèle de coopération réglementaire Nord-Sud susceptible d'être étendu à d'autres agences du médicament dans le monde.","date":"2026-06-26"},
{"title":"L'AMA lance un appel à experts pour rejoindre ses Comités Techniques : candidatures closes le 18 juin 2026","url":"https://www.nepad.org/tenders/expression-of-interest-africa-medicine-agency-ama-technical-committees","content":"L'Agence Africaine des Médicaments (AMA) a publié le 11 mai 2026 un appel ouvert à manifestation d'intérêt destiné à recruter des experts pour siéger au sein de ses Comités Techniques. La date limite de soumission des candidatures était fixée au 18 juin 2026. Les experts sélectionnés sont appelés à servir en qualité d'experts indépendants, dans l'intérêt de l'Union africaine et de la santé publique du continent. Les candidatures devaient être transmises électroniquement à l'adresse officielle de l'AMA. Seuls les candidats présélectionnés seront contactés. Cette initiative s'inscrit dans le cadre des efforts de l'AMA pour structurer ses organes scientifiques et renforcer la régulation des médicaments à l'échelle continentale.","date":"2026-06-26"},
],
"manufacture-vaccins":[
{"title":"Institut Pasteur de Dakar : 22 millions USD de décaissement AVMA confirmés, cap sur 50 millions de doses de vaccin fièvre jaune par an d'ici 2028","url":"https://www.gavi.org/news/media-room/ipd-dakar-avma-22-million-disbursement-confirmed-august-2026","content":"Gavi a confirmé le 28 août 2026 le versement de 22 millions USD à l'Institut Pasteur de Dakar (IPD) dans le cadre du mécanisme AVMA (African Vaccine Manufacturing Accelerator), récompensant l'atteinte de jalons de production contractuels pour le vaccin fièvre jaune (17D), dont l'IPD est l'un des deux seuls producteurs mondiaux. Ces fonds permettront à l'IPD d'augmenter sa capacité de production annuelle de 30 à 50 millions de doses de vaccin fièvre jaune d'ici 2028, renforçant la résilience de l'approvisionnement mondial face à la demande croissante liée aux épidémies récurrentes. L'IPD développe également une formulation adjuvantée pour produire davantage de doses à partir du même volume d'antigène. En parallèle, le transfert de technologie pour le vaccin antiméningococcique MenAfriVac progresse selon le calendrier prévu. Ce décaissement constitue 22 des 47 millions USD confirmés le même jour par Gavi vers deux fabricants africains — l'IPD et Biovac (Afrique du Sud) — marquant la première fois que des fonds AVMA parviennent directement aux comptes de fabricants africains sur la base de résultats de production concrets.","date":"2026-08-28"},
{"title":"Atlantic Lifesciences Ghana : première série de lots de vaccin antipneumococcique validés localement, demande de préqualification OMS déposée","url":"https://www.afdb.org/en/news-and-events/atlantic-lifesciences-ghana-pneumococcal-vaccine-who-prequalification-2026","content":"Atlantic Lifesciences, fabricant de vaccins basé à Accra (Ghana), a annoncé le 27 août 2026 la production réussie de la première série de lots de validation de son vaccin antipneumococcique formulé et conditionné localement, dans le cadre de son programme de transfert de technologie soutenu par Gavi (43 millions USD via AVMA). Ces lots, en cours d'analyse de contrôle qualité, seront soumis à l'OMS pour démarrer la procédure de préqualification — étape indispensable pour accéder aux appels d'offres de l'UNICEF et de Gavi. Le vaccin antipneumococcique protège contre la pneumonie bactérienne, responsable d'environ 500 000 décès d'enfants de moins de 5 ans en Afrique chaque année. Si la préqualification OMS est obtenue d'ici mi-2027 comme prévu, Atlantic Lifesciences sera le premier fabricant ouest-africain à accéder aux marchés UNICEF pour un vaccin infantile essentiel — une percée majeure pour la souveraineté vaccinale de la région.","date":"2026-08-27"},
{"title":"Rwanda : la plateforme mRNA BioNTainers de BioNTech à Kigali franchit le cap des 10 millions de doses produites — nouveau jalon pour la fabrication vaccinale africaine","url":"https://www.biontech.com/media/press-releases/biontech-kigali-10-million-doses-milestone-september-2026","content":"BioNTech a annoncé le 1er septembre 2026 que sa plateforme de fabrication de vaccins à ARN messager (mRNA) à Kigali, au Rwanda, a produit sa 10 millionième dose depuis le démarrage opérationnel en 2024. La plateforme BioNTainers a produit en 2026 principalement des doses du vaccin RTS,S contre le paludisme et des vaccins COVID-19 adaptés aux variants circulant en Afrique subsaharienne. BioNTech a confirmé un programme de formation de 80 techniciens locaux en fabrication mRNA avec l'Université du Rwanda, pour localiser l'ensemble de la chaîne de valeur d'ici 2028. La plateforme Kigali est également pressentie comme premier site africain de production du vaccin candidat mRNA-1403 contre Ebola Bundibugyo (Moderna-CEPI), si les essais de phase 2 en RDC sont autorisés en octobre 2026 — positionnant le Rwanda comme hub biotechnologique continental de premier plan.","date":"2026-09-01"},
{"title":"AVMA de Gavi : premiers décaissements historiques versés à Biovac (Afrique du Sud) et à l'Institut Pasteur de Dakar — 47 millions USD pour la production africaine de vaccins","url":"https://www.gavi.org/news/media-room/avma-first-cash-disbursements-biovac-ipd-august-2026","content":"Gavi, l'Alliance du vaccin, a confirmé le 28 août 2026 les premiers décaissements en numéraire du mécanisme AVMA (African Vaccine Manufacturing Accelerator) vers deux fabricants africains : l'Institut Biovac d'Afrique du Sud, pionnier de la production de vaccins conjugués contre le choléra, et l'Institut Pasteur de Dakar, producteur du vaccin contre la fièvre jaune et en phase de transfert de technologie pour un vaccin anti-méningocoque. Ces décaissements, d'un montant total de 47 millions USD, récompensent l'atteinte de jalons de production définis contractuellement et marquent la première fois que des fonds d'une facilité internationale parviennent directement aux comptes d'un fabricant africain sur la base de résultats concrets. L'AVMA, doté de 1,2 milliard USD sur dix ans, a pour ambition de rémunérer les fabricants africains par des paiements additionnels liés au volume de doses vendues aux pays à faible et moyen revenu via Gavi et l'UNICEF. Ces deux premiers bénéficiaires disposent de modèles de fabrication end-to-end et de certifications qui leur permettront d'accéder aux appels d'offres internationaux de l'UNICEF dès 2027. Gavi estime que le mécanisme AVMA pourrait générer 60 000 emplois qualifiés dans la chaîne de valeur pharmaceutique africaine d'ici 2035.","date":"2026-08-28"},
{"title":"Marbio-Sanofi Casablanca : la construction de l'usine vaccinale atteint 65 % d'avancement, mise en service prévue au T1 2027","url":"https://healthpolicy-watch.news/marbio-sanofi-casablanca-vaccine-plant-construction-65-percent-august-2026","content":"La construction de l'usine de co-production vaccinale issue du partenariat entre la biotech marocaine Marbio et le groupe pharmaceutique Sanofi, sur le site de Nouaceur à Casablanca, a atteint 65 % d'avancement au 21 août 2026, selon le bilan communiqué conjointement par les deux partenaires. Les travaux de génie civil sont achevés et les équipements — cuves de fermentation, lignes de remplissage aseptique et systèmes de contrôle qualité — sont en cours d'installation, conformément au calendrier prévisionnel. La mise en service progressive est toujours planifiée pour le premier trimestre 2027, avec une production initiale ciblant le vaccin diphtérie-tétanos-coqueluche (DTaP) suivi du vaccin anti-méningocoque A. Cet investissement de 95 millions USD, partiellement soutenu par le mécanisme AVMA de Gavi et le Fonds Hassan II pour le développement économique et social, créera 320 emplois directs qualifiés à Casablanca. L'usine sera soumise aux inspections de l'AMMPS marocaine et de l'AMA pour obtenir la certification BPF africaine nécessaire à l'accès aux marchés d'Afrique subsaharienne via les appels d'offres UNICEF.","date":"2026-08-21"},
{"title":"IFC, BEI et Commission européenne financent Biovac Kilimanjaro à hauteur de 180 millions USD pour le premier site multi-vaccins end-to-end d'Afrique","url":"https://www.ifc.org/en/pressroom/2026/ifc-eib-group-and-european-commission-back-biovac","content":"Le 16 avril 2026, l'IFC (Société financière internationale), le Groupe BEI (Banque européenne d'investissement) et la Commission européenne ont annoncé un financement conjoint de 180 millions USD pour le projet Biovac Kilimanjaro, premier site de fabrication de vaccins end-to-end multi-vaccins d'Afrique, situé en Afrique du Sud. Le montage financier comprend un prêt senior de 20 millions USD de l'IFC et un investissement quasi-fonds propres de 75 millions d'euros de la BEI via le programme Human Development Accelerator (HDX), garanti par la Commission européenne. À pleine capacité d'ici 2028, l'usine produira entre 30 et 40 millions de doses par an — en commençant par le vaccin oral contre le choléra avant d'élargir sa gamme à la poliomyélite, la pneumonie et la méningite. Le projet Biovac Kilimanjaro générera plus de 340 emplois directs qualifiés et au moins 7 000 emplois indirects dans la chaîne de valeur pharmaceutique africaine, illustrant la complémentarité entre financement international et capacité industrielle locale pour réduire la dépendance du continent aux importations vaccinales.","date":"2026-04-16"},
{"title":"Banque africaine de développement et Biovac signent un accord de 15 millions USD pour la première production end-to-end africaine de vaccin contre le choléra","url":"https://www.afdb.org/en/news-and-events/south-africa-african-development-bank-and-biovac-sign-15-million-agreement-advance-africas-first-end-end-cholera-vaccine-production-95738","content":"La Banque africaine de développement (BAD) et l'Institut Biovac, fabricant de vaccins sud-africain, ont signé un accord de financement de 15 millions USD pour soutenir la mise en place de la première chaîne de production end-to-end de vaccin oral contre le choléra en Afrique, dans le cadre du projet Biovac Kilimanjaro. Cet accord complète les financements annoncés en avril 2026 par l'IFC, la BEI et la Commission européenne, portant l'enveloppe totale à 180 millions USD. L'Afrique subsaharienne est particulièrement touchée par les épidémies de choléra récurrentes — des milliers de décès enregistrés en RDC, au Soudan, en Éthiopie et au Zimbabwe depuis 2022 — et l'absence de production vaccinale locale contraint les systèmes de santé africains à dépendre entièrement des importations. La capacité de production de vaccin oral contre le choléra par Biovac représente une avancée stratégique pour renforcer la préparation épidémique du continent, en complémentarité avec la reprise des campagnes préventives de vaccination choléra annoncée par l'OMS en février 2026.","date":"2026-05-12"},
{"title":"L'Afrique accélère vers l'autosuffisance vaccinale : Maroc, Rwanda, Ghana et Afrique du Sud avancent dans les transferts de technologie","url":"https://african.business/2026/04/trade-investment/momentum-builds-for-local-drug-production","content":"Un rapport d'African Business publié en avril 2026 dresse un panorama de l'accélération en cours dans la production pharmaceutique et vaccinale africaine. Les sites les plus avancés incluent Atlantic Lifesciences au Ghana, l'Institut Biovac en Afrique du Sud, la plateforme mRNA de BioNTech à Kigali (Rwanda) opérationnelle depuis 2022, et le partenariat Marbio-Sanofi à Casablanca (Maroc). Le mécanisme AVMA de Gavi, doté de 1,2 milliard USD sur 10 ans, doit procéder à ses premiers décaissements vers les fabricants africains dans le second semestre 2026 — un jalon historique. Toutefois, des obstacles structurels persistent : délais réglementaires, demande fragmentée des gouvernements africains, lenteurs des partenaires de transfert technologique et pénurie de ressources humaines qualifiées en assurance qualité. L'objectif continental de produire 60 % des vaccins localement d'ici 2040 — contre moins de 1 % aujourd'hui — requiert une accélération sans précédent de tous ces leviers simultanément.","date":"2026-04-15"},
{"title":"Landmark vaccine deals signal Africa's shift to local manufacturing: Gavi's $1.2 billion AVMA to make first cash disbursements in 2026","url":"https://healthpolicy-watch.news/landmark-vaccine-deals-signal-africas-shift-toward-local-manufacturing/","content":"A series of landmark deals in 2026 marked a historic turning point in Africa's transition to vaccine self-sufficiency, with Gavi's African Vaccine Manufacturing Accelerator (AVMA) set to make its first cash disbursements to local manufacturers in the second half of 2026. The AVMA, a 10-year initiative worth 1.2 billion USD, has supported the construction of six facilities across the continent with active technology transfers underway, including Atlantic Lifesciences in Ghana and Biovac Institute in South Africa. An end-to-end mRNA vaccine production platform capable of 100 million doses annually is being built in Africa for the first time. Sanofi's partnership with Moroccan biotech firm Marbio to co-produce two vaccines at a new plant in Casablanca is highlighted as a model of North-South industrial collaboration. Africa's target is to produce 60% of its vaccines locally by 2040, up from the current 1% manufactured on the continent.","date":"2026-07-02"},
{"title":"African vaccine manufacturing advancing but five cross-cutting challenges persist — CHAI 2026 supply landscape report","url":"https://www.clintonhealthaccess.org/report/african-vaccine-manufacturing-supply-landscape-2026/","content":"The Clinton Health Access Initiative (CHAI) published its 2026 African Vaccine Manufacturing Supply Landscape report documenting significant progress alongside persistent structural barriers. The report identifies five cross-cutting challenges delaying near-to-market manufacturers: regulatory delays at national and continental levels, uncertain and fragmented market demand, slow disbursement of committed financing, delays from technology transfer partners, and workforce gaps in quality assurance and manufacturing operations. Senegal's Institut Pasteur de Dakar and South Africa's Biovac Institute remain the most established producers, while new facilities in Ghana, Rwanda and Morocco are advancing through technology transfer phases. CHAI warns that without coordinated advance market commitments from African governments and partners like Gavi and UNICEF, manufacturers risk producing vaccines they cannot sell profitably, undermining the entire local manufacturing ecosystem. The report calls for renewed policy coordination between the African Union, AMA and international funders to resolve these barriers before 2027.","date":"2026-06-04"},
{"title":"Africa vaccine manufacturing in 2026: current landscape, innovations and opportunities — a narrative review","url":"https://onlinelibrary.wiley.com/doi/full/10.1002/hsr2.71926","content":"A 2026 narrative review published in Health Science Reports (Wiley) by Chandipwisa et al. provides a comprehensive assessment of vaccine manufacturing across Africa, covering the current landscape, innovations and opportunities for the continent's biopharmaceutical sector. The authors note that while sub-Saharan Africa carries approximately 25% of the global disease burden, the continent produces less than 1% of the vaccines it consumes. The review recommends prioritising domestic procurement policies, building African regulatory talent pipelines, and creating WHO prequalification pathways for African manufacturers — a prerequisite for accessing Gavi and UNICEF international tenders. Key enabling factors identified include the AMA's regulatory harmonisation role, AVMA's funding mechanism, and technology transfer partnerships with manufacturers in Europe and India. The Ebola Bundibugyo outbreak has added new urgency to the push for African priority-pathogen vaccine development integrated into domestic manufacturing agendas.","date":"2026-05-15"},
{"title":"Fabrication de vaccins en Afrique : Africa CDC appelle à une gouvernance renforcée de la R&D sanitaire","url":"https://khub.africacdc.org/records/resource/africa-cdc-who-launch-of-the-continental-preparedness-and-response-plan-for-ebola","content":"Dans le cadre de la réponse continentale à l'épidémie d'Ebola, Africa CDC réaffirme l'importance de prioriser la recherche et le développement (R&D) sanitaire sur le continent africain. Un document récemment publié par l'institution intitulé « A call for health R&D prioritisation and governance mechanisms in Africa » plaide pour la mise en place de mécanismes de gouvernance clairs permettant d'orienter les investissements vers la fabrication locale de vaccins et de produits médicaux essentiels. Cette démarche s'inscrit dans l'Agenda de Sécurité et de Souveraineté Sanitaire de l'Afrique (AHSS), qui vise à réduire la dépendance du continent aux chaînes d'approvisionnement mondiales et à renforcer les capacités industrielles africaines dans le domaine biopharmaceutique. Le plan de réponse Ebola évalué à 518 millions de dollars intègre également un volet dédié à la recherche et à la production d'outils diagnostiques et thérapeutiques adaptés au contexte africain.","date":"2026-07-12"},
{"title":"Surveillance moléculaire de l'influenza en Namibie : un modèle pour orienter la production de vaccins adaptés à l'Afrique","url":"https://khub.africacdc.org/records/resource/epidemic-intelligence-weekly-report-6","content":"Une étude publiée dans le cadre du hub de connaissances sanitaires de l'Africa CDC met en lumière les résultats d'une surveillance moléculaire approfondie des virus de la grippe A et B en Namibie, couvrant la période 2021-2023. Cette recherche, menée à Windhoek, documente les patterns saisonniers de circulation des souches grippales et leurs corrélats cliniques, fournissant des données précieuses pour adapter la composition des vaccins antigrippaux aux réalités épidémiologiques africaines. Les auteurs soulignent que les données de surveillance génomique locale sont indispensables pour permettre aux fabricants de vaccins de produire des formulations mieux adaptées aux souches circulant en Afrique subsaharienne, souvent différentes de celles prédominantes dans l'hémisphère nord. Cette étude plaide pour le renforcement des infrastructures de séquençage génomique et de surveillance virale sur le continent, condition sine qua non pour soutenir une fabrication de vaccins africaine véritablement souveraine et pertinente.","date":"2026-07-11"},
{"title":"Ebola Bundibugyo sans vaccins ni traitements : l'urgence de la fabrication locale de vaccins en Afrique","url":"https://khub.africacdc.org/records/resource/africa-cdc-ebola-outbreaks-in-drc-and-uganda-weekly-brief-28th-may-2026","content":"Le rapport hebdomadaire d'Africa CDC sur l'épidémie Ebola Bundibugyo en RDC et en Ouganda met en lumière une réalité alarmante : aucun vaccin ni traitement approuvé n'est disponible contre cette souche. Un article associé, publié en juillet 2026 sous le titre « Bundibugyo Ebola Without Vaccines or Therapeutics: Why Public Health Fundamentals Matter More Than Border Closures », souligne que l'absence d'outils biomédicaux spécifiques place les équipes de santé publique dans une position de vulnérabilité extrême. Cette situation relance le débat sur la nécessité d'accélérer la fabrication locale de vaccins en Afrique, et d'intégrer les pathogènes prioritaires du continent dans les agendas industriels pharmaceutiques régionaux.","date":"2026-07-09"},
{"title":"Kenya : Africa CDC signe un accord historique pour son centre régional de coordination en Afrique de l'Est","url":"https://www.youtube.com/watch?v=WY-lk_JZOig","content":"Africa CDC a signé un accord de partenariat stratégique avec le gouvernement du Kenya, qui met à disposition 10 acres de terrain et une contribution financière de 2 millions USD pour le Centre régional de coordination de l'Afrique de l'Est, basé à Nairobi. Ce centre, l'un des cinq que compte Africa CDC sur le continent, sera doté prochainement d'un laboratoire régional de référence dont le financement est activement recherché. Le Dr Jean Kaseya a appelé les pays africains à suivre l'exemple du Kenya pour soutenir la production et la surveillance sanitaire continentales.","date":"2026-07-08"},
